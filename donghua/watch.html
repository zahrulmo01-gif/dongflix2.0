  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #141416;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-movie: #f59e0b;
      --color-star: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(20, 20, 24, 0.58);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      --glass-blur: blur(20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 60px;
      padding-bottom: 50px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: 60px;
      display: flex;
      align-items: center;
    }

    .header-content {
      width: 100%; max-width: 1000px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }

    .header-left-group {
      display: flex; align-items: center; gap: 12px; cursor: pointer; max-width: calc(100% - 20px);
    }

    .icon-circle-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer; flex-shrink: 0;
    }

    .icon-circle-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .brand-title {
      font-size: 16.5px; font-weight: 700; color: #ffffff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* PLAYER WRAPPER - STICKY DI BAWAH HEADER */
    .player-wrapper {
      position: -webkit-sticky;
      position: sticky;
      top: 60px;
      z-index: 90;
      margin: 0 -16px 14px;
      width: calc(100% + 32px);
      background: #000;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .detail-player-box {
      width: 100%; height: 100%;
      background: #000; position: relative;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 13px;
    }

    .player-loader-overlay {
      position: absolute; inset: 0;
      background: #000000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 10;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .player-loader-overlay.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }

    .cool-spinner { position: relative; width: 48px; height: 48px; }

    .spinner-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--color-accent);
      border-right-color: var(--color-primary);
      animation: spinCool 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    @keyframes spinCool { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .player-iframe { width: 100%; height: 100%; border: none; display: block; }

    /* NOT FOUND BOX */
    .not-found-box {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px 16px; gap: 16px;
    }

    .not-found-text { font-size: 14px; color: #94a3b8; line-height: 1.5; max-width: 450px; }

    .btn-home-notfound {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff; padding: 10px 24px; border-radius: 12px;
      font-size: 13.5px; font-weight: 700; text-decoration: none;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); cursor: pointer; border: none;
      transition: transform 0.15s ease;
    }

    .btn-home-notfound:active { transform: scale(0.97); }
    .btn-home-notfound svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    /* SKELETON */
    @keyframes skeletonPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    .skeleton { 
      background-color: var(--bg-skeleton); 
      animation: skeletonPulse 1.4s infinite ease-in-out; 
      border-radius: 8px; 
    }

    /* EPISODE LIST & STICKY HORIZONTAL BOX */
    .ep-header-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 10px; 
      gap: 10px; 
    }
    .ep-header-title { font-size: 16px; font-weight: 800; }
    .episode-sort-wrapper { position: relative; margin-left: auto; }
    .episode-sort-button {
      height: 32px; min-width: 92px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: space-between;
      gap: 6px; background: var(--glass-bg); color: var(--text-sub); border: 1px solid var(--glass-border);
      border-radius: 9999px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .episode-sort-button svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .episode-sort-menu {
      display: none; position: absolute; top: 38px; right: 0; min-width: 125px; padding: 6px;
      background: rgba(22, 22, 26, 0.94); border: 1px solid var(--glass-border); border-radius: 14px; z-index: 150;
    }
    .episode-sort-menu.active { display: block; }
    .episode-sort-option {
      width: 100%; padding: 8px 10px; display: flex; align-items: center; background: transparent;
      color: var(--text-muted); border: none; border-radius: 8px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .episode-sort-option.active { background: rgba(56, 189, 248, 0.16); color: var(--color-accent); }

    .btn-see-all-ep {
      display: inline-flex; align-items: center; gap: 6px; background: var(--glass-bg); color: var(--color-accent);
      border: 1px solid var(--glass-border); padding: 6px 14px; border-radius: 9999px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }
    .btn-see-all-ep svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    /* WADAH EPISODE HORIZONTAL YANG NYANGKUT DI BAWAH PLAYER SAAT JUDUL HILANG */
    .ep-scroll-container { 
      position: -webkit-sticky;
      position: sticky;
      top: calc(60px + (100vw * 9 / 16));
      z-index: 80;
      width: calc(100% + 32px);
      margin: 0 -16px 16px;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      --ep-fade-left: 0;
      --ep-fade-right: 0;
    }

    @media (min-width: 1000px) {
      .ep-scroll-container {
        top: calc(60px + (1000px * 9 / 16));
      }
    }

    .ep-scroll-container::before,
    .ep-scroll-container::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32px;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.25s ease;
    }
    .ep-scroll-container::before {
      left: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.95), transparent);
      opacity: var(--ep-fade-left, 0);
    }
    .ep-scroll-container::after {
      right: 0;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.95), transparent);
      opacity: var(--ep-fade-right, 0);
    }

    .ep-scroll-grid { 
      display: flex; 
      gap: 10px; 
      overflow-x: auto; 
      padding-bottom: 2px; 
      scrollbar-width: none; 
      -webkit-overflow-scrolling: touch;
    }
    .ep-scroll-grid::-webkit-scrollbar { display: none; }
    
    .ep-box {
      flex: 0 0 54px; height: 54px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
      cursor: pointer; color: var(--text-sub); transition: all 0.2s ease;
    }
    .ep-box.active { background: var(--color-primary); border-color: var(--color-accent); color: #fff; box-shadow: 0 0 16px rgba(2, 132, 199, 0.4); }

    /* ACTION BAR */
    .action-bar {
      display: flex; justify-content: space-around; align-items: center;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
      border-radius: 18px; padding: 12px 6px; margin-bottom: 24px; position: relative;
      min-height: 58px;
    }

    .action-holder-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    .action-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      color: var(--text-muted); font-size: 11px; cursor: pointer; background: none; border: none; font-weight: 600;
    }
    .action-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .action-item.active { color: var(--color-accent); }
    .action-item.active svg { fill: var(--color-accent); stroke: var(--color-accent); }

    .server-custom-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; position: relative; }
    .server-custom-btn svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2.2; }
    .server-select-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .server-tooltip-hint {
      position: absolute; top: -52px; left: -10px;
      background: var(--color-primary); color: #ffffff; padding: 6px 12px;
      border-radius: 8px; font-size: 11px; font-weight: 700;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5); z-index: 50; opacity: 0;
      pointer-events: none; transition: all 0.4s ease; white-space: nowrap;
    }
    .server-tooltip-hint::after {
      content: ''; position: absolute; bottom: -5px; left: 22px;
      border-width: 6px 6px 0; border-style: solid; border-color: var(--color-primary) transparent;
      display: block; width: 0;
    }
    .server-tooltip-hint.show { opacity: 1; }

    /* DETAIL & SINOPSIS */
    .media-meta-card { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
    .media-cover-wrapper {
      width: 105px; min-width: 105px; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.8); flex-shrink: 0;
    }
    .media-cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .media-title { font-size: 17px; font-weight: 800; line-height: 1.35; color: #ffffff; }
    .genre-badges-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-pill { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .status-release-row { font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px; }
    .status-release-row span strong { color: #f1f5f9; font-weight: 600; }
    .synopsis-block { border-top: 1px solid var(--border-color); padding-top: 16px; }
    .synopsis-heading { font-size: 11.5px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .synopsis-text { font-size: 13px; line-height: 1.6; color: var(--text-sub); margin-bottom: 24px; text-align: justify; }

    /* REKOMENDASI SERUPA */
    .recommendations-section { 
      margin-top: 32px; margin-bottom: 32px; border-top: 1px solid var(--border-color); padding-top: 22px; width: 100%;
    }
    .recommendations-title { 
      font-size: 16px; font-weight: 800; color: #f8fafc; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; 
    }
    .recommendations-scroll-row { 
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; width: 100%;
    }
    .recommendations-scroll-row::-webkit-scrollbar { display: none; }

    .rec-card-item {
      flex: 0 0 135px; min-width: 135px; max-width: 135px; text-decoration: none !important;
      display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    }

    .rec-poster-box {
      position: relative; width: 100%; height: 185px; border-radius: 14px; overflow: hidden;
      background: var(--bg-card); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .rec-poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .rec-badge-status {
      position: absolute; top: 8px; left: 8px; background: rgba(2, 132, 199, 0.9);
      color: #fff; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 9999px;
      text-transform: uppercase; z-index: 2;
    }

    .rec-badge-ep {
      position: absolute; bottom: 8px; left: 8px; background: var(--glass-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); color: #fff; font-size: 9.5px; font-weight: 800;
      padding: 3px 9px; border-radius: 9999px; z-index: 2;
    }

    .rec-card-title {
      font-size: 13px; font-weight: 700; color: #ffffff; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    @media (min-width: 768px) {
      .rec-card-item { flex: 0 0 155px; min-width: 155px; max-width: 155px; }
      .rec-poster-box { height: 215px; }
    }

    /* SHEET & KOMENTAR ALA TIKTOK */
    .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; backdrop-filter: blur(14px); }
    .sheet-overlay.active { display: block; }
    .bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; height: 65vh; border-top-left-radius: 24px; border-top-right-radius: 24px;
      z-index: 201; padding: 18px 16px; display: flex; flex-direction: column; transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); background: rgba(18, 18, 22, 0.95); border-top: 1px solid var(--glass-border-top);
    }
    .sheet-overlay.active .bottom-sheet { transform: translateY(0); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .sheet-title { font-size: 16px; font-weight: 800; }
    .sheet-close {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-muted);
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 10px; overflow-y: auto; padding-bottom: 24px; }

    .comments-section {
      margin-top: 24px; border-top: 1px solid #1e293b; padding-top: 20px; width: 100%; display: block; text-align: left !important;
    }

    .comments-header-wrapper {
      display: flex !important; align-items: center !important; justify-content: space-between !important;
      width: 100% !important; margin-bottom: 16px !important; position: relative;
    }

    .comments-header-title {
      font-size: 16px !important; font-weight: 800 !important; display: flex !important;
      align-items: center !important; gap: 6px !important; color: #f8fafc !important; margin: 0 !important; padding: 0 !important; text-align: left !important;
    }
    .comments-header-title svg { width: 18px; height: 18px; stroke: #38bdf8; fill: none; stroke-width: 2.2; }

    .btn-sort-wrapper { position: relative; }
    .btn-sort-svg {
      background: rgba(255, 255, 255, 0.06); border: 1px solid #1e293b; color: #38bdf8;
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-sort-svg svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .btn-sort-svg:hover { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; }

    .sort-dropdown-menu {
      display: none; position: absolute; top: 42px; right: 0; background: #0f172a;
      border: 1px solid #1e293b; border-radius: 12px; padding: 6px; min-width: 140px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8); z-index: 120;
    }
    .sort-dropdown-menu.active { display: block; }
    .sort-dropdown-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: #94a3b8;
      font-size: 12.5px; font-weight: 700; border-radius: 8px; cursor: pointer;
    }
    .sort-dropdown-item:hover, .sort-dropdown-item.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

    .comment-input-box {
      display: flex; align-items: center; gap: 10px; background: #0f172a; border: 1px solid #1e293b;
      border-radius: 24px; padding: 6px 8px 6px 16px; margin-bottom: 20px; width: 100%;
    }
    .comment-input-box:focus-within { border-color: #38bdf8; }
    .comment-textarea {
      flex: 1; height: 38px; background: transparent; border: none; color: #fff; font-size: 13px;
      outline: none; resize: none; font-family: inherit; line-height: 38px;
    }
    .btn-send-comment {
      background: #0284c7; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-send-comment svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .comment-login-notice {
      background: rgba(15, 23, 42, 0.6); border: 1px dashed rgba(56, 189, 248, 0.3); border-radius: 14px;

    }
    .comment-login-notice a { color: #38bdf8; font-weight: 700; text-decoration: none; cursor: pointer; }

    .comments-list { display: flex; flex-direction: column; gap: 14px; width: 100%; text-align: left !important; }
    .comment-card {
      display: flex; gap: 12px; width: 100%; align-items: flex-start; background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px; position: relative;
    }
    .comment-card.pinned { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.03); }

    .tiktok-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #0284c7; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; overflow: hidden; flex-shrink: 0;
    }
    .tiktok-avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

<script>
  let globalEpisodes = [];
  let currentMainTitle = '';
  let currentPoster = '';
  let currentServerUrl = '';
  let episodeSortMode = 'oldest';
  let hasIncrementedView = false;
  let currentSortMode = 'latest';
  let currentViewCount = '0';
  const userProfilesCache = {};

  const ADMIN_EMAIL = 'zahrulms01@gmail.com';

  function getUserBasePath() {
    if (!window.currentUser) return null;
    const userEmail = window.currentUser.email;
    if (userEmail) {
      return `users/${userEmail.replace(/\./g, ',')}`;
    }
    return `users/${window.currentUser.uid}`;
  }

  function getCleanMainSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    let s = urlParams.get('slug');
    if (!s) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const donghuaIdx = parts.indexOf('donghua');
      if (donghuaIdx !== -1 && parts[donghuaIdx + 1]) {
        s = parts[donghuaIdx + 1];
      } else {
        s = parts[parts.length - 1] || '';
      }
    }
    s = String(s || '').trim().replace(/^https?:\/\/[^\/]+/i, '').split('?')[0].split('#')[0];
    return s.replace(/-episode-\d+.*$/i, '').replace(/-ep-\d+.*$/i, '').replace(/^\/+|\/+$/g, '');
  }

  let targetSlug = getCleanMainSlug();

  function slugToTitleCase(slug) {
    if (!slug) return 'Donghua';
    return slug.split('-').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }

  const initialDisplayTitle = slugToTitleCase(targetSlug);
  const headerTitleEl = document.getElementById('topHeaderTitle');
  if (headerTitleEl) headerTitleEl.innerText = initialDisplayTitle;
  document.title = `Nonton ${initialDisplayTitle} Sub Indo - Dongflix`;

  function sanitizeTitle(str) {
    if (!str) return '';
    const text = str.trim();
    const half = Math.floor(text.length / 2);
    return (text.length > 4 && text.slice(0, half) === text.slice(half)) ? text.slice(0, half).trim() : text;
  }

  function extractEpNumber(val, fallback = 1) {
    const match = String(val || '').match(/(\d+(\.\d+)?)/);
    return match ? parseFloat(match[1]) : fallback;
  }

  function getLocalDateString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatViewDisplay(val) {
    const n = parseInt(val, 10);
    if (isNaN(n) || n <= 0) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function renderActionBarContent() {
    const bar = document.getElementById('actionBarContainer');
    if (!bar) return;
    bar.innerHTML = `
      <div class="server-tooltip-hint" id="serverHint">Ganti server pemutaran di sini</div>
      <div class="server-custom-btn">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <span style="font-size:11px;color:var(--text-muted);font-weight:600;">Server</span>
        <select class="server-select-hidden" id="serverSelect" onchange="switchServer(this.value)"></select>
      </div>

      <div class="action-item">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewCountText">${currentViewCount}</span>
      </div>

      <button class="action-item" id="btnFavorite" onclick="toggleFavorite()">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Favorit</span>
      </button>

      <button class="action-item" onclick="triggerDownload()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Unduh</span>
      </button>

      <button class="action-item" onclick="triggerShare()">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span>Bagikan</span>
      </button>
    `;
    checkFavorite();
  }

  function updateSocialMetaTags(title, cover, synopsis, slug) {
    const fullTitle = `Nonton ${title} Sub Indo - Dongflix`;
    const cleanSynopsis = synopsis && synopsis.length > 20 
      ? synopsis.replace(/\s+/g, ' ').slice(0, 160) + '...'
      : `Nonton streaming ${title} subtitle Indonesia gratis dan terlengkap dengan kualitas HD di Dongflix.`;
    const canonicalPageUrl = `https://dongflix.my.id/donghua/${encodeURIComponent(slug)}`;
    const finalCoverUrl = cover || '';

    document.title = fullTitle;
    const pageTitleEl = document.getElementById('pageTitle');
    if (pageTitleEl) pageTitleEl.innerText = fullTitle;

    const descEl = document.getElementById('metaDescription');
    if (descEl) descEl.setAttribute('content', cleanSynopsis);
    const canonicalEl = document.getElementById('canonicalUrl');
    if (canonicalEl) canonicalEl.setAttribute('href', canonicalPageUrl);

    const ogTitle = document.getElementById('ogTitle');
    if (ogTitle) ogTitle.setAttribute('content', fullTitle);
    const ogDesc = document.getElementById('ogDescription');
    if (ogDesc) ogDesc.setAttribute('content', cleanSynopsis);
    const ogUrl = document.getElementById('ogUrl');
    if (ogUrl) ogUrl.setAttribute('content', canonicalPageUrl);
    const ogImg = document.getElementById('ogImage');
    if (ogImg) ogImg.setAttribute('content', finalCoverUrl);
    const ogAlt = document.getElementById('ogImageAlt');
    if (ogAlt) ogAlt.setAttribute('content', `Poster ${title}`);

    const twTitle = document.getElementById('twitterTitle');
    if (twTitle) twTitle.setAttribute('content', fullTitle);
    const twDesc = document.getElementById('twitterDescription');
    if (twDesc) twDesc.setAttribute('content', cleanSynopsis);
    const twImg = document.getElementById('twitterImage');
    if (twImg) twImg.setAttribute('content', finalCoverUrl);
  }

  function goBack() {
    const referrer = document.referrer;
    if (referrer) {
      try {
        const refUrl = new URL(referrer);
        if (refUrl.host === window.location.host) {
          if (refUrl.pathname === '/' || refUrl.pathname === '') {
            window.location.href = '/';
            return;
          }
          if (refUrl.pathname.startsWith('/donghua')) {
            window.location.href = '/donghua/';
            return;
          }
        }
      } catch (_) {}
    }

    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    window.location.href = '/';
  }

  function goToHomeLogin() { window.location.href = 'https://dongflix.my.id/profil/login.html'; }

  function saveContinueHistory(epNum) {
    if (!targetSlug) return;
    const historyItem = {
      slug: targetSlug,
      mainPath: targetSlug,
      title: currentMainTitle || initialDisplayTitle,
      poster: currentPoster || 'https://via.placeholder.com/300x400?text=No+Cover',
      cover: currentPoster || 'https://via.placeholder.com/300x400?text=No+Cover',
      episode: `Ep ${epNum}`,
      progressTime: '00:04',
      durationTime: '24:02',
      updatedAt: Date.now()
    };

    try {
      const historyKey = 'rz_continue_history';
      let historyList = JSON.parse(localStorage.getItem(historyKey) || '[]');
      historyList = historyList.filter(item => (item.slug !== targetSlug && item.mainPath !== targetSlug));
      historyList.unshift(historyItem);
      if (historyList.length > 15) historyList = historyList.slice(0, 15);
      localStorage.setItem(historyKey, JSON.stringify(historyList));
    } catch (_) {}

    if (window.currentUser && window.db && window.fbRef && window.fbSet) {
      const basePath = getUserBasePath();
      if (basePath) {
        const cleanSlugKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
        const histRef = window.fbRef(window.db, `${basePath}/history/${cleanSlugKey}`);
        window.fbSet(histRef, historyItem).catch(() => {});
      }
    }
  }

  function toggleEpisodeSort(e) {
    e.stopPropagation();
    document.getElementById('episodeSortMenu').classList.toggle('active');
  }

  function setEpisodeSort(mode) {
    episodeSortMode = mode;
    document.getElementById('episodeSortText').innerText = mode === 'oldest' ? 'Terlama' : 'Terbaru';
    document.getElementById('episodeSortOldest').classList.toggle('active', mode === 'oldest');
    document.getElementById('episodeSortNewest').classList.toggle('active', mode === 'newest');
    document.getElementById('episodeSortMenu').classList.remove('active');
    renderEpisodeGrid();
  }

  document.addEventListener('click', () => {
    const menu = document.getElementById('episodeSortMenu');
    if (menu) menu.classList.remove('active');
    const dropdown = document.getElementById('sortDropdownMenu');
    if (dropdown) dropdown.classList.remove('active');
  });

  function getSortedEpisodes() {
    return [...globalEpisodes].sort((a, b) => {
      const numA = extractEpNumber(a.episode || a.number || a.title || a.slug, 0);
      const numB = extractEpNumber(b.episode || b.number || b.title || b.slug, 0);
      return episodeSortMode === 'oldest' ? numA - numB : numB - numA;
    });
  }

  function updateEpScrollFade() {
    const grid = document.getElementById('epGrid');
    const container = document.getElementById('epScrollContainer');
    if (!grid || !container) return;

    const scrollLeft = grid.scrollLeft;
    const maxScrollLeft = grid.scrollWidth - grid.clientWidth;

    const fadeLeft = scrollLeft > 5 ? '1' : '0';
    const fadeRight = (maxScrollLeft - scrollLeft) > 5 ? '1' : '0';

    container.style.setProperty('--ep-fade-left', fadeLeft);
    container.style.setProperty('--ep-fade-right', fadeRight);
  }

  function renderEpisodeGrid() {
    const epGrid = document.getElementById('epGrid');
    if (!epGrid) return;
    epGrid.innerHTML = '';

    getSortedEpisodes().forEach((ep) => {
      const epNum = ep.episode || ep.number || extractEpNumber(ep.title || ep.slug, 1);
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = epNum;
      box.id = `ep-box-${epNum}`;
      if (String(epNum) === String(window.currentPlayingEpisodeNum)) box.classList.add('active');

      box.onclick = () => selectEpisodeByNum(epNum);
      epGrid.appendChild(box);
    });

    epGrid.removeEventListener('scroll', updateEpScrollFade);
    epGrid.addEventListener('scroll', updateEpScrollFade);
    setTimeout(updateEpScrollFade, 50);
  }

  window.triggerViewIncrement = async function() {
    if (!targetSlug || !window.db || !window.fbRef) {
      setTimeout(window.triggerViewIncrement, 250);
      return;
    }

    if (hasIncrementedView) return;
    hasIncrementedView = true;

    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const todayStr = getLocalDateString();
    const totalRef = window.fbRef(window.db, `views_total/${cleanKey}`);
    const dailyRef = window.fbRef(window.db, `views_daily/${todayStr}/${cleanKey}`);

    try {
      if (window.fbTransaction) {
        const result = await window.fbTransaction(totalRef, (currentVal) => {
          return (Number(currentVal) || 0) + 1;
        });

        if (result && result.snapshot) {
          const newVal = result.snapshot.val();
          currentViewCount = formatViewDisplay(newVal);
          const countEl = document.getElementById('viewCountText');
          if (countEl) countEl.innerText = currentViewCount;
        }

        window.fbTransaction(dailyRef, (currentVal) => {
          return (Number(currentVal) || 0) + 1;
        }).catch(() => {});
      } else {
        const snap = await window.fbGet(totalRef);
        const currentCount = snap.exists() ? (parseInt(snap.val(), 10) || 0) : 0;
        const newCount = currentCount + 1;
        
        await window.fbSet(totalRef, newCount);
        currentViewCount = formatViewDisplay(newCount);
        const countEl = document.getElementById('viewCountText');
        if (countEl) countEl.innerText = currentViewCount;

        const dailySnap = await window.fbGet(dailyRef);
        const dailyCount = dailySnap.exists() ? (parseInt(dailySnap.val(), 10) || 0) : 0;
        window.fbSet(dailyRef, dailyCount + 1).catch(() => {});
      }
    } catch (e) {
      console.warn("View Increment Error:", e);
      try {
        const snap = await window.fbGet(totalRef);
        if (snap.exists()) {
          currentViewCount = formatViewDisplay(snap.val());
          const countEl = document.getElementById('viewCountText');
          if (countEl) countEl.innerText = currentViewCount;
        }
      } catch (_) {}
    }
  };

  async function fetchUserProfile(email, uid) {
    const cacheKey = email || uid || '';
    if (!cacheKey) return { name: 'User', photoURL: '' };
    if (userProfilesCache[cacheKey]) return userProfilesCache[cacheKey];

    let foundProfile = null;

    if (email && window.db && window.fbRef && window.fbGet) {
      const sanitizedEmail = String(email).replace(/\./g, ',');
      try {
        const userRef = window.fbRef(window.db, `users/${sanitizedEmail}`);
        const snap = await window.fbGet(userRef);
        if (snap.exists()) {
          foundProfile = snap.val();
        }
      } catch (_) {}
    }

    if (!foundProfile && uid && window.db && window.fbRef && window.fbGet) {
      try {
        const userRef = window.fbRef(window.db, `users/${uid}`);
        const snap = await window.fbGet(userRef);
        if (snap.exists()) {
          foundProfile = snap.val();
        }
      } catch (_) {}
    }

    const finalData = {
      name: (foundProfile && foundProfile.name) ? foundProfile.name : (email ? email.split('@')[0] : 'User'),
      photoURL: (foundProfile && foundProfile.photoURL) ? foundProfile.photoURL : ''
    };

    userProfilesCache[cacheKey] = finalData;
    return finalData;
  }

  window.loadComments = async function() {
    const container = document.getElementById('commentsListContainer');
    const countBadge = document.getElementById('commentsCountBadge');
    if (!container) return;

    if (!window.db || !window.fbRef || !window.fbGet) {
      setTimeout(window.loadComments, 250);
      return;
    }

    if (!targetSlug) return;

    try {
      const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
      const commentsRef = window.fbRef(window.db, `comments/${cleanKey}`);
      const snap = await window.fbGet(commentsRef);

      if (snap.exists()) {
        const commentsData = snap.val() || {};
        container.innerHTML = '';
        const mainComments = [];
        const repliesMap = {};

        const keys = Object.keys(commentsData);
        if (countBadge) countBadge.innerText = `(${keys.length})`;

        keys.forEach(key => {
          const item = { id: String(key), ...commentsData[key] };
          if (item.parentId) {
            const pId = String(item.parentId);
            if (!repliesMap[pId]) repliesMap[pId] = [];
            repliesMap[pId].push(item);
          } else {
            mainComments.push(item);
          }
        });

        mainComments.sort((a, b) => {
          if (a.isPinned && !b.isPinned) return -1;
          if (!a.isPinned && b.isPinned) return 1;
          if (currentSortMode === 'top') {
            const repliesA = (repliesMap[a.id] || []).length;
            const repliesB = (repliesMap[b.id] || []).length;
            return repliesB - repliesA;
          }
          return (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0);
        });

        if (mainComments.length === 0) {
          container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
          return;
        }

        for (const item of mainComments) {
          const replies = repliesMap[item.id] || [];
          replies.sort((r1, r2) => (Number(r1.timestamp) || 0) - (Number(r2.timestamp) || 0));
          const cardEl = await renderTikTokCommentCard(item, replies);
          container.appendChild(cardEl);
        }
      } else {
        if (countBadge) countBadge.innerText = '(0)';
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
      }
    } catch (e) {
      container.innerHTML = '<p style="font-size:12px;color:#ef4444;">Gagal memuat komentar. Periksa izin baca database.</p>';
    }
  };

  function getTimeAgo(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'Baru saja';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(hours / 60);
    if (hours < 24) return `${hours}j`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d`;
    return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderSmartRecommendations(currentGenres, currentSlug, catalog) {
    const section = document.getElementById('recommendationsSection');
    const row = document.getElementById('recommendationsRow');
    if (!section || !row || !Array.isArray(catalog)) return;

    const others = catalog.filter(item => String(item.slug || '').toLowerCase() !== String(currentSlug || '').toLowerCase());
    if (others.length === 0) return;

    const scored = others.map(item => {
      let score = 0;
      const itemGenres = Array.isArray(item.genres) 
        ? item.genres 
        : (typeof item.genres === 'string' ? item.genres.split(/[,•/]/).map(g => g.trim()) : []);

      if (currentGenres && currentGenres.length > 0) {
        itemGenres.forEach(g => {
          if (g && currentGenres.some(cg => cg.toLowerCase() === g.toLowerCase())) {
            score += 2;
          }
        });
      }
      score += Math.random() * 0.5;
      return { item, score };
    });

    scored.sort((a, b) => b.score - a.score);
    const topRecs = scored.slice(0, 15).map(s => s.item);

    if (topRecs.length === 0) return;

    row.innerHTML = topRecs.map(item => {
      const title = sanitizeTitle(item.title);
      const poster = item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
      const isMovie = (item.type || '').toString().toLowerCase() === 'movie' || title.toLowerCase().includes('movie');
      const epNum = item['latest-episode'] || (item.episode ? item.episode.replace(/[^0-9]/g, '') : '1');
      const epText = isMovie ? 'MOVIE' : `Ep ${epNum}`;
      const statusText = ((item.status || item.type || '').toString().toLowerCase().includes('completed')) ? 'TAMAT' : 'ONGOING';

      return `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="rec-card-item">
          <div class="rec-poster-box">
            <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" />
            <span class="rec-badge-status">${statusText}</span>
            <span class="rec-badge-ep">${epText}</span>
          </div>
          <div class="rec-card-title">${title}</div>
        </a>
      `;
    }).join('');

    section.style.display = 'block';
  }

          renderEpisodeGrid();
          
          let initialEp = globalEpisodes[0].episode || globalEpisodes[0].number || extractEpNumber(globalEpisodes[0].title || globalEpisodes[0].slug, 1);
          
          const historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
          const savedItem = historyList.find(item => item.slug === targetSlug || item.mainPath === targetSlug);
          if (savedItem && savedItem.episode) {
            const savedEpNum = extractEpNumber(savedItem.episode);
            const exists = globalEpisodes.some(e => String(e.episode || e.number || extractEpNumber(e.title || e.slug, 0)) === String(savedEpNum));
            if (exists) initialEp = savedEpNum;
          }

          if (window.currentUser && window.db && window.fbRef && window.fbGet) {
            const basePath = getUserBasePath();
            if (basePath) {
              const cleanSlugKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
              try {
                const histRef = window.fbRef(window.db, `${basePath}/history/${cleanSlugKey}`);
                const snap = await window.fbGet(histRef);
                if (snap.exists() && snap.val().episode) {
                  const fbEpNum = extractEpNumber(snap.val().episode);
                  const exists = globalEpisodes.some(e => String(e.episode || e.number || extractEpNumber(e.title || e.slug, 0)) === String(fbEpNum));
                  if (exists) initialEp = fbEpNum;
                }
              } catch (_) {}
            }
          }

          selectEpisodeByNum(initialEp);
        } else {
          hidePlayerLoader();
          document.getElementById('playerMediaContainer').innerText = 'Episode belum tersedia.';
        }
      }
    } catch (_) {
      hidePlayerLoader();
      document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    const hint = document.getElementById('serverHint');
    if (hint) {
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 4000);
    }

    checkFavorite();

    if (typeof window.triggerViewIncrement === 'function') {
      window.triggerViewIncrement();
    }
    if (typeof window.loadComments === 'function') {
      window.loadComments();
    }
  }

  function selectEpisodeByNum(epNum) {
    closeEpisodeSheet();
    
    const episode = globalEpisodes.find(e => {
      const num = e.episode || e.number || extractEpNumber(e.title || e.slug, 0);
      return String(num) === String(epNum);
    }) || globalEpisodes[0];

    if (!episode) return;

    const finalEpNum = episode.episode || episode.number || extractEpNumber(episode.title || episode.slug, 1);
    window.currentPlayingEpisodeNum = finalEpNum;

    saveContinueHistory(finalEpNum);

    document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
    const activeBox = document.getElementById(`ep-box-${finalEpNum}`);
    if (activeBox) {
      activeBox.classList.add('active');
      activeBox.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    setTimeout(updateEpScrollFade, 50);

    const rawServers = episode.servers || episode.server || [];
    let originalServers = (Array.isArray(rawServers) ? rawServers : Object.values(rawServers))
      .map((s, i) => ({
        name: s.name || s.title || `Server ${i + 1}`,
        url: s.link || s.url || (typeof s === 'string' ? s : '')
      }))
      .filter(s => /^https?:\/\//i.test(s.url));

    let servers = [];
    let dongflixServerUrl = '';

    originalServers.forEach(srv => {
      if (/ok\.ru\/(video|videoembed)\//i.test(srv.url)) {
        const matchId = srv.url.match(/(?:videoembed\/|video\/)(\d+)/i);
        if (matchId && matchId[1]) {
          dongflixServerUrl = `https://video-extractor-eight.vercel.app/?id=${matchId[1]}`;
        }
      }
    });

    if (dongflixServerUrl) {
      servers.push({
        name: 'Dongflix Server',
        url: dongflixServerUrl
      });
    }

    originalServers.forEach(srv => {
      servers.push(srv);
    });

    const serverSelect = document.getElementById('serverSelect');
    if (serverSelect) {
      serverSelect.innerHTML = '';

      if (servers.length > 0) {
        servers.forEach((srv, i) => {
          const opt = document.createElement('option');
          opt.value = srv.url;
          opt.innerText = srv.name;
          if (i === 0) opt.selected = true;
          serverSelect.appendChild(opt);
        });
        currentServerUrl = servers[0].url;
        renderPlayer(servers[0].url);
      } else {
        hidePlayerLoader();
        document.getElementById('playerMediaContainer').innerHTML = '<div class="detail-player-box">Server video belum tersedia.</div>';
      }
    }
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayer(url);
    }
  }

  function renderPlayer(url) {
    const box = document.getElementById('playerMediaContainer');
    box.innerHTML = `
      <div class="player-loader-overlay" id="playerLoaderOverlay">
        <div class="cool-spinner">
          <div class="spinner-ring"></div>
        </div>
        <span style="font-size: 11px; color: var(--color-accent); font-weight: 700; letter-spacing: 0.5px;">Memuat Video...</span>
      </div>
      <iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer" onload="hidePlayerLoader()"></iframe>
    `;
  }

  function openEpisodeSheet() {
    const grid = document.getElementById('sheetEpGrid');
    if (!grid) return;
    grid.innerHTML = '';

    getSortedEpisodes().forEach((ep) => {
      const epNum = ep.episode || ep.number || extractEpNumber(ep.title || ep.slug, 1);
      const box = document.createElement('div');
      box.className = `ep-box ${String(epNum) === String(window.currentPlayingEpisodeNum) ? 'active' : ''}`;
      box.innerText = epNum;
      box.onclick = () => selectEpisodeByNum(epNum);
      grid.appendChild(box);
    });

    document.getElementById('sheetOverlay').classList.add('active');
  }

  function closeEpisodeSheet() {
    document.getElementById('sheetOverlay').classList.remove('active');
  }

  window.onload = loadDetail;
</script>
</body>
</html>
