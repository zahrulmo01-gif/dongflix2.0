  import { auth, db, ref, get, set, remove, runTransaction, increment, onAuthStateChanged } from '/assets/firebase-config.js';

  window.auth = auth;
  window.db = db;
  window.fbRef = ref;
  window.fbGet = get;
  window.fbSet = set;
  window.fbRemove = remove;
  window.fbTransaction = runTransaction;
  window.fbIncrement = increment;
  window.currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    window.currentUser = user;
    const formBox = document.getElementById('commentFormBox');
    const noticeBox = document.getElementById('commentLoginNotice');
    if (user) {
      if (formBox) formBox.style.display = 'flex';
      if (noticeBox) noticeBox.style.display = 'none';
      if (typeof window.addExpToUser === 'function' && window.hasWatchedThisSession && !window.hasRewardedWatchExp) {
        window.addExpToUser(100);
        window.hasRewardedWatchExp = true;
      }
    } else {
      if (formBox) formBox.style.display = 'none';
      if (noticeBox) noticeBox.style.display = 'block';
    }

    if (typeof window.checkFavorite === 'function') {
      window.checkFavorite();
    }
  });

  const checkFirebaseReady = setInterval(() => {
    if (window.db && window.fbRef) {
      clearInterval(checkFirebaseReady);
      if (typeof window.initWatchApp === 'function') {
        window.initWatchApp();
      }
    }
  }, 50);
</script>

<script>
  let globalEpisodes = [];

  window.hasWatchedThisSession = false;
  window.hasRewardedWatchExp = false;

  const DEFAULT_STICKERS = [
    'https://cdn-icons-png.flaticon.com/128/9408/9408175.png',
    'https://media.tenor.com/On7KVXhzuf8AAAAj/chibi-cat.gif',
    'https://cdn-icons-png.flaticon.com/128/9408/9408201.png',
    'https://media.tenor.com/2s_jOsl0e8MAAAAj/dance-happy.gif',
    'https://cdn-icons-png.flaticon.com/128/9408/9408166.png',
    'https://media.tenor.com/kHIdycPoP6AAAAAj/anime-cry.gif',
    'https://cdn-icons-png.flaticon.com/128/9408/9408224.png',
    'https://media.tenor.com/gK2J_J7KkE8AAAAj/cute-love.gif'
  ];

  // HITUNG LEVEL DINAMIS (0-1000 = Lv1, 1001-2000 = Lv2, dst)
  function calculateLevel(expVal) {
    const exp = Number(expVal) || 0;
    if (exp <= 0) return 1;
    return Math.floor((exp - 1) / 1000) + 1;
  }

  // FUNGSI PENAMBAH EXP PENGGUNA
  window.addExpToUser = async function(amount = 100) {
    if (!window.currentUser || !window.db || !window.fbRef) return;
    try {
      const email = window.currentUser.email;
      const uid = window.currentUser.uid;
      let pathKey = uid;
      if (email) {
        pathKey = email.toLowerCase().replace(/\./g, ',');
      }
      const expRef = window.fbRef(window.db, `users/${pathKey}/exp`);

      if (window.fbTransaction) {
        await window.fbTransaction(expRef, (currentExp) => {
          return (Number(currentExp) || 0) + Number(amount);
        });
      } else if (window.fbIncrement && window.fbSet) {
        await window.fbSet(expRef, window.fbIncrement(amount));
      } else {
        const snap = await window.fbGet(expRef);
        const cur = snap.exists() ? (Number(snap.val()) || 0) : 0;
        await window.fbSet(expRef, cur + amount);
      }
    } catch (e) {
      console.warn("Gagal menambahkan EXP:", e);
    }
  };

  async function loadAllFirebaseUsers() {
    if (allRegisteredUsers.length > 0) return allRegisteredUsers;
    try {
      if (window.db && window.fbRef && window.fbGet) {
        const usersSnap = await window.fbGet(window.fbRef(window.db, 'users'));
        if (usersSnap.exists()) {
          const raw = usersSnap.val() || {};
          const users = [];
          Object.keys(raw).forEach(key => {
            const u = raw[key];
            if (u && typeof u === 'object') {
              users.push({
                key: key,
                username: u.username || '',
                name: u.name || u.username || 'User',
                photo: u.photoURL || '',
                email: u.email || '',
                exp: u.exp || 0
              });
            }
          });
          allRegisteredUsers = users;
          return allRegisteredUsers;
        }
      }
    } catch (e) {
      console.warn("Gagal mengambil users untuk mention:", e);
    }
    return [];
  }

  async function fetchStickersFromFirebase() {
    if (cachedStickers.length > 0) return cachedStickers;
    try {
      if (window.db && window.fbRef && window.fbGet) {
        let snap = await window.fbGet(window.fbRef(window.db, 'stickers'));
        if (!snap.exists()) {
          snap = await window.fbGet(window.fbRef(window.db, 'sticker'));
        }

        if (snap.exists()) {
          const val = snap.val();
          let list = [];
          if (Array.isArray(val)) {
            list = val.filter(Boolean);
          } else if (typeof val === 'object' && val !== null) {
            Object.values(val).forEach(item => {
              if (typeof item === 'string') {
                list.push(item);
              } else if (item && typeof item === 'object') {
                const url = item.url || item.link || item.image || item.src;
                if (url) list.push(url);
              }
            });
          }
          if (list.length > 0) {
            cachedStickers = list;
            return cachedStickers;
          }
        }
      }
    } catch (e) {
      console.warn("Gagal mengambil stiker dari Firebase:", e);
    }

    cachedStickers = DEFAULT_STICKERS;
    return cachedStickers;
  }

  async function handleMentionInput(inputEl, menuId) {
    const menu = document.getElementById(menuId);
    if (!menu) return;

    const val = inputEl.value;
    const cursorPos = inputEl.selectionStart;
    const textBeforeCursor = val.slice(0, cursorPos);
    const atIndex = textBeforeCursor.lastIndexOf('@');

    if (atIndex !== -1 && (atIndex === 0 || /\s/.test(textBeforeCursor[atIndex - 1]))) {
      const query = textBeforeCursor.slice(atIndex + 1).toLowerCase();

      if (allRegisteredUsers.length === 0) {
        await loadAllFirebaseUsers();
      }

      const matchedUsers = allRegisteredUsers.filter(u => {
        const uName = (u.username || '').toLowerCase();
        const dName = (u.name || '').toLowerCase();
        return uName.includes(query) || dName.includes(query);
      });

      if (matchedUsers.length > 0) {
        menu.innerHTML = matchedUsers.slice(0, 8).map(u => {
          const insertTag = u.username || u.name;
          const initial = (u.name || u.username || 'U').charAt(0).toUpperCase();
          const avatarHtml = u.photo 
            ? `<img src="${u.photo}" onerror="this.outerHTML='<span class=\\'mention-initial\\'>${initial}</span>'" />` 
            : `<span class="mention-initial">${initial}</span>`;

          return `
            <div class="mention-dropdown-item" onclick="insertMention('${escapeHtml(insertTag)}', '${inputEl.id}', '${menuId}', ${atIndex})">
              ${avatarHtml}
              <div style="display:flex; flex-direction:column; line-height:1.2;">
                <span style="color:#f1f5f9; font-weight:700;">${escapeHtml(u.name)}</span>
                ${u.username ? `<span style="font-size:10px; color:#64748b;">@${escapeHtml(u.username)}</span>` : ''}
              </div>
            </div>
          `;
        }).join('');
        menu.classList.add('active');
        return;
      }
    }

    menu.classList.remove('active');
  }

    const textBeforeAt = val.slice(0, atIndex);

  function getCleanMainSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    let s = urlParams.get('slug');
    if (!s) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const donghuaIdx = parts.indexOf('donghua');
      if (donghuaIdx !== -1 && parts[donghuaIdx + 1]) {
        s = parts[donghuaIdx + 1];
      } else {
        s = parts[parts.length - 1] || '';
      }
    }
    s = String(s || '').trim().replace(/^https?:\/\/[^\/]+/i, '').split('?')[0].split('#')[0];
    return s.replace(/-episode-\d+.*$/i, '').replace(/-ep-\d+.*$/i, '').replace(/^\/+|\/+$/g, '');
  }

  let targetSlug = getCleanMainSlug();

  function slugToTitleCase(slug) {
    if (!slug) return 'Donghua';
    return slug.split('-').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }

  const initialDisplayTitle = slugToTitleCase(targetSlug);
  const headerTitleEl = document.getElementById('topHeaderTitle');
  if (headerTitleEl) headerTitleEl.innerText = initialDisplayTitle;
  document.title = `Nonton ${initialDisplayTitle} Sub Indo - Dongflix`;

  function sanitizeTitle(str) {
    if (!str) return '';
    const text = str.trim();
    const half = Math.floor(text.length / 2);
    return (text.length > 4 && text.slice(0, half) === text.slice(half)) ? text.slice(0, half).trim() : text;
  }

  function isMovieItem(info) {
    if (!info) return false;
    const typeStr = (info.type || '').toString().toLowerCase();
    const titleStr = `${info.title || ''} ${targetSlug}`.toLowerCase();
    return typeStr === 'movie' || titleStr.includes('movie');
  }

  function extractEpNumber(val, fallback = 1) {
    const match = String(val || '').match(/(\d+(\.\d+)?)/);
    return match ? parseFloat(match[1]) : fallback;
  }

  function getLocalDateString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatViewDisplay(val) {
    const n = parseInt(val, 10);
    if (isNaN(n) || n < 0) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function goBack() {
    const referrer = document.referrer;
    if (referrer) {
      try {
        const refUrl = new URL(referrer);
        if (refUrl.host === window.location.host) {
          if (refUrl.pathname === '/' || refUrl.pathname === '') {
            window.location.href = '/';
            return;
          }
          if (refUrl.pathname.startsWith('/donghua')) {
            window.location.href = '/donghua/';
            return;
          }
        }
      } catch (_) {}
    }

    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    window.location.href = '/';
  }

    const scrollLeft = grid.scrollLeft;
    const maxScrollLeft = grid.scrollWidth - grid.clientWidth;

    const fadeRight = (maxScrollLeft - scrollLeft) > 5 ? '1' : '0';

  window.triggerViewIncrement = async function() {
    targetSlug = getCleanMainSlug();
    if (!targetSlug || !window.db || !window.fbRef) return;

    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const todayStr = getLocalDateString();
    const totalRef = window.fbRef(window.db, `views_total/${cleanKey}`);
    const dailyRef = window.fbRef(window.db, `views_daily/${todayStr}/${cleanKey}`);

    try {
      const initSnap = await window.fbGet(totalRef);
      if (initSnap.exists()) {
        currentViewCount = formatViewDisplay(initSnap.val());
        const countEl = document.getElementById('viewCountText');
        if (countEl) countEl.innerText = currentViewCount;
      }
    } catch (_) {}

    if (hasIncrementedView) return;
    hasIncrementedView = true;

    // Trigger EXP +100 saat nonton (views bertambah) jika sudah login
    window.hasWatchedThisSession = true;
    if (window.currentUser && !window.hasRewardedWatchExp) {
      window.addExpToUser(100);
      window.hasRewardedWatchExp = true;
    }

    try {
      if (window.fbTransaction) {
        const result = await window.fbTransaction(totalRef, (currentVal) => {
          return (Number(currentVal) || 0) + 1;
        });

        if (result && result.snapshot) {
          const newVal = result.snapshot.val();
          currentViewCount = formatViewDisplay(newVal);
          const countEl = document.getElementById('viewCountText');
          if (countEl) countEl.innerText = currentViewCount;
        }

        window.fbTransaction(dailyRef, (currentVal) => {
          return (Number(currentVal) || 0) + 1;
        }).catch(() => {});
      } else {
        const snap = await window.fbGet(totalRef);
        const currentCount = snap.exists() ? (parseInt(snap.val(), 10) || 0) : 0;
        const newCount = currentCount + 1;
        
        await window.fbSet(totalRef, newCount);
        currentViewCount = formatViewDisplay(newCount);
        const countEl = document.getElementById('viewCountText');
        if (countEl) countEl.innerText = currentViewCount;

        const dailySnap = await window.fbGet(dailyRef);
        const dailyCount = dailySnap.exists() ? (parseInt(dailySnap.val(), 10) || 0) : 0;
        window.fbSet(dailyRef, dailyCount + 1).catch(() => {});
      }
    } catch (e) {
      console.warn("View Increment Error:", e);
    }
  };

  async function toggleFavorite() {
    targetSlug = getCleanMainSlug();
    if (!targetSlug) return;
    let favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    const exists = favs.some(f => f.slug === targetSlug);
    const btn = document.getElementById('btnFavorite');

    const cleanSlugKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const basePath = getUserBasePath();

    if (exists) {
      favs = favs.filter(f => f.slug !== targetSlug);
      if (btn) btn.classList.remove('active');

      if (window.currentUser && basePath && window.fbRef && window.fbRemove) {
        try {
          const favRef = window.fbRef(window.db, `${basePath}/favorites/${cleanSlugKey}`);
          await window.fbRemove(favRef);
        } catch (_) {}
      }
    } else {
      const favItem = {
        slug: targetSlug,
        title: currentMainTitle || initialDisplayTitle,
        poster: currentPoster,
        updatedAt: Date.now()
      };
      favs.unshift(favItem);
      if (btn) btn.classList.add('active');

      if (window.currentUser && basePath && window.fbRef && window.fbSet) {
        try {
          const favRef = window.fbRef(window.db, `${basePath}/favorites/${cleanSlugKey}`);
          await window.fbSet(favRef, favItem);
        } catch (_) {}
      }
    }

    localStorage.setItem('df_favorites', JSON.stringify(favs));
  }

  async function checkFavorite() {
    targetSlug = getCleanMainSlug();
    if (!targetSlug) return;
    const btn = document.getElementById('btnFavorite');
    if (!btn) return;

    let isFav = false;
    const favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    if (favs.some(f => f.slug === targetSlug)) {
      isFav = true;
    }

    if (window.currentUser && window.db && window.fbRef && window.fbGet) {
      const basePath = getUserBasePath();
      if (basePath) {
        const cleanSlugKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
        try {
          const favRef = window.fbRef(window.db, `${basePath}/favorites/${cleanSlugKey}`);
          const snap = await window.fbGet(favRef);
          if (snap.exists()) {
            isFav = true;
            if (!favs.some(f => f.slug === targetSlug)) {
              favs.unshift({
                slug: targetSlug,
                title: currentMainTitle || initialDisplayTitle,
                poster: currentPoster
              });
              localStorage.setItem('df_favorites', JSON.stringify(favs));
            }
          }
        } catch (_) {}
      }
    }

    if (isFav) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }

  window.checkFavorite = checkFavorite;

  function triggerDownload() {
    if (!globalEpisodes || globalEpisodes.length === 0 || !window.currentPlayingEpisodeNum) {
      if (currentServerUrl) {
        window.open(currentServerUrl, '_blank');
      } else {
        alert('Video belum siap.');
      }
      return;
    }

    const currentEp = globalEpisodes.find(e => {
      const num = e.episode || e.number || extractEpNumber(e.title || e.slug, 0);
      return String(num) === String(window.currentPlayingEpisodeNum);
    });

    let okRuId = null;

    if (currentEp) {
      const rawServers = currentEp.servers || currentEp.server || [];
      const serversList = (Array.isArray(rawServers) ? rawServers : Object.values(rawServers))
        .map(s => s.link || s.url || (typeof s === 'string' ? s : ''))
        .filter(url => /^https?:\/\//i.test(url));

      for (const srvUrl of serversList) {
        const matchId = srvUrl.match(/(?:videoembed\/|video\/)(\d+)/i);
        if (matchId && matchId[1]) {
          okRuId = matchId[1];
          break;
        }
      }
    }

    if (!okRuId && currentServerUrl) {
      const activeMatch = currentServerUrl.match(/(?:videoembed\/|video\/)(\d+)/i);
      if (activeMatch && activeMatch[1]) {
        okRuId = activeMatch[1];
      }
    }

    if (okRuId) {
      const downloadUrl = `https://api-extract-player.pages.dev/download?id=${okRuId}`;
      window.open(downloadUrl, '_blank');
    } else if (currentServerUrl) {
      window.open(currentServerUrl, '_blank');
    } else {
      alert('Video belum siap.');
    }
  }

  async function fetchUserProfile(email, uid) {
    const cacheKey = email || uid || '';
    if (!cacheKey) return { name: '', photoURL: '', username: '', exp: 0 };
    if (userProfilesCache[cacheKey]) return userProfilesCache[cacheKey];

    let foundProfile = null;

    try {
      if (email && window.db && window.fbRef && window.fbGet) {
        const sanitizedEmail = String(email).toLowerCase().replace(/\./g, ',');
        const userRef = window.fbRef(window.db, `users/${sanitizedEmail}`);
        const snap = await window.fbGet(userRef);
        if (snap.exists()) {
          foundProfile = snap.val();
        }
      }

      if (!foundProfile && uid && window.db && window.fbRef && window.fbGet) {
        const userRef = window.fbRef(window.db, `users/${uid}`);
        const snap = await window.fbGet(userRef);
        if (snap.exists()) {
          foundProfile = snap.val();
        }
      }
    } catch (_) {}

    const finalData = {
      name: (foundProfile && foundProfile.name) ? foundProfile.name : '',
      photoURL: (foundProfile && foundProfile.photoURL) ? foundProfile.photoURL : '',
      username: (foundProfile && foundProfile.username) ? foundProfile.username : '',
      exp: (foundProfile && foundProfile.exp) ? Number(foundProfile.exp) : 0
    };

    userProfilesCache[cacheKey] = finalData;
    return finalData;
  }

  function formatCommentTime(tsVal) {
    const ts = Number(tsVal);
    if (!ts || isNaN(ts)) return 'Baru saja';
    try {
      const diff = Date.now() - ts;
      if (diff < 60000 || diff < 0) return 'Baru saja';
      const m = Math.floor(diff / 60000);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}j`;
      const d = Math.floor(h / 24);
      if (d < 30) return `${d}h`;
      const dateObj = new Date(ts);
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return `${dateObj.getDate()} ${months[dateObj.getMonth()]}`;
    } catch (_) {
      return 'Baru saja';
    }
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  window.loadComments = async function() {
    targetSlug = getCleanMainSlug();
    const container = document.getElementById('commentsListContainer');
    const countBadge = document.getElementById('commentsCountBadge');
    if (!container) return;

    if (!window.db || !window.fbRef || !window.fbGet) {
      container.innerHTML = '<p style="font-size:12px;color:#64748b;">Menghubungkan ke database...</p>';
      return;
    }
    if (!targetSlug) return;

    try {
      loadAllFirebaseUsers();

      const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
      const commentsRef = window.fbRef(window.db, `comments/${cleanKey}`);
      const snap = await window.fbGet(commentsRef);

      if (!snap || !snap.exists()) {
        if (countBadge) countBadge.innerText = '(0)';
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
        return;
      }

      const rawData = snap.val() || {};
      const allComments = [];

      Object.keys(rawData).forEach(key => {
        const item = rawData[key];
        if (item && typeof item === 'object') {
          allComments.push({ ...item, id: String(key) });
        }
      });

      if (countBadge) countBadge.innerText = `(${allComments.length})`;

      if (allComments.length === 0) {
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
        return;
      }

      const mainComments = [];
      const repliesMap = {};

      allComments.forEach(item => {
        const pId = item.parentId ? String(item.parentId).trim() : '';
        if (pId && pId !== 'null' && pId !== 'undefined' && pId !== String(item.id)) {
          if (!repliesMap[pId]) repliesMap[pId] = [];
          repliesMap[pId].push(item);
        } else {
          mainComments.push(item);
        }
      });

      mainComments.sort((a, b) => {
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;
        if (currentSortMode === 'top') {
          const repA = (repliesMap[a.id] || []).length;
          const repB = (repliesMap[b.id] || []).length;
          return repB - repA;
        }
        return (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0);
      });

      container.innerHTML = '';

      for (let item of mainComments) {
        const replies = repliesMap[item.id] || [];
        replies.sort((r1, r2) => (Number(r1.timestamp) || 0) - (Number(r2.timestamp) || 0));
        
        const cardEl = await createCommentCardElement(item, replies);
        container.appendChild(cardEl);
      }

    } catch (e) {
      console.error("Load Comments Error:", e);
      container.innerHTML = `<p style="font-size:12px;color:#ef4444;">Gagal memuat komentar: ${escapeHtml(e.message || String(e))}</p>`;
    }
  };

  function renderSmartRecommendations(currentGenres, currentSlug, catalog) {
    const section = document.getElementById('recommendationsSection');
    const row = document.getElementById('recommendationsRow');
    if (!section || !row || !Array.isArray(catalog)) return;

    const others = catalog.filter(item => String(item.slug || '').toLowerCase() !== String(currentSlug || '').toLowerCase());
    if (others.length === 0) return;

    const scored = others.map(item => {
      let score = 0;
      const itemGenres = Array.isArray(item.genres) 
        ? item.genres 
        : (typeof item.genres === 'string' ? item.genres.split(/[,•/]/).map(g => g.trim()) : []);

      if (currentGenres && currentGenres.length > 0) {
        itemGenres.forEach(g => {
          if (g && currentGenres.some(cg => cg.toLowerCase() === g.toLowerCase())) {
            score += 2;
          }
        });
      }
      score += Math.random() * 0.5;
      return { item, score };
    });

    scored.sort((a, b) => b.score - a.score);
    const topRecs = scored.slice(0, 15).map(s => s.item);

    if (topRecs.length === 0) return;

    row.innerHTML = topRecs.map(item => {
      const title = sanitizeTitle(item.title);
      const poster = item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
      const isMovie = isMovieItem(item);
      const epNum = item['latest-episode'] || (item.episode ? item.episode.replace(/[^0-9]/g, '') : '1');
      const epText = isMovie ? 'MOVIE' : `Ep ${epNum}`;
      const statusText = ((item.status || item.type || '').toString().toLowerCase().includes('completed')) ? 'TAMAT' : 'ONGOING';

      return `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="rec-card-item">
          <div class="rec-poster-box">
            <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" />
            <span class="rec-badge-status">${statusText}</span>
            <span class="rec-badge-ep">${epText}</span>
          </div>
          <div class="rec-card-title">${title}</div>
        </a>
      `;
    }).join('');

    section.style.display = 'block';
  }

  async function initWatchApp() {
    targetSlug = getCleanMainSlug();

    if (!targetSlug) {
      document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    try {
      let catalog = null;
      let info = null;

      const catRes = await fetch('/api/donghua?path=donghua.json');
      if (catRes.ok) {
        catalog = await catRes.json();
        info = catalog.find(d => String(d.slug || '').toLowerCase() === targetSlug.toLowerCase());
      }

      if (!info) {
        let altRes = await fetch(`/api/detail?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
        if (altRes && altRes.success && altRes.data) {
          info = {
            slug: targetSlug,
            title: altRes.data.judul || altRes.data.title || initialDisplayTitle,
            cover: altRes.data.poster || '',
            synopsis: altRes.data.synopsis || altRes.data.desc || '',
            status: altRes.data.status || 'Ongoing',
            released: altRes.data.released || '-',
            genres: altRes.data.genres || ['Action', 'Fantasy']
          };
        }
      }

      if (!info) {
        hidePlayerLoader();
        document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
        document.getElementById('mainContentGroup').style.display = 'none';
        document.getElementById('notFoundBox').style.display = 'flex';
        return;
      }

      // Ambil view data dulu sebelum render action bar
      try {
        if (window.db && window.fbRef && window.fbGet) {
          const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
          const snapTotal = await window.fbGet(window.fbRef(window.db, `views_total/${cleanKey}`));
          if (snapTotal.exists()) {
            currentViewCount = formatViewDisplay(snapTotal.val());
          }
        }
      } catch (_) {}

      renderActionBarContent();

      document.getElementById('mainContentGroup').style.display = 'block';
      document.getElementById('notFoundBox').style.display = 'none';

      currentMainTitle = sanitizeTitle(info.title);
      currentPoster = info.cover || info.poster || info.thumbnail || '';
      const currentSynopsis = info.synopsis || info.description || info.desc || '';

      updateSocialMetaTags(currentMainTitle, currentPoster, currentSynopsis, targetSlug);
      document.getElementById('topHeaderTitle').innerText = currentMainTitle;

      const genresList = Array.isArray(info.genres) ? info.genres : (typeof info.genres === 'string' ? info.genres.split(/[,•/]/).map(g => g.trim()) : []);
      const genresHtml = genresList.map(g => `<span class="genre-pill">${g}</span>`).join('');

      document.getElementById('mediaDetailsGroup').innerHTML = `
        <div class="media-meta-card">
          <div class="media-cover-wrapper">
            <img src="${currentPoster || 'https://via.placeholder.com/150x200?text=No+Cover'}" class="media-cover-img" alt="${currentMainTitle}" />
          </div>
          <div class="media-info-col">
            <h1 class="media-title">${currentMainTitle}</h1>
            <div class="genre-badges-row">${genresHtml}</div>
            <div class="status-release-row">
              <span>Status: <strong>${info.status || 'Ongoing'}</strong></span>
              <span>Rilis: <strong>${info.released || '-'}</strong></span>
            </div>
          </div>
        </div>
        <div class="synopsis-block">
          <div class="synopsis-heading">SINOPSIS</div>
          <p class="synopsis-text">${currentSynopsis || 'Tidak ada deskripsi sinopsis.'}</p>
        </div>
      `;

      if (Array.isArray(catalog)) {
        renderSmartRecommendations(genresList, targetSlug, catalog);
      }

      const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(targetSlug)}.json`);
      if (epRes.ok) {
        globalEpisodes = await epRes.json();
        document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;

        const isMovie = isMovieItem(info);
        const epContainerEl = document.getElementById('epContainer');

        if (isMovie && globalEpisodes.length <= 1) {
          if (epContainerEl) epContainerEl.style.display = 'none';
        } else {
          if (epContainerEl) epContainerEl.style.display = 'block';
          document.getElementById('episodeSortWrapper').style.display = 'block';
          document.getElementById('btnSeeAllEp').style.display = 'inline-flex';
        }

        if (globalEpisodes.length > 0) {
          renderEpisodeGrid();
          
          let initialEp = globalEpisodes[0].episode || globalEpisodes[0].number || extractEpNumber(globalEpisodes[0].title || globalEpisodes[0].slug, 1);
          
          const historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
          const savedItem = historyList.find(item => item.slug === targetSlug || item.mainPath === targetSlug);
          if (savedItem && savedItem.episode) {
            const savedEpNum = extractEpNumber(savedItem.episode);
            const exists = globalEpisodes.some(e => String(e.episode || e.number || extractEpNumber(e.title || e.slug, 0)) === String(savedEpNum));
            if (exists) initialEp = savedEpNum;
          }

          if (window.currentUser && window.db && window.fbRef && window.fbGet) {
            const basePath = getUserBasePath();
            if (basePath) {
              const cleanSlugKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
              try {
                const histRef = window.fbRef(window.db, `${basePath}/history/${cleanSlugKey}`);
                const snap = await window.fbGet(histRef);
                if (snap.exists() && snap.val().episode) {
                  const fbEpNum = extractEpNumber(snap.val().episode);
                  const exists = globalEpisodes.some(e => String(e.episode || e.number || extractEpNumber(e.title || e.slug, 0)) === String(fbEpNum));
                  if (exists) initialEp = fbEpNum;
                }
              } catch (_) {}
            }
          }

          selectEpisodeByNum(initialEp);
        } else {
          hidePlayerLoader();
          document.getElementById('playerMediaContainer').innerText = 'Episode belum tersedia.';
        }
      }
    } catch (_) {
      hidePlayerLoader();
      document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    const hint = document.getElementById('serverHint');
    if (hint) {
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 4000);
    }

    checkFavorite();

    if (typeof window.triggerViewIncrement === 'function') {
      window.triggerViewIncrement();
    }
    if (typeof window.loadComments === 'function') {
      window.loadComments();
    }
  }

  window.loadDetail = initWatchApp;

  function selectEpisodeByNum(epNum) {
    closeEpisodeSheet();
    
    const episode = globalEpisodes.find(e => {
      const num = e.episode || e.number || extractEpNumber(e.title || e.slug, 0);
      return String(num) === String(epNum);
    }) || globalEpisodes[0];

    if (!episode) return;

    const finalEpNum = episode.episode || episode.number || extractEpNumber(episode.title || episode.slug, 1);
    window.currentPlayingEpisodeNum = finalEpNum;

    saveContinueHistory(finalEpNum);

    document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
    const activeBox = document.getElementById(`ep-box-${finalEpNum}`);
    if (activeBox) {
      activeBox.classList.add('active');
      activeBox.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    setTimeout(updateEpScrollFade, 50);

    const epOp = episode.op || episode.opening || episode.intro || '';

    const rawServers = episode.servers || episode.server || [];
    let originalServers = (Array.isArray(rawServers) ? rawServers : Object.values(rawServers))
      .map((s, i) => ({
        name: s.name || s.title || `Server ${i + 1}`,
        url: s.link || s.url || (typeof s === 'string' ? s : '')
      }))
      .filter(s => /^https?:\/\//i.test(s.url));

    let servers = [];
    let dongflixServerUrl = '';

    originalServers.forEach(srv => {
      if (/ok\.ru\/(video|videoembed)\//i.test(srv.url)) {
        const matchId = srv.url.match(/(?:videoembed\/|video\/)(\d+)/i);
        if (matchId && matchId[1]) {
          const opQuery = epOp ? `&op=${encodeURIComponent(epOp)}` : '';
          dongflixServerUrl = `https://api-extract-player.pages.dev/?id=${matchId[1]}${opQuery}`;
        }
      }
    });

    if (dongflixServerUrl) {
      servers.push({
        name: 'Dongflix Server',
        url: dongflixServerUrl
      });
    }

    originalServers.forEach(srv => {
      servers.push(srv);
    });

    const serverSelect = document.getElementById('serverSelect');
    if (serverSelect) {
      serverSelect.innerHTML = '';

      if (servers.length > 0) {
        servers.forEach((srv, i) => {
          const opt = document.createElement('option');
          opt.value = srv.url;
          opt.innerText = srv.name;
          if (i === 0) opt.selected = true;
          serverSelect.appendChild(opt);
        });
        currentServerUrl = servers[0].url;
        renderPlayer(servers[0].url);
      } else {
        hidePlayerLoader();
        document.getElementById('playerMediaContainer').innerHTML = '<div class="detail-player-box">Server video belum tersedia.</div>';
      }
    }
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayer(url);
    }
  }

  function renderPlayer(url) {
    const box = document.getElementById('playerMediaContainer');
    box.innerHTML = `
      <div class="player-loader-overlay" id="playerLoaderOverlay">
        <div class="cool-spinner">
          <div class="spinner-ring"></div>
        </div>
        <span style="font-size: 11px; color: var(--color-accent); font-weight: 700; letter-spacing: 0.5px;">Memuat Video...</span>
      </div>
      <iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer" onload="hidePlayerLoader()"></iframe>
    `;
  }

  function openEpisodeSheet() {
    const grid = document.getElementById('sheetEpGrid');
    if (!grid) return;
    grid.innerHTML = '';

    getSortedEpisodes().forEach((ep) => {
      const epNum = ep.episode || ep.number || extractEpNumber(ep.title || ep.slug, 1);
      const box = document.createElement('div');
      box.className = `ep-box ${String(epNum) === String(window.currentPlayingEpisodeNum) ? 'active' : ''}`;
      box.innerText = epNum;
      box.onclick = () => selectEpisodeByNum(epNum);
      grid.appendChild(box);
    });

    document.getElementById('sheetOverlay').classList.add('active');
  }

  function closeEpisodeSheet() {
    document.getElementById('sheetOverlay').classList.remove('active');
  }
</script>
</body>
</html>
