<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Nonton Donghua - Dongflix</title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #1a2234; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #25334d; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 bg-[#07090e]/85 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="text-xl sm:text-2xl font-black tracking-tight bg-gradient-to-r from-blue-500 via-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          Dongflix
        </a>
        <nav class="flex items-center gap-4 text-xs font-semibold text-slate-400">
          <a href="/" class="hover:text-white transition">Beranda</a>
          <a href="/donghua/" class="hover:text-white transition">Semua Donghua</a>
        </nav>
      </div>

      <a href="/donghua/" class="text-xs font-semibold text-blue-400 bg-blue-950/40 border border-blue-800/60 px-3 py-1.5 rounded-xl hover:bg-blue-900/40 transition">
        &larr; Kembali ke Katalog
      </a>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-6">

    <!-- BREADCRUMB -->
    <div class="text-xs font-mono text-slate-500 flex items-center gap-2">
      <a href="/" class="hover:text-slate-300">Home</a>
      <span>/</span>
      <a href="/donghua/" class="hover:text-slate-300">Donghua</a>
      <span>/</span>
      <span id="breadcrumbTitle" class="text-slate-300 truncate max-w-xs">Memuat...</span>
    </div>

    <!-- VIDEO PLAYER SECTION -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <div class="lg:col-span-2 space-y-4">
        <!-- FRAME CONTAINER -->
        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
          <iframe 
            id="mainPlayer" 
            src="" 
            class="w-full h-full border-0" 
            allowfullscreen 
            scrolling="no"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>

        <!-- SERVER SWITCHER -->
        <div class="bg-[#0d121d] border border-slate-800/80 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider font-mono">Pilih Server:</span>
            <div id="serverButtons" class="flex flex-wrap gap-2">
              <span class="text-xs text-slate-500">Memuat server...</span>
            </div>
          </div>
          <span id="currentEpisodeLabel" class="text-xs font-mono font-bold text-blue-400 bg-blue-950/60 border border-blue-800/60 px-3 py-1 rounded-xl">
            Ep -
          </span>
        </div>
      </div>

      <!-- EPISODE SELECTOR SIDEBAR -->
      <div class="bg-[#0d121d] border border-slate-800/80 rounded-2xl p-4 flex flex-col h-[480px]">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider font-mono">Daftar Episode</h2>
          <span id="epTotalBadge" class="text-[11px] font-mono text-slate-500">0 Ep</span>
        </div>

        <div id="episodeGrid" class="flex-1 overflow-y-auto grid grid-cols-4 sm:grid-cols-5 lg:grid-cols-4 gap-2 pt-3 pr-1">
          <div class="col-span-full text-center text-xs text-slate-500 py-10">Memuat episode...</div>
        </div>
      </div>

    </div>

    <!-- METADATA & SYNOPSIS -->
    <div class="bg-[#0d121d] border border-slate-800/80 rounded-2xl p-5 sm:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row gap-5">
        <img 
          id="detailCover" 
          src="https://via.placeholder.com/150x210" 
          alt="Poster" 
          referrerpolicy="no-referrer"
          class="w-28 sm:w-36 h-auto aspect-[3/4] object-cover rounded-xl border border-slate-800 shrink-0 mx-auto sm:mx-0 shadow-lg"
        >
        <div class="space-y-3 flex-1 text-center sm:text-left">
          <h1 id="detailTitle" class="text-lg sm:text-2xl font-black text-white leading-tight">Memuat Judul...</h1>
          
          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 pt-1" id="genreContainer"></div>

          <div class="text-xs text-slate-400 space-y-1 font-mono pt-2">
            <div><span class="text-slate-500">Status:</span> <span id="detailStatus" class="text-slate-300">-</span></div>
            <div><span class="text-slate-500">Rilis:</span> <span id="detailReleased" class="text-slate-300">-</span></div>
          </div>
        </div>
      </div>

      <div class="border-t border-slate-800/80 pt-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 font-mono mb-2">Sinopsis</h3>
        <p id="detailSynopsis" class="text-xs sm:text-sm text-slate-300 leading-relaxed">
          Memuat sinopsis...
        </p>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800/80 bg-[#07090e] px-4 py-8 text-center text-xs text-slate-500">
    <p class="font-bold text-slate-400">Dongflix &copy; 2026 - Streaming Donghua Subtitle Indonesia</p>
  </footer>

  <script>
    // Ambil slug dari path URL (/donghua/[slug])
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = pathParts[pathParts.length - 1] === 'donghua' ? 'swallowed-star-battle-of-the-primordial-star' : pathParts[pathParts.length - 1];

    let episodeList = [];
    let currentEpisode = null;

    function cleanTitle(str) {
      if (!str) return '';
      const text = str.trim();
      const half = Math.floor(text.length / 2);
      if (text.length > 4 && text.slice(0, half) === text.slice(half)) {
        return text.slice(0, half).trim();
      }
      return text;
    }

    async function initDetailPage() {
      // 1. Ambil info donghua dari katalog master
      try {
        const catRes = await fetch('/api/donghua?path=donghua.json');
        if (catRes.ok) {
          const catalog = await catRes.json();
          const info = catalog.find(d => d.slug === slug);
          if (info) {
            const safeTitle = cleanTitle(info.title);
            document.title = `Nonton ${safeTitle} Sub Indo - Dongflix`;
            document.getElementById('pageTitle').innerText = `Nonton ${safeTitle} - Dongflix`;
            document.getElementById('breadcrumbTitle').innerText = safeTitle;
            document.getElementById('detailTitle').innerText = safeTitle;
            document.getElementById('detailCover').src = info.cover || 'https://via.placeholder.com/150x210';
            document.getElementById('detailStatus').innerText = info.status || 'Ongoing';
            document.getElementById('detailReleased').innerText = info.released || '-';
            document.getElementById('detailSynopsis').innerText = info.synopsis || 'Sinopsis belum tersedia.';

            if (Array.isArray(info.genres)) {
              document.getElementById('genreContainer').innerHTML = info.genres.map(g => 
                `<span class="text-[10px] font-semibold bg-slate-800/80 text-slate-300 border border-slate-700/60 px-2 py-0.5 rounded-lg">${g}</span>`
              ).join('');
            }
          }
        }
      } catch (_) {}

      // 2. Ambil daftar episode
      try {
        const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(slug)}.json`);
        if (!epRes.ok) throw new Error('File episode belum tersedia');
        episodeList = await epRes.json();

        if (!Array.isArray(episodeList) || episodeList.length === 0) {
          document.getElementById('episodeGrid').innerHTML = '<div class="col-span-full text-center text-xs text-slate-500 py-10">Belum ada episode.</div>';
          return;
        }

        document.getElementById('epTotalBadge').innerText = `${episodeList.length} Ep`;

        // Render tombol episode
        renderEpisodeList();

        // Putar episode pertama secara default
        selectEpisode(0);
      } catch (err) {
        document.getElementById('episodeGrid').innerHTML = `<div class="col-span-full text-center text-xs text-rose-400 py-10">${err.message}</div>`;
      }
    }

    function renderEpisodeList() {
      const grid = document.getElementById('episodeGrid');
      grid.innerHTML = episodeList.map((ep, idx) => {
        const num = ep.episode || (idx + 1);
        return `
          <button 
            id="epBtn-${idx}"
            onclick="selectEpisode(${idx})" 
            class="h-9 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center bg-[#121927] border border-slate-800 hover:border-blue-500 text-slate-300 hover:text-white"
          >
            ${num}
          </button>
        `;
      }).join('');
    }

    function selectEpisode(idx) {
      currentEpisode = episodeList[idx];
      if (!currentEpisode) return;

      // Update state styling tombol
      episodeList.forEach((_, i) => {
        const btn = document.getElementById(`epBtn-${i}`);
        if (btn) {
          if (i === idx) {
            btn.className = 'h-9 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center bg-blue-600 text-white shadow-lg shadow-blue-900/40 border-0';
          } else {
            btn.className = 'h-9 rounded-xl font-mono text-xs font-bold transition flex items-center justify-center bg-[#121927] border border-slate-800 hover:border-blue-500 text-slate-300 hover:text-white';
          }
        }
      });

      document.getElementById('currentEpisodeLabel').innerText = `Episode ${currentEpisode.episode || (idx + 1)}`;

      // Render pilihan server
      const servers = currentEpisode.servers || [];
      const btnContainer = document.getElementById('serverButtons');

      if (servers.length === 0) {
        btnContainer.innerHTML = '<span class="text-xs text-rose-400">Server tidak tersedia</span>';
        document.getElementById('mainPlayer').src = '';
        return;
      }

      btnContainer.innerHTML = servers.map((srv, sIdx) => `
        <button 
          id="srvBtn-${sIdx}" 
          onclick="playServer('${srv.link}', ${sIdx})" 
          class="text-xs font-semibold px-3 py-1 rounded-xl transition ${sIdx === 0 ? 'bg-blue-600 text-white' : 'bg-[#121927] border border-slate-800 text-slate-400 hover:text-white'}"
        >
          ${srv.name || `Server ${sIdx + 1}`}
        </button>
      `).join('');

      // Putar server index 0
      playServer(servers[0].link, 0);
    }

    function playServer(link, sIdx) {
      document.getElementById('mainPlayer').src = link;

      const servers = currentEpisode.servers || [];
      servers.forEach((_, i) => {
        const b = document.getElementById(`srvBtn-${i}`);
        if (b) {
          b.className = (i === sIdx) 
            ? 'text-xs font-semibold px-3 py-1 rounded-xl transition bg-blue-600 text-white' 
            : 'text-xs font-semibold px-3 py-1 rounded-xl transition bg-[#121927] border border-slate-800 text-slate-400 hover:text-white';
        }
      });
    }

    initDetailPage();
  </script>
</body>
</html>
