<script type="module">
  import { auth, db, ref, get, set, remove, transaction, onAuthStateChanged } from '/assets/firebase-config.js';

  window.auth = auth;
  window.db = db;
  window.fbRef = ref;
  window.fbGet = get;
  window.fbSet = set;
  window.fbRemove = remove;
  window.fbTransaction = transaction;

  window.currentUser = null;

  onAuthStateChanged(auth, (user) => {
    window.currentUser = user;
    if (window.updateCommentAuthUI) {
      window.updateCommentAuthUI();
    }
  });
</script>

<script>
  let globalEpisodes = [];
  let currentMainTitle = '';
  let currentPoster = '';
  let currentServerUrl = '';
  let episodeSortMode = 'oldest';
  let hasIncrementedView = false;
  let currentSortMode = 'latest';

  const ADMIN_EMAIL = 'zahrulms01@gmail.com';

  /* FUNGSI PEMBERSIH SLUG AKURAT UNTUK SEMUA FORMAT URL */
  function getCleanMainSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    let s = urlParams.get('slug');
    if (!s) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const donghuaIdx = parts.indexOf('donghua');
      if (donghuaIdx !== -1 && parts[donghuaIdx + 1]) {
        s = parts[donghuaIdx + 1];
      } else {
        s = parts[parts.length - 1] || '';
      }
    }
    s = String(s || '').trim().replace(/^https?:\/\/[^\/]+/i, '').split('?')[0].split('#')[0];
    return s.replace(/-episode-\d+.*$/i, '').replace(/-ep-\d+.*$/i, '').replace(/^\/+|\/+$/g, '');
  }

  let targetSlug = getCleanMainSlug();

  function slugToTitleCase(slug) {
    if (!slug) return 'Donghua';
    return slug
      .split('-')
      .filter(Boolean)
      .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
      .join(' ');
  }

  const initialDisplayTitle = slugToTitleCase(targetSlug);
  const headerTitleEl = document.getElementById('topHeaderTitle');
  if (headerTitleEl) headerTitleEl.innerText = initialDisplayTitle;
  document.title = `Nonton ${initialDisplayTitle} Sub Indo - Dongflix`;

  function getDbKey(email) {
    if (!email) return '';
    return email.toLowerCase().replace(/\./g, ',');
  }

  function generateRandomUsername() {
    const randomDigits = Math.floor(1000000000 + Math.random() * 9000000000);
    return `user${randomDigits}`;
  }

  async function ensureUserRecord(user) {
    if (!user || !window.db) return;
    const userKey = getDbKey(user.email);
    const userRef = window.fbRef(window.db, `users/${userKey}`);
    const snap = await window.fbGet(userRef);

    if (!snap.exists() || !snap.val().name) {
      const defaultName = generateRandomUsername();
      const statusRole = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'admin' : 'user';
      await window.fbSet(userRef, {
        name: defaultName,
        email: user.email,
        photoURL: '',
        status: statusRole,
        createdAt: Date.now()
      });
    }
  }

  function sanitizeTitle(str) {
    if (!str) return '';
    const text = str.trim();
    const half = Math.floor(text.length / 2);
    return (text.length > 4 && text.slice(0, half) === text.slice(half)) ? text.slice(0, half).trim() : text;
  }

  function extractEpNumber(val, fallback = 1) {
    const match = String(val || '').match(/(\d+(\.\d+)?)/);
    return match ? parseFloat(match[1]) : fallback;
  }

  function getLocalDateString() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function updateSocialMetaTags(title, cover, synopsis, slug) {
    const fullTitle = `Nonton ${title} Sub Indo - Dongflix`;
    const cleanSynopsis = synopsis && synopsis.length > 20 
      ? synopsis.replace(/\s+/g, ' ').slice(0, 160) + '...'
      : `Nonton streaming ${title} subtitle Indonesia gratis dan terlengkap dengan kualitas HD di Dongflix.`;
    const canonicalPageUrl = `https://dongflix.my.id/donghua/${encodeURIComponent(slug)}`;
    const finalCoverUrl = cover || '';

    document.title = fullTitle;
    const pageTitleEl = document.getElementById('pageTitle');
    if (pageTitleEl) pageTitleEl.innerText = fullTitle;

    const descEl = document.getElementById('metaDescription');
    if (descEl) descEl.setAttribute('content', cleanSynopsis);
    const canonicalEl = document.getElementById('canonicalUrl');
    if (canonicalEl) canonicalEl.setAttribute('href', canonicalPageUrl);

    const ogTitle = document.getElementById('ogTitle');
    if (ogTitle) ogTitle.setAttribute('content', fullTitle);
    const ogDesc = document.getElementById('ogDescription');
    if (ogDesc) ogDesc.setAttribute('content', cleanSynopsis);
    const ogUrl = document.getElementById('ogUrl');
    if (ogUrl) ogUrl.setAttribute('content', canonicalPageUrl);
    const ogImg = document.getElementById('ogImage');
    if (ogImg) ogImg.setAttribute('content', finalCoverUrl);
    const ogAlt = document.getElementById('ogImageAlt');
    if (ogAlt) ogAlt.setAttribute('content', `Poster ${title}`);

    const twTitle = document.getElementById('twitterTitle');
    if (twTitle) twTitle.setAttribute('content', fullTitle);
    const twDesc = document.getElementById('twitterDescription');
    if (twDesc) twDesc.setAttribute('content', cleanSynopsis);
    const twImg = document.getElementById('twitterImage');
    if (twImg) twImg.setAttribute('content', finalCoverUrl);
  }

  function goBack() {
    const referrer = document.referrer;
    if (referrer) {
      try {
        const refUrl = new URL(referrer);
        if (refUrl.host === window.location.host) {
          if (refUrl.pathname === '/' || refUrl.pathname === '') {
            window.location.href = '/';
            return;
          }
          if (refUrl.pathname.startsWith('/donghua')) {
            window.location.href = '/donghua/';
            return;
          }
        }
      } catch (_) {}
    }

    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    window.location.href = '/';
  }

  function saveContinueHistory(epNum) {
    if (!targetSlug) return;
    try {
      const historyKey = 'rz_continue_history';
      let historyList = JSON.parse(localStorage.getItem(historyKey) || '[]');

      historyList = historyList.filter(item => (item.slug !== targetSlug && item.mainPath !== targetSlug));

      historyList.unshift({
        slug: targetSlug,
        mainPath: targetSlug,
        title: currentMainTitle || initialDisplayTitle,
        poster: currentPoster || 'https://via.placeholder.com/300x400?text=No+Cover',
        cover: currentPoster || 'https://via.placeholder.com/300x400?text=No+Cover',
        episode: `Ep ${epNum}`,
        progressTime: '00:04',
        durationTime: '24:02',
        updatedAt: Date.now()
      });

      if (historyList.length > 15) historyList = historyList.slice(0, 15);
      localStorage.setItem(historyKey, JSON.stringify(historyList));
    } catch (_) {}
  }

  function toggleEpisodeSort(e) {
    e.stopPropagation();
    document.getElementById('episodeSortMenu').classList.toggle('active');
  }

  function setEpisodeSort(mode) {
    episodeSortMode = mode;
    document.getElementById('episodeSortText').innerText = mode === 'oldest' ? 'Terlama' : 'Terbaru';
    document.getElementById('episodeSortOldest').classList.toggle('active', mode === 'oldest');
    document.getElementById('episodeSortNewest').classList.toggle('active', mode === 'newest');
    document.getElementById('episodeSortMenu').classList.remove('active');
    renderEpisodeGrid();
  }

  document.addEventListener('click', () => {
    const menu = document.getElementById('episodeSortMenu');
    if (menu) menu.classList.remove('active');
    const dropdown = document.getElementById('sortDropdownMenu');
    if (dropdown) dropdown.classList.remove('active');
  });

  function getSortedEpisodes() {
    return [...globalEpisodes].sort((a, b) => {
      const numA = extractEpNumber(a.episode || a.number || a.title || a.slug, 0);
      const numB = extractEpNumber(b.episode || b.number || b.title || b.slug, 0);
      return episodeSortMode === 'oldest' ? numA - numB : numB - numA;
    });
  }

  function updateEpScrollFade() {
    const grid = document.getElementById('epGrid');
    const container = document.getElementById('epScrollContainer');
    if (!grid || !container) return;

    const scrollLeft = grid.scrollLeft;
    const maxScrollLeft = grid.scrollWidth - grid.clientWidth;

    const fadeLeft = scrollLeft > 5 ? '1' : '0';
    const fadeRight = scrollLeft < maxScrollLeft - 5 ? '1' : '0';

    container.style.setProperty('--ep-fade-left', fadeLeft);
    container.style.setProperty('--ep-fade-right', fadeRight);
  }

  function renderEpisodeGrid() {
    const epGrid = document.getElementById('epGrid');
    if (!epGrid) return;
    epGrid.innerHTML = '';

    getSortedEpisodes().forEach((ep) => {
      const epNum = ep.episode || ep.number || extractEpNumber(ep.title || ep.slug, 1);
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = epNum;
      box.id = `ep-box-${epNum}`;
      if (String(epNum) === String(window.currentPlayingEpisodeNum)) box.classList.add('active');

      box.onclick = () => selectEpisodeByNum(epNum);
      epGrid.appendChild(box);
    });

    epGrid.removeEventListener('scroll', updateEpScrollFade);
    epGrid.addEventListener('scroll', updateEpScrollFade);
    setTimeout(updateEpScrollFade, 50);
  }

  function goToHomeLogin() { window.location.href = '/'; }

  window.triggerViewIncrement = async function() {
    if (!targetSlug || !window.db || !window.fbRef || hasIncrementedView) return;
    hasIncrementedView = true;

    const todayStr = getLocalDateString();

    try {
      const totalRef = window.fbRef(window.db, `views_total/${targetSlug}`);
      const dailyRef = window.fbRef(window.db, `views_daily/${todayStr}/${targetSlug}`);

      if (typeof window.fbTransaction === 'function') {
        window.fbTransaction(totalRef, (currentVal) => (currentVal || 0) + 1).then((res) => {
          if (res && res.snapshot) {
            document.getElementById('viewCountText').innerText = String(res.snapshot.val());
          }
        }).catch(() => {});

        window.fbTransaction(dailyRef, (currentVal) => (currentVal || 0) + 1).catch(() => {});
      } else if (typeof window.fbGet === 'function') {
        const snap = await window.fbGet(totalRef);
        if (snap.exists()) {
          document.getElementById('viewCountText').innerText = String(snap.val());
        }
      }
    } catch (_) {}
  };

  function toggleFavorite() {
    if (!targetSlug) return;
    let favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    const exists = favs.some(f => f.slug === targetSlug);

    if (exists) {
      favs = favs.filter(f => f.slug !== targetSlug);
      document.getElementById('btnFavorite').classList.remove('active');
    } else {
      favs.unshift({ slug: targetSlug, title: currentMainTitle || initialDisplayTitle, poster: currentPoster });
      document.getElementById('btnFavorite').classList.add('active');
    }
    localStorage.setItem('df_favorites', JSON.stringify(favs));
  }

  function checkFavorite() {
    const favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    if (favs.some(f => f.slug === targetSlug)) {
      document.getElementById('btnFavorite').classList.add('active');
    }
  }

  function triggerDownload() {
    if (currentServerUrl) window.open(currentServerUrl, '_blank');
    else alert('Video belum siap.');
  }

  function triggerShare() {
    const shareTitle = `Nonton ${currentMainTitle || initialDisplayTitle} Sub Indo - Dongflix`;
    const shareUrl = `https://dongflix.my.id/donghua/${encodeURIComponent(targetSlug)}`;
    if (navigator.share) {
      navigator.share({ title: shareTitle, url: shareUrl }).catch(() => {});
    } else {
      navigator.clipboard.writeText(shareUrl);
      alert('Tautan berhasil disalin ke clipboard!');
    }
  }

  window.updateCommentAuthUI = function() {
    const formBox = document.getElementById('commentFormBox');
    const noticeBox = document.getElementById('commentLoginNotice');
    if (window.currentUser) {
      if (formBox) formBox.style.display = 'flex';
      if (noticeBox) noticeBox.style.display = 'none';
    } else {
      if (formBox) formBox.style.display = 'none';
      if (noticeBox) noticeBox.style.display = 'block';
    }
  };

  function toggleSortDropdown(event) {
    event.stopPropagation();
    document.getElementById('sortDropdownMenu').classList.toggle('active');
  }

  function selectSortOrder(mode) {
    currentSortMode = mode;
    document.getElementById('sortOptLatest').classList.toggle('active', mode === 'latest');
    document.getElementById('sortOptTop').classList.toggle('active', mode === 'top');
    document.getElementById('sortDropdownMenu').classList.remove('active');
    loadComments();
  }

  async function loadComments() {
    const container = document.getElementById('commentsListContainer');
    const countBadge = document.getElementById('commentsCountBadge');
    if (!window.db || !targetSlug) return;

    try {
      const commentsRef = window.fbRef(window.db, `comments/${targetSlug}`);
      const snap = await window.fbGet(commentsRef);

      if (snap.exists()) {
        const commentsData = snap.val();
        container.innerHTML = '';
        const mainComments = [];
        const repliesMap = {};

        countBadge.innerText = `(${Object.keys(commentsData).length})`;

        Object.keys(commentsData).forEach(key => {
          const item = { id: key, ...commentsData[key] };
          if (item.parentId) {
            if (!repliesMap[item.parentId]) repliesMap[item.parentId] = [];
            repliesMap[item.parentId].push(item);
          } else {
            mainComments.push(item);
          }
        });

        mainComments.sort((a, b) => {
          if (a.isPinned && !b.isPinned) return -1;
          if (!a.isPinned && b.isPinned) return 1;
          if (currentSortMode === 'top') {
            const repliesA = (repliesMap[a.id] || []).length;
            const repliesB = (repliesMap[b.id] || []).length;
            return repliesB - repliesA;
          }
          return b.timestamp - a.timestamp;
        });

        if (mainComments.length === 0) {
          container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
          return;
        }

        for (const item of mainComments) {
          const replies = repliesMap[item.id] || [];
          const cardEl = await renderTikTokCommentCardAsync(item, replies);
          container.appendChild(cardEl);
        }
      } else {
        countBadge.innerText = '(0)';
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
      }
    } catch (e) {
      container.innerHTML = '<p style="font-size:12px;color:#ef4444;">Gagal memuat komentar.</p>';
    }
  }

  async function fetchUserProfileByEmailOrUid(userEmail, uid) {
    if (!window.db) return null;
    try {
      if (userEmail) {
        const userKey = getDbKey(userEmail);
        const snap = await window.fbGet(window.fbRef(window.db, `users/${userKey}`));
        if (snap.exists()) return snap.val();
      }
    } catch (e) {}
    return null;
  }

  async function renderTikTokCommentCardAsync(item, replies = []) {
    const card = document.createElement('div');
    card.className = `comment-card ${item.isPinned ? 'pinned' : ''}`;
    card.id = `comment-${item.id}`;

    const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : 'Baru saja';
    const profile = await fetchUserProfileByEmailOrUid(item.email, item.uid);
    const currentAuthorName = profile?.name || item.author || 'User';
    const currentPhotoURL = profile?.photoURL || item.photoURL || '';
    const authorEmail = (profile?.email || item.email || '').toLowerCase();
    const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase() || profile?.status === 'admin';
    const initial = currentAuthorName.charAt(0).toUpperCase();

    const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
    const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
    const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;

    const isMyComment = window.currentUser && (window.currentUser.email === item.email || window.currentUser.uid === item.uid);
    let actionButtons = '';

    if (window.currentUser) {
      actionButtons += `<button class="btn-reply-tiktok" onclick="toggleReplyBox('${item.id}')">Balas</button>`;
      if (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase())) {
        actionButtons += `<button class="btn-delete-tiktok" onclick="deleteComment('${item.id}')">Hapus</button>`;
      }
    }

    let repliesHtml = '';
    if (replies.length > 0) {
      let renderedReplies = '';
      for (const reply of replies) {
        renderedReplies += await renderTikTokReplyCardHtmlAsync(reply);
      }
      repliesHtml = `
        <button class="replies-toggle-btn" id="btn-toggle-${item.id}" onclick="toggleRepliesDisplay('${item.id}', ${replies.length})">
          Lihat ${replies.length} balasan ▾
        </button>
        <div class="replies-container" id="replies-box-${item.id}">${renderedReplies}</div>
      `;
    }

    card.innerHTML = `
      <div class="tiktok-avatar">${photoHtml}</div>
      <div class="comment-content">
        <div class="comment-user-row">
          <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
          ${levelBadge} ${adminBadge}
        </div>
        <div class="comment-body-text">${escapeHtml(item.text)}</div>
        <div class="comment-footer-actions">
          <span class="comment-time">${timeAgo}</span>
          ${actionButtons}
        </div>
        <div id="reply-input-wrapper-${item.id}"></div>
        ${repliesHtml}
      </div>
      <div class="comment-like-box" onclick="toggleLikeComment(this)">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    `;

    return card;
  }

  async function renderTikTokReplyCardHtmlAsync(reply) {
    const timeAgo = reply.timestamp ? getTimeAgo(reply.timestamp) : 'Baru saja';
    const profile = await fetchUserProfileByEmailOrUid(reply.email, reply.uid);
    const currentAuthorName = profile?.name || reply.author || 'User';
    const currentPhotoURL = profile?.photoURL || reply.photoURL || '';
    const authorEmail = (profile?.email || reply.email || '').toLowerCase();
    const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase() || profile?.status === 'admin';
    const initial = currentAuthorName.charAt(0).toUpperCase();

    const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
    const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
    const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;

    const isMyComment = window.currentUser && (window.currentUser.email === reply.email || window.currentUser.uid === reply.uid);
    let deleteBtn = '';
    if (window.currentUser && (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()))) {
      deleteBtn = `<button class="btn-delete-tiktok" onclick="deleteComment('${reply.id}')">Hapus</button>`;
    }

    return `
      <div class="reply-card" id="comment-${reply.id}">
        <div class="tiktok-avatar">${photoHtml}</div>
        <div class="comment-content">
          <div class="comment-user-row">
            <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
            ${levelBadge} ${adminBadge}
          </div>
          <div class="comment-body-text">${escapeHtml(reply.text)}</div>
          <div class="comment-footer-actions">
            <span class="comment-time">${timeAgo}</span>
            ${deleteBtn}
          </div>
        </div>
      </div>
    `;
  }

  function toggleRepliesDisplay(commentId, count) {
    const container = document.getElementById(`replies-box-${commentId}`);
    const btn = document.getElementById(`btn-toggle-${commentId}`);
    if (!container || !btn) return;

    if (container.classList.contains('show')) {
      container.classList.remove('show');
      btn.innerText = `Lihat ${count} balasan ▾`;
    } else {
      container.classList.add('show');
      btn.innerText = 'Sembunyikan balasan ▴';
    }
  }

  function toggleLikeComment(el) { el.classList.toggle('liked'); }

  function toggleReplyBox(commentId) {
    const container = document.getElementById(`reply-input-wrapper-${commentId}`);
    if (!container) return;
    if (container.innerHTML !== '') {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = `
      <div class="reply-input-box">
        <input type="text" class="reply-input" id="replyInput-${commentId}" placeholder="Tulis balasan..." />
        <button class="btn-reply-send" onclick="submitReply('${commentId}')">Kirim</button>
      </div>
    `;
  }

  async function submitComment() {
    if (!window.currentUser) { alert('Anda harus login terlebih dahulu.'); return; }
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;

    await ensureUserRecord(window.currentUser);
    const commentItem = { uid: window.currentUser.uid, email: window.currentUser.email || '', text: text, timestamp: Date.now() };

    try {
      const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
      await window.fbSet(newCommentRef, commentItem);
      input.value = '';
      loadComments();
    } catch (e) {
      alert('Gagal mengirim komentar: ' + e.message);
    }
  }

  async function submitReply(parentId) {
    if (!window.currentUser) return;
    const input = document.getElementById(`replyInput-${parentId}`);
    const text = input ? input.value.trim() : '';
    if (!text) return;

    await ensureUserRecord(window.currentUser);
    const replyItem = { uid: window.currentUser.uid, email: window.currentUser.email || '', text: text, parentId: parentId, timestamp: Date.now() };

    try {
      const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
      await window.fbSet(newCommentRef, replyItem);
      loadComments();
    } catch (e) {
      alert('Gagal membalas komentar: ' + e.message);
    }
  }

  async function deleteComment(commentId) {
    if (!confirm('Apakah Anda yakin ingin menghapus komentar ini?')) return;
    try {
      const commentRef = window.fbRef(window.db, `comments/${targetSlug}/${commentId}`);
      await window.fbRemove(commentRef);
      loadComments();
    } catch (e) {
      alert('Gagal menghapus komentar: ' + e.message);
    }
  }

  function getTimeAgo(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'Baru saja';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}j`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d`;
    return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function hidePlayerLoader() {
    const loader = document.getElementById('playerLoaderOverlay');
    if (loader) loader.classList.add('hidden');
  }

  function renderSmartRecommendations(currentGenres, currentSlug, catalog) {
    const section = document.getElementById('recommendationsSection');
    const row = document.getElementById('recommendationsRow');
    if (!section || !row || !Array.isArray(catalog)) return;

    const others = catalog.filter(item => item.slug !== currentSlug);
    if (others.length === 0) return;

    const scored = others.map(item => {
      let score = 0;
      const itemGenres = Array.isArray(item.genres) 
        ? item.genres 
        : (typeof item.genres === 'string' ? item.genres.split(/[,•/]/).map(g => g.trim()) : []);

      if (currentGenres && currentGenres.length > 0) {
        itemGenres.forEach(g => {
          if (g && currentGenres.some(cg => cg.toLowerCase() === g.toLowerCase())) {
            score += 2;
          }
        });
      }
      score += Math.random() * 0.5;
      return { item, score };
    });

    scored.sort((a, b) => b.score - a.score);
    const topRecs = scored.slice(0, 15).map(s => s.item);

    if (topRecs.length === 0) return;

    row.innerHTML = topRecs.map(item => {
      const title = sanitizeTitle(item.title);
      const poster = item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
      const isMovie = (item.type || '').toString().toLowerCase() === 'movie' || title.toLowerCase().includes('movie');
      const epNum = item['latest-episode'] || (item.episode ? item.episode.replace(/[^0-9]/g, '') : '1');
      const epText = isMovie ? 'MOVIE' : `Ep ${epNum}`;
      const statusText = ((item.status || item.type || '').toString().toLowerCase().includes('completed')) ? 'TAMAT' : 'ONGOING';

      return `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="rec-card-item">
          <div class="rec-poster-box">
            <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" />
            <span class="rec-badge-status">${statusText}</span>
            <span class="rec-badge-ep">${epText}</span>
          </div>
          <div class="rec-card-title">${title}</div>
        </a>
      `;
    }).join('');

    section.style.display = 'block';
  }

  async function loadDetail() {
    targetSlug = getCleanMainSlug();

    if (!targetSlug) {
      document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    try {
      let catalog = null;
      let info = null;

      const catRes = await fetch('/api/donghua?path=donghua.json');
      if (catRes.ok) {
        catalog = await catRes.json();
        info = catalog.find(d => String(d.slug).toLowerCase() === targetSlug.toLowerCase());
      }

      if (!info) {
        let altRes = await fetch(`/api/detail?slug=${encodeURIComponent(targetSlug)}`).then(r => r.json()).catch(() => null);
        if (altRes && altRes.success && altRes.data) {
          info = {
            slug: targetSlug,
            title: altRes.data.judul || altRes.data.title || initialDisplayTitle,
            cover: altRes.data.poster || '',
            synopsis: altRes.data.synopsis || altRes.data.desc || '',
            status: altRes.data.status || 'Ongoing',
            released: altRes.data.released || '-',
            genres: altRes.data.genres || ['Action', 'Fantasy']
          };
        }
      }

      if (!info) {
        hidePlayerLoader();
        document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
        document.getElementById('mainContentGroup').style.display = 'none';
        document.getElementById('notFoundBox').style.display = 'flex';
        return;
      }

      // RESET TAMPILAN JIKA DONGHUA ADA
      document.getElementById('mainContentGroup').style.display = 'block';
      document.getElementById('notFoundBox').style.display = 'none';

      if (typeof window.triggerViewIncrement === 'function') {
        window.triggerViewIncrement();
      }

      currentMainTitle = sanitizeTitle(info.title);
      currentPoster = info.cover || info.poster || info.thumbnail || '';
      const currentSynopsis = info.synopsis || info.description || info.desc || '';

      updateSocialMetaTags(currentMainTitle, currentPoster, currentSynopsis, targetSlug);
      document.getElementById('topHeaderTitle').innerText = currentMainTitle;

      const genresList = Array.isArray(info.genres) ? info.genres : (typeof info.genres === 'string' ? info.genres.split(/[,•/]/).map(g => g.trim()) : []);
      const genresHtml = genresList.map(g => `<span class="genre-pill">${g}</span>`).join('');

      document.getElementById('mediaDetailsGroup').innerHTML = `
        <div class="media-meta-card">
          <div class="media-cover-wrapper">
            <img src="${currentPoster || 'https://via.placeholder.com/150x200?text=No+Cover'}" class="media-cover-img" alt="${currentMainTitle}" />
          </div>
          <div class="media-info-col">
            <h1 class="media-title">${currentMainTitle}</h1>
            <div class="genre-badges-row">${genresHtml}</div>
            <div class="status-release-row">
              <span>Status: <strong>${info.status || 'Ongoing'}</strong></span>
              <span>Rilis: <strong>${info.released || '-'}</strong></span>
            </div>
          </div>
        </div>
        <div class="synopsis-block">
          <div class="synopsis-heading">SINOPSIS</div>
          <p class="synopsis-text">${currentSynopsis || 'Tidak ada deskripsi sinopsis.'}</p>
        </div>
      `;

      if (Array.isArray(catalog)) {
        renderSmartRecommendations(genresList, targetSlug, catalog);
      }

      const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(targetSlug)}.json`);
      if (epRes.ok) {
        globalEpisodes = await epRes.json();
        document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;

        if (globalEpisodes.length > 0) {
          renderEpisodeGrid();
          
          const historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
          const savedItem = historyList.find(item => item.slug === targetSlug || item.mainPath === targetSlug);
          
          let initialEp = globalEpisodes[0].episode || globalEpisodes[0].number || extractEpNumber(globalEpisodes[0].title || globalEpisodes[0].slug, 1);
          if (savedItem && savedItem.episode) {
            const savedEpNum = extractEpNumber(savedItem.episode);
            const exists = globalEpisodes.some(e => String(e.episode || e.number || extractEpNumber(e.title || e.slug, 0)) === String(savedEpNum));
            if (exists) initialEp = savedEpNum;
          }

          selectEpisodeByNum(initialEp);
        } else {
          hidePlayerLoader();
          document.getElementById('playerMediaContainer').innerText = 'Episode belum tersedia.';
        }
      }
    } catch (_) {
      hidePlayerLoader();
      document.getElementById('playerMediaContainer').innerHTML = '<div style="color:var(--text-muted);">Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    const hint = document.getElementById('serverHint');
    if (hint) {
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 4000);
    }

    checkFavorite();
    loadComments();
  }

  function selectEpisodeByNum(epNum) {
    closeEpisodeSheet();
    
    const episode = globalEpisodes.find(e => {
      const num = e.episode || e.number || extractEpNumber(e.title || e.slug, 0);
      return String(num) === String(epNum);
    }) || globalEpisodes[0];

    if (!episode) return;

    const finalEpNum = episode.episode || episode.number || extractEpNumber(episode.title || episode.slug, 1);
    window.currentPlayingEpisodeNum = finalEpNum;

    saveContinueHistory(finalEpNum);

    document.querySelectorAll('.ep-box').forEach(b => b.classList.remove('active'));
    const activeBox = document.getElementById(`ep-box-${finalEpNum}`);
    if (activeBox) {
      activeBox.classList.add('active');
      activeBox.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    setTimeout(updateEpScrollFade, 50);

    const rawServers = episode.servers || episode.server || [];
    const servers = (Array.isArray(rawServers) ? rawServers : Object.values(rawServers))
      .map((s, i) => ({
        name: s.name || s.title || `Server ${i + 1}`,
        url: s.link || s.url || (typeof s === 'string' ? s : '')
      }))
      .filter(s => /^https?:\/\//i.test(s.url));

    const serverSelect = document.getElementById('serverSelect');
    serverSelect.innerHTML = '';

    if (servers.length > 0) {
      servers.forEach((srv, i) => {
        const opt = document.createElement('option');
        opt.value = srv.url;
        opt.innerText = srv.name;
        if (i === 0) opt.selected = true;
        serverSelect.appendChild(opt);
      });
      currentServerUrl = servers[0].url;
      renderPlayer(servers[0].url);
    } else {
      hidePlayerLoader();
      document.getElementById('playerMediaContainer').innerHTML = '<div class="detail-player-box">Server video belum tersedia.</div>';
    }
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayer(url);
    }
  }

  function renderPlayer(url) {
    const box = document.getElementById('playerMediaContainer');
    box.innerHTML = `
      <div class="player-loader-overlay" id="playerLoaderOverlay">
        <div class="cool-spinner">
          <div class="spinner-ring"></div>
        </div>
        <span style="font-size: 11px; color: var(--color-accent); font-weight: 700; letter-spacing: 0.5px;">Memuat Video...</span>
      </div>
      <iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer" onload="hidePlayerLoader()"></iframe>
    `;
  }

  function openEpisodeSheet() {
    const grid = document.getElementById('sheetEpGrid');
    if (!grid) return;
    grid.innerHTML = '';

    getSortedEpisodes().forEach((ep) => {
      const epNum = ep.episode || ep.number || extractEpNumber(ep.title || ep.slug, 1);
      const box = document.createElement('div');
      box.className = `ep-box ${String(epNum) === String(window.currentPlayingEpisodeNum) ? 'active' : ''}`;
      box.innerText = epNum;
      box.onclick = () => selectEpisodeByNum(epNum);
      grid.appendChild(box);
    });

    document.getElementById('sheetOverlay').classList.add('active');
  }

  function closeEpisodeSheet() {
    document.getElementById('sheetOverlay').classList.remove('active');
  }

  window.onload = loadDetail;
</script>
