<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Dongflix - Detail</title>
  <meta name="referrer" content="no-referrer">

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 68px;
      padding-bottom: 40px;
      text-align: left;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px;
      text-align: left;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.95) 0%,
        rgba(0, 0, 0, 0.5) 70%,
        rgba(0, 0, 0, 0) 100%
      );
      padding: 10px 16px 16px 16px;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-circle-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      color: #ffffff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .icon-circle-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    @keyframes skeletonPulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .skeleton {
      background: #182232;
      animation: skeletonPulse 1.5s infinite ease-in-out;
      border-radius: 8px;
    }

    .skeleton-player {
      width: 100%;
      height: 100%;
      border-radius: 0;
    }

    .skeleton-title {
      height: 24px;
      width: 65%;
      margin-bottom: 12px;
    }

    .skeleton-synopsis {
      height: 12px;
      width: 100%;
      margin-bottom: 6px;
    }

    .player-wrapper {
      margin-left: -16px;
      margin-right: -16px;
      width: calc(100% + 32px);
      background: #000;
      margin-bottom: 16px;
      position: relative;
      aspect-ratio: 16/9;
    }

    .detail-player-box {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }

    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .ep-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .ep-header-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .episode-sort-wrapper {
      position: relative;
      margin-left: auto;
    }

    .episode-sort-button {
      height: 32px;
      min-width: 92px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .episode-sort-button:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.45);
      color: #38bdf8;
    }

    .episode-sort-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .episode-sort-menu {
      display: none;
      position: absolute;
      top: 38px;
      right: 0;
      min-width: 125px;
      padding: 5px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
      z-index: 150;
    }

    .episode-sort-menu.active {
      display: block;
    }

    .episode-sort-option {
      width: 100%;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }

    .episode-sort-option:hover,
    .episode-sort-option.active {
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
    }

    .btn-see-all-ep {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-see-all-ep:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .btn-see-all-ep svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    .ep-scroll-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 14px;
      margin-bottom: 16px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .ep-scroll-grid::-webkit-scrollbar {
      display: none;
    }

    .ep-box {
      flex: 0 0 54px;
      height: 54px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ep-box:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .ep-box.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .action-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 20px;
      position: relative;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }

    .action-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .action-item.active {
      color: #38bdf8;
    }

    .action-item.active svg {
      fill: #38bdf8;
      stroke: #38bdf8;
    }

    .server-custom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #94a3b8;
      position: relative;
    }

    .server-custom-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .server-label-text {
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
    }

    .server-select-hidden {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .server-tooltip-hint {
      position: absolute;
      top: -45px;
      left: 10px;
      background: #0284c7;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .server-tooltip-hint.show {
      opacity: 1;
      transform: translateY(0);
    }

    .server-tooltip-hint::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 24px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #0284c7 transparent transparent transparent;
    }

    .media-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      text-align: left;
    }

    .synopsis-text {
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: left;
    }

    .sheet-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .sheet-overlay.active {
      display: block;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60vh;
      max-height: 70vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 201;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      background: #0f172a;
    }

    .sheet-overlay.active .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
    }

    .sheet-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      font-weight: 700;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    .comments-section {
      margin-top: 24px;
      border-top: 1px solid #1e293b;
      padding-top: 20px;
      width: 100%;
      display: block;
      text-align: left !important;
    }

    .comments-header-wrapper {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100% !important;
      margin-bottom: 16px !important;
      position: relative;
    }

    .comments-header-title {
      font-size: 16px !important;
      font-weight: 800 !important;
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
      color: #f8fafc !important;
      margin: 0 !important;
      padding: 0 !important;
      text-align: left !important;
    }

    .comments-header-title svg {
      width: 18px;
      height: 18px;
      stroke: #38bdf8;
      fill: none;
      stroke-width: 2.2;
    }

    .btn-sort-wrapper {
      position: relative;
    }

    .btn-sort-svg {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #1e293b;
      color: #38bdf8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sort-svg svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .btn-sort-svg:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }

    .sort-dropdown-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 6px;
      min-width: 140px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      z-index: 120;
    }

    .sort-dropdown-menu.active {
      display: block;
    }

    .sort-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }

    .sort-dropdown-item:hover,
    .sort-dropdown-item.active {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    .comment-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 6px 8px 6px 16px;
      margin-bottom: 20px;
      width: 100%;
    }

    .comment-input-box:focus-within {
      border-color: #38bdf8;
    }

    .comment-textarea {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 38px;
    }

    .btn-send-comment {
      background: #0284c7;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-send-comment svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .comment-login-notice {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .comment-login-notice a {
      color: #38bdf8;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      text-align: left !important;
    }

    .comment-card {
      display: flex;
      gap: 12px;
      width: 100%;
      align-items: flex-start;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      position: relative;
      touch-action: pan-y;
    }

    .comment-card.pinned {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.03);
    }

    .tiktok-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tiktok-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comment-content {
      flex: 1;
      min-width: 0;
      text-align: left !important;
    }

    .comment-user-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .tiktok-username {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }

    .tiktok-username.admin {
      color: #f59e0b !important;
    }

    .badge-admin {
      background: #f59e0b;
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .badge-level {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .badge-level.admin-lvl {
      background: #f59e0b;
      color: #000;
      font-weight: 900;
    }

    .comment-body-text {
      font-size: 13.5px;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 6px;
      text-align: left !important;
    }

    .comment-footer-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11.5px;
      color: #64748b;
    }

    .comment-time {
      font-size: 11px;
    }

    .btn-reply-tiktok {
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-size: 11.5px;
    }

    .btn-reply-tiktok:hover {
      color: #fff;
    }

    .btn-delete-tiktok {
      font-weight: 700;
      color: #ef4444;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-size: 11.5px;
    }

    .comment-like-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 2px;
      color: #64748b;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .comment-like-box svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .comment-like-box.liked svg {
      fill: #ef4444;
      stroke: #ef4444;
    }

    .replies-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .replies-toggle-btn::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 1px;
      background: #0284c7;
    }

    .replies-container {
      display: none;
      margin-top: 10px;
      flex-direction: column;
      gap: 10px;
      padding-left: 14px;
      border-left: 2px solid #0284c7;
      width: 100%;
    }

    .replies-container.show {
      display: flex;
    }

    .reply-card {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      padding: 8px;
      width: 100%;
    }

    .reply-card .tiktok-avatar {
      width: 26px;
      height: 26px;
      font-size: 11px;
    }

    .reply-input-box {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .reply-input {
      flex: 1;
      height: 34px;
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 0 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .btn-reply-send {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="header-left-group" onclick="goBack()">
      <button class="icon-circle-btn">
        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <span class="brand-title" id="topHeaderTitle">
        Memuat...
      </span>
    </div>
  </div>
</header>

<div class="container">

  <div class="player-wrapper">
    <div class="detail-player-box" id="playerMediaContainer">
      <div class="skeleton skeleton-player"></div>
    </div>
  </div>

  <div class="detail-body">

    <!-- EPISODE LIST -->
    <div id="epContainer">
      <div class="ep-header-row">
        <span class="ep-header-title">Episode List</span>

        <div class="episode-sort-wrapper">
          <button class="episode-sort-button" id="episodeSortButton" onclick="toggleEpisodeSort(event)">
            <span id="episodeSortText">Terlama</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <div class="episode-sort-menu" id="episodeSortMenu">
            <button class="episode-sort-option active" id="episodeSortOldest" onclick="setEpisodeSort('oldest')">Terlama</button>
            <button class="episode-sort-option" id="episodeSortNewest" onclick="setEpisodeSort('newest')">Terbaru</button>
          </div>
        </div>

        <button class="btn-see-all-ep" onclick="openEpisodeSheet()">
          <span id="epTotalInfo">0 Episode</span>
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="ep-scroll-grid" id="epGrid">
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
      </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <div class="server-tooltip-hint" id="serverHint">

<!-- FIREBASE CONNECTOR -->
<script type="module">
  try {
    const { auth, db, ref, get, set, remove, transaction, onAuthStateChanged } = await import('/assets/firebase-config.js');
    window.auth = auth;
    window.db = db;
    window.fbRef = ref;
    window.fbGet = get;
    window.fbSet = set;
    window.fbRemove = remove;
    window.fbTransaction = transaction;

    window.currentUser = null;

    if (auth) {
      onAuthStateChanged(auth, (user) => {
        window.currentUser = user;
        if (window.updateCommentAuthUI) {
          window.updateCommentAuthUI();
        }
      });
    }
  } catch (err) {
    console.warn("Firebase tidak dimuat atau modul opsional:", err.message);
  }
</script>

<script>
  let globalEpisodes = [];
  let currentMainTitle = '';
  let currentPoster = '';
  let currentServerUrl = '';
  let isFavorite = false;
  let currentSortMode = 'latest';
  let episodeSortMode = 'oldest';

  const ADMIN_EMAIL = 'zahrulms01@gmail.com';

  /* EKSTRAKSI SLUG URL VERCEL /donghua/[slug] */
  function extractTargetSlug() {
    const pathSegments = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    if (pathSegments.length > 1 && pathSegments[0] === 'donghua') {
      return pathSegments[1];
    }
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('slug') || '';
  }

  const targetSlug = extractTargetSlug();

  function sanitizeTitle(rawTitle) {
    if (!rawTitle) return '';
    const str = rawTitle.trim();
    const half = Math.floor(str.length / 2);
    if (str.length > 4 && str.slice(0, half) === str.slice(half)) {
      return str.slice(0, half).trim();
    }
    return str;
  }

  function getDbKey(email) {
    if (!email) return '';
    return email.toLowerCase().replace(/\./g, ',');
  }

  function generateRandomUsername() {
    const randomDigits = Math.floor(1000000000 + Math.random() * 9000000000);
    return `user${randomDigits}`;
  }

  async function ensureUserRecord(user) {
    if (!user || !window.db) return;
    const userKey = getDbKey(user.email);
    const userRef = window.fbRef(window.db, `users/${userKey}`);
    const snap = await window.fbGet(userRef);

    if (!snap.exists() || !snap.val().name) {
      const defaultName = generateRandomUsername();
      const statusRole = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() ? 'admin' : 'user';
      await window.fbSet(userRef, {
        name: defaultName,
        email: user.email,
        photoURL: '',
        status: statusRole,
        createdAt: Date.now()
      });
    }
  }

  function getTodayString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function extractEpNumber(val, fallback) {
    if (!val) return fallback;
    const str = String(val);
    const epMatch = str.match(/(\d+(\.\d+)?)/);
    return epMatch ? parseFloat(epMatch[1]) : fallback;
  }

  function toggleEpisodeSort(event) {
    event.stopPropagation();
    const menu = document.getElementById('episodeSortMenu');
    if (menu) menu.classList.toggle('active');
  }

  function setEpisodeSort(mode) {
    if (mode !== 'oldest' && mode !== 'newest') return;
    episodeSortMode = mode;

    const menu = document.getElementById('episodeSortMenu');
    const text = document.getElementById('episodeSortText');
    const oldOption = document.getElementById('episodeSortOldest');
    const newOption = document.getElementById('episodeSortNewest');

    if (text) text.innerText = mode === 'oldest' ? 'Terlama' : 'Terbaru';
    if (oldOption) oldOption.classList.toggle('active', mode === 'oldest');
    if (newOption) newOption.classList.toggle('active', mode === 'newest');
    if (menu) menu.classList.remove('active');

    renderEpisodeGrid();
  }

  document.addEventListener('click', function(event) {
    const wrapper = document.querySelector('.episode-sort-wrapper');
    const menu = document.getElementById('episodeSortMenu');
    if (wrapper && menu && !wrapper.contains(event.target)) {
      menu.classList.remove('active');
    }
  });

  function getSortedEpisodes() {
    const list = Array.isArray(globalEpisodes) ? [...globalEpisodes] : [];
    list.sort((a, b) => {
      const numA = extractEpNumber(a.episode || a.number || a.slug, 0);
      const numB = extractEpNumber(b.episode || b.number || b.slug, 0);
      return episodeSortMode === 'oldest' ? numA - numB : numB - numA;
    });
    return list;
  }

  function renderEpisodeGrid(scrollToCurrent = true) {
    const epGrid = document.getElementById('epGrid');
    if (!epGrid) return;
    epGrid.innerHTML = '';

    const sortedEpisodes = getSortedEpisodes();
    sortedEpisodes.forEach((ep, index) => {
      const epNum = ep.episode || ep.number || (index + 1);
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = epNum;
      box.id = `ep-box-${epNum}`;
      box.dataset.episode = String(epNum);

      box.onclick = () => {
        selectEpisode(index, `Ep ${epNum}`);
      };

      epGrid.appendChild(box);
    });

    highlightCurrentEpisode();
    if (scrollToCurrent) {
      setTimeout(scrollToActiveEpisode, 100);
    }
  }

  function highlightCurrentEpisode() {
    document.querySelectorAll('#epGrid .ep-box').forEach(box => box.classList.remove('active'));
    const current = window.currentPlayingEpisodeNum;
    if (!current) return;
    const box = document.getElementById(`ep-box-${current}`);
    if (box) box.classList.add('active');
  }

  function scrollToActiveEpisode() {
    const current = window.currentPlayingEpisodeNum;
    if (!current) return;
    const box = document.getElementById(`ep-box-${current}`);
    const grid = document.getElementById('epGrid');
    if (box && grid) {
      const left = box.offsetLeft - grid.clientWidth / 2 + box.offsetWidth / 2;
      grid.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
    }
  }

  function formatViews(num) {
    if (!num || isNaN(num)) return '0';
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return String(num);
  }

  function goBack() { window.location.href = '/donghua/'; }
  function goToHomeLogin() { window.location.href = '/'; }

  function showServerHint() {
    const hint = document.getElementById('serverHint');
    if (!hint) return;
    hint.classList.add('show');
    setTimeout(() => { hint.classList.remove('show'); }, 4000);
  }

  /* VIEWS & COMMENTS */
  async function initViewsAndComments() {
    if (!targetSlug) return;
    if (window.currentUser) {
      await ensureUserRecord(window.currentUser);
    }

    if (window.db) {
      const today = getTodayString();
      try {
        const totalRef = window.fbRef(window.db, `views_total/${targetSlug}`);
        await window.fbTransaction(totalRef, current => (current || 0) + 1);

        const dailyRef = window.fbRef(window.db, `views_daily/${today}/${targetSlug}`);
        await window.fbTransaction(dailyRef, current => (current || 0) + 1);

        const viewSnap = await window.fbGet(totalRef);
        if (viewSnap.exists()) {
          document.getElementById('viewCountText').innerText = formatViews(viewSnap.val());
        }
      } catch (e) {
        console.warn('Gagal sinkron view:', e);
      }
    }

    checkFavoriteStatus();
    if (window.updateCommentAuthUI) window.updateCommentAuthUI();
    loadComments();
  }

  /* FAVORITE */
  async function checkFavoriteStatus() {
    const btn = document.getElementById('btnFavorite');
    if (!targetSlug || !btn) return;

    if (window.currentUser && window.db) {
      const userKey = getDbKey(window.currentUser.email);
      const favRef = window.fbRef(window.db, `users/${userKey}/favorites/${targetSlug}`);
      const snap = await window.fbGet(favRef);
      isFavorite = snap.exists();
    } else {
      let favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
      isFavorite = favs.some(f => f.slug === targetSlug);
    }

    if (isFavorite) btn.classList.add('active');
    else btn.classList.remove('active');
  }

  async function toggleFavorite() {
    if (!targetSlug) return;
    isFavorite = !isFavorite;
    const btn = document.getElementById('btnFavorite');

    if (isFavorite) btn.classList.add('active');
    else btn.classList.remove('active');

    const favItem = {
      slug: targetSlug,
      title: currentMainTitle || 'Donghua',
      poster: currentPoster || '',
      timestamp: Date.now()
    };

    if (window.currentUser && window.db) {
      await ensureUserRecord(window.currentUser);
      const userKey = getDbKey(window.currentUser.email);
      const favRef = window.fbRef(window.db, `users/${userKey}/favorites/${targetSlug}`);
      if (isFavorite) await window.fbSet(favRef, favItem);
      else await window.fbRemove(favRef);
    } else {
      let favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
      if (isFavorite) {
        favs = favs.filter(f => f.slug !== targetSlug);
        favs.unshift(favItem);
      } else {
        favs = favs.filter(f => f.slug !== targetSlug);
      }
      localStorage.setItem('df_favorites', JSON.stringify(favs));
    }
  }

  function triggerDownload() {
    if (!currentServerUrl) {
      alert('Video belum siap diunduh.');
      return;
    }
    window.open(currentServerUrl, '_blank');
  }

  function triggerShare() {
    const shareData = {
      title: currentMainTitle || 'Dongflix',
      text: `Tonton ${currentMainTitle} Sub Indo di Dongflix!`,
      url: window.location.href
    };
    if (navigator.share) {
      navigator.share(shareData).catch(() => {});
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Tautan streaming berhasil disalin!');
    }
  }

  window.updateCommentAuthUI = function() {
    const formBox = document.getElementById('commentFormBox');
    const noticeBox = document.getElementById('commentLoginNotice');
    if (window.currentUser) {
      if (formBox) formBox.style.display = 'flex';
      if (noticeBox) noticeBox.style.display = 'none';
    } else {
      if (formBox) formBox.style.display = 'none';
      if (noticeBox) noticeBox.style.display = 'block';
    }
  };

  function toggleSortDropdown(event) {
    event.stopPropagation();
    document.getElementById('sortDropdownMenu').classList.toggle('active');
  }

  function selectSortOrder(mode) {
    currentSortMode = mode;
    document.getElementById('sortOptLatest').classList.toggle('active', mode === 'latest');
    document.getElementById('sortOptTop').classList.toggle('active', mode === 'top');
    document.getElementById('sortDropdownMenu').classList.remove('active');
    loadComments();
  }

  document.addEventListener('click', () => {
    const dropdown = document.getElementById('sortDropdownMenu');
    if (dropdown) dropdown.classList.remove('active');
  });

  async function loadComments() {
    const container = document.getElementById('commentsListContainer');
    const countBadge = document.getElementById('commentsCountBadge');
    if (!window.db || !targetSlug) {
      container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
      return;
    }

    try {
      const commentsRef = window.fbRef(window.db, `comments/${targetSlug}`);
      const snap = await window.fbGet(commentsRef);

      if (snap.exists()) {
        const commentsData = snap.val();
        container.innerHTML = '';
        const mainComments = [];
        const repliesMap = {};

        countBadge.innerText = `(${Object.keys(commentsData).length})`;

        Object.keys(commentsData).forEach(key => {
          const item = { id: key, ...commentsData[key] };
          if (item.parentId) {
            if (!repliesMap[item.parentId]) repliesMap[item.parentId] = [];
            repliesMap[item.parentId].push(item);
          } else {
            mainComments.push(item);
          }
        });

        mainComments.sort((a, b) => {
          if (a.isPinned && !b.isPinned) return -1;
          if (!a.isPinned && b.isPinned) return 1;
          if (currentSortMode === 'top') {
            const repliesA = (repliesMap[a.id] || []).length;
            const repliesB = (repliesMap[b.id] || []).length;
            return repliesB - repliesA;
          }
          return b.timestamp - a.timestamp;
        });

        if (mainComments.length === 0) {
          container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
          return;
        }

        for (const item of mainComments) {
          const replies = repliesMap[item.id] || [];
          const cardEl = await renderTikTokCommentCardAsync(item, replies);
          container.appendChild(cardEl);
        }
      } else {
        countBadge.innerText = '(0)';
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
      }
    } catch (e) {
      container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
    }
  }

  async function fetchUserProfileByEmailOrUid(userEmail, uid) {
    if (!window.db) return null;
    try {
      if (userEmail) {
        const userKey = getDbKey(userEmail);
        const snap = await window.fbGet(window.fbRef(window.db, `users/${userKey}`));
        if (snap.exists()) return snap.val();
      }
    } catch (e) {}
    return null;
  }

  async function renderTikTokCommentCardAsync(item, replies = []) {
    const card = document.createElement('div');
    card.className = `comment-card ${item.isPinned ? 'pinned' : ''}`;
    card.id = `comment-${item.id}`;

    const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : 'Baru saja';
    const profile = await fetchUserProfileByEmailOrUid(item.email, item.uid);
    const currentAuthorName = profile?.name || item.author || 'User';
    const currentPhotoURL = profile?.photoURL || item.photoURL || '';
    const authorEmail = (profile?.email || item.email || '').toLowerCase();
    const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase() || profile?.status === 'admin';
    const initial = currentAuthorName.charAt(0).toUpperCase();

    const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
    const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
    const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;

    const isMyComment = window.currentUser && (window.currentUser.email === item.email || window.currentUser.uid === item.uid);
    let actionButtons = '';

    if (window.currentUser) {
      actionButtons += `<button class="btn-reply-tiktok" onclick="toggleReplyBox('${item.id}')">Balas</button>`;
      if (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase())) {
        actionButtons += `<button class="btn-delete-tiktok" onclick="deleteComment('${item.id}')">Hapus</button>`;
      }
    }

    let repliesHtml = '';
    if (replies.length > 0) {
      let renderedReplies = '';
      for (const reply of replies) {
        renderedReplies += await renderTikTokReplyCardHtmlAsync(reply);
      }
      repliesHtml = `
        <button class="replies-toggle-btn" id="btn-toggle-${item.id}" onclick="toggleRepliesDisplay('${item.id}', ${replies.length})">
          Lihat ${replies.length} balasan ▾
        </button>
        <div class="replies-container" id="replies-box-${item.id}">${renderedReplies}</div>
      `;
    }

    card.innerHTML = `
      <div class="tiktok-avatar">${photoHtml}</div>
      <div class="comment-content">
        <div class="comment-user-row">
          <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
          ${levelBadge} ${adminBadge}
        </div>
        <div class="comment-body-text">${escapeHtml(item.text)}</div>
        <div class="comment-footer-actions">
          <span class="comment-time">${timeAgo}</span>
          ${actionButtons}
        </div>
        <div id="reply-input-wrapper-${item.id}"></div>
        ${repliesHtml}
      </div>
      <div class="comment-like-box" onclick="toggleLikeComment(this)">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    `;

    return card;
  }

  async function renderTikTokReplyCardHtmlAsync(reply) {
    const timeAgo = reply.timestamp ? getTimeAgo(reply.timestamp) : 'Baru saja';
    const profile = await fetchUserProfileByEmailOrUid(reply.email, reply.uid);
    const currentAuthorName = profile?.name || reply.author || 'User';
    const currentPhotoURL = profile?.photoURL || reply.photoURL || '';
    const authorEmail = (profile?.email || reply.email || '').toLowerCase();
    const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase() || profile?.status === 'admin';
    const initial = currentAuthorName.charAt(0).toUpperCase();

    const photoHtml = currentPhotoURL ? `<img src="${currentPhotoURL}" />` : initial;
    const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
    const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;

    const isMyComment = window.currentUser && (window.currentUser.email === reply.email || window.currentUser.uid === reply.uid);
    let deleteBtn = '';
    if (window.currentUser && (isMyComment || (window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()))) {
      deleteBtn = `<button class="btn-delete-tiktok" onclick="deleteComment('${reply.id}')">Hapus</button>`;
    }

    return `
      <div class="reply-card" id="comment-${reply.id}">
        <div class="tiktok-avatar">${photoHtml}</div>
        <div class="comment-content">
          <div class="comment-user-row">
            <span class="tiktok-username ${isAdmin ? 'admin' : ''}">${escapeHtml(currentAuthorName)}</span>
            ${levelBadge} ${adminBadge}
          </div>
          <div class="comment-body-text">${escapeHtml(reply.text)}</div>
          <div class="comment-footer-actions">
            <span class="comment-time">${timeAgo}</span>
            ${deleteBtn}
          </div>
        </div>
      </div>
    `;
  }

  function toggleRepliesDisplay(commentId, count) {
    const container = document.getElementById(`replies-box-${commentId}`);
    const btn = document.getElementById(`btn-toggle-${commentId}`);
    if (!container || !btn) return;

    if (container.classList.contains('show')) {
      container.classList.remove('show');
      btn.innerText = `Lihat ${count} balasan ▾`;
    } else {
      container.classList.add('show');
      btn.innerText = 'Sembunyikan balasan ▴';
    }
  }

  function toggleLikeComment(el) { el.classList.toggle('liked'); }

  function toggleReplyBox(commentId) {
    const container = document.getElementById(`reply-input-wrapper-${commentId}`);
    if (!container) return;
    if (container.innerHTML !== '') {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = `
      <div class="reply-input-box">
        <input type="text" class="reply-input" id="replyInput-${commentId}" placeholder="Tulis balasan..." />
        <button class="btn-reply-send" onclick="submitReply('${commentId}')">Kirim</button>
      </div>
    `;
  }

  async function submitComment() {
    if (!window.currentUser) { alert('Anda harus login terlebih dahulu.'); return; }
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;

    await ensureUserRecord(window.currentUser);
    const commentItem = { uid: window.currentUser.uid, email: window.currentUser.email || '', text: text, timestamp: Date.now() };

    try {
      const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
      await window.fbSet(newCommentRef, commentItem);
      input.value = '';
      loadComments();
    } catch (e) {
      alert('Gagal mengirim komentar: ' + e.message);
    }
  }

  async function submitReply(parentId) {
    if (!window.currentUser) return;
    const input = document.getElementById(`replyInput-${parentId}`);
    const text = input ? input.value.trim() : '';
    if (!text) return;

    await ensureUserRecord(window.currentUser);
    const replyItem = { uid: window.currentUser.uid, email: window.currentUser.email || '', text: text, parentId: parentId, timestamp: Date.now() };

    try {
      const newCommentRef = window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`);
      await window.fbSet(newCommentRef, replyItem);
      loadComments();
    } catch (e) {
      alert('Gagal membalas komentar: ' + e.message);
    }
  }

  async function deleteComment(commentId) {
    if (!confirm('Apakah Anda yakin ingin menghapus komentar ini?')) return;
    try {
      const commentRef = window.fbRef(window.db, `comments/${targetSlug}/${commentId}`);
      await window.fbRemove(commentRef);
      loadComments();
    } catch (e) {
      alert('Gagal menghapus komentar: ' + e.message);
    }
  }

  function getTimeAgo(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'Baru saja';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}j`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d`;
    return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* LOAD DETAIL DARI DONGFLIX API (/api/donghua) */
  async function loadDetail() {
    if (!targetSlug) {
      document.getElementById('mediaDetailsGroup').innerHTML = '<h1 class="media-title">Donghua Tidak Ditemukan</h1>';
      return;
    }

    try {
      // 1. Ambil Info Donghua dari donghua.json
      const catRes = await fetch('/api/donghua?path=donghua.json');
      if (!catRes.ok) throw new Error('Katalog gagal dimuat');
      const catalog = await catRes.json();
      const info = catalog.find(d => d.slug === targetSlug);

      if (info) {
        currentMainTitle = sanitizeTitle(info.title);
        currentPoster = info.cover || '';

        const headerTitleEl = document.getElementById('topHeaderTitle');
        if (headerTitleEl) headerTitleEl.innerText = currentMainTitle;

        document.getElementById('pageTitle').innerText = `${currentMainTitle} - Dongflix`;

        document.getElementById('mediaDetailsGroup').innerHTML = `
          <h1 class="media-title">${escapeHtml(currentMainTitle)}</h1>
          <p class="synopsis-text">${escapeHtml(info.synopsis || 'Tidak ada deskripsi sinopsis.')}</p>
        `;
      }

      // 2. Ambil Episode dari episodes/[slug].json
      const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(targetSlug)}.json`);
      if (!epRes.ok) throw new Error('Episode belum tersedia');
      const episodesData = await epRes.json();

      globalEpisodes = Array.isArray(episodesData) ? episodesData : [];
      document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;

      if (globalEpisodes.length > 0) {
        renderEpisodeGrid(false);
        selectEpisode(0, `Ep ${globalEpisodes[0].episode || 1}`, true);
      } else {
        document.getElementById('playerMediaContainer').innerText = 'Episode belum tersedia.';
      }

    } catch (err) {
      document.getElementById('mediaDetailsGroup').innerHTML = '<h1 class="media-title">Media Belum Tersedia</h1>';
      document.getElementById('playerMediaContainer').innerText = 'File episode belum tersedia.';
    }

    showServerHint();
    initViewsAndComments();
  }

  /* PILIH EPISODE & MAINKAN VIDEO */
  function selectEpisode(index, episodeLabel, skipScroll = false) {
    closeEpisodeSheet();
    const episode = globalEpisodes[index];
    if (!episode) return;

    const epNum = episode.episode || (index + 1);
    window.currentPlayingEpisodeNum = epNum;

    highlightCurrentEpisode();
    if (!skipScroll) setTimeout(scrollToActiveEpisode, 80);

    const mediaBox = document.getElementById('playerMediaContainer');
    mediaBox.innerHTML = '<div class="skeleton skeleton-player"></div>';

    const servers = normalizeServerList(episode.servers);

    if (servers.length > 0) {
      setupServers(servers);
    } else {
      currentServerUrl = '';
      const serverSelect = document.getElementById('serverSelect');
      if (serverSelect) serverSelect.innerHTML = '';
      mediaBox.innerText = 'Server pemutar belum tersedia untuk episode ini.';
    }
  }

  function normalizeServerList(servers) {
    if (!servers) return [];
    const source = Array.isArray(servers) ? servers : Object.values(servers);

    return source
      .filter(Boolean)
      .map((server, index) => {
        if (typeof server === 'string') {
          return { name: `Server ${index + 1}`, url: server.trim() };
        }
        return {
          name: String(server.name || `Server ${index + 1}`).trim(),
          url: String(server.link || server.url || '').trim()
        };
      })
      .filter(server => /^https?:\/\//i.test(server.url));
  }

  function setupServers(servers) {
    const serverSelect = document.getElementById('serverSelect');
    serverSelect.innerHTML = '';

    servers.forEach((srv, index) => {
      const opt = document.createElement('option');
      opt.value = srv.url;
      opt.innerText = srv.name;
      if (index === 0) opt.selected = true;
      serverSelect.appendChild(opt);
    });

    serverSelect.selectedIndex = 0;
    currentServerUrl = servers[0].url;
    renderPlayerMedia(servers[0].url);
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayerMedia(url);
    }
  }

  function renderPlayerMedia(url) {
    const mediaBox = document.getElementById('playerMediaContainer');
    if (!url) return;

    mediaBox.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.className = 'player-iframe';
    iframe.src = String(url);
    iframe.allowFullscreen = true;
    iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture; web-share');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    mediaBox.appendChild(iframe);
  }

  function openEpisodeSheet() {
    const sheetGrid = document.getElementById('sheetEpGrid');
    const overlay = document.getElementById('sheetOverlay');
    sheetGrid.innerHTML = '';

    if (globalEpisodes.length === 0) return;

    const sortedEpisodes = getSortedEpisodes();
    sortedEpisodes.forEach((ep, index) => {
      const epNum = ep.episode || ep.number || (index + 1);
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = epNum;

      if (String(epNum) === String(window.currentPlayingEpisodeNum)) {
        box.classList.add('active');
      }

      box.onclick = () => {
        const originalIndex = globalEpisodes.findIndex(e => (e.episode || e.number) == epNum);
        selectEpisode(originalIndex !== -1 ? originalIndex : index, `Ep ${epNum}`);
      };

      sheetGrid.appendChild(box);
    });

    overlay.classList.add('active');
  }

  function closeEpisodeSheet() {
    document.getElementById('sheetOverlay').classList.remove('active');
  }

  window.onload = loadDetail;
</script>
