      --bg-card: #0a0a0a;

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);

    .container { max-width: 1000px; margin: 0 auto; padding: 0 16px; }

    header {

    .header-content {

    .header-left-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .icon-circle-btn {

    .brand-title {
      font-size: 16.5px; font-weight: 700; color: #fff;

    .player-wrapper {
      margin: 0 -16px 18px;

    .cool-spinner {

    .spinner-ring {

    .reply-input-box { margin-top: 10px; display: flex; gap: 8px; }

<script type="module">
  import { auth, db, ref, get, set, remove, runTransaction, increment, onAuthStateChanged } from '/assets/firebase-config.js';

  window.auth = auth;
  window.db = db;
  window.fbRef = ref;
  window.fbGet = get;
  window.fbSet = set;
  window.fbRemove = remove;
  window.fbTransaction = runTransaction;
  window.fbIncrement = increment;

  onAuthStateChanged(auth, (user) => {
    window.currentUser = user;
    const formBox = document.getElementById('commentFormBox');
    const noticeBox = document.getElementById('commentLoginNotice');
    if (user) {
      if (formBox) formBox.style.display = 'flex';
      if (noticeBox) noticeBox.style.display = 'none';
    } else {
      if (formBox) formBox.style.display = 'none';
      if (noticeBox) noticeBox.style.display = 'block';
    }
  });

  // Eksekusi view dan komentar begitu modul siap
  window.triggerViewIncrement();
  window.loadComments();
</script>

<script>
  let globalEpisodes = [];
  let currentMainTitle = '';
  let currentPoster = '';
  let currentServerUrl = '';
  let hasIncrementedView = false;
  const ADMIN_EMAIL = 'zahrulms01@gmail.com';

  function getCleanMainSlug() {
    const urlParams = new URLSearchParams(window.location.search);
    let s = urlParams.get('slug');
    if (!s) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const donghuaIdx = parts.indexOf('donghua');
      if (donghuaIdx !== -1 && parts[donghuaIdx + 1]) {
        s = parts[donghuaIdx + 1];
      } else {
        s = parts[parts.length - 1] || '';
      }
    }
    s = String(s || '').trim().replace(/^https?:\/\/[^\/]+/i, '').split('?')[0].split('#')[0];
    return s.replace(/-episode-\d+.*$/i, '').replace(/-ep-\d+.*$/i, '').replace(/^\/+|\/+$/g, '');
  }

  let targetSlug = getCleanMainSlug();

  function slugToTitleCase(slug) {
    if (!slug) return 'Donghua';
    return slug.split('-').filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  }

  const initialTitle = slugToTitleCase(targetSlug);
  document.getElementById('topHeaderTitle').innerText = initialTitle;
  document.title = `Nonton ${initialTitle} Sub Indo - Dongflix`;

  function getLocalDateString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatViewDisplay(val) {
    const n = parseInt(val, 10);
    if (isNaN(n) || n <= 0) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  /* SISTEM VIEW TOTAL & HARIAN (AUTO-INCR & DISPLAY) */
  window.triggerViewIncrement = async function() {
    if (!targetSlug || !window.db || !window.fbRef || !window.fbGet) {
      setTimeout(window.triggerViewIncrement, 250);
      return;
    }

    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const todayStr = getLocalDateString();
    const totalRef = window.fbRef(window.db, `views_total/${cleanKey}`);
    const dailyRef = window.fbRef(window.db, `views_daily/${todayStr}/${cleanKey}`);

    try {
      if (!hasIncrementedView) {
        hasIncrementedView = true;
        if (window.fbIncrement && window.fbSet) {
          window.fbSet(totalRef, window.fbIncrement(1)).catch(() => {});
          window.fbSet(dailyRef, window.fbIncrement(1)).catch(() => {});
        } else {
          const snap = await window.fbGet(totalRef);
          const curr = snap.exists() ? (parseInt(snap.val(), 10) || 0) : 0;
          window.fbSet(totalRef, curr + 1).catch(() => {});
        }
      }

      const snap = await window.fbGet(totalRef);
      if (snap.exists()) {
        document.getElementById('viewCountText').innerText = formatViewDisplay(snap.val());
      }
    } catch (e) {
      console.warn("View Error:", e);
    }
  };

  /* SISTEM KOMENTAR */
  window.loadComments = async function() {
    const container = document.getElementById('commentsListContainer');
    const countBadge = document.getElementById('commentsCountBadge');
    if (!container) return;

    if (!window.db || !window.fbRef || !window.fbGet) {
      setTimeout(window.loadComments, 250);
      return;
    }

    if (!targetSlug) return;

    try {
      const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
      const commentsRef = window.fbRef(window.db, `comments/${cleanKey}`);
      const snap = await window.fbGet(commentsRef);

      if (snap.exists()) {
        const commentsData = snap.val() || {};
        container.innerHTML = '';
        const mainComments = [];
        const repliesMap = {};

        const keys = Object.keys(commentsData);
        if (countBadge) countBadge.innerText = `(${keys.length})`;

        keys.forEach(key => {
          const item = { id: String(key), ...commentsData[key] };
          if (item.parentId) {
            const pId = String(item.parentId);
            if (!repliesMap[pId]) repliesMap[pId] = [];
            repliesMap[pId].push(item);
          } else {
            mainComments.push(item);
          }
        });

        mainComments.sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));

        if (mainComments.length === 0) {
          container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
          return;
        }

        mainComments.forEach(item => {
          const replies = repliesMap[item.id] || [];
          replies.sort((r1, r2) => (Number(r1.timestamp) || 0) - (Number(r2.timestamp) || 0));
          container.appendChild(renderTikTokCommentCard(item, replies));
        });
      } else {
        if (countBadge) countBadge.innerText = '(0)';
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
      }
    } catch (e) {
      container.innerHTML = '<p style="font-size:12px;color:#ef4444;">Gagal memuat komentar.</p>';
    }
  };

  function renderTikTokCommentCard(item, replies = []) {
    const card = document.createElement('div');
    card.className = `comment-card ${item.isPinned ? 'pinned' : ''}`;
    card.id = `comment-${item.id}`;

    const authorEmail = String(item.email || '').toLowerCase();
    const currentAuthorName = item.author || (item.email ? item.email.split('@')[0] : 'User');
    const isAdmin = authorEmail === ADMIN_EMAIL.toLowerCase() || item.isAdmin === true;
    const initial = currentAuthorName.charAt(0).toUpperCase();

    const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
    const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;

    let actionButtons = '';
    if (window.currentUser) {
      actionButtons += `<button class="btn-reply-tiktok" onclick="toggleReplyBox('${item.id}')">Balas</button>`;
      if (window.currentUser.email === item.email || window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        actionButtons += `<button class="btn-reply-tiktok" style="color:#ef4444;" onclick="deleteComment('${item.id}')">Hapus</button>`;
      }
    }

    let repliesHtml = '';
    if (replies.length > 0) {
      let renderedReplies = '';
      replies.forEach(r => {
        const rEmail = String(r.email || '').toLowerCase();
        const rName = r.author || (r.email ? r.email.split('@')[0] : 'User');
        const rAdmin = rEmail === ADMIN_EMAIL.toLowerCase() || r.isAdmin === true;
        renderedReplies += `
          <div class="reply-card">
            <div class="tiktok-avatar">${rName.charAt(0).toUpperCase()}</div>
            <div class="comment-content">
              <div class="comment-user-row">
                <span class="tiktok-username">${escapeHtml(rName)}</span>
                ${rAdmin ? '<span class="badge-admin">★ ADMIN</span>' : '<span class="badge-level">Lv1</span>'}
              </div>
              <div class="comment-body-text">${escapeHtml(r.text)}</div>
            </div>
          </div>
        `;
      });
      repliesHtml = `
        <button class="replies-toggle-btn" id="btn-toggle-${item.id}" onclick="toggleRepliesDisplay('${item.id}', ${replies.length})">
          Lihat ${replies.length} balasan ▾
        </button>
        <div class="replies-container" id="replies-box-${item.id}">${renderedReplies}</div>
      `;
    }

    card.innerHTML = `
      <div class="tiktok-avatar">${initial}</div>
      <div class="comment-content">
        <div class="comment-user-row">
          <span class="tiktok-username">${escapeHtml(currentAuthorName)}</span>
          ${levelBadge} ${adminBadge}
        </div>
        <div class="comment-body-text">${escapeHtml(item.text)}</div>
        <div class="comment-footer-actions">
          <span>${item.timestamp ? new Date(item.timestamp).toLocaleDateString('id-ID') : 'Baru saja'}</span>
          ${actionButtons}
        </div>
        <div id="reply-input-wrapper-${item.id}"></div>
        ${repliesHtml}
      </div>
    `;
    return card;
  }

  function toggleRepliesDisplay(commentId, count) {
    const box = document.getElementById(`replies-box-${commentId}`);
    const btn = document.getElementById(`btn-toggle-${commentId}`);
    if (!box || !btn) return;
    if (box.classList.contains('show')) {
      box.classList.remove('show');
      btn.innerText = `Lihat ${count} balasan ▾`;
    } else {
      box.classList.add('show');
      btn.innerText = 'Sembunyikan balasan ▴';
    }
  }

  function toggleReplyBox(commentId) {
    const wrap = document.getElementById(`reply-input-wrapper-${commentId}`);
    if (!wrap) return;
    if (wrap.innerHTML !== '') { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="reply-input-box">
        <input type="text" class="reply-input" id="replyInput-${commentId}" placeholder="Balas komentar..." />
        <button class="btn-reply-send" onclick="submitReply('${commentId}')">Kirim</button>
      </div>
    `;
  }

  async function submitComment() {
    if (!window.currentUser) return;
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;

    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const newRef = window.fbRef(window.db, `comments/${cleanKey}/${Date.now()}`);
    await window.fbSet(newRef, {
      uid: window.currentUser.uid,
      email: window.currentUser.email || '',
      text: text,
      timestamp: Date.now(),
      isAdmin: window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
    });
    input.value = '';
    window.loadComments();
  }

  async function submitReply(parentId) {
    if (!window.currentUser) return;
    const input = document.getElementById(`replyInput-${parentId}`);
    const text = input ? input.value.trim() : '';
    if (!text) return;

    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const newRef = window.fbRef(window.db, `comments/${cleanKey}/${Date.now()}`);
    await window.fbSet(newRef, {
      uid: window.currentUser.uid,
      email: window.currentUser.email || '',
      text: text,
      parentId: String(parentId),
      timestamp: Date.now(),
      isAdmin: window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
    });
    window.loadComments();
  }

  async function deleteComment(commentId) {
    if (!confirm('Hapus komentar ini?')) return;
    const cleanKey = String(targetSlug).replace(/[.#$\[\]\/]/g, '_');
    const cRef = window.fbRef(window.db, `comments/${cleanKey}/${commentId}`);
    await window.fbRemove(cRef);
    window.loadComments();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function goBack() { window.location.href = '/'; }
  function toggleFavorite() { alert('Tersimpan di favorit.'); }
  function triggerDownload() { if (currentServerUrl) window.open(currentServerUrl, '_blank'); }
  function triggerShare() { navigator.clipboard.writeText(window.location.href); alert('Tautan disalin.'); }

  async function loadDetail() {
    targetSlug = getCleanMainSlug();
    if (!targetSlug) {
      document.getElementById('playerMediaContainer').innerHTML = '<div>Donghua tidak tersedia</div>';
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
      return;
    }

    try {
      const catRes = await fetch('/api/donghua?path=donghua.json');
      const catalog = await catRes.json();
      const info = catalog.find(d => String(d.slug || '').toLowerCase() === targetSlug.toLowerCase());

      if (!info) {
        document.getElementById('playerMediaContainer').innerHTML = '<div>Donghua tidak tersedia</div>';
        document.getElementById('mainContentGroup').style.display = 'none';
        document.getElementById('notFoundBox').style.display = 'flex';
        return;
      }

      document.getElementById('mainContentGroup').style.display = 'block';
      document.getElementById('notFoundBox').style.display = 'none';
      currentMainTitle = info.title;
      currentPoster = info.cover || info.poster || '';
      document.getElementById('topHeaderTitle').innerText = currentMainTitle;

      const genres = Array.isArray(info.genres) ? info.genres : [];
      document.getElementById('mediaDetailsGroup').innerHTML = `
        <div class="media-meta-card">
          <div class="media-cover-wrapper">
            <img src="${currentPoster}" class="media-cover-img" alt="${currentMainTitle}" />
          </div>
          <div class="media-info-col">
            <h1 class="media-title">${currentMainTitle}</h1>
            <div class="genre-badges-row">${genres.map(g => `<span class="genre-pill">${g}</span>`).join('')}</div>
            <div class="status-release-row">
              <span>Status: <strong>${info.status || 'Ongoing'}</strong></span>
              <span>Rilis: <strong>${info.released || '-'}</strong></span>
            </div>
          </div>
        </div>
        <div class="synopsis-block">
          <div class="synopsis-heading">SINOPSIS</div>
          <p class="synopsis-text">${info.synopsis || info.description || 'Tidak ada deskripsi.'}</p>
        </div>
      `;

      const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(targetSlug)}.json`);
      if (epRes.ok) {
        globalEpisodes = await epRes.json();
        document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;
        renderEpisodeGrid();
        if (globalEpisodes.length > 0) selectEpisodeByNum(globalEpisodes[0].episode || 1);
      }
    } catch (e) {
      document.getElementById('mainContentGroup').style.display = 'none';
      document.getElementById('notFoundBox').style.display = 'flex';
    }
  }

  function renderEpisodeGrid() {
    const epGrid = document.getElementById('epGrid');
    epGrid.innerHTML = '';
    globalEpisodes.forEach((ep) => {
      const num = ep.episode || ep.number || 1;
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = num;
      box.onclick = () => selectEpisodeByNum(num);
      epGrid.appendChild(box);
    });
  }

  function selectEpisodeByNum(epNum) {
    const episode = globalEpisodes.find(e => String(e.episode || e.number) === String(epNum)) || globalEpisodes[0];
    if (!episode) return;
    const servers = episode.servers || episode.server || [];
    const serverSelect = document.getElementById('serverSelect');
    serverSelect.innerHTML = '';

    if (servers.length > 0) {
      servers.forEach((srv, i) => {
        const opt = document.createElement('option');
        opt.value = srv.link || srv.url;
        opt.innerText = srv.name || `Server ${i+1}`;
        serverSelect.appendChild(opt);
      });
      currentServerUrl = servers[0].link || servers[0].url;
      renderPlayer(currentServerUrl);
    }
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayer(url);
    }
  }

  function renderPlayer(url) {
    const box = document.getElementById('playerMediaContainer');
    box.innerHTML = `
      <div class="player-loader-overlay" id="playerLoaderOverlay">
        <div class="cool-spinner"><div class="spinner-ring"></div></div>
      </div>
      <iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer" onload="document.getElementById('playerLoaderOverlay').classList.add('hidden')"></iframe>
    `;
  }

  window.onload = loadDetail;
</script>
</body>
</html>
