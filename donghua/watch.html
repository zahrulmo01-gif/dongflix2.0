<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Dongflix - Detail</title>
  <meta name="referrer" content="no-referrer">

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: #000000;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 68px;
      padding-bottom: 40px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 70%, rgba(0, 0, 0, 0) 100%);
      padding: 10px 16px 16px;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-circle-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      color: #ffffff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .icon-circle-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #182232;
      animation: skeletonPulse 1.5s infinite ease-in-out;
      border-radius: 8px;
    }

    .skeleton-player {
      width: 100%;
      height: 100%;
      border-radius: 0;
    }

    .player-wrapper {
      margin: 0 -16px 16px;
      width: calc(100% + 32px);
      background: #000;
      aspect-ratio: 16/9;
    }

    .detail-player-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
    }

    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .ep-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .ep-header-title {
      font-size: 16px;
      font-weight: 800;
    }

    .episode-sort-wrapper {
      position: relative;
      margin-left: auto;
    }

    .episode-sort-button {
      height: 32px;
      min-width: 92px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .episode-sort-button svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .episode-sort-menu {
      display: none;
      position: absolute;
      top: 38px;
      right: 0;
      min-width: 125px;
      padding: 5px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
      z-index: 150;
    }

    .episode-sort-menu.active {
      display: block;
    }

    .episode-sort-option {
      width: 100%;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .episode-sort-option.active {
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
    }

    .btn-see-all-ep {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-see-all-ep svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    .ep-scroll-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 14px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .ep-scroll-grid::-webkit-scrollbar {
      display: none;
    }

    .ep-box {
      flex: 0 0 54px;
      height: 54px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .ep-box.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    .action-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 20px;
      position: relative;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .action-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .action-item.active {
      color: #38bdf8;
    }

    .action-item.active svg {
      fill: #38bdf8;
      stroke: #38bdf8;
    }

    .server-custom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
    }

    .server-custom-btn svg {
      width: 22px;
      height: 22px;
      stroke: #94a3b8;
      fill: none;
      stroke-width: 2;
    }

    .server-select-hidden {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .server-tooltip-hint {
      position: absolute;
      top: -45px;
      left: 10px;
      background: #0284c7;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .server-tooltip-hint.show {
      opacity: 1;
    }

    /* COVER & INFO SAMPING */
    .media-meta-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .media-cover-wrapper {
      width: 105px;
      min-width: 105px;
      aspect-ratio: 3/4;
      border-radius: 12px;
      overflow: hidden;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .media-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-info-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .media-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      color: #ffffff;
    }

    .genre-badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .genre-pill {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-release-row {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .status-release-row span strong {
      color: #f1f5f9;
      font-weight: 600;
    }

    .synopsis-block {
      border-top: 1px solid #1e293b;
      padding-top: 16px;
    }

    .synopsis-heading {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .synopsis-text {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
      text-align: justify;
    }

    /* BOTTOM SHEET */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      backdrop-filter: blur(4px);
    }

    .sheet-overlay.active {
      display: block;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 201;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      background: #0f172a;
    }

    .sheet-overlay.active .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
    }

    .sheet-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* KOMENTAR */
    .comments-section {
      margin-top: 24px;
      border-top: 1px solid #1e293b;
      padding-top: 20px;
    }

    .comments-header-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      position: relative;
    }

    .comments-header-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f8fafc;
    }

    .comments-header-title svg {
      width: 18px;
      height: 18px;
      stroke: #38bdf8;
      fill: none;
      stroke-width: 2.2;
    }

    .comment-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 6px 8px 6px 16px;
      margin-bottom: 20px;
    }

    .comment-textarea {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .btn-send-comment {
      background: #0284c7;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-send-comment svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .comment-login-notice {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .comment-login-notice a {
      color: #38bdf8;
      font-weight: 700;
      cursor: pointer;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .comment-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
    }

    .tiktok-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
      min-width: 0;
    }

    .comment-user-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .tiktok-username {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }

    .comment-body-text {
      font-size: 13.5px;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 6px;
    }

    .comment-time {
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-left-group" onclick="goBack()">
      <button class="icon-circle-btn">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="brand-title" id="topHeaderTitle">Memuat...</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="player-wrapper">
    <div class="detail-player-box" id="playerMediaContainer">
      <div class="skeleton skeleton-player"></div>
    </div>
  </div>

  <div>
    <!-- EPISODE LIST -->
    <div id="epContainer">
      <div class="ep-header-row">
        <span class="ep-header-title">Episode List</span>

        <div class="episode-sort-wrapper">
          <button class="episode-sort-button" onclick="toggleEpisodeSort(event)">
            <span id="episodeSortText">Terlama</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="episode-sort-menu" id="episodeSortMenu">
            <button class="episode-sort-option active" id="episodeSortOldest" onclick="setEpisodeSort('oldest')">Terlama</button>
            <button class="episode-sort-option" id="episodeSortNewest" onclick="setEpisodeSort('newest')">Terbaru</button>
          </div>
        </div>

        <button class="btn-see-all-ep" onclick="openEpisodeSheet()">
          <span id="epTotalInfo">0 Episode</span>
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="ep-scroll-grid" id="epGrid">
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
        <div class="ep-box skeleton"></div>
      </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
      <div class="server-tooltip-hint" id="serverHint">Ganti server pemutaran di sini</div>

      <div class="server-custom-btn">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="8" rx="2"/>
          <rect x="2" y="14" width="20" height="8" rx="2"/>
          <line x1="6" y1="6" x2="6.01" y2="6"/>
          <line x1="6" y1="18" x2="6.01" y2="18"/>
        </svg>
        <span style="font-size:11px;color:#94a3b8;">Server</span>
        <select class="server-select-hidden" id="serverSelect" onchange="switchServer(this.value)"></select>
      </div>

      <div class="action-item">
        <svg viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="viewCountText">0</span>
      </div>

      <button class="action-item" id="btnFavorite" onclick="toggleFavorite()">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Favorit</span>
      </button>

      <button class="action-item" onclick="triggerDownload()">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Unduh</span>
      </button>

      <button class="action-item" onclick="triggerShare()">
        <svg viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span>Bagikan</span>
      </button>
    </div>

    <!-- DETAIL KONTEN -->
    <div id="mediaDetailsGroup">
      <div class="skeleton" style="height:120px;margin-bottom:20px;"></div>
    </div>

    <!-- COMMENTS SECTION -->
    <section class="comments-section">
      <div class="comments-header-wrapper">
        <h3 class="comments-header-title">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Komentar <span id="commentsCountBadge">(0)</span>
        </h3>
      </div>

      <div class="comment-input-box" id="commentFormBox" style="display:none;">
        <input class="comment-textarea" id="commentInput" placeholder="Tambah komentar..." />
        <button class="btn-send-comment" onclick="submitComment()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <div class="comment-login-notice" id="commentLoginNotice">
        Silakan <a onclick="goToHomeLogin()">Login</a> terlebih dahulu untuk menulis komentar.
      </div>

      <div class="comments-list" id="commentsListContainer">
        <p style="font-size:12px;color:#64748b;">Memuat komentar...</p>
      </div>
    </section>
  </div>
</div>

<!-- EPISODE SHEET -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeEpisodeSheet()">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <span class="sheet-title">Semua Episode</span>
      <button class="sheet-close" onclick="closeEpisodeSheet()">✕</button>
    </div>
    <div class="sheet-grid" id="sheetEpGrid"></div>
  </div>
</div>

<script type="module">
  try {
    const { auth, db, ref, get, set, transaction, onAuthStateChanged } = await import('/assets/firebase-config.js');
    window.auth = auth;
    window.db = db;
    window.fbRef = ref;
    window.fbGet = get;
    window.fbSet = set;
    window.fbTransaction = transaction;

    if (auth) {
      onAuthStateChanged(auth, (user) => {
        window.currentUser = user;
        const form = document.getElementById('commentFormBox');
        const notice = document.getElementById('commentLoginNotice');
        if (form && notice) {
          form.style.display = user ? 'flex' : 'none';
          notice.style.display = user ? 'none' : 'block';
        }
      });
    }
  } catch (_) {}
</script>

<script>
  let globalEpisodes = [];
  let currentMainTitle = '';
  let currentPoster = '';
  let currentServerUrl = '';
  let episodeSortMode = 'oldest';

  function extractTargetSlug() {
    const segments = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    if (segments.length > 1 && segments[0] === 'donghua') return segments[1];
    return new URLSearchParams(window.location.search).get('slug') || '';
  }

  const targetSlug = extractTargetSlug();

  function sanitizeTitle(str) {
    if (!str) return '';
    const text = str.trim();
    const half = Math.floor(text.length / 2);
    return (text.length > 4 && text.slice(0, half) === text.slice(half)) ? text.slice(0, half).trim() : text;
  }

  function extractEpNumber(val, fallback = 1) {
    const match = String(val || '').match(/(\d+(\.\d+)?)/);
    return match ? parseFloat(match[1]) : fallback;
  }

  function toggleEpisodeSort(e) {
    e.stopPropagation();
    document.getElementById('episodeSortMenu').classList.toggle('active');
  }

  function setEpisodeSort(mode) {
    episodeSortMode = mode;
    document.getElementById('episodeSortText').innerText = mode === 'oldest' ? 'Terlama' : 'Terbaru';
    document.getElementById('episodeSortOldest').classList.toggle('active', mode === 'oldest');
    document.getElementById('episodeSortNewest').classList.toggle('active', mode === 'newest');
    document.getElementById('episodeSortMenu').classList.remove('active');
    renderEpisodeGrid();
  }

  document.addEventListener('click', () => {
    const menu = document.getElementById('episodeSortMenu');
    if (menu) menu.classList.remove('active');
  });

  function getSortedEpisodes() {
    return [...globalEpisodes].sort((a, b) => {
      const numA = extractEpNumber(a.episode || a.number, 0);
      const numB = extractEpNumber(b.episode || b.number, 0);
      return episodeSortMode === 'oldest' ? numA - numB : numB - numA;
    });
  }

  function renderEpisodeGrid() {
    const epGrid = document.getElementById('epGrid');
    if (!epGrid) return;
    epGrid.innerHTML = '';

    getSortedEpisodes().forEach((ep, index) => {
      const epNum = ep.episode || ep.number || (index + 1);
      const box = document.createElement('div');
      box.className = 'ep-box';
      box.innerText = epNum;
      box.id = `ep-box-${epNum}`;
      if (String(epNum) === String(window.currentPlayingEpisodeNum)) box.classList.add('active');

      box.onclick = () => selectEpisode(index);
      epGrid.appendChild(box);
    });
  }

  function goBack() { window.location.href = '/donghua/'; }
  function goToHomeLogin() { window.location.href = '/'; }

  async function initViews() {
    if (!targetSlug || !window.db) return;
    try {
      const totalRef = window.fbRef(window.db, `views_total/${targetSlug}`);
      await window.fbTransaction(totalRef, c => (c || 0) + 1);
      const snap = await window.fbGet(totalRef);
      if (snap.exists()) document.getElementById('viewCountText').innerText = String(snap.val());
    } catch (_) {}
  }

  function toggleFavorite() {
    if (!targetSlug) return;
    let favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    const exists = favs.some(f => f.slug === targetSlug);

    if (exists) {
      favs = favs.filter(f => f.slug !== targetSlug);
      document.getElementById('btnFavorite').classList.remove('active');
    } else {
      favs.unshift({ slug: targetSlug, title: currentMainTitle, poster: currentPoster });
      document.getElementById('btnFavorite').classList.add('active');
    }
    localStorage.setItem('df_favorites', JSON.stringify(favs));
  }

  function checkFavorite() {
    const favs = JSON.parse(localStorage.getItem('df_favorites') || '[]');
    if (favs.some(f => f.slug === targetSlug)) {
      document.getElementById('btnFavorite').classList.add('active');
    }
  }

  function triggerDownload() {
    if (currentServerUrl) window.open(currentServerUrl, '_blank');
    else alert('Video belum siap.');
  }

  function triggerShare() {
    if (navigator.share) {
      navigator.share({ title: currentMainTitle, url: window.location.href }).catch(() => {});
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Tautan disalin!');
    }
  }

  async function loadComments() {
    const container = document.getElementById('commentsListContainer');
    if (!window.db || !targetSlug) {
      container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
      return;
    }

    try {
      const snap = await window.fbGet(window.fbRef(window.db, `comments/${targetSlug}`));
      if (snap.exists()) {
        const data = snap.val();
        const list = Object.values(data).reverse();
        document.getElementById('commentsCountBadge').innerText = `(${list.length})`;

        container.innerHTML = list.map(item => `
          <div class="comment-card">
            <div class="tiktok-avatar">${(item.email || 'U')[0].toUpperCase()}</div>
            <div class="comment-content">
              <div class="comment-user-row">
                <span class="tiktok-username">${item.email ? item.email.split('@')[0] : 'User'}</span>
              </div>
              <div class="comment-body-text">${item.text}</div>
              <span class="comment-time">${new Date(item.timestamp).toLocaleDateString('id-ID')}</span>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<p style="font-size:12px;color:#64748b;">Belum ada komentar.</p>';
      }
    } catch (_) {
      container.innerHTML = '<p style="font-size:12px;color:#64748b;">Gagal memuat komentar.</p>';
    }
  }

  async function submitComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text || !window.currentUser || !window.db) return;

    try {
      await window.fbSet(window.fbRef(window.db, `comments/${targetSlug}/${Date.now()}`), {
        uid: window.currentUser.uid,
        email: window.currentUser.email || '',
        text,
        timestamp: Date.now()
      });
      input.value = '';
      loadComments();
    } catch (e) {
      alert('Gagal mengirim komentar.');
    }
  }

  async function loadDetail() {
    if (!targetSlug) return;

    try {
      const catRes = await fetch('/api/donghua?path=donghua.json');
      if (catRes.ok) {
        const catalog = await catRes.json();
        const info = catalog.find(d => d.slug === targetSlug);

        if (info) {
          currentMainTitle = sanitizeTitle(info.title);
          currentPoster = info.cover || '';

          document.getElementById('topHeaderTitle').innerText = currentMainTitle;
          document.getElementById('pageTitle').innerText = `${currentMainTitle} - Dongflix`;

          const genresHtml = (Array.isArray(info.genres) ? info.genres : [])
            .map(g => `<span class="genre-pill">${g}</span>`).join('');

          document.getElementById('mediaDetailsGroup').innerHTML = `
            <div class="media-meta-card">
              <div class="media-cover-wrapper">
                <img src="${currentPoster || 'https://via.placeholder.com/150x200?text=No+Cover'}" class="media-cover-img" />
              </div>
              <div class="media-info-col">
                <h1 class="media-title">${currentMainTitle}</h1>
                <div class="genre-badges-row">${genresHtml}</div>
                <div class="status-release-row">
                  <span>Status: <strong>${info.status || 'Ongoing'}</strong></span>
                  <span>Rilis: <strong>${info.released || '-'}</strong></span>
                </div>
              </div>
            </div>
            <div class="synopsis-block">
              <div class="synopsis-heading">SINOPSIS</div>
              <p class="synopsis-text">${info.synopsis || 'Tidak ada deskripsi sinopsis.'}</p>
            </div>
          `;
        }
      }

      const epRes = await fetch(`/api/donghua?path=episodes/${encodeURIComponent(targetSlug)}.json`);
      if (epRes.ok) {
        globalEpisodes = await epRes.json();
        document.getElementById('epTotalInfo').innerText = `${globalEpisodes.length} Episode`;

        if (globalEpisodes.length > 0) {
          renderEpisodeGrid();
          selectEpisode(0);
        } else {
          document.getElementById('playerMediaContainer').innerText = 'Episode belum tersedia.';
        }
      }
    } catch (_) {}

    const hint = document.getElementById('serverHint');
    if (hint) {
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 4000);
    }

    checkFavorite();
    initViews();
    loadComments();
  }

  function selectEpisode(index) {
    closeEpisodeSheet();
    const episode = globalEpisodes[index];
    if (!episode) return;

    const epNum = episode.episode || (index + 1);
    window.currentPlayingEpisodeNum = epNum;

    document.querySelectorAll('#epGrid .ep-box').forEach(b => b.classList.remove('active'));
    const activeBox = document.getElementById(`ep-box-${epNum}`);
    if (activeBox) activeBox.classList.add('active');

    const servers = (episode.servers || []).map((s, i) => ({
      name: s.name || `Server ${i + 1}`,
      url: s.link || s.url || ''
    })).filter(s => /^https?:\/\//i.test(s.url));

    const serverSelect = document.getElementById('serverSelect');
    serverSelect.innerHTML = '';

    if (servers.length > 0) {
      servers.forEach((srv, i) => {
        const opt = document.createElement('option');
        opt.value = srv.url;
        opt.innerText = srv.name;
        if (i === 0) opt.selected = true;
        serverSelect.appendChild(opt);
      });
      currentServerUrl = servers[0].url;
      renderPlayer(servers[0].url);
    } else {
      document.getElementById('playerMediaContainer').innerText = 'Server tidak tersedia.';
    }
  }

  function switchServer(url) {
    if (url) {
      currentServerUrl = url;
      renderPlayer(url);
    }
  }

  function renderPlayer(url) {
    const box = document.getElementById('playerMediaContainer');
    box.innerHTML = `<iframe class="player-iframe" src="${url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer"></iframe>`;
  }

  function openEpisodeSheet() {
    const grid = document.getElementById('sheetEpGrid');
    grid.innerHTML = '';

    getSortedEpisodes().forEach((ep, index) => {
      const epNum = ep.episode || (index + 1);
      const box = document.createElement('div');
      box.className = `ep-box ${String(epNum) === String(window.currentPlayingEpisodeNum) ? 'active' : ''}`;
      box.innerText = epNum;
      box.onclick = () => selectEpisode(index);
      grid.appendChild(box);
    });

    document.getElementById('sheetOverlay').classList.add('active');
  }

  function closeEpisodeSheet() {
    document.getElementById('sheetOverlay').classList.remove('active');
  }

  window.onload = loadDetail;
</script>
</body>
</html>
