<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Katalog Donghua - Dongflix</title>
  
  <!-- Favicon / Ikon Web -->
  <link rel="icon" type="image/png" href="../image/IMG_6395.png">
  <link rel="apple-touch-icon" href="../image/IMG_6395.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #141416;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-movie: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      /* iOS Glass Tokens */
      --glass-bg: rgba(20, 20, 24, 0.58);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      --glass-blur: blur(16px);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      touch-action: manipulation; 
    }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      padding-top: 86px;
      padding-bottom: 50px; 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    /* FLOATING GLASS PILL HEADER (Sama persis Beranda) */
    .header-bar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform;
    }

    .header-bar > * { pointer-events: auto; }

    .pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-light-pip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 3.5px;
      background: var(--color-accent);
      border-radius: 9999px;
      box-shadow: 0 0 10px var(--color-accent), 0 0 18px var(--color-accent);
      opacity: 0.9;
      pointer-events: none;
    }

    .nav-capsule {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px;
      padding: 6px 20px;
      height: 46px;
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transform: translateZ(0);
    }

    .brand-title-capsule { 
      font-size: 22px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: -0.4px; 
      text-decoration: none; 
      display: inline-flex; 
      align-items: center;
      gap: 8px;
    }

    .brand-logo-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      background: transparent !important;
    }

    .brand-title-capsule .brand-accent { 
      color: var(--color-accent); 
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      letter-spacing: 0.2px;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6); 
    }

    .header-actions-group { display: flex; align-items: center; gap: 10px; }

    .action-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      flex-shrink: 0;
      transform: translateZ(0);
    }

    .action-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* GLASS POPOVER MENU */
    .popover-menu {
      display: none;
      position: fixed;
      top: 72px;
      right: 16px;
      background: rgba(22, 22, 26, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 18px;
      padding: 8px;
      min-width: 210px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6);
      z-index: 105;
      transform: translateZ(0);
    }

    .popover-menu.active { display: block; }
    .popover-menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
    }
    .popover-menu a svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* SEARCH MODAL */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.75); 
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 999; 
      padding: 16px; 
      overflow-y: auto; 
    }
    .modal-overlay.active { display: block; }
    .search-modal-container { max-width: 1100px; margin: 0 auto; }
    .search-modal-header { display: flex; align-items: center; gap: 10px; height: 46px; margin-bottom: 12px; }
    .search-input-box { flex: 1; position: relative; display: flex; align-items: center; height: 46px; }
    .search-input-box svg { position: absolute; left: 16px; width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2.2; }
    .search-input-field { 
      width: 100%; height: 46px; background: var(--glass-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px; padding: 0 18px 0 44px; color: var(--text-main); font-size: 14.5px; outline: none;
    }
    .modal-close-btn { 
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); 
      cursor: pointer; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .modal-close-btn svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2.2; fill: none; }
    .search-nav-pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .search-pill-btn {
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-sub);
      font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 9999px; cursor: pointer;
    }
    .search-pill-btn.active { background: rgba(56, 189, 248, 0.25); color: #fff; border-color: rgba(56, 189, 248, 0.45); }
    .search-results-list { display: flex; flex-direction: column; gap: 10px; }
    .search-item-card { 
      display: flex; gap: 14px; background: rgba(22, 22, 26, 0.65); border: 1px solid var(--glass-border); 
      border-radius: 16px; padding: 10px; cursor: pointer; text-decoration: none; 
    }
    .search-item-thumb { width: 72px; height: 98px; border-radius: 12px; flex-shrink: 0; background: var(--bg-card); border: none !important; position: relative; overflow: hidden; }
    .search-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .search-item-thumb .badge-cover-ep {
      position: absolute; bottom: 6px; left: 6px; background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: #ffffff; font-size: 9px; font-weight: 800; padding: 2.5px 8px; border-radius: 9999px;
    }

    /* SEARCH & FILTER CONTROLS */
    .catalog-top-panel {
      margin-top: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box-wrap {
      position: relative;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
    }

    .search-icon-svg {
      position: absolute;
      left: 18px;
      width: 19px;
      height: 19px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
      z-index: 5;
    }

    .search-field {
      width: 100%;
      height: 100%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px;
      padding: 0 20px 0 48px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      box-shadow: var(--glass-shadow);
      transition: border-color 0.2s;
      position: relative;
      z-index: 1;
    }

    .search-field::placeholder { color: #9ca3af; }

    .search-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    /* BARIS FILTER TIPE */
    .filter-pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .filter-pills-row::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 15px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .filter-pill.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.45);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    /* BARIS PEMILIHAN KATEGORI / GENRE */
    .category-pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .category-pills-row::-webkit-scrollbar { display: none; }

    .category-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      color: #9ca3af;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .category-pill:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .category-pill.active {
      background: rgba(2, 132, 199, 0.3);
      border-color: rgba(56, 189, 248, 0.5);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .catalog-count-info {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 18px;
      padding-left: 2px;
    }

    /* CARD GRID */
    .grid-catalog { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      column-gap: 10px; 
      row-gap: 22px; 
    }

    .card-grid { 
      text-decoration: none !important; 
      border: none !important; 
      display: block;
    }

    .card-grid-img-wrapper { 
      position: relative; 
      width: 100%; 
      height: 180px; 
      border-radius: 14px; 
      overflow: hidden; 
      background: var(--bg-card); 
      border: none !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-grid-img-wrapper img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    .badge-ep { 
      position: absolute; 
      top: 8px; 
      left: 8px; 
      background: rgba(2, 132, 199, 0.9);
      color: var(--text-main); 
      font-size: 9px; 
      font-weight: 800; 
      padding: 3.5px 9px; 
      border-radius: 9999px; 
      text-transform: uppercase; 
    }

    .card-bottom-info {
      position: absolute; 
      bottom: 8px; 
      left: 8px; 
      right: 8px;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 2; 
      pointer-events: none;
    }

    .badge-bottom { 
      background: var(--glass-bg); 
      backdrop-filter: var(--glass-blur); 
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); 
      border-top: 1px solid var(--glass-border-top); 
      color: #ffffff; 
      font-size: 9.5px; 
      font-weight: 800; 
      padding: 3px 9px; 
      border-radius: 9999px; 
      white-space: nowrap; 
    }

    .card-title { 
      margin-top: 8px; 
      font-size: 13.5px; 
      font-weight: 700; 
      color: #ffffff; 
      line-height: 1.35;
      display: -webkit-box; 
      -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
    }

    /* TOMBOL MUAT LEBIH BANYAK */
    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }
    .btn-load-more {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-load-more:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* SKELETON PLACEHOLDER */
    @keyframes skeletonPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    .skeleton { background-color: var(--bg-skeleton); animation: skeletonPulse 1.5s infinite ease-in-out; border-radius: 8px; border: none !important; }
    .card-skeleton { width: 100%; }
    .card-skeleton-img { width: 100%; height: 180px; border-radius: 14px; margin-bottom: 8px; border: none !important; }
    .card-skeleton-title { height: 14px; width: 85%; margin-bottom: 4px; }

    /* FLOATING ON-TOP */
    .bottom-floating-controls { position: fixed; bottom: 24px; right: 18px; z-index: 95; }
    .floating-circle-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; visibility: hidden; transition: opacity 0.2s, transform 0.2s;
    }
    .floating-circle-btn.show { opacity: 1; visibility: visible; }
    .floating-circle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    @media (min-width: 768px) {
      .grid-catalog { grid-template-columns: repeat(6, 1fr); column-gap: 16px; row-gap: 28px; }
      .card-grid-img-wrapper, .card-skeleton-img { height: 235px; }
      .card-title { font-size: 14.5px; margin-top: 10px; }
    }

    footer { margin-top: 60px; padding: 26px 16px; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 13px; }
    footer a { color: var(--color-accent); text-decoration: none; }
  </style>
</head>
<body>

  <!-- FLOATING GLASS PILL HEADER (Persis Beranda + Logo Lokal) -->
  <header class="header-bar">
    <div class="pill-wrapper">
      <div class="top-light-pip"></div>
      <div class="nav-capsule" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <a href="/" class="brand-title-capsule">
          <img src="../image/IMG_6395.png" alt="Logo" class="brand-logo-icon" style="width:24px; height:24px; object-fit:contain; vertical-align:middle;">
          <span>Dong<span class="brand-accent" style="font-family:'Outfit',sans-serif;">flix</span></span>
        </a>
      </div>
    </div>

    <div class="header-actions-group">
      <button class="action-btn" onclick="openSearchModal()" aria-label="Cari Donghua">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="action-btn" id="socialMenuBtn" onclick="togglePopoverMenu()" aria-label="Menu Navigasi">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <!-- GLASS POPOVER MENU -->
  <div class="popover-menu" id="popoverMenu">
    <a href="/"><span>Beranda</span><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
    <a href="/donghua/"><span>Katalog Lengkap</span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></a>
    <a href="/donghua/"><span>Donghua Terbaru</span><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg></a>
    <a href="/donghua/?type=movie"><span>Movie Terbaru</span><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg></a>
  </div>

  <!-- SEARCH MODAL -->
  <div class="modal-overlay" id="searchModalOverlay">
    <div class="search-modal-container">
      <div class="search-modal-header">
        <div class="search-input-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" class="search-input-field" id="searchInputModal" placeholder="Cari donghua atau movie..." onkeyup="handleModalSearchInput(event)">
        </div>
        <button class="modal-close-btn" onclick="closeSearchModal()" aria-label="Tutup Pencarian">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="search-nav-pills">
        <button class="search-pill-btn active" id="searchPillAll" onclick="setModalSearchFilter('all')">Semua</button>
        <button class="search-pill-btn" id="searchPillSeries" onclick="setModalSearchFilter('series')">Series</button>
        <button class="search-pill-btn" id="searchPillMovie" onclick="setModalSearchFilter('movie')">Movie</button>
      </div>

      <div class="search-results-list" id="searchResultsList">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="catalog-top-panel">
      <!-- PENCARIAN -->
      <div class="search-box-wrap">
        <svg class="search-icon-svg" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-field" id="catalogSearchInput" placeholder="Cari judul di katalog..." onkeyup="handleFilterChange()">
      </div>

      <!-- FILTER TIPE -->
      <div class="filter-pills-row">
        <button class="filter-pill active" id="pillAll" onclick="setCatalogType('all')">Semua</button>
        <button class="filter-pill" id="pillSeries" onclick="setCatalogType('series')">Series</button>
        <button class="filter-pill" id="pillOngoing" onclick="setCatalogType('ongoing')">Ongoing</button>
        <button class="filter-pill" id="pillCompleted" onclick="setCatalogType('completed')">Tamat</button>
        <button class="filter-pill" id="pillMovie" onclick="setCatalogType('movie')">Movie</button>
      </div>

      <!-- PEMILIHAN KATEGORI / GENRE -->
      <div class="category-pills-row" id="categoryPillsRow">
        <button class="category-pill active" onclick="setCategoryFilter('')">Semua Genre</button>
        <button class="category-pill" onclick="setCategoryFilter('Action')">Action</button>
        <button class="category-pill" onclick="setCategoryFilter('Adventure')">Adventure</button>
        <button class="category-pill" onclick="setCategoryFilter('Fantasy')">Fantasy</button>
        <button class="category-pill" onclick="setCategoryFilter('Cultivation')">Cultivation</button>
        <button class="category-pill" onclick="setCategoryFilter('Martial Arts')">Martial Arts</button>
        <button class="category-pill" onclick="setCategoryFilter('Romance')">Romance</button>
        <button class="category-pill" onclick="setCategoryFilter('Sci-Fi')">Sci-Fi</button>
        <button class="category-pill" onclick="setCategoryFilter('Comedy')">Comedy</button>
        <button class="category-pill" onclick="setCategoryFilter('Supernatural')">Supernatural</button>
        <button class="category-pill" onclick="setCategoryFilter('Historical')">Historical</button>
        <button class="category-pill" onclick="setCategoryFilter('Isekai')">Isekai</button>
        <button class="category-pill" onclick="setCategoryFilter('Mystery')">Mystery</button>
      </div>
    </div>

    <div class="catalog-count-info" id="catalogCountInfo">Menampilkan koleksi donghua...</div>

    <!-- GRID KATALOG -->
    <div class="grid-catalog" id="catalogGrid">
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
      <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div></div>
    </div>

    <!-- TOMBOL MUAT LEBIH BANYAK -->
    <div class="load-more-wrap" id="loadMoreContainer" style="display: none;">
      <button class="btn-load-more" onclick="loadMoreItems()">Muat Lebih Banyak</button>
    </div>
  </div>

  <aside class="bottom-floating-controls">
    <button class="floating-circle-btn" id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Kembali ke atas">
      <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </aside>

  <footer>
    <div class="container">
      <p>&copy; 2026 Dongflix.my.id. Seluruh hak cipta dilindungi.</p>
    </div>
  </footer>

  <script>
    let masterList = [];
    let filteredList = [];
    let displayedCount = 0;
    const pageSize = 18;
    let currentTypeFilter = 'all';
    let currentCategoryFilter = '';
    let searchTimer = null;
    let modalSearchType = 'all';

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) return str.slice(0, half).trim();
      return str;
    }

    function isMovieItem(item) {
      if (!item) return false;
      const typeStr = (item.type || '').toString().toLowerCase();
      const titleStr = `${item.title || ''} ${item.slug || ''}`.toLowerCase();
      return typeStr === 'movie' || titleStr.includes('movie');
    }

    function parseStatusText(item) {
      const rawStatus = (item.status || item.type || '').toString().toLowerCase();
      return (rawStatus.includes('completed') || rawStatus.includes('tamat') || rawStatus.includes('end')) ? 'COMPLETED' : 'ONGOING';
    }

    function parseEpisodeText(item) {
      if (!item) return 'Ep 1';
      if (isMovieItem(item)) return 'MOVIE';
      return item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep 1');
    }

    function getImageUrl(item) {
      return item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
    }

    function togglePopoverMenu() {
      document.getElementById('popoverMenu').classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
      const popover = document.getElementById('popoverMenu');
      const btn = document.getElementById('socialMenuBtn');
      if (popover && btn && !btn.contains(e.target) && !popover.contains(e.target)) popover.classList.remove('active');
    });

    function openSearchModal() { document.getElementById('searchModalOverlay').classList.add('active'); document.getElementById('searchInputModal').focus(); }
    function closeSearchModal() { document.getElementById('searchModalOverlay').classList.remove('active'); }

    function setModalSearchFilter(type) {
      modalSearchType = type;
      document.getElementById('searchPillAll').classList.toggle('active', type === 'all');
      document.getElementById('searchPillSeries').classList.toggle('active', type === 'series');
      document.getElementById('searchPillMovie').classList.toggle('active', type === 'movie');
      handleModalSearchInput();
    }

    function handleModalSearchInput() {
      const inputEl = document.getElementById('searchInputModal');
      const query = inputEl ? inputEl.value.trim().toLowerCase() : '';
      const resultsList = document.getElementById('searchResultsList');

      clearTimeout(searchTimer);
      if (query === '') {
        resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>';
        return;
      }

      searchTimer = setTimeout(() => {
        const searchItems = masterList.filter(item => {
          const titleStr = (item.title || item.name || '').toLowerCase();
          const slugStr = (item.slug || '').toLowerCase();
          const matches = titleStr.includes(query) || slugStr.includes(query);
          if (!matches) return false;
          if (modalSearchType === 'movie') return isMovieItem(item);
          if (modalSearchType === 'series') return !isMovieItem(item);
          return true;
        });

        resultsList.innerHTML = '';
        if (searchItems.length > 0) {
          searchItems.forEach(item => {
            const card = document.createElement('a');
            card.className = 'search-item-card';
            card.href = `/donghua/${encodeURIComponent(item.slug)}`;
            card.innerHTML = `
              <div class="search-item-thumb">
                <img src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
                <span class="badge-cover-ep">${parseEpisodeText(item)}</span>
              </div>
              <div class="search-item-info">
                <div class="search-item-title" style="font-size: 14px; font-weight: 800; color: #fff;">${sanitizeTitle(item.title)}</div>
                <div class="search-item-desc" style="font-size: 11.5px; color: #94a3b8; margin-top: 4px;">Status: ${parseStatusText(item)} • ${isMovieItem(item) ? 'Movie' : 'Donghua'}</div>
              </div>
            `;
            resultsList.appendChild(card);
          });
        } else {
          resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Tidak ditemukan hasil yang cocok.</p>';
        }
      }, 150);
    }

    window.addEventListener('scroll', () => {
      const onTopBtn = document.getElementById('backToTopBtn');
      if (window.scrollY > 300) onTopBtn.classList.add('show');
      else onTopBtn.classList.remove('show');
    }, { passive: true });

    function setCatalogType(type) {
      currentTypeFilter = type;
      document.getElementById('pillAll').classList.toggle('active', type === 'all');
      document.getElementById('pillSeries').classList.toggle('active', type === 'series');
      document.getElementById('pillOngoing').classList.toggle('active', type === 'ongoing');
      document.getElementById('pillCompleted').classList.toggle('active', type === 'completed');
      document.getElementById('pillMovie').classList.toggle('active', type === 'movie');
      updateUrlState();
      handleFilterChange();
    }

    function setCategoryFilter(category) {
      currentCategoryFilter = category;
      const buttons = document.querySelectorAll('#categoryPillsRow .category-pill');
      buttons.forEach(btn => {
        if (!category && btn.innerText === 'Semua Genre') {
          btn.classList.add('active');
        } else if (category && btn.innerText.toLowerCase() === category.toLowerCase()) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      updateUrlState();
      handleFilterChange();
    }

    function updateUrlState() {
      const params = new URLSearchParams();
      if (currentTypeFilter && currentTypeFilter !== 'all') {
        params.set('type', currentTypeFilter);
      }
      if (currentCategoryFilter) {
        params.set('category', currentCategoryFilter);
      }
      const newQuery = params.toString();
      const newUrl = window.location.pathname + (newQuery ? '?' + newQuery : '');
      window.history.replaceState({}, '', newUrl);
    }

    function createGridCard(item) {
      const card = document.createElement('a');
      card.className = 'card-grid';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;
      const isMovie = isMovieItem(item);

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
          <span class="badge-ep">${isMovie ? 'MOVIE' : parseStatusText(item)}</span>
          <div class="card-bottom-info">
            <span class="badge-bottom">${isMovie ? parseStatusText(item) : parseEpisodeText(item)}</span>
          </div>
        </div>
        <div class="card-title">${sanitizeTitle(item.title)}</div>
      `;
      return card;
    }

    function handleFilterChange() {
      const query = (document.getElementById('catalogSearchInput').value || '').trim().toLowerCase();

      filteredList = masterList.filter(item => {
        const titleStr = (item.title || item.name || '').toLowerCase();
        const slugStr = (item.slug || '').toLowerCase();
        const matchesQuery = titleStr.includes(query) || slugStr.includes(query);
        if (!matchesQuery) return false;

        const isMovie = isMovieItem(item);
        const status = parseStatusText(item);
        if (currentTypeFilter === 'movie' && !isMovie) return false;
        if (currentTypeFilter === 'series' && isMovie) return false;
        if (currentTypeFilter === 'ongoing' && (status !== 'ONGOING' || isMovie)) return false;
        if (currentTypeFilter === 'completed' && (status !== 'COMPLETED' || isMovie)) return false;

        if (currentCategoryFilter) {
          const catLower = currentCategoryFilter.toLowerCase();
          const genres = Array.isArray(item.genres) 
            ? item.genres 
            : (typeof item.genres === 'string' ? item.genres.split(/[,•/]/).map(g => g.trim()) : []);
          
          const hasCategory = genres.some(g => g && g.toLowerCase() === catLower);
          if (!hasCategory) return false;
        }

        return true;
      });

      displayedCount = 0;
      document.getElementById('catalogGrid').innerHTML = '';
      renderCatalogBatch();
    }

    function renderCatalogBatch() {
      const grid = document.getElementById('catalogGrid');
      const countInfo = document.getElementById('catalogCountInfo');
      const loadMoreWrap = document.getElementById('loadMoreContainer');

      countInfo.innerText = `Menampilkan ${filteredList.length} judul`;

      const nextBatch = filteredList.slice(displayedCount, displayedCount + pageSize);
      if (displayedCount === 0 && nextBatch.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; grid-column: 1 / -1; text-align: center; padding: 40px 0;">Tidak ditemukan donghua yang sesuai.</p>';
        loadMoreWrap.style.display = 'none';
        return;
      }

      nextBatch.forEach(item => {
        grid.appendChild(createGridCard(item));
      });

      displayedCount += nextBatch.length;

      if (displayedCount < filteredList.length) {
        loadMoreWrap.style.display = 'flex';
      } else {
        loadMoreWrap.style.display = 'none';
      }
    }

    function loadMoreItems() {
      renderCatalogBatch();
    }

    function initParams() {
      const params = new URLSearchParams(window.location.search);
      
      const type = params.get('type');
      if (type && ['all', 'series', 'ongoing', 'completed', 'movie'].includes(type.toLowerCase())) {
        currentTypeFilter = type.toLowerCase();
        document.getElementById('pillAll').classList.toggle('active', currentTypeFilter === 'all');
        document.getElementById('pillSeries').classList.toggle('active', currentTypeFilter === 'series');
        document.getElementById('pillOngoing').classList.toggle('active', currentTypeFilter === 'ongoing');
        document.getElementById('pillCompleted').classList.toggle('active', currentTypeFilter === 'completed');
        document.getElementById('pillMovie').classList.toggle('active', currentTypeFilter === 'movie');
      }

      const category = params.get('category');
      if (category) {
        currentCategoryFilter = category.trim();
        const buttons = document.querySelectorAll('#categoryPillsRow .category-pill');
        buttons.forEach(btn => {
          if (btn.innerText.toLowerCase() === currentCategoryFilter.toLowerCase()) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }
    }

    async function loadCatalogData() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error();
        masterList = await res.json();
        initParams();
        handleFilterChange();
      } catch (_) {
        document.getElementById('catalogGrid').innerHTML = '<p style="color: #ef4444; font-size: 13px; grid-column: 1 / -1; text-align: center; padding: 40px 0;">Gagal memuat katalog donghua.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadCatalogData);
  </script>
</body>
</html>
