<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  
  <title id="metaTitle">Koleksi Donghua - Dongflix</title>
  <meta name="description" id="metaDesc" content="Nonton streaming donghua subtitle Indonesia update terbaru kualitas HD gratis di Dongflix.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" id="metaCanonical" href="https://dongflix.my.id/donghua/">

  <meta property="og:type" content="video.tv_show">
  <meta property="og:title" id="ogTitle" content="Koleksi Donghua - Dongflix">
  <meta property="og:description" id="ogDesc" content="Nonton streaming donghua subtitle Indonesia terlengkap di Dongflix.">
  <meta property="og:image" id="ogImage" content="">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Navbar -->
    <header class="flex items-center justify-between pb-5 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <a href="/" class="text-2xl font-extrabold bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
          Dongflix
        </a>
        <span class="text-[10px] bg-slate-900 border border-slate-800 text-cyan-400 px-2 py-0.5 rounded font-mono">
          Streaming
        </span>
      </div>

      <div class="flex items-center gap-3">
        <a href="/" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 transition">
          Beranda
        </a>
        <a href="/donghua/" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 transition">
          Katalog
        </a>
        <a href="/admin/" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 transition">
          Admin
        </a>
      </div>
    </header>

    <!-- VIEW 1: PLAYER & DETAIL (/donghua/:slug) -->
    <section id="detailView" class="hidden space-y-6">
      <div>
        <a href="/donghua/" class="text-xs text-cyan-400 hover:underline inline-flex items-center gap-1.5 font-medium">
          ← Kembali ke Semua Koleksi
        </a>
      </div>

      <!-- Player Frame -->
      <div id="playerSection" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
        <div class="aspect-video w-full bg-black relative">
          
          <!-- Mode 1: Native HTML5 Video (dfplayer - 100% Bebas Iklan) -->
          <video 
            id="dfVideoPlayer" 
            controls 
            playsinline 
            class="hidden w-full h-full object-contain bg-black focus:outline-none"
          ></video>

          <!-- Mode 2: Iframe Embed (Sandbox Ketat: Anti-Popup & Anti-Redirect) -->
          <iframe 
  id="videoIframe" 
  src="" 
  class="w-full h-full border-0" 
  allowfullscreen 
  sandbox="allow-forms allow-scripts allow-same-origin allow-presentation allow-popups-to-escape-sandbox"
></iframe>


          <!-- Placeholder -->
          <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 p-6 text-center">
            <p class="text-sm text-slate-400" id="playerMessage">Pilih episode di bawah untuk memutar video.</p>
          </div>
        </div>

        <!-- Controls: Info, Server Selector, & Quality Selector -->
        <div class="p-4 bg-slate-950/80 border-t border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <span class="text-[10px] uppercase tracking-wider text-cyan-400 font-bold block">Sedang Diputar</span>
            <h2 id="currentEpTitle" class="text-sm font-semibold text-white">Belum ada episode dipilih</h2>
          </div>

          <div class="flex items-center gap-2">
            <!-- Pilihan Server -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="serverContainer"></div>

            <!-- Dropdown Resolusi (Hanya aktif saat dfplayer berjalan) -->
            <select 
              id="qualitySelect" 
              onchange="changeQuality(this.value)" 
              class="hidden bg-slate-900 border border-slate-700 text-cyan-400 text-xs px-2.5 py-1.5 rounded-lg focus:outline-none"
            >
            </select>
          </div>
        </div>
      </div>

      <!-- Layout 2 Kolom: Detail & List Episode -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Info Donghua -->
        <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-5">
          <div class="flex gap-5">
            <img id="detailCover" src="" class="w-24 sm:w-32 aspect-[3/4] object-cover rounded-xl border border-slate-800 shrink-0">
            <div class="space-y-2">
              <h1 id="detailTitle" class="text-xl sm:text-2xl font-bold text-white leading-tight"></h1>
              <div class="flex flex-wrap gap-2 text-xs">
                <span id="detailStatus" class="px-2.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"></span>
                <span id="detailEpBadge" class="px-2.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20"></span>
                <span id="detailReleased" class="px-2.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700"></span>
              </div>
              <div id="detailGenres" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>
          </div>

          <hr class="border-slate-800">

          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Sinopsis</h3>
            <p id="detailSynopsis" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line"></p>
          </div>
        </div>

        <!-- Panel Episode -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 flex flex-col h-[520px]">
          <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
              <span>Daftar Episode</span>
              <span id="epTotalCount" class="text-xs text-cyan-400 font-normal"></span>
            </h3>
            <input 
              id="searchEpInput" 
              oninput="filterEpisodeList()" 
              type="text" 
              placeholder="Cari ep..." 
              class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white w-24 focus:outline-none focus:border-cyan-500"
            >
          </div>

          <div id="episodesList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>

      </div>
    </section>

    <!-- VIEW 2: KATALOG (/donghua/) -->
    <section id="listView" class="space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">Semua Donghua</h1>
          <p class="text-xs text-slate-400 mt-1">Daftar arsip serial animasi China subtitle Indonesia lengkap.</p>
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <input 
            id="searchInput" 
            oninput="applyFilters()" 
            type="text" 
            placeholder="Cari judul..." 
            class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white flex-1 sm:w-64 focus:outline-none focus:border-cyan-500"
          >
          <select 
            id="statusFilter" 
            onchange="applyFilters()" 
            class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-cyan-500"
          >
            <option value="ALL">Semua Status</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </div>

      <div class="text-xs text-slate-500" id="totalCounter">Memuat koleksi...</div>
      <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </section>

  </div>

  <script>
    // ================= SCRIPT ANTI-POPUP & REDIRECT =================
    // Blokir trigger pembukaan window baru / popunder
    window.open = function () {
      console.warn('Pop-up window.open otomatis dicegah.');
      return null;
    };

    // Cegah klik target blank liar di luar kontrol resmi
    document.addEventListener('click', function (e) {
      const link = e.target.closest('a');
      if (link && link.target === '_blank') {
        const href = link.getAttribute('href') || '';
        if (!href.startsWith('/') && !href.includes(window.location.hostname)) {
          e.preventDefault();
          console.warn('Redirect external tab dicegah:', href);
        }
      }
    }, true);

    // ================= STATE & LOGIKA APLIKASI =================
    let allData = [];
    let currentEpisodes = [];
    let selectedEpIndex = 0;
    let selectedServerIndex = 0;

    async function init() {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const isSlugView = pathSegments.length >= 2 && pathSegments[0] === 'donghua';
      const targetSlug = isSlugView ? pathSegments[1] : null;

      try {
        const res = await fetch('/donghua/donghua.json?nocache=' + Date.now());
        if (!res.ok) throw new Error('Database katalog belum tersedia');
        allData = await res.json();

        if (targetSlug) {
          showDetail(targetSlug);
        } else {
          showCatalog(allData);
        }
      } catch (err) {
        document.getElementById('catalogGrid').innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
            Database belum siap. Buka admin panel untuk scrape katalog terlebih dahulu.
          </div>
        `;
      }
    }

    async function showDetail(slug) {
      const item = allData.find(d => d.slug === slug);
      const detailView = document.getElementById('detailView');
      const listView = document.getElementById('listView');

      if (!item) {
        detailView.classList.remove('hidden');
        listView.classList.add('hidden');
        document.getElementById('detailTitle').innerText = 'Donghua Tidak Ditemukan';
        return;
      }

      detailView.classList.remove('hidden');
      listView.classList.add('hidden');

      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailCover').src = item.cover || 'https://via.placeholder.com/300x400';
      document.getElementById('detailStatus').innerText = item.status || 'Ongoing';
      document.getElementById('detailEpBadge').innerText = item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || '-');
      document.getElementById('detailReleased').innerText = item.released && item.released !== '-' ? `Rilis: ${item.released}` : 'Rilis: Terbaru';
      document.getElementById('detailSynopsis').innerText = item.synopsis || 'Sinopsis belum tersedia.';

      const genres = item.genres && item.genres.length > 0 ? item.genres : ['Donghua', '3D Animation'];
      document.getElementById('detailGenres').innerHTML = genres.map(g => `
        <span class="bg-slate-800 text-cyan-300 text-[11px] px-2 py-0.5 rounded border border-slate-700 font-medium">
          ${g}
        </span>
      `).join('');

      const pageTitle = `Nonton ${item.title} Sub Indo - Dongflix`;
      document.title = pageTitle;
      document.getElementById('metaTitle').innerText = pageTitle;
      document.getElementById('metaCanonical').href = `https://dongflix.my.id/donghua/${item.slug}`;

      await loadEpisodes(item.slug);
    }

    async function loadEpisodes(slug) {
      const listContainer = document.getElementById('episodesList');
      listContainer.innerHTML = '<div class="text-xs text-slate-500 py-6 text-center">Memuat episode...</div>';

      try {
        const res = await fetch(`/donghua/episodes/${slug}.json?t=` + Date.now());
        if (!res.ok) throw new Error();
        currentEpisodes = await res.json();

        if (currentEpisodes.length === 0) throw new Error();

        document.getElementById('epTotalCount').innerText = `(${currentEpisodes.length} Ep)`;
        renderEpisodeList(currentEpisodes);
        playEpisode(0);
      } catch (err) {
        document.getElementById('epTotalCount').innerText = '(0 Ep)';
        listContainer.innerHTML = `
          <div class="py-12 text-center text-xs text-slate-500 border border-dashed border-slate-800 rounded-xl p-3">
            Video episode belum discrape.<br>
            Buka menu <strong>Admin</strong> untuk scrape episode & server.
          </div>
        `;
        document.getElementById('playerMessage').innerText = 'Video belum tersedia untuk judul ini.';
      }
    }

    function renderEpisodeList(epList) {
      const listContainer = document.getElementById('episodesList');
      listContainer.innerHTML = epList.map((ep, idx) => `
        <button 
          onclick="playEpisode(${idx})" 
          id="epBtn-${idx}"
          class="w-full text-left p-3 rounded-xl border transition flex items-center justify-between text-xs ${
            idx === selectedEpIndex 
              ? 'bg-cyan-600/20 border-cyan-500 text-cyan-300' 
              : 'bg-slate-950/60 border-slate-800 hover:border-slate-700 text-slate-300'
          }"
        >
          <div class="line-clamp-1 font-medium">
            <span class="font-bold text-white mr-1.5">Ep ${ep.episode}</span>
            <span class="text-slate-400">${ep.title}</span>
          </div>
          <span class="text-[10px] text-slate-500 shrink-0 ml-2 font-mono">${ep.date || ''}</span>
        </button>
      `).join('');
    }

    function filterEpisodeList() {
      const q = document.getElementById('searchEpInput').value.toLowerCase();
      const filtered = currentEpisodes.filter(e => 
        e.title.toLowerCase().includes(q) || String(e.episode).toLowerCase().includes(q)
      );
      renderEpisodeList(filtered);
    }

    function playEpisode(index) {
      selectedEpIndex = index;
      selectedServerIndex = 0;
      const ep = currentEpisodes[index];
      if (!ep) return;

      currentEpisodes.forEach((_, i) => {
        const btn = document.getElementById(`epBtn-${i}`);
        if (btn) {
          btn.className = (i === index)
            ? 'w-full text-left p-3 rounded-xl border transition flex items-center justify-between text-xs bg-cyan-600/20 border-cyan-500 text-cyan-300'
            : 'w-full text-left p-3 rounded-xl border transition flex items-center justify-between text-xs bg-slate-950/60 border-slate-800 hover:border-slate-700 text-slate-300';
        }
      });

      document.getElementById('currentEpTitle').innerText = ep.title;

      const serverBox = document.getElementById('serverContainer');
      const servers = ep.servers || [];

      if (servers.length === 0) {
        serverBox.innerHTML = '<span class="text-xs text-rose-400">Tidak ada server video</span>';
        document.getElementById('videoIframe').src = '';
        document.getElementById('dfVideoPlayer').src = '';
        document.getElementById('qualitySelect').classList.add('hidden');
        document.getElementById('playerPlaceholder').classList.remove('hidden');
        document.getElementById('playerMessage').innerText = 'Tidak ada link player aktif pada episode ini.';
        return;
      }

      serverBox.innerHTML = servers.map((srv, sIdx) => `
        <button 
          onclick="switchServer(${sIdx})"
          id="srvBtn-${sIdx}"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 transition ${
            sIdx === 0 
              ? 'bg-cyan-500 text-slate-950' 
              : 'bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800'
          }"
        >
          ${srv.name || `Server ${sIdx + 1}`}
        </button>
      `).join('');

      switchServer(0);
    }

    function switchServer(serverIndex) {
      selectedServerIndex = serverIndex;
      const ep = currentEpisodes[selectedEpIndex];
      const srv = ep?.servers?.[serverIndex];

      if (!srv || !srv.link) return;

      ep.servers.forEach((_, idx) => {
        const sBtn = document.getElementById(`srvBtn-${idx}`);
        if (sBtn) {
          sBtn.className = (idx === serverIndex)
            ? 'px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 transition bg-cyan-500 text-slate-950'
            : 'px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0 transition bg-slate-900 text-slate-300 border border-slate-800 hover:bg-slate-800';
        }
      });

      const dfPlayer = document.getElementById('dfVideoPlayer');
      const iframePlayer = document.getElementById('videoIframe');
      const placeholder = document.getElementById('playerPlaceholder');
      const qualitySelect = document.getElementById('qualitySelect');

      placeholder.classList.add('hidden');

      if (srv.name.toLowerCase() === 'dfplayer' || srv.type === 'direct') {
        iframePlayer.classList.add('hidden');
        iframePlayer.src = '';

        if (srv.qualities && srv.qualities.length > 0) {
          qualitySelect.classList.remove('hidden');
          qualitySelect.innerHTML = srv.qualities.map((q) => `
            <option value="${q.url}">${q.resolution}</option>
          `).join('');
        } else {
          qualitySelect.classList.add('hidden');
        }

        dfPlayer.classList.remove('hidden');
        dfPlayer.src = srv.link;
        dfPlayer.load();
        dfPlayer.play().catch(() => {});
      } else {
        qualitySelect.classList.add('hidden');

        dfPlayer.pause();
        dfPlayer.classList.add('hidden');
        dfPlayer.src = '';

        iframePlayer.classList.remove('hidden');
        iframePlayer.src = srv.link;
      }
    }

    function changeQuality(newUrl) {
      const dfPlayer = document.getElementById('dfVideoPlayer');
      const currentTime = dfPlayer.currentTime;
      const isPaused = dfPlayer.paused;

      dfPlayer.src = newUrl;
      dfPlayer.currentTime = currentTime;

      if (!isPaused) {
        dfPlayer.play().catch(() => {});
      }
    }

    function showCatalog(items) {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('totalCounter').innerText = `Menampilkan ${items.length} dari total ${allData.length} donghua`;

      const grid = document.getElementById('catalogGrid');
      if (items.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500">Tidak ada donghua yang cocok.</div>';
        return;
      }

      grid.innerHTML = items.map(item => `
        <a href="/donghua/${item.slug}" class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col hover:border-slate-700 transition">
          <div class="aspect-[3/4] w-full bg-slate-800 relative overflow-hidden">
            <img 
              src="${item.cover || 'https://via.placeholder.com/300x400'}" 
              alt="${item.title}" 
              class="w-full h-full object-cover group-hover:scale-105 transition duration-300" 
              loading="lazy"
            >
            <span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-[10px] text-cyan-400 font-semibold px-2 py-0.5 rounded">
              ${item.type || 'Donghua'}
            </span>
            <span class="absolute bottom-2 right-2 bg-blue-600/90 backdrop-blur-md text-[10px] text-white font-medium px-1.5 py-0.5 rounded">
              ${item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || '-')}
            </span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <h3 class="text-xs font-semibold text-slate-200 line-clamp-2 leading-snug group-hover:text-cyan-400 transition" title="${item.title}">
              ${item.title}
            </h3>
            <span class="text-[11px] text-emerald-400 font-medium mt-2">
              ${item.status || 'Ongoing'}
            </span>
          </div>
        </a>
      `).join('');
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = allData.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(q);
        const matchesStatus = status === 'ALL' || (item.status && item.status.toLowerCase() === status.toLowerCase());
        return matchesQuery && matchesStatus;
      });

      showCatalog(filtered);
    }

    init();
  </script>
</body>
</html>
