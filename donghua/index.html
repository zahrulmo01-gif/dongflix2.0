  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #141416;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      
      --glass-bg: rgba(20, 20, 24, 0.85);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      --glass-blur: blur(16px);
    }

    /* === ATURAN PLATFORM: IOS FULL GLASS VS ANDROID OPTIMIZED === */
    @supports (-webkit-touch-callout: none) {
      /* PENGATURAN KHUSUS iOS (iPhone / iPad): SEMUANYA FULL GLASS */
      :root {
        --glass-bg: rgba(20, 20, 24, 0.58);
      }
      .nav-capsule, .action-btn-home, .search-input-field, .filter-pill, .badge-bottom, .btn-load-more, .floating-circle-btn {
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }
    }

    @supports not (-webkit-touch-callout: none) {
      /* PENGATURAN KHUSUS ANDROID / NON-IOS: BLUR HANYA PADA PILL HEADER & ONTOP (FLOATING) */
      .nav-capsule, .action-btn-home, .floating-circle-btn {
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
      }
      /* Komponen lain menggunakan warna solid transparan murni tanpa blur */
      .search-input-field, .filter-pill, .badge-bottom, .btn-load-more {
        background: #141418;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      padding-top: 82px;
      padding-bottom: 50px; 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    /* HEADER */
    .header-bar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform;
    }

    .header-bar > * { pointer-events: auto; }

    .pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .top-light-pip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 3.5px;
      background: var(--color-accent);
      border-radius: 9999px;
      box-shadow: 0 0 10px var(--color-accent), 0 0 18px var(--color-accent);
      opacity: 0.9;
      pointer-events: none;
    }

    .nav-capsule {
      display: flex;
      align-items: center;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px;
      padding: 6px 20px;
      height: 46px;
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      text-decoration: none;
      transform: translateZ(0);
    }

    .brand-title-capsule { 
      font-size: 22px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: -0.4px; 
      text-decoration: none; 
      display: inline-flex; 
      align-items: center;
      gap: 8px;
    }

    .brand-logo-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      background: transparent !important;
    }

    .brand-title-capsule .brand-accent { 
      color: var(--color-accent); 
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      letter-spacing: 0.2px;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6); 
    }

    .action-btn-home {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      flex-shrink: 0;
      text-decoration: none;
      transform: translateZ(0);
    }

    .action-btn-home svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* CONTROLS AREA */
    .controls-panel {
      margin-top: 10px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* INPUT PENCARIAN */
    .search-input-box { 
      position: relative; 
      display: flex; 
      align-items: center; 
      height: 46px; 
      width: 100%;
    }
    .search-input-box svg { 
      position: absolute; 
      left: 16px; 
      width: 18px; 
      height: 18px; 
      stroke: #94a3b8 !important; 
      fill: none !important; 
      stroke-width: 2.4; 
      pointer-events: none; 
      z-index: 10;
      display: block !important;
    }
    .search-input-field { 
      width: 100%; 
      height: 46px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 9999px; 
      padding: 0 18px 0 46px; 
      color: #ffffff; 
      font-size: 14px; 
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input-field:focus { border-color: var(--color-accent); }

    /* BARIS FILTER SCROLL */
    .filter-scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }
    .filter-scroll-row::-webkit-scrollbar { display: none; }

    .filter-pill {
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      padding: 6.5px 14px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .filter-pill.active {
      background: rgba(56, 189, 248, 0.25) !important;
      border-color: rgba(56, 189, 248, 0.5) !important;
      color: #ffffff !important;
    }

    .catalog-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .catalog-total-badge { 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--color-accent); 
      background: rgba(56, 189, 248, 0.14); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      padding: 3px 10px; 
      border-radius: 9999px; 
    }

    /* CARD GRID */
    .grid-catalog { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 10px; row-gap: 22px; }
    .card-grid { text-decoration: none !important; }
    .card-grid-img-wrapper { 
      position: relative; 
      width: 100%; 
      height: 180px; 
      border-radius: 14px; 
      overflow: hidden; 
      background: var(--bg-card); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-grid-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { 
      position: absolute; top: 8px; left: 8px; 
      background: rgba(2, 132, 199, 0.9);
      color: var(--text-main); font-size: 9px; font-weight: 800; 
      padding: 3.5px 9px; border-radius: 9999px; text-transform: uppercase; 
    }

    .badge-view-top {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
    }

    .card-bottom-info {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: center; z-index: 2; pointer-events: none;
    }

    .badge-bottom { 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      color: #ffffff; 
      font-size: 9.5px; 
      font-weight: 800; 
      padding: 3px 9px; 
      border-radius: 9999px; 
      white-space: nowrap; 
    }

    .badge-view-count {
      display: inline-flex;
      align-items: center;
      gap: 4.5px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f1f5f9;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 9999px;
    }
    .badge-view-count svg {
      width: 11px;
      height: 11px;
      stroke: var(--color-accent);
      fill: none;
      stroke-width: 2.2;
    }

    .card-title { 
      margin-top: 8px; font-size: 13.5px; font-weight: 700; color: #ffffff; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
    }

    /* LOAD MORE */
    .load-more-container { text-align: center; margin-top: 36px; }
    .btn-load-more {
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--color-accent);
      padding: 12px 32px;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      transition: all 0.2s ease;
    }
    .btn-load-more:active { transform: scale(0.97); }

    /* SKELETON */
    @keyframes skeletonPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    .skeleton { background-color: var(--bg-skeleton); animation: skeletonPulse 1.5s infinite ease-in-out; border-radius: 8px; }
    .card-skeleton-img { width: 100%; height: 180px; border-radius: 14px; margin-bottom: 8px; }
    .card-skeleton-title { height: 14px; width: 85%; margin-bottom: 4px; }

    /* BACK TO TOP */
    .bottom-floating-controls { position: fixed; bottom: 24px; right: 18px; z-index: 95; }
    .floating-circle-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border); 
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; visibility: hidden; transition: opacity 0.2s, transform 0.2s;
      transform: translateZ(0);
    }
    .floating-circle-btn.show { opacity: 1; visibility: visible; }
    .floating-circle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    @media (min-width: 768px) {
      .grid-catalog { grid-template-columns: repeat(6, 1fr); column-gap: 16px; row-gap: 28px; }
    }

    footer { margin-top: 60px; padding: 26px 16px; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 13px; }
  </style>
</head>

  <script type="module">
    try {
      const fb = await import('/assets/firebase-config.js');
      window.db = fb.db;
      window.fbRef = fb.ref;
      window.fbGet = fb.get;

      if (typeof window.syncFirebaseViews === 'function') {
        window.syncFirebaseViews();
      }
    } catch (_) {}
  </script>

  <script>
    let rawCatalog = [];
    let filteredList = [];
    let displayedCount = 0;
    const ITEMS_PER_PAGE = 18;
    let selectedType = 'all';
    let selectedCategory = 'all';
    let searchQuery = '';
    let searchDebounce = null;
    let viewsDataMap = {};

    function formatViewCount(val) {
      const num = parseInt(val, 10);
      if (isNaN(num) || num <= 0) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
      return String(num);
    }

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) return str.slice(0, half).trim();
      return str;
    }

    function isMovieItem(item) {
      if (!item) return false;
      const typeStr = (item.type || '').toString().toLowerCase();
      const titleStr = `${item.title || ''} ${item.slug || ''}`.toLowerCase();
      return typeStr === 'movie' || titleStr.includes('movie');
    }

    function parseStatusText(item) {
      const rawStatus = (item.status || item.type || '').toString().toLowerCase();
      return (rawStatus.includes('completed') || rawStatus.includes('tamat') || rawStatus.includes('end')) ? 'COMPLETED' : 'ONGOING';
    }

    function parseEpisodeText(item) {
      if (!item) return 'Ep 1';
      if (isMovieItem(item)) return 'MOVIE';
      return item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep 1');
    }

    function getImageUrl(item) {
      return item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
    }

    window.addEventListener('scroll', () => {
      const onTopBtn = document.getElementById('backToTopBtn');
      if (window.scrollY > 300) onTopBtn.classList.add('show');
      else onTopBtn.classList.remove('show');
    }, { passive: true });

    function onSearchInput() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchQuery = (document.getElementById('catalogSearchInput').value || '').trim().toLowerCase();
        applyFilters();
      }, 150);
    }

    function setTypeFilter(type) {
      selectedType = type;
      document.querySelectorAll('#typeFilterRow .filter-pill').forEach(btn => btn.classList.remove('active'));
      const buttons = document.querySelectorAll('#typeFilterRow .filter-pill');
      buttons.forEach(btn => {
        const text = btn.innerText.toLowerCase();
        if ((type === 'all' && text.includes('semua')) ||
            (type === 'series' && text === 'series') ||
            (type === 'movie' && text === 'movie') ||
            (type === 'ongoing' && text === 'ongoing') ||
            (type === 'completed' && text === 'tamat')) {
          btn.classList.add('active');
        }
      });
      applyFilters();
    }

    function setCategoryFilter(category) {
      selectedCategory = category;
      document.querySelectorAll('#categoryFilterRow .filter-pill').forEach(btn => btn.classList.remove('active'));
      const buttons = document.querySelectorAll('#categoryFilterRow .filter-pill');
      buttons.forEach(btn => {
        if ((category === 'all' && btn.innerText.toLowerCase().includes('semua')) ||
            btn.innerText.toLowerCase() === category.toLowerCase()) {
          btn.classList.add('active');
        }
      });
      applyFilters();
    }

    function createCard(item) {
      const card = document.createElement('a');
      card.className = 'card-grid';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;
      const isMovie = isMovieItem(item);
      const viewsDisplay = formatViewCount(viewsDataMap[item.slug] || 0);

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
          <span class="badge-ep">${isMovie ? 'MOVIE' : parseStatusText(item)}</span>
          ${isMovie ? `
            <div class="badge-view-count badge-view-top">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span class="view-num" data-slug="${item.slug}">${viewsDisplay}</span>
            </div>
          ` : ''}
          <div class="card-bottom-info">
            <span class="badge-bottom">${isMovie ? parseStatusText(item) : parseEpisodeText(item)}</span>
            ${!isMovie ? `
              <div class="badge-view-count">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="view-num" data-slug="${item.slug}">${viewsDisplay}</span>
              </div>
            ` : ''}
          </div>
        </div>
        <div class="card-title">${sanitizeTitle(item.title)}</div>
      `;
      return card;
    }

    function renderCatalogBatch() {
      const grid = document.getElementById('catalogGrid');
      const loadMoreBtn = document.getElementById('loadMoreContainer');
      const nextBatch = filteredList.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);

      nextBatch.forEach(item => grid.appendChild(createCard(item)));
      displayedCount += nextBatch.length;

      if (displayedCount < filteredList.length) {
        loadMoreBtn.style.display = 'block';
      } else {
        loadMoreBtn.style.display = 'none';
      }
    }

    function loadMoreItems() {
      renderCatalogBatch();
    }

    function applyFilters() {
      filteredList = rawCatalog.filter(item => {
        if (searchQuery) {
          const t = (item.title || '').toLowerCase();
          const s = (item.slug || '').toLowerCase();
          if (!t.includes(searchQuery) && !s.includes(searchQuery)) return false;
        }

        if (selectedType === 'series' && isMovieItem(item)) return false;
        if (selectedType === 'movie' && !isMovieItem(item)) return false;
        if (selectedType === 'ongoing' && (parseStatusText(item) !== 'ONGOING' || isMovieItem(item))) return false;
        if (selectedType === 'completed' && (parseStatusText(item) !== 'COMPLETED' || isMovieItem(item))) return false;

        if (selectedCategory !== 'all') {
          const genres = Array.isArray(item.genres) 
            ? item.genres 
            : (typeof item.genres === 'string' ? item.genres.split(/[,•/]/).map(g => g.trim()) : []);
          const match = genres.some(g => g.toLowerCase() === selectedCategory.toLowerCase());
          if (!match) return false;
        }

        return true;
      });

      document.getElementById('catalogTotalBadge').innerText = `${filteredList.length} Judul`;
      
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';
      displayedCount = 0;

      if (filteredList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0;">Tidak ada judul donghua yang cocok.</p>';
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
      }

      renderCatalogBatch();
    }

    window.syncFirebaseViews = async function() {
      if (!window.db || !window.fbRef || !window.fbGet) return;
      try {
        const snap = await window.fbGet(window.fbRef(window.db, 'views_total'));
        if (snap.exists()) {
          viewsDataMap = snap.val() || {};
          document.querySelectorAll('.view-num').forEach(el => {
            const slug = el.getAttribute('data-slug');
            if (slug && viewsDataMap[slug] !== undefined) {
              el.innerText = formatViewCount(viewsDataMap[slug]);
            }
          });
        }
      } catch (_) {}
    };

    async function initCatalog() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error();
        rawCatalog = await res.json();

        const params = new URLSearchParams(window.location.search);
        const catParam = params.get('category');
        const typeParam = params.get('type');
        const statusParam = params.get('status');

        if (catParam) selectedCategory = catParam;
        if (typeParam === 'movie') selectedType = 'movie';
        if (statusParam === 'ongoing') selectedType = 'ongoing';
        if (statusParam === 'completed') selectedType = 'completed';

        setTypeFilter(selectedType);
        if (selectedCategory !== 'all') setCategoryFilter(selectedCategory);
        else applyFilters();

        if (window.syncFirebaseViews) {
          window.syncFirebaseViews();
        }
      } catch (_) {
        document.getElementById('catalogGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0;">Gagal memuat katalog donghua.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', initCatalog);
  </script>
</body>
</html>
