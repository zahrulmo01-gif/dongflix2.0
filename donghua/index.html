<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Default SEO Meta Tags -->
  <title id="metaTitle">Koleksi Donghua Lengkap Sub Indo - Dongflix</title>
  <meta name="description" id="metaDesc" content="Nonton streaming dan daftar koleksi donghua subtitle Indonesia update terbaru kualitas HD gratis di Dongflix.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" id="metaCanonical" href="https://dongflix.my.id/donghua/">

  <!-- Open Graph / Sosmed -->
  <meta property="og:type" content="video.tv_show">
  <meta property="og:title" id="ogTitle" content="Koleksi Donghua - Dongflix">
  <meta property="og:description" id="ogDesc" content="Nonton streaming donghua subtitle Indonesia terlengkap di Dongflix.">
  <meta property="og:image" id="ogImage" content="">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header / Navbar -->
    <header class="flex items-center justify-between pb-5 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <a href="/" class="text-2xl font-extrabold bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
          Dongflix
        </a>
        <span class="text-[10px] bg-slate-900 border border-slate-800 text-cyan-400 px-2 py-0.5 rounded font-mono">
          Sub Indo
        </span>
      </div>

      <div class="flex items-center gap-3">
        <a href="/" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 transition">
          Beranda
        </a>
        <a href="/admin/" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 transition">
          Admin
        </a>
      </div>
    </header>

    <!-- ================= VIEW 1: DETAIL DONGHUA (/donghua/:slug) ================= -->
    <section id="detailView" class="hidden space-y-6">
      <div>
        <a href="/donghua/" class="text-xs text-cyan-400 hover:underline inline-flex items-center gap-1.5 font-medium">
          ← Kembali ke Semua Koleksi
        </a>
      </div>

      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-sm">
        <div class="flex flex-col md:flex-row gap-8">
          
          <!-- Poster / Cover -->
          <div class="w-full md:w-72 shrink-0 flex flex-col items-center">
            <div class="aspect-[3/4] w-full bg-slate-800 rounded-xl overflow-hidden relative shadow-lg border border-slate-800">
              <img id="detailCover" src="" alt="" class="w-full h-full object-cover">
              <span id="detailBadge" class="absolute top-2.5 left-2.5 bg-slate-950/80 backdrop-blur-md text-[11px] text-cyan-400 font-semibold px-2.5 py-1 rounded"></span>
            </div>
            
            <a id="detailWatchBtn" href="#" target="_blank" rel="noreferrer" class="mt-4 w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-center text-sm transition shadow-lg shadow-cyan-600/30 flex items-center justify-center gap-2 active:scale-95">
              <span>Nonton di Anichin</span>
              <span>↗</span>
            </a>
          </div>

          <!-- Metadata & Sinopsis -->
          <div class="flex-1 space-y-5">
            <div>
              <h1 id="detailTitle" class="text-2xl md:text-3xl font-extrabold text-white leading-tight">Memuat...</h1>
              
              <!-- Badges Metadata -->
              <div class="flex flex-wrap items-center gap-2 mt-3">
                <span id="detailStatus" class="text-xs px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium"></span>
                <span id="detailEp" class="text-xs px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium"></span>
                <span id="detailReleased" class="text-xs px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700"></span>
              </div>
            </div>

            <!-- Genre / Kategori -->
            <div class="space-y-1.5">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Genre / Kategori</h3>
              <div id="detailGenres" class="flex flex-wrap gap-1.5">
                <!-- Genre tags dinamis -->
              </div>
            </div>

            <hr class="border-slate-800">

            <!-- Sinopsis Lengkap -->
            <div class="space-y-2">
              <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wide">Sinopsis</h2>
              <div id="detailSynopsis" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line bg-slate-950/50 p-4 rounded-xl border border-slate-800/80">
                Memuat sinopsis...
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ================= VIEW 2: ARSIP / KATALOG (/donghua/) ================= -->
    <section id="listView" class="space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">Semua Donghua</h1>
          <p class="text-xs text-slate-400 mt-1">Daftar arsip serial animasi China subtitle Indonesia lengkap.</p>
        </div>

        <!-- Filter & Search -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <input 
            id="searchInput" 
            oninput="applyFilters()" 
            type="text" 
            placeholder="Cari judul..." 
            class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 flex-1 sm:w-64"
          >
          <select 
            id="statusFilter" 
            onchange="applyFilters()" 
            class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-cyan-500"
          >
            <option value="ALL">Semua Status</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </div>

      <div class="text-xs text-slate-500" id="totalCounter">Memuat koleksi...</div>

      <!-- Grid Cards -->
      <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- Render kartu donghua dinamis -->
      </div>
    </section>

  </div>

  <script>
    let allData = [];

    async function init() {
      // Mendeteksi apakah membuka slug: /donghua/judul-donghua
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const isSlugView = pathSegments.length >= 2 && pathSegments[0] === 'donghua';
      const targetSlug = isSlugView ? pathSegments[1] : null;

      try {
        const res = await fetch('/donghua/donghua.json?nocache=' + Date.now());
        if (!res.ok) throw new Error('File JSON belum ada');
        allData = await res.json();

        if (targetSlug) {
          showDetail(targetSlug);
        } else {
          showCatalog(allData);
        }
      } catch (err) {
        document.getElementById('catalogGrid').innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
            Belum ada data donghua. Jalankan scraper di admin panel terlebih dahulu.
          </div>
        `;
      }
    }

    // 1. Logika View Detail Donghua
    function showDetail(slug) {
      const item = allData.find(d => d.slug === slug);
      const detailView = document.getElementById('detailView');
      const listView = document.getElementById('listView');

      if (!item) {
        detailView.classList.remove('hidden');
        listView.classList.add('hidden');
        document.getElementById('detailTitle').innerText = 'Donghua Tidak Ditemukan';
        document.getElementById('detailSynopsis').innerText = 'Donghua dengan slug ini tidak ditemukan dalam database kami.';
        return;
      }

      detailView.classList.remove('hidden');
      listView.classList.add('hidden');

      // Tampilkan Info Utama
      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailCover').src = item.cover || 'https://via.placeholder.com/300x400?text=No+Cover';
      document.getElementById('detailCover').alt = item.title;
      document.getElementById('detailBadge').innerText = item.type || 'Donghua';
      document.getElementById('detailStatus').innerText = item.status || 'Ongoing';
      document.getElementById('detailEp').innerText = `Episode: ${item.episode || '-'}`;
      document.getElementById('detailReleased').innerText = item.released && item.released !== '-' ? `Rilis: ${item.released}` : 'Rilis: Terbaru';
      document.getElementById('detailWatchBtn').href = item.link;

      // Render Genre Tags
      const genreContainer = document.getElementById('detailGenres');
      const genres = item.genres && item.genres.length > 0 ? item.genres : ['3D Animation', 'Action'];
      genreContainer.innerHTML = genres.map(g => `
        <span class="bg-slate-800/90 text-cyan-300 text-xs px-2.5 py-1 rounded-lg border border-slate-700 font-medium">
          ${g}
        </span>
      `).join('');

      // Render Sinopsis
      document.getElementById('detailSynopsis').innerText = item.synopsis && item.synopsis !== '-' ? item.synopsis : 'Sinopsis belum tersedia untuk serial ini.';

      // Dynamic SEO Meta Tags
      const pageTitle = `Nonton ${item.title} Subtitle Indonesia - Dongflix`;
      const pageDesc = item.synopsis && item.synopsis !== '-' 
        ? item.synopsis.slice(0, 150).replace(/\n/g, ' ') + '...'
        : `Nonton streaming donghua ${item.title} ${item.episode} sub Indo kualitas HD gratis di Dongflix.`;

      document.title = pageTitle;
      document.getElementById('metaTitle').innerText = pageTitle;
      document.getElementById('metaDesc').content = pageDesc;
      document.getElementById('metaCanonical').href = `https://dongflix.my.id/donghua/${item.slug}`;
      document.getElementById('ogTitle').content = pageTitle;
      document.getElementById('ogDesc').content = pageDesc;
      document.getElementById('ogImage').content = item.cover;
    }

    // 2. Logika View Katalog /donghua/
    function showCatalog(items) {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('totalCounter').innerText = `Menampilkan ${items.length} dari total ${allData.length} donghua`;

      const grid = document.getElementById('catalogGrid');
      if (items.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500">Tidak ada donghua yang sesuai filter.</div>';
        return;
      }

      grid.innerHTML = items.map(item => `
        <a href="/donghua/${item.slug}" class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col hover:border-slate-700 transition">
          <div class="aspect-[3/4] w-full bg-slate-800 relative overflow-hidden">
            <img 
              src="${item.cover || 'https://via.placeholder.com/300x400?text=No+Cover'}" 
              alt="${item.title}" 
              class="w-full h-full object-cover group-hover:scale-105 transition duration-300" 
              loading="lazy"
            >
            <span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-[10px] text-cyan-400 font-semibold px-2 py-0.5 rounded">
              ${item.type || 'Donghua'}
            </span>
            <span class="absolute bottom-2 right-2 bg-blue-600/90 backdrop-blur-md text-[10px] text-white font-medium px-1.5 py-0.5 rounded">
              ${item.episode || '-'}
            </span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <h3 class="text-xs font-semibold text-slate-200 line-clamp-2 leading-snug group-hover:text-cyan-400 transition" title="${item.title}">
              ${item.title}
            </h3>
            <div class="mt-2 flex items-center justify-between text-[11px]">
              <span class="text-emerald-400 font-medium">${item.status || 'Ongoing'}</span>
              <span class="text-slate-500">${item.released || ''}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = allData.filter(item => {
        const matchesQuery = item.title.toLowerCase().includes(q);
        const matchesStatus = status === 'ALL' || (item.status && item.status.toLowerCase() === status.toLowerCase());
        return matchesQuery && matchesStatus;
      });

      showCatalog(filtered);
    }

    init();
  </script>
</body>
</html>
