<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Donghua Lengkap - Dongflix</title>
  <meta name="description" content="Jelajahi seluruh koleksi serial dan film donghua subtitle Indonesia terlengkap di Dongflix.">
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f8fafc; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #1a2234; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #25334d; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- TOP NAVBAR -->
  <header class="sticky top-0 z-40 bg-[#07090e]/85 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="text-xl sm:text-2xl font-black tracking-tight bg-gradient-to-r from-blue-500 via-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          Dongflix
        </a>
        <nav class="hidden md:flex items-center gap-4 text-xs font-semibold text-slate-400">
          <a href="/" class="hover:text-white transition">Beranda</a>
          <a href="/donghua/" class="text-blue-400 border-b-2 border-blue-500 pb-0.5">Semua Donghua</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <div class="relative w-44 sm:w-64">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Cari judul..." 
            oninput="handleSearch()"
            class="w-full bg-[#121927] border border-slate-800 rounded-xl px-3.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
          >
          <svg class="w-3.5 h-3.5 text-slate-500 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/60 pb-5">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>Katalog Semua Donghua</span>
          <span id="totalBadge" class="text-xs font-mono font-normal text-blue-400 bg-blue-950/60 border border-blue-800/60 px-2.5 py-0.5 rounded-full">...</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">Daftar lengkap rilisan anime 3D & 2D China dengan update episode tercepat.</p>
      </div>

      <!-- FILTER STATUS -->
      <div class="flex items-center gap-2">
        <button onclick="setStatusFilter('ALL')" id="tabALL" class="text-xs px-3 py-1.5 rounded-xl font-semibold bg-blue-600 text-white transition">Semua</button>
        <button onclick="setStatusFilter('Ongoing')" id="tabOngoing" class="text-xs px-3 py-1.5 rounded-xl font-semibold bg-[#121927] text-slate-400 hover:text-white border border-slate-800 transition">Ongoing</button>
        <button onclick="setStatusFilter('Completed')" id="tabCompleted" class="text-xs px-3 py-1.5 rounded-xl font-semibold bg-[#121927] text-slate-400 hover:text-white border border-slate-800 transition">Tamat</button>
      </div>
    </div>

    <!-- DONGHUA GRID -->
    <div id="gridContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5 sm:gap-4">
      <div class="col-span-full py-16 text-center text-xs text-slate-500 font-mono">Memuat koleksi donghua...</div>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 bg-[#07090e] px-4 py-8 text-center text-xs text-slate-500 space-y-2">
    <p class="font-bold text-slate-400">Dongflix &copy; 2026 - Streaming Donghua Subtitle Indonesia</p>
    <p class="text-[11px] text-slate-600">Seluruh konten didapat dari penyedia publik di internet.</p>
  </footer>

  <script>
    let masterList = [];
    let filteredData = [];
    let currentStatus = 'ALL';

    function cleanTitle(str) {
      if (!str) return '';
      const text = str.trim();
      const half = Math.floor(text.length / 2);
      if (text.length > 4 && text.slice(0, half) === text.slice(half)) {
        return text.slice(0, half).trim();
      }
      return text;
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Gagal mengambil data');
        masterList = await res.json();
        document.getElementById('totalBadge').innerText = `${masterList.length} Judul`;
        applyFilter();
      } catch (err) {
        document.getElementById('gridContainer').innerHTML = `
          <div class="col-span-full py-16 text-center text-xs text-rose-400">Gagal memuat katalog: ${err.message}</div>
        `;
      }
    }

    function setStatusFilter(status) {
      currentStatus = status;
      ['ALL', 'Ongoing', 'Completed'].forEach(s => {
        const btn = document.getElementById(`tab${s}`);
        if (s === status) {
          btn.className = 'text-xs px-3 py-1.5 rounded-xl font-semibold bg-blue-600 text-white transition';
        } else {
          btn.className = 'text-xs px-3 py-1.5 rounded-xl font-semibold bg-[#121927] text-slate-400 hover:text-white border border-slate-800 transition';
        }
      });
      applyFilter();
    }

    function applyFilter() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredData = masterList.filter(item => {
        const matchTitle = (item.title && item.title.toLowerCase().includes(q)) || (item.slug && item.slug.toLowerCase().includes(q));
        const matchStatus = currentStatus === 'ALL' || (item.status && item.status.toLowerCase() === currentStatus.toLowerCase());
        return matchTitle && matchStatus;
      });
      renderCards();
    }

    function handleSearch() {
      applyFilter();
    }

    function renderCards() {
      const container = document.getElementById('gridContainer');
      if (filteredData.length === 0) {
        container.innerHTML = '<div class="col-span-full py-16 text-center text-xs text-slate-500">Donghua tidak ditemukan.</div>';
        return;
      }

      container.innerHTML = filteredData.map(item => {
        const title = cleanTitle(item.title);
        const cover = item.cover || 'https://via.placeholder.com/200x280?text=No+Cover';
        const ep = item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep -');
        const isCompleted = (item.status || '').toLowerCase() === 'completed';

        return `
          <a href="/donghua/${encodeURIComponent(item.slug)}" class="group bg-[#0d121d] border border-slate-800/80 hover:border-blue-500/60 rounded-2xl overflow-hidden transition duration-200 flex flex-col shadow-lg">
            <div class="relative aspect-[3/4] w-full bg-slate-900 overflow-hidden">
              <img 
                src="${cover}" 
                alt="${title}"
                referrerpolicy="no-referrer"
                loading="lazy"
                class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'"
              >
              <div class="absolute top-2 left-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${isCompleted ? 'bg-blue-600/90 text-white' : 'bg-emerald-600/90 text-white'} backdrop-blur-sm">
                  ${item.status || 'Ongoing'}
                </span>
              </div>
              <div class="absolute bottom-2 right-2">
                <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-slate-950/80 text-cyan-300 border border-slate-700/60 backdrop-blur-sm">
                  ${ep}
                </span>
              </div>
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <h3 class="text-xs font-bold text-slate-200 group-hover:text-blue-400 line-clamp-2 transition leading-snug" title="${title}">
                ${title}
              </h3>
              <span class="text-[10px] text-slate-500 font-mono mt-2">${item.type || 'Donghua'}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    loadCatalog();
  </script>
</body>
</html>
