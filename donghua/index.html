<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Katalog Donghua & Movie - Dongflix.my.id</title>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #121212;
      --bg-search-input: #121212;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-movie: #f59e0b;
      --color-star: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 86px;
      padding-bottom: 50px;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    /* FLOATING HEADER PILL */
    .header-bar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      pointer-events: none;
    }

    .header-bar > * { pointer-events: auto; }

    .pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-light-pip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 3.5px;
      background: var(--color-accent);
      border-radius: 9999px;
      box-shadow: 0 0 12px var(--color-accent), 0 0 20px var(--color-accent);
      opacity: 0.95;
      pointer-events: none;
    }

    .nav-capsule {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(15, 15, 18, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      padding: 6px 18px;
      height: 46px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .brand-title-capsule {
      font-size: 18.5px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.4px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .brand-title-capsule .brand-accent {
      color: var(--color-accent);
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
    }

    .tld-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(56, 189, 248, 0.16);
      color: var(--color-accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 3px 7px;
      border-radius: 7px;
      line-height: 1.2;
      text-transform: lowercase;
    }

    .header-actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(15, 15, 18, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
      text-decoration: none;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--color-accent);
      transform: translateY(-1px);
    }

    .action-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* FILTER & SEARCH BAR TOP */
    .catalog-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar { display: none; }

    .filter-pill {
      background: rgba(18, 18, 20, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      border-radius: 9999px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-pill.active {
      color: #fff;
      background: var(--color-primary);
      border-color: var(--color-accent);
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.45);
    }

    .filter-pill.movie-pill.active {
      background: var(--color-movie);
      border-color: #fde047;
      color: #000;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.45);
    }

    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 46px;
    }

    .search-input-box svg {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2.2;
    }

    .search-input-field {
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 18, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 0 18px 0 44px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input-field:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .catalog-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .catalog-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .catalog-count-badge {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* GRID & CARDS IDENTIK DENGAN BERANDA */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card-grid {
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .card-grid-img-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .badge-ep {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(2, 132, 199, 0.9);
      color: var(--text-main);
      font-size: 9px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      z-index: 2;
      text-transform: uppercase;
    }

    .badge-ep.movie {
      background: rgba(245, 158, 11, 0.95);
      color: #000;
    }

    .card-bottom-info {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      pointer-events: none;
      gap: 4px;
    }

    .badge-bottom {
      background: rgba(15, 23, 42, 0.95);
      color: var(--color-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 9px;
      font-weight: 700;
      padding: 2.5px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge-bottom.movie {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .card-title {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* PAGINATION / LOAD MORE */
    .load-more-btn {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 32px auto 0;
      padding: 14px;
      background: var(--bg-card);
      color: var(--color-accent);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .load-more-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--color-accent);
    }

    @media (min-width: 768px) {
      .catalog-controls {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .search-input-box { max-width: 380px; }
      .grid-3 {
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
      .card-grid-img-wrapper { height: 235px; }
      .card-grid:hover .card-grid-img-wrapper {
        transform: translateY(-5px);
        border-color: rgba(56, 189, 248, 0.45);
        box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      }
      .card-grid:hover img { transform: scale(1.06); }
      .card-title { font-size: 13px; margin-top: 10px; }
    }

    footer {
      margin-top: 60px;
      padding: 26px 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    footer a { color: var(--color-accent); text-decoration: none; }
  </style>
</head>
<body>

  <!-- FLOATING GLASS PILL HEADER -->
  <header class="header-bar">
    <div class="pill-wrapper">
      <div class="top-light-pip"></div>
      <div class="nav-capsule" onclick="window.location.href='/'">
        <a href="/" class="brand-title-capsule">
          <span>Dong<span class="brand-accent">flix</span></span>
          <span class="tld-badge">.my.id</span>
        </a>
      </div>
    </div>

    <div class="header-actions-group">
      <a href="/" class="action-btn" title="Kembali ke Beranda">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </div>
  </header>

  <main class="container">
    <!-- FILTER TABS & SEARCH INPUT -->
    <div class="catalog-controls">
      <div class="filter-pills">
        <button class="filter-pill active" id="tabAll" onclick="setFilter('all')">Semua Koleksi</button>
        <button class="filter-pill" id="tabSeries" onclick="setFilter('series')">Series Donghua</button>
        <button class="filter-pill movie-pill" id="tabMovie" onclick="setFilter('movie')">Movie</button>
      </div>

      <div class="search-input-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="catalogSearchInput" class="search-input-field" placeholder="Cari dalam katalog..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- HEADER TITLE & HITUNGAN -->
    <div class="catalog-heading-row">
      <h1 class="catalog-title" id="sectionTitle">
        Semua Donghua
      </h1>
      <span class="catalog-count-badge" id="countBadge">Memuat...</span>
    </div>

    <!-- GRID KATALOG -->
    <div class="grid-3" id="catalogGrid">
      <div class="card-grid"><div class="card-grid-img-wrapper" style="background:#111;"></div></div>
      <div class="card-grid"><div class="card-grid-img-wrapper" style="background:#111;"></div></div>
      <div class="card-grid"><div class="card-grid-img-wrapper" style="background:#111;"></div></div>
    </div>

    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Muat Lebih Banyak</button>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 <a href="/">Dongflix.my.id</a>. Ditenagai oleh Real-time GitHub Proxy.</p>
    </div>
  </footer>

  <script>
    let masterData = [];
    let filteredData = [];
    let currentFilter = 'all'; // 'all', 'series', 'movie'
    let currentPage = 1;
    const pageSize = 24;

    function isMovieItem(item) {
      if (!item) return false;
      const typeStr = (item.type || '').toString().toLowerCase();
      const titleStr = `${item.title || ''} ${item.slug || ''}`.toLowerCase();
      return typeStr === 'movie' || titleStr.includes('movie');
    }

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) {
        return str.slice(0, half).trim();
      }
      return str;
    }

    function parseEpisodeText(item) {
      if (!item) return 'Ep 1';
      if (isMovieItem(item)) return 'MOVIE';
      return item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep 1');
    }

    function parseStatusText(item) {
      const rawStatus = (item.status || item.type || '').toString().toLowerCase();
      if (rawStatus.includes('completed') || rawStatus.includes('tamat') || rawStatus.includes('end')) {
        return 'COMPLETED';
      }
      return 'ONGOING';
    }

    function createCard(item) {
      const card = document.createElement('a');
      card.className = 'card-grid';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;

      const isMovie = isMovieItem(item);
      const episodeText = parseEpisodeText(item);
      const statusText = parseStatusText(item);
      const titleText = sanitizeTitle(item.title);
      const posterUrl = item.cover || item.thumbnail || 'https://via.placeholder.com/300x400?text=No+Cover';

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${posterUrl}" alt="${titleText}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/300x400?text=No+Cover'" />
          <span class="badge-ep ${isMovie ? 'movie' : ''}">${isMovie ? 'MOVIE' : statusText}</span>
          <div class="card-bottom-info">
            <span class="badge-bottom ${isMovie ? 'movie' : ''}">${isMovie ? statusText : episodeText}</span>
          </div>
        </div>
        <div class="card-title">${titleText}</div>
      `;
      return card;
    }

    function applyFilter() {
      const searchVal = document.getElementById('catalogSearchInput').value.trim().toLowerCase();

      filteredData = masterData.filter(item => {
        const matchesFilter =
          currentFilter === 'all' ? true :
          currentFilter === 'movie' ? isMovieItem(item) :
          !isMovieItem(item);

        const titleText = (item.title || '').toLowerCase();
        const slugText = (item.slug || '').toLowerCase();
        const matchesSearch = !searchVal || titleText.includes(searchVal) || slugText.includes(searchVal);

        return matchesFilter && matchesSearch;
      });

      // Update Judul & Hitungan
      const sectionTitle = document.getElementById('sectionTitle');
      if (currentFilter === 'movie') sectionTitle.innerText = 'Katalog Movie';
      else if (currentFilter === 'series') sectionTitle.innerText = 'Katalog Series Donghua';
      else sectionTitle.innerText = 'Semua Koleksi Donghua';

      document.getElementById('countBadge').innerText = `${filteredData.length} Judul`;

      currentPage = 1;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const grid = document.getElementById('catalogGrid');
      const loadBtn = document.getElementById('loadMoreBtn');

      if (currentPage === 1) grid.innerHTML = '';

      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const slice = filteredData.slice(start, end);

      if (slice.length > 0) {
        slice.forEach(item => grid.appendChild(createCard(item)));
        currentPage++;
      }

      if (filteredData.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);font-size:13px;grid-column:1/-1;text-align:center;padding:40px 0;">Tidak ada judul yang cocok.</p>';
      }

      loadBtn.style.display = (end >= filteredData.length) ? 'none' : 'block';
    }

    function loadMore() {
      renderCurrentPage();
    }

    function setFilter(type, updateHistory = true) {
      currentFilter = type;

      document.getElementById('tabAll').classList.toggle('active', type === 'all');
      document.getElementById('tabSeries').classList.toggle('active', type === 'series');
      document.getElementById('tabMovie').classList.toggle('active', type === 'movie');

      if (updateHistory) {
        const newUrl = type === 'movie' ? '/donghua/?type=movie' :
                       type === 'series' ? '/donghua/?type=series' : '/donghua/';
        window.history.pushState({}, '', newUrl);
      }

      applyFilter();
    }

    function handleSearch() {
      applyFilter();
    }

    async function initCatalog() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Gagal memuat katalog');
        masterData = await res.json();

        // Cek Query Param (?type=movie atau ?type=series)
        const params = new URLSearchParams(window.location.search);
        const typeParam = (params.get('type') || '').toLowerCase();

        if (typeParam === 'movie') {
          setFilter('movie', false);
        } else if (typeParam === 'series') {
          setFilter('series', false);
        } else {
          setFilter('all', false);
        }

      } catch (err) {
        document.getElementById('catalogGrid').innerHTML = '<p style="color:#ef4444;font-size:13px;grid-column:1/-1;text-align:center;">Gagal memuat katalog donghua.</p>';
        document.getElementById('countBadge').innerText = '0 Judul';
      }
    }

    window.onload = initCatalog;
  </script>
</body>
</html>
