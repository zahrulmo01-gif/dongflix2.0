<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-10 font-sans">
  <div class="max-w-7xl mx-auto space-y-8">
    <div class="flex items-center justify-between border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Update Donghua</h1>
        <p class="text-xs text-slate-400 mt-1">Koleksi donghua terbaru</p>
      </div>
      <a href="/admin/" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Admin Panel</a>
    </div>

    <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <!-- Diisi otomatis dari donghua/donghua.json -->
    </div>
  </div>

  <script>
    fetch('/donghua/donghua.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('catalogGrid').innerHTML = data.map(item => `
          <div class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
            <div class="aspect-[3/4] w-full bg-slate-800 relative overflow-hidden">
              <img src="${item.cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
              <span class="absolute top-2 left-2 bg-slate-950/80 text-[10px] text-sky-400 font-semibold px-2 py-0.5 rounded">${item.type}</span>
              <span class="absolute bottom-2 right-2 bg-blue-600/90 text-[10px] text-white font-medium px-1.5 py-0.5 rounded">${item.episode}</span>
            </div>
            <div class="p-3 flex-1 flex flex-col justify-between">
              <h3 class="text-xs font-semibold text-slate-200 line-clamp-2">${item.title}</h3>
              <a href="${item.link}" target="_blank" class="mt-2 text-[11px] text-blue-400 hover:underline">Tonton Sekarang ↗</a>
            </div>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('catalogGrid').innerHTML = '<div class="col-span-full py-16 text-center text-slate-500">Belum ada daftar donghua.</div>';
      });
  </script>
</body>
</html>
