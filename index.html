<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dongflix - Streaming Donghua Subtitle Indonesia</title>
  <meta name="description" content="Nonton streaming donghua subtitle Indonesia update terbaru dengan server cepat tanpa iklan mengganggu di Dongflix.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dongflix.my.id/">

  <!-- Meta Header agar Gambar Eksternal Tidak Diblokir (Bypass Hotlink) -->
  <meta name="referrer" content="no-referrer">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

  <!-- TOP NAVBAR -->
  <header class="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="text-2xl font-black tracking-tight bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-500 bg-clip-text text-transparent flex items-center gap-2">
          <span>Dongflix</span>
        </a>
        <span class="hidden sm:inline-flex text-[10px] font-bold uppercase tracking-wider bg-cyan-950/80 text-cyan-300 border border-cyan-800/60 px-2.5 py-0.5 rounded-full font-mono">
          Streaming
        </span>
      </div>

      <nav class="flex items-center gap-2">
        <a href="/" class="text-xs font-semibold text-cyan-400 px-3.5 py-2 rounded-xl bg-cyan-950/40 border border-cyan-800/60 transition">
          Beranda
        </a>
        <a href="/donghua/" class="text-xs font-semibold text-slate-300 hover:text-white px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition">
          Katalog
        </a>
        <a href="/admin/" class="text-xs font-semibold text-slate-300 hover:text-white px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition">
          Admin
        </a>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-8">
    <section class="space-y-6">
      
      <!-- Filter Bar & Search -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/60 border border-slate-800/80 p-4 rounded-2xl">
        <div>
          <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Katalog Donghua Terbaru</h1>
          <p class="text-xs text-slate-400 mt-0.5">Koleksi serial animasi China subtitle Indonesia terlengkap dan terupdate.</p>
        </div>

        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
          <div class="relative flex-1 sm:w-64">
            <input 
              id="searchInput" 
              type="text" 
              placeholder="Cari judul donghua..." 
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
            >
          </div>

          <select 
            id="statusFilter" 
            class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-cyan-500"
          >
            <option value="ALL">Semua Status</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </div>

      <!-- Counter Tampilan -->
      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <span id="totalCountInfo">Memuat koleksi...</span>
      </div>

      <!-- Skeleton Loading -->
      <div id="loadingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5 sm:gap-4">
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
        <div class="bg-slate-900/60 rounded-2xl aspect-[3/4] animate-pulse border border-slate-800"></div>
      </div>

      <!-- Grid Katalog Card -->
      <div id="donghuaGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3.5 sm:gap-4"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden col-span-full py-16 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
        Judul donghua tidak ditemukan.
      </div>

      <!-- Tombol Muat Lagi -->
      <div class="text-center pt-4">
        <button 
          id="btnLoadMore" 
          class="hidden inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-cyan-400 font-semibold text-xs px-6 py-3 rounded-full border border-cyan-800/60 hover:border-cyan-500 transition shadow-lg shadow-cyan-950/20"
        >
          <span>Muat Lebih Banyak (+12)</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
      </div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="mt-auto border-t border-slate-800/80 bg-slate-950 px-4 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026 Dongflix. Ditenagai oleh Real-time GitHub Proxy.</p>
  </footer>

  <script>
    const ITEMS_PER_PAGE = 12;
    let allDonghua = [];
    let filteredDonghua = [];
    let displayedCount = 0;

    const loadingGrid = document.getElementById('loadingGrid');
    const donghuaGrid = document.getElementById('donghuaGrid');
    const emptyState = document.getElementById('emptyState');
    const btnLoadMore = document.getElementById('btnLoadMore');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const totalCountInfo = document.getElementById('totalCountInfo');

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) {
        return str.slice(0, half).trim();
      }
      return str;
    }

    async function loadData() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error();
        allDonghua = await res.json();
      } catch (err) {
        try {
          const localRes = await fetch('/donghua/donghua.json?t=' + Date.now());
          allDonghua = await localRes.json();
        } catch (localErr) {
          allDonghua = [];
        }
      }

      loadingGrid.classList.add('hidden');
      donghuaGrid.classList.remove('hidden');

      if (!allDonghua || allDonghua.length === 0) {
        emptyState.classList.remove('hidden');
        totalCountInfo.textContent = '0 donghua';
        return;
      }

      filteredDonghua = [...allDonghua];
      renderNextBatch();
    }

    function createCard(item) {
      const displayTitle = sanitizeTitle(item.title || item.name);
      const isCompleted = (item.status || '').toLowerCase() === 'completed';
      const epDisplay = item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || '-');
      const posterImage = item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
      const slug = item.slug || '';

      const card = document.createElement('a');
      // Direct ke /donghua/:slug
      card.href = `/donghua/${slug}`;
      card.className = 'group bg-slate-900/60 border border-slate-800/80 rounded-2xl overflow-hidden flex flex-col hover:border-cyan-500/50 hover:shadow-xl hover:shadow-cyan-950/20 transition duration-200';

      card.innerHTML = `
        <div class="aspect-[3/4] w-full bg-slate-950 relative overflow-hidden">
          <img 
            src="${posterImage}" 
            alt="${displayTitle}" 
            loading="lazy" 
            referrerpolicy="no-referrer"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
            onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=No+Cover';"
          >
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-60"></div>
          
          <span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-[10px] text-cyan-400 font-bold px-2 py-0.5 rounded-md border border-slate-800">
            ${item.type || 'Donghua'}
          </span>

          <span class="absolute bottom-2 right-2 bg-cyan-600/90 backdrop-blur-md text-[10px] text-white font-mono font-bold px-1.5 py-0.5 rounded-md shadow">
            ${epDisplay}
          </span>
        </div>

        <div class="p-3 flex-1 flex flex-col justify-between">
          <h3 class="text-xs font-semibold text-slate-200 line-clamp-2 leading-snug group-hover:text-cyan-400 transition" title="${displayTitle}">
            ${displayTitle}
          </h3>
          
          <div class="mt-2.5 flex items-center justify-between text-[10px] font-medium">
            <span class="${isCompleted ? 'text-blue-400' : 'text-emerald-400'}">
              ${item.status || 'Ongoing'}
            </span>
            <span class="text-slate-500 font-mono">Sub Indo</span>
          </div>
        </div>
      `;
      return card;
    }

    function renderNextBatch() {
      const nextBatch = filteredDonghua.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
      
      nextBatch.forEach(item => {
        donghuaGrid.appendChild(createCard(item));
      });

      displayedCount += nextBatch.length;
      totalCountInfo.textContent = `Menampilkan ${displayedCount} dari ${filteredDonghua.length} donghua`;

      if (displayedCount < filteredDonghua.length) {
        btnLoadMore.classList.remove('hidden');
      } else {
        btnLoadMore.classList.add('hidden');
      }
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const status = statusFilter.value;
      
      filteredDonghua = allDonghua.filter(item => {
        const titleMatch = (item.title && item.title.toLowerCase().includes(q)) || 
                           (item.slug && item.slug.toLowerCase().includes(q));
        const statusMatch = status === 'ALL' || (item.status && item.status.toLowerCase() === status.toLowerCase());
        return titleMatch && statusMatch;
      });

      donghuaGrid.innerHTML = '';
      displayedCount = 0;

      if (filteredDonghua.length === 0) {
        emptyState.classList.remove('hidden');
        btnLoadMore.classList.add('hidden');
        totalCountInfo.textContent = '0 donghua';
      } else {
        emptyState.classList.add('hidden');
        renderNextBatch();
      }
    }

    btnLoadMore.addEventListener('click', renderNextBatch);
    searchInput.addEventListener('input', applyFilters);
    statusFilter.addEventListener('change', applyFilters);

    loadData();
  </script>
</body>
</html>
