<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Dongflix.my.id - Streaming Donghua Sub Indo</title>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --bg-skeleton: #121212;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-movie: #f59e0b;
      --color-star: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(20, 20, 24, 0.58);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      --glass-blur: blur(16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding-top: 0;
      padding-bottom: 50px; 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .icon-svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; vertical-align: middle; }

    /* FLOATING GLASS PILL HEADER */
    .header-bar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      pointer-events: none;
      transform: translateZ(0);
      will-change: transform;
    }

    .header-bar > * { pointer-events: auto; }

    .pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-light-pip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 3.5px;
      background: var(--color-accent);
      border-radius: 9999px;
      box-shadow: 0 0 10px var(--color-accent), 0 0 18px var(--color-accent);
      opacity: 0.9;
      pointer-events: none;
    }

    .nav-capsule {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px;
      padding: 6px 18px;
      height: 46px;
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transform: translateZ(0);
    }

    .brand-title-capsule { 
      font-size: 18.5px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: -0.4px; 
      text-decoration: none; 
      display: inline-flex; 
      align-items: center;
      gap: 7px;
    }

    .brand-title-capsule .brand-accent { 
      color: var(--color-accent); 
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6); 
    }

    .tld-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 3px 7px;
      border-radius: 7px;
      line-height: 1.2;
      text-transform: lowercase;
    }

    .header-actions-group { display: flex; align-items: center; gap: 10px; }

    .action-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      flex-shrink: 0;
      transform: translateZ(0);
    }

    .action-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* GLASS POPOVER MENU */
    .popover-menu {
      display: none;
      position: fixed;
      top: 72px;
      right: 16px;
      background: rgba(22, 22, 26, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 18px;
      padding: 8px;
      min-width: 210px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6);
      z-index: 105;
      transform: translateZ(0);
    }

    .popover-menu.active { display: block; }
    .popover-menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 12px;
    }
    .popover-menu a svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* SEARCH MODAL */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.75); 
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 999; 
      padding: 16px; 
      overflow-y: auto; 
    }
    .modal-overlay.active { display: block; }
    .search-modal-container { max-width: 1100px; margin: 0 auto; }
    .search-modal-header { display: flex; align-items: center; gap: 10px; height: 46px; margin-bottom: 12px; }
    .search-input-box { flex: 1; position: relative; display: flex; align-items: center; height: 46px; }
    .search-input-box svg { position: absolute; left: 16px; width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2.2; }
    .search-input-field { 
      width: 100%; height: 46px; background: var(--glass-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px; padding: 0 18px 0 44px; color: var(--text-main); font-size: 14.5px; outline: none;
    }
    .modal-close-btn { 
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); 
      cursor: pointer; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .modal-close-btn svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2.2; fill: none; }
    .search-nav-pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .search-pill-btn {
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-sub);
      font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 9999px; cursor: pointer;
    }
    .search-pill-btn.active { background: rgba(56, 189, 248, 0.25); color: #fff; border-color: rgba(56, 189, 248, 0.45); }
    .search-results-list { display: flex; flex-direction: column; gap: 10px; }
    .search-item-card { 
      display: flex; gap: 14px; background: rgba(22, 22, 26, 0.65); border: 1px solid var(--glass-border); 
      border-radius: 16px; padding: 10px; cursor: pointer; text-decoration: none; 
    }
    .search-item-thumb { width: 72px; height: 98px; border-radius: 12px; flex-shrink: 0; background: var(--bg-card); position: relative; overflow: hidden; }
    .search-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .search-item-thumb .badge-cover-ep {
      position: absolute; bottom: 6px; left: 6px; background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: #ffffff; font-size: 9px; font-weight: 800; padding: 2.5px 8px; border-radius: 9999px;
    }

    /* SLIDER DENGAN PROGRESSIVE BLUR & MENGGELAP */
    .hero-slider-wrapper { 
      position: relative; width: 100%; height: 460px; overflow: hidden; background: #000; 
      transform: translateZ(0); contain: paint;
    }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease-in-out; display: flex; align-items: flex-end; }
    .hero-slide.active { opacity: 1; z-index: 1; }
    .hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-blur-layer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 60%; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      mask-image: linear-gradient(to top, black 20%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 20%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
      z-index: 1; pointer-events: none;
    }
    .hero-overlay { 
      position: absolute; inset: 0; 
      background: linear-gradient(to top, #000000 0%, rgba(0, 0, 0, 0.96) 24%, rgba(0, 0, 0, 0.7) 48%, rgba(0, 0, 0, 0.25) 70%, transparent 90%); 
      z-index: 2; pointer-events: none; 
    }
    .hero-content { position: relative; z-index: 3; padding: 20px 18px 42px; max-width: 760px; margin: 0 auto; width: 100%; }
    .badge-tag { display: inline-block; background: var(--color-primary); color: var(--text-main); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; }
    .hero-title { font-size: 24px; font-weight: 900; line-height: 1.2; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase; }
    .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
    .badge-status-green { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); border: 1px solid var(--border-color); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .btn-watch { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%); color: var(--text-main); padding: 10px 24px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none; }
    .btn-watch svg { width: 16px; height: 16px; fill: currentColor; }
    .slider-dots { position: absolute; bottom: 16px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; cursor: pointer; transition: all 0.3s; }
    .dot.active { width: 28px; background: var(--color-accent); border-radius: 10px; }

    /* CONTENT SECTIONS */
    .section-block { margin-top: 36px; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

    /* LANJUTKAN MENONTON (COVER 16:9 LANDSCAPE SESUAI GAMBAR) */
    .continue-scroll-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }
    .continue-scroll-row::-webkit-scrollbar { display: none; }

    .continue-card-item {
      flex: 0 0 200px;
      min-width: 200px;
      max-width: 200px;
      text-decoration: none !important;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transform: translateZ(0);
    }

    .continue-thumb-box {
      position: relative;
      width: 100%;
      height: 114px;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
    }

    .continue-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .continue-thumb-box .continue-eps-text {
      position: absolute;
      left: 10px;
      bottom: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
      z-index: 2;
      pointer-events: none;
    }

    .continue-item-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .continue-time-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
    }

    .continue-time-row svg {
      width: 13px;
      height: 13px;
      stroke: var(--color-accent);
      fill: none;
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    /* CARD GRID DONGHUA & MOVIE */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 10px; row-gap: 20px; }
    .card-grid { text-decoration: none !important; border: none !important; }
    .card-grid-img-wrapper { 
      position: relative; width: 100%; height: 180px; border-radius: 14px; overflow: hidden; 
      background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
    }
    .card-grid-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-ep { 
      position: absolute; top: 8px; left: 8px; background: rgba(2, 132, 199, 0.9);
      color: var(--text-main); font-size: 9px; font-weight: 800; padding: 3.5px 9px; border-radius: 9999px; text-transform: uppercase; 
    }
    .badge-ep.movie { background: rgba(245, 158, 11, 0.95); color: #000; }

    .card-bottom-info {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: center; z-index: 2; pointer-events: none;
    }

    .badge-bottom { 
      background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); 
      border-top: 1px solid var(--glass-border-top); color: #ffffff; font-size: 9.5px; font-weight: 800; 
      padding: 3px 9px; border-radius: 9999px; white-space: nowrap; 
    }
    .badge-bottom.movie { color: #fde047; }

    .card-title { 
      margin-top: 8px; font-size: 13.5px; font-weight: 700; color: #ffffff; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
    }
    .see-all-btn { color: var(--color-accent); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }

    /* FEATURED POPULER */
    .popular-featured-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .popular-featured-row::-webkit-scrollbar { display: none; }
    .popular-featured-card { flex: 0 0 88%; max-width: 380px; height: 185px; display: flex; gap: 14px; text-decoration: none !important; }
    .popular-vertical-list { display: flex; flex-direction: column; gap: 18px; }
    .popular-vertical-list .popular-featured-card { flex: 1 1 auto; max-width: 100%; }
    .featured-thumb-box { width: 135px; min-width: 135px; height: 185px; border-radius: 20px; overflow: hidden; background: #111; flex-shrink: 0; }
    .featured-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .featured-info-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
    .featured-title { font-size: 15.5px; font-weight: 800; color: #ffffff; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .featured-synopsis { font-size: 11px; color: #94a3b8; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .featured-synopsis.clamp-3 { -webkit-line-clamp: 3; }
    .featured-synopsis.clamp-5 { -webkit-line-clamp: 5; }
    .featured-genres { font-size: 11px; color: #64748b; line-height: 1.35; font-weight: 500; }
    .featured-pill-btn {
      align-self: flex-start; background: #1c1c1e; border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db; font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 9999px;
    }

    /* BACK TO TOP */
    .bottom-floating-controls { position: fixed; bottom: 24px; right: 18px; z-index: 95; }
    .floating-circle-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); color: var(--text-main); display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; visibility: hidden; transition: opacity 0.2s, transform 0.2s;
    }
    .floating-circle-btn.show { opacity: 1; visibility: visible; }
    .floating-circle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    @media (min-width: 768px) {
      .hero-slider-wrapper { height: 500px; }
      .grid-3 { grid-template-columns: repeat(6, 1fr); column-gap: 16px; row-gap: 28px; }
      .continue-card-item { flex: 0 0 240px; min-width: 240px; max-width: 240px; }
      .continue-thumb-box { height: 136px; }
      .popular-vertical-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 28px; }
    }

    footer { margin-top: 60px; padding: 26px 16px; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-muted); font-size: 13px; }
    footer a { color: var(--color-accent); text-decoration: none; }
  </style>
</head>
<body>

  <!-- FLOATING GLASS PILL HEADER -->
  <header class="header-bar">
    <div class="pill-wrapper">
      <div class="top-light-pip"></div>
      <div class="nav-capsule" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <a href="/" class="brand-title-capsule">
          <span>Dong<span class="brand-accent">flix</span></span>
          <span class="tld-badge">.my.id</span>
        </a>
      </div>
    </div>

    <div class="header-actions-group">
      <button class="action-btn" onclick="openSearchModal()" aria-label="Cari Donghua">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="action-btn" id="socialMenuBtn" onclick="togglePopoverMenu()" aria-label="Menu Navigasi">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <!-- GLASS POPOVER MENU -->
  <div class="popover-menu" id="popoverMenu">
    <a href="/"><span>Beranda</span><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
    <a href="/donghua/"><span>Katalog Lengkap</span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></a>
    <a href="/donghua/"><span>Donghua Terbaru</span><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg></a>
    <a href="/donghua/?type=movie"><span>Movie Terbaru</span><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg></a>
  </div>

  <!-- SEARCH MODAL -->
  <div class="modal-overlay" id="searchModalOverlay">
    <div class="search-modal-container">
      <div class="search-modal-header">
        <div class="search-input-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" class="search-input-field" id="searchInputModal" placeholder="Cari donghua atau movie..." onkeyup="handleSearchInput(event)">
        </div>
        <button class="modal-close-btn" onclick="closeSearchModal()" aria-label="Tutup Pencarian">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="search-nav-pills">
        <button class="search-pill-btn active" id="searchPillAll" onclick="setSearchFilter('all')">Semua</button>
        <button class="search-pill-btn" id="searchPillSeries" onclick="setSearchFilter('series')">Series</button>
        <button class="search-pill-btn" id="searchPillMovie" onclick="setSearchFilter('movie')">Movie</button>
      </div>

      <div class="search-results-list" id="searchResultsList">
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>
      </div>
    </div>
  </div>

  <!-- HERO SLIDER -->
  <div class="hero-slider-wrapper" id="heroSlider"></div>

  <div class="container">
    <!-- 1. LANJUTKAN MENONTON (DISEMBUNYIKAN SECARA DEFAULT HINGGA ADA DATA) -->
    <section class="section-block" id="continueSection" style="display: none !important;">
      <h2 class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Lanjutkan Menonton
      </h2>
      <div class="continue-scroll-row" id="continueRow"></div>
    </section>

    <!-- 2. POPULER HARI INI -->
    <section class="section-block">
      <div class="section-header-flex">
        <h2 class="section-title">
          <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Populer Hari Ini
        </h2>
      </div>
      <div class="popular-featured-row" id="todayPopularRow"></div>
    </section>

    <!-- 3. DONGHUA TERBARU -->
    <section class="section-block" id="donghuaSection">
      <div class="section-header-flex">
        <h2 class="section-title">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>
          Donghua Terbaru
        </h2>
        <a href="/donghua/" class="see-all-btn">Lihat Semua</a>
      </div>
      <div class="grid-3" id="latestGrid"></div>
    </section>

    <!-- 4. MOVIE TERBARU -->
    <section class="section-block" id="movieSection">
      <div class="section-header-flex">
        <h2 class="section-title">
          <svg class="icon-svg" style="color: var(--color-movie);" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg>
          Movie Terbaru
        </h2>
        <a href="/donghua/?type=movie" class="see-all-btn movie">Lihat Semua</a>
      </div>
      <div class="grid-3" id="movieGrid"></div>
    </section>

    <!-- 5. DONGHUA POPULER -->
    <section class="section-block">
      <div class="section-header-flex">
        <h2 class="section-title">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Donghua Populer
        </h2>
      </div>
      <div class="popular-vertical-list" id="popularAllGrid"></div>
    </section>
  </div>

  <aside class="bottom-floating-controls">
    <button class="floating-circle-btn" id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Kembali ke atas">
      <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
  </aside>

  <footer>
    <div class="container">
      <p>&copy; 2026 <a href="/">Dongflix.my.id</a>. Seluruh hak cipta dilindungi.</p>
    </div>
  </footer>

  <script>
    let searchTimer = null;
    let currentSlide = 0;
    let slideInterval = null;
    let currentSearchType = 'all';

    let donghuaList = [];
    let movieList = [];
    let masterList = [];

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) return str.slice(0, half).trim();
      return str;
    }

    function isMovieItem(item) {
      if (!item) return false;
      const typeStr = (item.type || '').toString().toLowerCase();
      const titleStr = `${item.title || ''} ${item.slug || ''}`.toLowerCase();
      return typeStr === 'movie' || titleStr.includes('movie');
    }

    function parseStatusText(item) {
      const rawStatus = (item.status || item.type || '').toString().toLowerCase();
      return (rawStatus.includes('completed') || rawStatus.includes('tamat') || rawStatus.includes('end')) ? 'COMPLETED' : 'ONGOING';
    }

    function parseEpisodeText(item) {
      if (!item) return 'Ep 1';
      if (isMovieItem(item)) return 'MOVIE';
      return item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep 1');
    }

    function getImageUrl(item) {
      return item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
    }

    function togglePopoverMenu() {
      document.getElementById('popoverMenu').classList.toggle('active');
    }

    document.addEventListener('click', (e) => {
      const popover = document.getElementById('popoverMenu');
      const btn = document.getElementById('socialMenuBtn');
      if (popover && btn && !btn.contains(e.target) && !popover.contains(e.target)) popover.classList.remove('active');
    });

    function openSearchModal() { document.getElementById('searchModalOverlay').classList.add('active'); document.getElementById('searchInputModal').focus(); }
    function closeSearchModal() { document.getElementById('searchModalOverlay').classList.remove('active'); }

    window.addEventListener('scroll', () => {
      const onTopBtn = document.getElementById('backToTopBtn');
      if (window.scrollY > 300) onTopBtn.classList.add('show');
      else onTopBtn.classList.remove('show');
    }, { passive: true });

    function setSearchFilter(type) {
      currentSearchType = type;
      document.getElementById('searchPillAll').classList.toggle('active', type === 'all');
      document.getElementById('searchPillSeries').classList.toggle('active', type === 'series');
      document.getElementById('searchPillMovie').classList.toggle('active', type === 'movie');
      handleSearchInput();
    }

    function handleSearchInput() {
      const inputEl = document.getElementById('searchInputModal');
      const query = inputEl ? inputEl.value.trim().toLowerCase() : '';
      const resultsList = document.getElementById('searchResultsList');

      clearTimeout(searchTimer);
      if (query === '') {
        resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>';
        return;
      }

      searchTimer = setTimeout(() => {
        const searchItems = masterList.filter(item => {
          const titleStr = (item.title || item.name || '').toLowerCase();
          const slugStr = (item.slug || '').toLowerCase();
          const matches = titleStr.includes(query) || slugStr.includes(query);
          if (!matches) return false;
          if (currentSearchType === 'movie') return isMovieItem(item);
          if (currentSearchType === 'series') return !isMovieItem(item);
          return true;
        });

        resultsList.innerHTML = '';
        if (searchItems.length > 0) {
          searchItems.forEach(item => {
            const card = document.createElement('a');
            card.className = 'search-item-card';
            card.href = `/donghua/${encodeURIComponent(item.slug)}`;
            card.innerHTML = `
              <div class="search-item-thumb">
                <img src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
                <span class="badge-cover-ep">${parseEpisodeText(item)}</span>
              </div>
              <div class="search-item-info">
                <div class="search-item-title">${sanitizeTitle(item.title)}</div>
                <div class="search-item-desc">Status: ${parseStatusText(item)} • ${isMovieItem(item) ? 'Movie' : 'Donghua'}</div>
              </div>
            `;
            resultsList.appendChild(card);
          });
        } else {
          resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Tidak ditemukan hasil yang cocok.</p>';
        }
      }, 150);
    }

    function renderHeroSlider(items) {
      const slider = document.getElementById('heroSlider');
      if (!slider) return;
      slider.innerHTML = '';

      const sliderItems = items.slice(0, 5);
      sliderItems.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
        slide.innerHTML = `
          <img class="hero-bg-img" src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
          <div class="hero-blur-layer"></div>
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="badge-tag ${isMovieItem(item) ? 'movie' : ''}">${isMovieItem(item) ? 'MOVIE' : 'DONGHUA'}</span>
            <h1 class="hero-title">${sanitizeTitle(item.title)}</h1>
            <div class="hero-meta">
              <span class="rating-star">★ 9.0</span>
              <span>•</span>
              <span class="badge-status-green">${parseStatusText(item)}</span>
              <span>•</span>
              <span>${parseEpisodeText(item)}</span>
            </div>
            <a href="/donghua/${encodeURIComponent(item.slug)}" class="btn-watch">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Tonton
            </a>
          </div>
        `;
        slider.appendChild(slide);
      });

      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'slider-dots';
      sliderItems.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setSlide(index);
        dotsContainer.appendChild(dot);
      });
      slider.appendChild(dotsContainer);

      clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        let next = (currentSlide + 1) % sliderItems.length;
        setSlide(next);
      }, 4000);
    }

    function setSlide(index) {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.dot');
      if (slides.length === 0) return;
      slides[currentSlide].classList.remove('active');
      if (dots[currentSlide]) dots[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');
      if (dots[currentSlide]) dots[currentSlide].classList.add('active');
    }

    /* RENDER LANJUTKAN MENONTON: HANYA MUNCUL JIKA ADA DATA TONTONAN ASLI */
    function renderContinueWatching() {
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');
      if (!container || !row) return;

      let historyList = [];
      try {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      } catch (_) {
        historyList = [];
      }

      // JIKA KOSONG / BELUM ADA TONTONAN, SEMBUNYIKAN PENUH
      if (!Array.isArray(historyList) || historyList.length === 0) {
        container.style.setProperty('display', 'none', 'important');
        row.innerHTML = '';
        return;
      }

      // JIKA ADA RIWAYAT, TAMPILKAN KONTAINER & RENDER CARD
      container.style.removeProperty('display');
      container.style.display = 'block';
      row.innerHTML = '';

      historyList.slice(0, 10).forEach((item) => {
        const card = document.createElement('a');
        card.className = 'continue-card-item';
        card.href = `/donghua/${encodeURIComponent(item.slug || item.mainPath)}`;
        
        const posterUrl = item.poster || item.cover || 'https://via.placeholder.com/300x200?text=No+Cover';
        const rawEp = String(item.episode || 'Ep 1').replace(/[^0-9]/g, '');
        const displayEps = `Eps ${rawEp || '1'}`;
        const progressTime = item.progressTime || '00:04';
        const durationTime = item.durationTime || '24:02';

        card.innerHTML = `
          <div class="continue-thumb-box">
            <img src="${posterUrl}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" />
            <span class="continue-eps-text">${displayEps}</span>
          </div>
          <div class="continue-item-title" title="${item.title}">${item.title}</div>
          <div class="continue-time-row">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>${progressTime} / ${durationTime}</span>
          </div>
        `;
        row.appendChild(card);
      });
    }

    function createPopularFeaturedCard(item) {
      const card = document.createElement('a');
      card.className = 'popular-featured-card';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;
      const titleText = sanitizeTitle(item.title);
      const isMovie = isMovieItem(item);
      const epNum = item['latest-episode'] || (item.episode ? item.episode.replace(/[^0-9]/g, '') : '1');
      const badgeText = isMovie ? 'Movie' : `Ep ${epNum} / ${parseStatusText(item) === 'COMPLETED' ? 'Completed' : 'Ongoing'}`;
      const synopsisText = item.synopsis || item.description || item.desc || `${titleText} menceritakan petualangan kultivasi tanpa sihir yang penuh pertempuran hebat di benua spiritual melawan takdir.`;
      const genresFormatted = Array.isArray(item.genres) && item.genres.length > 0 ? item.genres.join(' • ') : 'Action • Adventure • Fantasy';

      card.innerHTML = `
        <div class="featured-thumb-box">
          <img src="${getImageUrl(item)}" alt="${titleText}" loading="lazy" referrerpolicy="no-referrer" />
        </div>
        <div class="featured-info-col">
          <div class="featured-text-top">
            <h3 class="featured-title">${titleText}</h3>
            <p class="featured-synopsis clamp-3">${synopsisText}</p>
            <div class="featured-genres">${genresFormatted}</div>
          </div>
          <div class="featured-pill-btn">
            <span>${badgeText}</span>
          </div>
        </div>
      `;
      return card;
    }

    function createGridCard(item) {
      const card = document.createElement('a');
      card.className = 'card-grid';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;
      const isMovie = isMovieItem(item);

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${getImageUrl(item)}" alt="${sanitizeTitle(item.title)}" loading="lazy" referrerpolicy="no-referrer" />
          <span class="badge-ep ${isMovie ? 'movie' : ''}">${isMovie ? 'MOVIE' : parseStatusText(item)}</span>
          <div class="card-bottom-info">
            <span class="badge-bottom ${isMovie ? 'movie' : ''}">${isMovie ? parseStatusText(item) : parseEpisodeText(item)}</span>
          </div>
        </div>
        <div class="card-title">${sanitizeTitle(item.title)}</div>
      `;
      return card;
    }

    async function loadMainData() {
      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error();
        masterList = await res.json();

        donghuaList = masterList.filter(item => !isMovieItem(item));
        movieList = masterList.filter(item => isMovieItem(item));

        renderHeroSlider(masterList);

        // Render Populer Hari Ini
        const popRow = document.getElementById('todayPopularRow');
        popRow.innerHTML = '';
        masterList.slice(0, 6).forEach(item => popRow.appendChild(createPopularFeaturedCard(item)));

        // Render Donghua Terbaru
        const latestGrid = document.getElementById('latestGrid');
        latestGrid.innerHTML = '';
        donghuaList.slice(0, 12).forEach(item => latestGrid.appendChild(createGridCard(item)));

        // Render Movie Terbaru
        const movieGrid = document.getElementById('movieGrid');
        movieGrid.innerHTML = '';
        movieList.slice(0, 12).forEach(item => movieGrid.appendChild(createGridCard(item)));

        // Render Donghua Populer
        const popAllGrid = document.getElementById('popularAllGrid');
        popAllGrid.innerHTML = '';
        donghuaList.slice(6, 12).forEach(item => popAllGrid.appendChild(createPopularFeaturedCard(item)));

      } catch (_) {}
    }

    // Refresh riwayat saat halaman dimuat atau kembali dibuka
    window.addEventListener('pageshow', renderContinueWatching);
    window.addEventListener('DOMContentLoaded', () => {
      renderContinueWatching();
      loadMainData();
    });
  </script>
</body>
</html>
