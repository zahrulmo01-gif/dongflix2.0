<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Dongflix - Streaming Donghua & Movie Sub Indo</title>

  <!-- MODERN FONTS: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #030712;
      --bg-card: #0b0f19;
      --bg-card-hover: #111827;
      --bg-skeleton: #131b2e;
      --bg-header-scrolled: rgba(3, 7, 18, 0.88);
      --bg-search-input: #0b0f19;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-movie: #f59e0b;
      --color-star: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(56, 189, 248, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      padding-bottom: 50px; 
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .brand-title, .dialog-title {
      font-family: 'Outfit', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .container { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

    .icon-svg { 
      width: 18px; 
      height: 18px; 
      fill: none; 
      stroke: currentColor; 
      stroke-width: 1.9; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      display: inline-block; 
      vertical-align: middle; 
      flex-shrink: 0;
    }

    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    .skeleton { background-color: var(--bg-skeleton); animation: skeletonPulse 1.6s infinite ease-in-out; border-radius: 12px; }
    .skeleton-hero { width: 100%; height: 520px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 24px 20px 48px; }
    .skeleton-text { height: 14px; margin-bottom: 8px; border-radius: 6px; }
    .skeleton-text.title { height: 28px; width: 65%; margin-bottom: 12px; }
    .skeleton-text.sub { height: 14px; width: 40%; margin-bottom: 18px; }
    .skeleton-btn { height: 42px; width: 125px; border-radius: 12px; }

    .card-skeleton { width: 100%; }
    .card-skeleton-img { width: 100%; height: 185px; border-radius: 14px; margin-bottom: 10px; border: 1px solid var(--border-color); }
    .card-skeleton-title { height: 14px; width: 85%; margin-bottom: 5px; }
    .card-skeleton-sub { height: 12px; width: 50%; }

    .no-image-box {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0f19;
      display: flex; align-items: center; justify-content: center;
      color: #475569; font-size: 11px; font-weight: 800;
      letter-spacing: 0.5px; z-index: 1;
    }

    /* HEADER & FLOATING NAVBAR */
    header { 
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; 
      padding: 12px 14px; pointer-events: none; 
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    .header-content { 
      max-width: 100%; width: 100%; margin: 0 auto; 
      display: flex; justify-content: space-between; align-items: center; 
      height: 52px; padding: 0 10px; border-radius: 26px; pointer-events: auto; 
      background: transparent; border: 1px solid transparent; 
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    header.scrolled { padding: 10px 18px; }
    header.scrolled .header-content { 
      max-width: 900px; padding: 0 18px; 
      background: var(--bg-header-scrolled); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); 
    }
    
    .header-normal-group { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .header-left-group { display: flex; align-items: center; gap: 10px; }
    .header-right-group { display: flex; align-items: center; gap: 8px; }

    .brand-logo-badge {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .brand-logo-badge svg { width: 17px; height: 17px; fill: #ffffff; }

    .brand-title { 
      font-size: 22px; font-weight: 900; color: #ffffff; 
      letter-spacing: -0.3px; text-decoration: none; 
      display: flex; align-items: center; gap: 9px;
    }
    .brand-title span { color: var(--color-accent); }

    .icon-circle-btn { 
      background: rgba(255, 255, 255, 0.06); 
      backdrop-filter: blur(10px);
      color: var(--text-main); 
      border-radius: 50%; width: 40px; height: 40px; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: all 0.2s ease;
    }
    .icon-circle-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--color-accent);
      transform: translateY(-1px);
    }
    .icon-circle-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* MENU DROPDOWN */
    .menu-dropdown { 
      display: none; position: absolute; top: 62px; right: 18px; 
      background: #090e17; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 16px; padding: 6px; min-width: 210px; 
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85); 
      z-index: 101; 
      backdrop-filter: blur(20px);
    }
    .menu-dropdown.active { display: block; animation: dropIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    .menu-dropdown a { 
      display: flex; align-items: center; gap: 11px; 
      padding: 11px 14px; color: var(--text-sub); 
      text-decoration: none; font-size: 13px; font-weight: 600; 
      border-radius: 10px; cursor: pointer; transition: all 0.15s;
    }
    .menu-dropdown a svg { width: 17px; height: 17px; stroke: #94a3b8; }
    .menu-dropdown a:hover { 
      background: rgba(56, 189, 248, 0.12); 
      color: var(--color-accent); 
    }
    .menu-dropdown a:hover svg { stroke: var(--color-accent); }

    /* SEARCH MODAL */
    .modal-overlay { 
      display: none; position: fixed; inset: 0; 
      background: rgba(3, 7, 18, 0.96); 
      backdrop-filter: blur(12px);
      z-index: 999; padding: 18px 16px; overflow-y: auto; 
    }
    .modal-overlay.active { display: block; }

    .search-modal-header { display: flex; align-items: center; gap: 12px; max-width: 800px; margin: 0 auto 16px; }
    .search-input-box { flex: 1; position: relative; display: flex; align-items: center; }
    .search-input-box svg { position: absolute; left: 16px; width: 19px; height: 19px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .search-input-field { 
      width: 100%; height: 48px; 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      border-radius: 14px; padding: 0 16px 0 46px; 
      color: var(--text-main); font-size: 15px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .search-input-field:focus { border-color: var(--color-accent); }
    .modal-close-btn { 
      background: rgba(255, 255, 255, 0.06); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); cursor: pointer; 
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; 
    }
    .modal-close-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    .search-info-bar { max-width: 800px; margin: 0 auto 18px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .search-badge-source { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 10px; border-radius: 10px; font-weight: 700; font-size: 11.5px; }
    .search-results-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .search-item-card { 
      display: flex; gap: 14px; background: var(--bg-card); 
      border: 1px solid var(--border-color); border-radius: 14px; 
      padding: 12px; cursor: pointer; text-decoration: none; 
      transition: all 0.2s ease;
    }
    .search-item-card:hover {
      border-color: var(--border-color-hover);
      background: var(--bg-card-hover);
    }
    
    .search-item-thumb { 
      width: 76px; height: 102px; border-radius: 10px; 
      flex-shrink: 0; background: #0b0f19; position: relative; overflow: hidden; 
    }
    .search-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .search-item-info { display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .search-item-title { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .search-item-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
    .search-item-ep { font-size: 12px; font-weight: 700; color: var(--color-accent); margin-top: 6px; }

    /* DIALOG MODAL (POPUP LIHAT SEMUA) */
    .dialog-header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
    .dialog-title { font-size: 21px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .load-more-btn { 
      display: block; width: 100%; max-width: 800px; margin: 26px auto 0; 
      padding: 13px; background: var(--bg-card); color: var(--color-accent); 
      border: 1px solid var(--border-color); border-radius: 14px; 
      font-weight: 700; font-size: 13.5px; cursor: pointer; text-align: center; 
      transition: all 0.2s;
    }
    .load-more-btn:hover { background: rgba(56, 189, 248, 0.12); border-color: var(--color-accent); }

    /* HERO SLIDER */
    .hero-slider-wrapper { position: relative; width: 100%; height: 520px; overflow: hidden; background: #000; }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease-in-out; display: flex; align-items: flex-end; }
    .hero-slide.active { opacity: 1; z-index: 1; }
    .hero-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { 
      position: absolute; inset: 0; 
      background: linear-gradient(to top, var(--bg-main) 12%, rgba(3, 7, 18, 0.72) 58%, rgba(3, 7, 18, 0.25) 100%); 
      z-index: 1; 
    }
    .hero-content { position: relative; z-index: 2; padding: 24px 20px 48px; max-width: 620px; }
    
    .badge-tag { 
      display: inline-block; background: var(--color-primary); color: #fff; 
      font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 6px; 
      letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; 
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.35);
    }
    .badge-tag.movie { 
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
      color: #000; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35); 
    }
    
    .hero-title { 
      font-size: 27px; font-weight: 900; line-height: 1.25; color: #ffffff; 
      margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.3px;
    }
    .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-sub); font-weight: 600; margin-bottom: 16px; }
    .rating-star { color: var(--color-star); font-weight: 800; display: flex; align-items: center; gap: 4px; }
    .badge-status-green { 
      background: rgba(56, 189, 248, 0.14); color: var(--color-accent); 
      border: 1px solid rgba(56, 189, 248, 0.3); font-size: 10px; 
      font-weight: 800; padding: 2.5px 8px; border-radius: 6px; letter-spacing: 0.5px;
    }
    
    .btn-watch { 
      display: inline-flex; align-items: center; gap: 9px; 
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
      color: #ffffff; border: none; padding: 11px 26px; border-radius: 12px; 
      font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none; 
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45); 
      transition: all 0.2s ease;
    }
    .btn-watch:hover { transform: translateY(-1.5px); box-shadow: 0 8px 24px rgba(2, 132, 199, 0.6); }
    .btn-watch svg { width: 16px; height: 16px; fill: #ffffff; }

    .slider-dots { position: absolute; bottom: 18px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; background: rgba(255, 255, 255, 0.35); border-radius: 50%; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .dot.active { width: 26px; background: var(--color-accent); border-radius: 10px; }

    /* SECTIONS & GRID */
    .section-block { margin-top: 30px; }
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .section-title { 
      font-size: 18.5px; font-weight: 800; margin-bottom: 14px; 
      color: #ffffff; display: flex; align-items: center; gap: 9px; 
      letter-spacing: -0.2px;
    }
    .section-title svg { stroke: var(--color-accent); }
    .section-title.movie-title svg { stroke: var(--color-movie); }

    .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .card-continue { flex: 0 0 calc((100% - 24px) / 3); min-width: calc((100% - 24px) / 3); cursor: pointer; text-decoration: none; display: block; }
    
    .card-continue-img-wrapper, .card-grid-img-wrapper { 
      position: relative; width: 100%; height: 185px; 
      border-radius: 14px; overflow: hidden; background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); 
      transition: all 0.25s ease;
    }
    .card-grid:hover .card-grid-img-wrapper,
    .card-continue:hover .card-continue-img-wrapper { 
      transform: translateY(-3px); 
      border-color: var(--border-color-hover); 
      box-shadow: 0 8px 24px rgba(0,0,0,0.7); 
    }
    .card-continue img, .card-grid img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
    .card-grid:hover img, .card-continue:hover img { transform: scale(1.05); }
    
    .badge-ep { 
      position: absolute; top: 8px; left: 8px; 
      background: rgba(2, 132, 199, 0.9);
      backdrop-filter: blur(6px);
      color: #ffffff; font-size: 9.5px; font-weight: 800; 
      padding: 3.5px 7.5px; border-radius: 7px; z-index: 2; text-transform: uppercase; 
      letter-spacing: 0.3px;
    }
    .badge-ep.movie {
      background: rgba(245, 158, 11, 0.95);
      color: #000;
    }

    .card-bottom-info {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 2; pointer-events: none; gap: 4px;
    }

    .badge-bottom { 
      background: rgba(3, 7, 18, 0.88); 
      backdrop-filter: blur(6px);
      color: var(--color-accent); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      font-size: 9.5px; font-weight: 700; padding: 3px 7px; border-radius: 6px; 
      white-space: nowrap;
    }
    .badge-bottom.movie {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card-grid { cursor: pointer; text-decoration: none; display: block; }
    .card-title { 
      margin-top: 8px; font-size: 12.5px; font-weight: 600; 
      color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;
      transition: color 0.15s;
    }
    .card-grid:hover .card-title { color: #ffffff; }
    
    .see-all-btn { 
      color: var(--color-accent); font-size: 12.5px; font-weight: 700; 
      cursor: pointer; text-decoration: none; border: none; background: none; 
      display: flex; align-items: center; gap: 4px;
      transition: gap 0.2s;
    }
    .see-all-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; }
    .see-all-btn:hover { gap: 6px; }
    .see-all-btn.movie { color: var(--color-movie); }

    footer { 
      margin-top: 55px; padding: 26px 16px; 
      border-top: 1px solid var(--border-color); 
      text-align: center; color: var(--text-muted); font-size: 12.5px; 
    }
    footer a { color: var(--color-accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header id="mainHeader">
    <div class="header-content">
      <div class="header-normal-group">
        <div class="header-left-group">
          <a href="/" class="brand-title">
            <div class="brand-logo-badge">
              <!-- MODERN LOGO ICON -->
              <svg viewBox="0 0 24 24"><path d="M5.5 3.5h13a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2zM9.5 8.5v7l6-3.5-6-3.5z"/></svg>
            </div>
            Dong<span>flix</span>
          </a>
        </div>
        <div class="header-right-group">
          <!-- SEARCH BUTTON -->
          <button class="icon-circle-btn" onclick="openSearchModal()" title="Cari Donghua & Movie">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7.5"/>
              <path d="m20.5 20.5-4-4"/>
            </svg>
          </button>

          <!-- MENU BUTTON -->
          <button class="icon-circle-btn" onclick="toggleMenu()" title="Menu">
            <svg viewBox="0 0 24 24">
              <line x1="3.5" y1="7" x2="20.5" y2="7"/>
              <line x1="3.5" y1="12" x2="20.5" y2="12"/>
              <line x1="3.5" y1="17" x2="20.5" y2="17"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- DROPDOWN MENU -->
      <div class="menu-dropdown" id="menuDropdown">
        <a href="/">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 13 20v-4.5h-2V20A1.5 1.5 0 0 1 9.5 21.5h-5A1.5 1.5 0 0 1 3 20v-9.5z"/>
          </svg>
          Beranda
        </a>
        <a href="/donghua/">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2.5"/>
            <line x1="8" y1="4" x2="8" y2="20"/>
            <line x1="16" y1="4" x2="16" y2="20"/>
          </svg>
          Katalog Donghua
        </a>
        <a href="javascript:void(0)" onclick="openLatestDialog('donghua')">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M12 2.5c1.8 3.5 5 5.5 5 9.5a5 5 0 0 1-10 0c0-2.2 1.2-4.3 2.5-6 .3 1.8 1.5 3 2.5 3 0-2.2 0-4.8 0-6.5z"/>
          </svg>
          Donghua Terbaru
        </a>
        <a href="javascript:void(0)" onclick="openLatestDialog('movie')">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <rect x="2.5" y="3.5" width="19" height="17" rx="3"/>
            <path d="m9.5 8.5 6 3.5-6 3.5v-7z"/>
          </svg>
          Movie Terbaru
        </a>
      </div>
    </div>
  </header>

  <!-- SEARCH MODAL -->
  <div class="modal-overlay" id="searchModalOverlay">
    <div class="search-modal-header">
      <div class="search-input-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
        <input type="text" class="search-input-field" id="searchInputModal" placeholder="Cari donghua atau movie..." onkeyup="handleSearchInput(event)">
      </div>
      <button class="modal-close-btn" onclick="closeSearchModal()">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="search-info-bar">
      <span>Mencari di:</span>
      <span class="search-badge-source">Dongflix Proxy Catalog</span>
    </div>

    <div class="search-results-list" id="searchResultsList">
      <p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>
    </div>
  </div>

  <!-- POPUP DIALOG (LIHAT SEMUA DONGHUA / MOVIE) -->
  <div class="modal-overlay" id="latestModalOverlay">
    <div class="dialog-header">
      <h2 class="dialog-title" id="dialogTitleText">
        <svg class="icon-svg" id="dialogTitleIcon" viewBox="0 0 24 24">
          <path d="M12 2.5c1.8 3.5 5 5.5 5 9.5a5 5 0 0 1-10 0c0-2.2 1.2-4.3 2.5-6 .3 1.8 1.5 3 2.5 3 0-2.2 0-4.8 0-6.5z"/>
        </svg>
        <span>Semua Donghua Terbaru</span>
      </h2>
      <button class="modal-close-btn" onclick="closeLatestDialog()">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div class="container" style="padding: 0;">
      <div class="grid-3" id="latestModalGrid"></div>
      <button class="load-more-btn" id="loadMoreDialogBtn" onclick="loadMoreDialogData()">Muat Lainnya</button>
    </div>
  </div>

  <!-- HERO SLIDER -->
  <div class="hero-slider-wrapper" id="heroSlider">
    <div class="skeleton skeleton-hero">
      <div style="width: 100%;">
        <div class="skeleton skeleton-text title"></div>
        <div class="skeleton skeleton-text sub"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- LANJUTKAN MENONTON -->
    <section class="section-block" id="continueSection" style="display: none;">
      <h2 class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15 15"/>
        </svg>
        Lanjutkan Menonton
      </h2>
      <div class="scroll-row" id="continueRow"></div>
    </section>

    <!-- SECTION 1: DONGHUA TERBARU -->
    <section class="section-block">
      <div class="section-header-flex">
        <h2 class="section-title" style="margin-bottom: 0;">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M12 2.5c1.8 3.5 5 5.5 5 9.5a5 5 0 0 1-10 0c0-2.2 1.2-4.3 2.5-6 .3 1.8 1.5 3 2.5 3 0-2.2 0-4.8 0-6.5z"/>
          </svg>
          Donghua Terbaru
        </h2>
        <button class="see-all-btn" onclick="openLatestDialog('donghua')">
          Lihat Semua
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="grid-3" id="latestGrid" style="margin-top: 14px;">
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
      </div>
    </section>

    <!-- SECTION 2: MOVIE TERBARU -->
    <section class="section-block">
      <div class="section-header-flex">
        <h2 class="section-title movie-title" style="margin-bottom: 0;">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <rect x="2.5" y="3.5" width="19" height="17" rx="3"/>
            <path d="m9.5 8.5 6 3.5-6 3.5v-7z"/>
          </svg>
          Movie Terbaru
        </h2>
        <button class="see-all-btn movie" onclick="openLatestDialog('movie')">
          Lihat Semua
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="grid-3" id="movieGrid" style="margin-top: 14px;">
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
      </div>
    </section>

    <!-- SECTION 3: SEMUA KOLEKSI -->
    <section class="section-block">
      <h2 class="section-title">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        Semua Koleksi
      </h2>
      <div class="grid-3" id="popularAllGrid">
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
        <div class="card-skeleton"><div class="skeleton card-skeleton-img"></div><div class="skeleton card-skeleton-title"></div><div class="skeleton card-skeleton-sub"></div></div>
      </div>
    </section>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 <a href="/">Dongflix</a>. Streaming Donghua & Movie Subtitle Indonesia.</p>
    </div>
  </footer>

  <script>
    let searchTimer = null;
    let currentSlide = 0;
    let slideInterval = null;
    let dialogPage = 1;
    let dialogTargetType = 'donghua';

    let donghuaList = [];
    let movieList = [];
    let masterList = [];

    function sanitizeTitle(rawTitle) {
      if (!rawTitle) return 'Donghua';
      const str = rawTitle.trim();
      const half = Math.floor(str.length / 2);
      if (str.length > 4 && str.slice(0, half) === str.slice(half)) {
        return str.slice(0, half).trim();
      }
      return str;
    }

    function isMovieItem(item) {
      if (!item) return false;
      const typeStr = (item.type || '').toString().toLowerCase();
      const titleStr = `${item.title || ''} ${item.slug || ''}`.toLowerCase();
      return typeStr === 'movie' || titleStr.includes('movie');
    }

    function parseStatusText(item) {
      const rawStatus = (item.status || item.type || '').toString().toLowerCase();
      if (rawStatus.includes('completed') || rawStatus.includes('tamat') || rawStatus.includes('end')) {
        return 'COMPLETED';
      }
      return 'ONGOING';
    }

    function parseEpisodeText(item) {
      if (!item) return 'Ep 1';
      if (isMovieItem(item)) return 'MOVIE';
      return item['latest-episode'] ? `Ep ${item['latest-episode']}` : (item.episode || 'Ep 1');
    }

    function getImageUrl(item) {
      return item.cover || item.thumbnail || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
    }

    function handleMissingImage(imgElement) {
      if (!imgElement) return;
      const wrapper = imgElement.parentElement;
      if (!wrapper) return;
      imgElement.style.display = 'none';
      if (!wrapper.querySelector('.no-image-box')) {
        const noImg = document.createElement('div');
        noImg.className = 'no-image-box';
        noImg.innerText = 'No Image';
        wrapper.insertBefore(noImg, wrapper.firstChild);
      }
    }

    window.addEventListener('scroll', () => {
      const header = document.getElementById('mainHeader');
      if (window.scrollY > 15) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    }, { passive: true });

    function toggleMenu() { document.getElementById('menuDropdown').classList.toggle('active'); }
    function openSearchModal() { document.getElementById('searchModalOverlay').classList.add('active'); document.getElementById('searchInputModal').focus(); }
    function closeSearchModal() { document.getElementById('searchModalOverlay').classList.remove('active'); }

    function openLatestDialog(type = 'donghua') {
      document.getElementById('menuDropdown').classList.remove('active');
      document.getElementById('latestModalOverlay').classList.add('active');
      
      dialogTargetType = type;
      dialogPage = 1;

      const titleSpan = document.querySelector('#dialogTitleText span');
      const titleIcon = document.getElementById('dialogTitleIcon');

      if (titleSpan) {
        titleSpan.innerText = type === 'movie' ? 'Semua Movie Terbaru' : 'Semua Donghua Terbaru';
      }

      if (titleIcon) {
        if (type === 'movie') {
          titleIcon.innerHTML = '<rect x="2.5" y="3.5" width="19" height="17" rx="3"/><path d="m9.5 8.5 6 3.5-6 3.5v-7z"/>';
          titleIcon.style.stroke = 'var(--color-movie)';
        } else {
          titleIcon.innerHTML = '<path d="M12 2.5c1.8 3.5 5 5.5 5 9.5a5 5 0 0 1-10 0c0-2.2 1.2-4.3 2.5-6 .3 1.8 1.5 3 2.5 3 0-2.2 0-4.8 0-6.5z"/>';
          titleIcon.style.stroke = 'var(--color-accent)';
        }
      }

      loadMoreDialogData();
    }

    function closeLatestDialog() { document.getElementById('latestModalOverlay').classList.remove('active'); }

    function loadMoreDialogData() {
      const btn = document.getElementById('loadMoreDialogBtn');
      const grid = document.getElementById('latestModalGrid');
      
      const currentSource = dialogTargetType === 'movie' ? movieList : donghuaList;
      const pageSize = 12;
      const startIndex = (dialogPage - 1) * pageSize;
      const endIndex = startIndex + pageSize;
      
      const pagedData = currentSource.slice(startIndex, endIndex);

      if (dialogPage === 1) grid.innerHTML = '';

      if (pagedData.length > 0) {
        pagedData.forEach(item => {
          grid.appendChild(createGridCard(item));
        });
        dialogPage++;
        
        if (endIndex >= currentSource.length) {
          btn.innerText = 'Semua data telah ditampilkan';
        } else {
          btn.innerText = 'Muat Lainnya';
        }
      } else {
        if (dialogPage === 1) grid.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; grid-column: span 3; text-align:center;">Data tidak tersedia.</p>';
        btn.innerText = 'Tidak ada data lagi';
      }
    }

    function handleSearchInput(event) {
      const query = event.target.value.trim().toLowerCase();
      const resultsList = document.getElementById('searchResultsList');

      clearTimeout(searchTimer);
      if (query === '') {
        resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Ketik judul yang ingin dicari...</p>';
        return;
      }

      resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Mencari...</p>';

      searchTimer = setTimeout(() => {
        const searchItems = masterList.filter(item => {
          const titleStr = (item.title || item.name || '').toLowerCase();
          const slugStr = (item.slug || '').toLowerCase();
          return titleStr.includes(query) || slugStr.includes(query);
        });

        resultsList.innerHTML = '';
        if (searchItems && searchItems.length > 0) {
          searchItems.forEach(item => {
            const card = document.createElement('a');
            card.className = 'search-item-card';
            card.href = `/donghua/${encodeURIComponent(item.slug)}`;

            const posterUrl = getImageUrl(item);
            const titleText = sanitizeTitle(item.title);
            const isMovie = isMovieItem(item);

            card.innerHTML = `
              <div class="search-item-thumb">
                <img src="${posterUrl}" alt="${titleText}" loading="lazy" referrerpolicy="no-referrer" onerror="handleMissingImage(this)" />
              </div>
              <div class="search-item-info">
                <div>
                  <div class="search-item-title">${titleText}</div>
                  <div class="search-item-desc">Status: ${item.status || 'Ongoing'} • ${isMovie ? 'Movie' : 'Donghua'}</div>
                </div>
                <div class="search-item-ep" style="color: ${isMovie ? 'var(--color-movie)' : 'var(--color-accent)'}; font-family: 'JetBrains Mono', monospace;">
                  ${parseEpisodeText(item)}
                </div>
              </div>
            `;
            resultsList.appendChild(card);
          });
        } else {
          resultsList.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 40px;">Tidak ditemukan hasil yang cocok.</p>';
        }
      }, 200);
    }

    function renderHeroSlider(items) {
      const slider = document.getElementById('heroSlider');
      if (!slider) return;
      slider.innerHTML = '';

      const sliderItems = items.slice(0, 5);
      sliderItems.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
        
        const isMovie = isMovieItem(item);
        const epText = parseEpisodeText(item);
        const statusText = parseStatusText(item);
        const posterUrl = getImageUrl(item);
        const titleText = sanitizeTitle(item.title);

        slide.innerHTML = `
          <img class="hero-bg-img" src="${posterUrl}" alt="${titleText}" loading="lazy" referrerpolicy="no-referrer" onerror="handleMissingImage(this)" />
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <span class="badge-tag ${isMovie ? 'movie' : ''}">${isMovie ? 'MOVIE' : 'DONGHUA'}</span>
            <h1 class="hero-title">${titleText}</h1>
            <div class="hero-meta">
              <span class="rating-star">
                <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;stroke:none;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                9.4
              </span>
              <span>•</span>
              <span class="badge-status-green">${statusText}</span>
              <span>•</span>
              <span class="font-mono">${epText}</span>
            </div>
            <a href="/donghua/${encodeURIComponent(item.slug)}" class="btn-watch">
              <!-- PLAY MODERN ICON -->
              <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:currentColor;"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              Tonton Sekarang
            </a>
          </div>
        `;
        slider.appendChild(slide);
      });

      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'slider-dots';
      dotsContainer.id = 'sliderDots';

      sliderItems.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => setSlide(index);
        dotsContainer.appendChild(dot);
      });

      slider.appendChild(dotsContainer);
      startSliderAutoPlay(sliderItems.length);
    }

    function setSlide(index) {
      const slides = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.dot');
      if (slides.length === 0) return;

      slides[currentSlide].classList.remove('active');
      if (dots[currentSlide]) dots[currentSlide].classList.remove('active');

      currentSlide = index;

      slides[currentSlide].classList.add('active');
      if (dots[currentSlide]) dots[currentSlide].classList.add('active');
    }

    function startSliderAutoPlay(total) {
      clearInterval(slideInterval);
      slideInterval = setInterval(() => {
        let next = (currentSlide + 1) % total;
        setSlide(next);
      }, 4000);
    }

    function createGridCard(item) {
      const card = document.createElement('a');
      card.className = 'card-grid';
      card.href = `/donghua/${encodeURIComponent(item.slug)}`;

      const isMovie = isMovieItem(item);
      const episodeText = parseEpisodeText(item);
      const statusText = parseStatusText(item);
      const titleText = sanitizeTitle(item.title);
      const posterUrl = getImageUrl(item);

      card.innerHTML = `
        <div class="card-grid-img-wrapper">
          <img src="${posterUrl}" alt="${titleText}" loading="lazy" referrerpolicy="no-referrer" onerror="handleMissingImage(this)" />
          <span class="badge-ep ${isMovie ? 'movie' : ''}">${isMovie ? 'MOVIE' : statusText}</span>
          <div class="card-bottom-info">
            <span class="badge-bottom ${isMovie ? 'movie' : ''}">${isMovie ? statusText : episodeText}</span>
          </div>
        </div>
        <div class="card-title">${titleText}</div>
      `;

      return card;
    }

    function renderGridItems(list, targetElement) {
      if (!targetElement) return;
      targetElement.innerHTML = '';
      if (Array.isArray(list) && list.length > 0) {
        list.forEach(item => {
          if (item && item.title) targetElement.appendChild(createGridCard(item));
        });
      } else {
        targetElement.innerHTML = '<p style="color: var(--text-muted); font-size: 12px; grid-column: span 3;">Data tidak tersedia.</p>';
      }
    }

    async function loadMainData() {
      const latestGrid = document.getElementById('latestGrid');
      const movieGrid = document.getElementById('movieGrid');
      const popAllGrid = document.getElementById('popularAllGrid');

      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('API Proxy gagal memuat data');
        
        masterList = await res.json();

        // Pisahkan data Serial Donghua dan Movie
        donghuaList = masterList.filter(item => !isMovieItem(item));
        movieList = masterList.filter(item => isMovieItem(item));

        // 1. Render Hero Slider (5 data teratas)
        renderHeroSlider(masterList);

        // 2. Render Donghua Terbaru (6 data serial)
        renderGridItems(donghuaList.slice(0, 6), latestGrid);

        // 3. Render Movie Terbaru (6 data movie)
        renderGridItems(movieList.slice(0, 6), movieGrid);

        // 4. Render Semua Koleksi (Campuran)
        renderGridItems(masterList.slice(6, 30), popAllGrid);

      } catch (e) {
        console.error("Gagal memuat data via API:", e);
        if (latestGrid) latestGrid.innerHTML = `<p style="color: #ef4444; font-size: 12px; grid-column: span 3;">Gagal memuat katalog donghua.</p>`;
        if (movieGrid) movieGrid.innerHTML = `<p style="color: #ef4444; font-size: 12px; grid-column: span 3;">Gagal memuat movie terbaru.</p>`;
      }
    }

    function renderContinueWatching() {
      const container = document.getElementById('continueSection');
      const row = document.getElementById('continueRow');
      if (!container || !row) return;

      const historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      if (!historyList || historyList.length === 0) { 
        container.style.display = 'none'; 
        return; 
      }

      container.style.display = 'block';
      row.innerHTML = '';

      historyList.forEach((item) => {
        const card = document.createElement('a');
        card.className = 'card-continue';
        card.href = `/donghua/${encodeURIComponent(item.slug || item.mainPath)}`;
        
        const posterUrl = item.poster || item.cover || 'https://via.placeholder.com/300x400?text=No+Cover';
        const displayEp = item.episode || 'Ep 1';

        card.innerHTML = `
          <div class="card-continue-img-wrapper">
            <img src="${posterUrl}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" onerror="handleMissingImage(this)" />
            <span class="badge-ep">${displayEp}</span>
          </div>
          <div class="card-title">${item.title}</div>
        `;
        row.appendChild(card);
      });
    }

    window.onload = () => {
      loadMainData();
      renderContinueWatching();
    };
  </script>
</body>
</html>
