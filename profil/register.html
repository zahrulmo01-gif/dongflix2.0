<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daftar Akun - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">

  <style>
    :root {
      --bg-base: #000000;
      --bg-card: rgba(18, 22, 34, 0.75);
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
      --color-red: #ef4444;
      --color-green: #22c55e;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-xl: 24px;
      --radius-md: 12px;
      --radius-btn: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.25) 0%, transparent 75%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .register-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 10;
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .brand-sub { font-size: 13px; color: var(--text-sub); margin-top: 6px; }

    .form-group { margin-bottom: 16px; position: relative; }
    .form-label {
      display: block; font-size: 11px; font-weight: 700; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .form-input {
      width: 100%; height: 44px; background: rgba(5, 8, 17, 0.85); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 0 14px; color: #fff; font-size: 13.5px; outline: none;
    }
    .form-input:focus { border-color: var(--color-accent); }
    .form-input.input-error { border-color: var(--color-red); }
    .form-input.input-success { border-color: var(--color-green); }

    .input-hint { font-size: 11.5px; margin-top: 5px; display: none; font-weight: 600; }
    .input-hint.error { color: var(--color-red); display: block; }
    .input-hint.success { color: var(--color-green); display: block; }
    .input-hint.loading { color: var(--text-sub); display: block; }

    .btn-submit {
      width: 100%; height: 46px; background: #ffffff; color: #000000; border: none;
      border-radius: var(--radius-btn); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-sub); }
    .footer-links a { color: var(--color-accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="register-card">
    <div class="brand-header">
      <div class="brand-title">Daftar Akun Baru</div>
      <div class="brand-sub">Bergabung ke Dongflix untuk menyimpan koleksi & riwayat</div>
    </div>

    <form onsubmit="handleRegister(event)">
      <!-- Username -->
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" id="regUsername" class="form-input" placeholder="contoh: rulsz" required autocomplete="off" pattern="^[a-zA-Z0-9_]{3,20}$">
        <div id="usernameStatus" class="input-hint"></div>
      </div>

      <!-- Nama Lengkap -->
      <div class="form-group">
        <label class="form-label">Nama Lengkap *</label>
        <input type="text" id="regName" class="form-input" placeholder="Nama Anda" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input type="email" id="regEmail" class="form-input" placeholder="nama@email.com" required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" id="regPassword" class="form-input" placeholder="Minimal 6 karakter" minlength="6" required>
      </div>

      <button type="submit" id="btnSubmitRegister" class="btn-submit">Daftar Sekarang</button>
    </form>

    <div class="footer-links">
      Sudah punya akun? <a href="/profil/login.html">Masuk di sini</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/assets/firebase-config.js';
    import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const usernameInput = document.getElementById('regUsername');
    const usernameStatus = document.getElementById('usernameStatus');
    const submitBtn = document.getElementById('btnSubmitRegister');

    let isUsernameAvailable = false;
    let checkTimeout = null;
    let isSubmitting = false; // Mencegah onAuthStateChanged redirect duluan saat pendaftaran berlangsung

    // Format email key untuk Firebase Realtime Database
    function getDbKey(email) {
      return email.toLowerCase().trim().replace(/\./g, ',');
    }

    // Auto-redirect jika pengguna SUDAH login sebelumnya saat membuka halaman ini
    onAuthStateChanged(auth, async (user) => {
      if (user && !isSubmitting) {
        try {
          const emailKey = getDbKey(user.email);
          const userSnap = await get(ref(db, `users/${emailKey}`));
          if (userSnap.exists() && userSnap.val().username) {
            window.location.href = `/profil/${userSnap.val().username}`;
          } else {
            window.location.href = '/profil/';
          }
        } catch (_) {}
      }
    });

    // Pengecekan username secara langsung ke node users
    async function checkUsernameAvailability(username) {
      const cleanUsername = username.trim().toLowerCase();
      if (cleanUsername.length < 3) {
        usernameStatus.className = 'input-hint error';
        usernameStatus.innerText = 'Username minimal 3 karakter.';
        usernameInput.className = 'form-input input-error';
        isUsernameAvailable = false;
        return;
      }

      usernameStatus.className = 'input-hint loading';
      usernameStatus.innerText = 'Memeriksa ketersediaan...';

      try {
        const usersRef = ref(db, 'users');
        const snap = await get(usersRef);
        let isTaken = false;

        if (snap.exists()) {
          const data = snap.val();
          for (const key in data) {
            if (data[key]?.username && String(data[key].username).toLowerCase() === cleanUsername) {
              isTaken = true;
              break;
            }
          }
        }

        if (isTaken) {
          usernameStatus.className = 'input-hint error';
          usernameStatus.innerText = `Username "${cleanUsername}" sudah digunakan!`;
          usernameInput.className = 'form-input input-error';
          isUsernameAvailable = false;
        } else {
          usernameStatus.className = 'input-hint success';
          usernameStatus.innerText = `Username "${cleanUsername}" tersedia!`;
          usernameInput.className = 'form-input input-success';
          isUsernameAvailable = true;
        }
      } catch (err) {
        console.error('Error cek username:', err);
        // Jika pembacaan gagal, biarkan tetap true agar user tidak terhalang
        isUsernameAvailable = true;
      }
    }

    usernameInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\s+/g, '').toLowerCase();
      clearTimeout(checkTimeout);
      const val = e.target.value.trim();

      if (!val) {
        usernameStatus.style.display = 'none';
        usernameInput.className = 'form-input';
        isUsernameAvailable = false;
        return;
      }

      checkTimeout = setTimeout(() => {
        checkUsernameAvailability(val);
      }, 400);
    });

    // PROSES REGISTRASI & PENULISAN DATABASE
    window.handleRegister = async function(e) {
      e.preventDefault();

      const username = usernameInput.value.trim().toLowerCase();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!username || !name || !email || !password) {
        alert('Semua kolom formulir wajib diisi!');
        return;
      }

      if (!isUsernameAvailable) {
        alert('Username belum tersedia atau sudah digunakan. Silakan pilih username lain.');
        return;
      }

      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.innerText = 'Mendaftarkan akun...';

      try {
        // 1. Buat User di Firebase Auth
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        // 2. Set Display Name
        try {
          await updateProfile(user, { displayName: name });
        } catch (_) {}

        // 3. Format key email
        const emailKey = getDbKey(email);

        // 4. Struktur data profil lengkap
        const newUserData = {
          createdAt: Date.now(),
          email: email,
          name: name,
          photoURL: '',
          status: 'user',
          username: username,
          bio: '',
          level: 1,
          followersCount: 0,
          followingCount: 0
        };

        // 5. Tulis langsung ke database users/{emailKey}
        const userRef = ref(db, `users/${emailKey}`);
        await set(userRef, newUserData);

        // Berikan jeda kecil agar proses socket Firebase tuntas sebelum pindah URL
        setTimeout(() => {
          window.location.href = `/profil/${username}`;
        }, 500);

      } catch (err) {
        console.error('Pendaftaran Gagal:', err);
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Daftar Sekarang';
        
        let msg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          msg = 'Email ini sudah terdaftar. Silakan login.';
        }
        alert('Gagal mendaftar: ' + msg);
      }
    };
  </script>
</body>
</html>
