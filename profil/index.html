<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profil Saya - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="../image/IMG_6395.png">
  <link rel="apple-touch-icon" href="../image/IMG_6395.png">

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    :root {
      --bg-base: #000000;
      --bg-card: rgba(18, 22, 34, 0.65);
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-surface-hover: rgba(255, 255, 255, 0.08);
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
      --color-gold: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: 64px;
      padding-bottom: 70px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow-top {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 280px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.2) 0%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    /* HEADER: BERSIH & TANPA GRADASI GELAP */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: transparent;
      padding: 10px 16px;
    }

    .header-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-circle-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .icon-circle-btn:active { transform: scale(0.95); }
    .icon-circle-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
    }

    /* HERO CARD PROFILE */
    .profile-hero {
      background: var(--bg-card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 28px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .avatar-container {
      position: relative;
      margin-bottom: 14px;
    }

    .avatar-wrapper {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      border: 3px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.45);
      overflow: hidden;
      cursor: pointer;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .avatar-edit-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #0284c7;
      border: 2px solid #000;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .avatar-edit-badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .user-name {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      font-weight: 500;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 9999px;
    }

    .badge-level {
      background: rgba(56, 189, 248, 0.15);
      color: var(--color-accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .badge-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #000;
      font-weight: 900;
    }

    /* STATS STRIP */
    .stats-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
      padding: 14px 10px;
      margin-top: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-box:last-child { border-right: none; }

    .stat-num {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* SECTION TITLE */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 4px 12px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* MENU LIST (iOS STYLE) */
    .menu-group {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .menu-item {
      width: 100%;
      background: transparent;
      border: none;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg-surface-hover); }

    .menu-item-left { display: flex; align-items: center; gap: 12px; }

    .menu-icon-wrap {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .menu-icon-wrap svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .icon-blue { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); }
    .icon-amber { background: rgba(245, 158, 11, 0.15); color: var(--color-gold); }
    .icon-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .menu-chevron svg { width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2.5; }
    .btn-item-logout { color: #f87171; }

    /* SCROLL HORIZONTAL WRAPPERS */
    .scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-row::-webkit-scrollbar { display: none; }

    /* KOLEKSI FAVORIT (SCROLL HORIZONTAL) */
    .fav-card {
      flex: 0 0 130px;
      min-width: 130px;
      max-width: 130px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .fav-card:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.35); }

    .fav-poster-wrap {
      width: 100%;
      height: 180px;
      background: #090d16;
      overflow: hidden;
    }
    .fav-poster-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .fav-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #f1f5f9;
      padding: 8px 10px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* RIWAYAT NONTON (UI SEPERTI DI BERANDA) */
    .history-card {
      flex: 0 0 230px;
      min-width: 230px;
      max-width: 230px;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .history-card:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.35); }

    .history-cover-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #090d16;
      position: relative;
      overflow: hidden;
    }
    .history-cover-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .history-play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .history-play-icon svg {
      width: 32px; height: 32px;
      color: #fff;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
    }

    .history-ep-badge {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(2, 132, 199, 0.9);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .history-progress-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
    }
    .history-progress-fill {
      height: 100%;
      background: var(--color-primary);
      width: 65%;
    }

    .history-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 24px;
      position: relative;
    }

    .modal-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 16px; }
    .modal-close {
      position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-sub);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .form-input {
      width: 100%; height: 42px; background: #050811; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 0 12px; color: #fff; font-size: 13px; outline: none;
    }
    .form-input:focus { border-color: var(--color-accent); }
    .btn-submit {
      width: 100%; height: 44px; background: var(--color-primary); color: #fff; border: none;
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow-top"></div>

  <header>
    <div class="header-content">
      <div class="header-left-group" onclick="window.location.href='/'">
        <button class="icon-circle-btn">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="brand-title">Profil Saya</span>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- HERO PROFILE -->
    <div class="profile-hero">
      <div class="avatar-container">
        <div class="avatar-wrapper" id="profileAvatar" onclick="openModal('modalPhoto')">
          <span id="avatarInitial">U</span>
        </div>
        <div class="avatar-edit-badge" onclick="openModal('modalPhoto')">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
      </div>

      <div class="user-name" id="userName">Memuat...</div>
      <div class="user-email" id="userEmail">...</div>

      <div class="badges-row">
        <span class="badge-pill badge-level" id="badgeLevel">Lv1</span>
        <span class="badge-pill badge-admin" id="badgeAdmin" style="display: none;">★ ADMIN</span>
      </div>

      <!-- STATISTIK -->
      <div class="stats-card">
        <div class="stat-box">
          <span class="stat-num" id="statFollowers">0</span>
          <span class="stat-label">Pengikut</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statFollowing">0</span>
          <span class="stat-label">Mengikuti</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statFavorites">0</span>
          <span class="stat-label">Favorit</span>
        </div>
      </div>
    </div>

    <!-- PENGATURAN AKUN -->
    <div class="section-header">
      <span class="section-title">Pengaturan Akun</span>
    </div>

    <div class="menu-group">
      <button class="menu-item" onclick="openModal('modalName')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-blue">
            <svg viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <span>Ubah Nama Tampilan</span>
        </div>
        <div class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
      </button>

      <button class="menu-item" onclick="openModal('modalPhoto')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-blue">
            <svg viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16m-2-2l1.586-1.586a2 2 0 0 1 2.828 0L20 14m-6-6h.01M6 20h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>
          </div>
          <span>Perbarui Foto Profil</span>
        </div>
        <div class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
      </button>

      <button class="menu-item" onclick="openModal('modalPassword')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-amber">
            <svg viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
          </div>
          <span>Ganti Password</span>
        </div>
        <div class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
      </button>

      <button class="menu-item btn-item-logout" onclick="handleLogout()">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-red">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </div>
          <span>Keluar dari Akun</span>
        </div>
        <div class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
      </button>
    </div>

    <!-- DONGHUA FAVORIT (HORIZONTAL SCROLL) -->
    <div class="section-header">
      <span class="section-title">
        <svg width="15" height="15" fill="currentColor" style="color: var(--color-gold);" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Koleksi Favorit
      </span>
    </div>
    <div class="scroll-row" id="favoritesContainer">
      <p style="color:var(--text-muted);font-size:12px;padding:10px 0;">Memuat favorit...</p>
    </div>

    <!-- RIWAYAT NONTON (CONTINUE WATCHING SEPERTI BERANDA) -->
    <div class="section-header">
      <span class="section-title">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Riwayat Nonton Terakhir
      </span>
    </div>
    <div class="scroll-row" id="historyContainer">
      <p style="color:var(--text-muted);font-size:12px;padding:10px 0;">Memuat riwayat nonton...</p>
    </div>
  </div>

  <!-- MODAL: GANTI NAMA -->
  <div id="modalName" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalName')">&times;</button>
      <div class="modal-title">Ubah Nama Profil</div>
      <form onsubmit="handleSaveName(event)">
        <div class="form-group">
          <label class="form-label">Nama Pengguna Baru</label>
          <input type="text" id="newNameInput" class="form-input" required placeholder="Masukkan nama baru...">
        </div>
        <button type="submit" class="btn-submit">Simpan Nama</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GANTI FOTO PROFIL -->
  <div id="modalPhoto" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalPhoto')">&times;</button>
      <div class="modal-title">Ganti Foto Profil</div>
      <form onsubmit="handleSavePhoto(event)">
        <div class="form-group">
          <label class="form-label">Upload File Gambar</label>
          <input type="file" id="filePhotoInput" accept="image/*" class="form-input" onchange="previewImage(this)">
        </div>
        <div class="form-group">
          <label class="form-label">Atau Masukkan URL Gambar</label>
          <input type="url" id="urlPhotoInput" class="form-input" placeholder="https://example.com/foto.jpg">
        </div>
        <button type="submit" class="btn-submit">Perbarui Foto</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GANTI PASSWORD -->
  <div id="modalPassword" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalPassword')">&times;</button>
      <div class="modal-title">Ganti Password</div>
      <form onsubmit="handleSavePassword(event)">
        <div class="form-group">
          <label class="form-label">Password Baru</label>
          <input type="password" id="newPassInput" class="form-input" required placeholder="Minimal 6 karakter...">
        </div>
        <button type="submit" class="btn-submit">Simpan Password Baru</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db, ref, get, set, onAuthStateChanged } from '/assets/firebase-config.js';
    import { updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAIL = 'zahrulms01@gmail.com';
    let base64Photo = '';
    let currentAuthUser = null;

    function getDbKey(email) {
      if (!email) return '';
      return email.toLowerCase().replace(/\./g, ',');
    }

    async function loadUserData(user) {
      document.getElementById('userEmail').innerText = user.email;
      const emailKey = getDbKey(user.email);
      const userRef = ref(db, `users/${emailKey}`);

      try {
        const snap = await get(userRef);
        let data = snap.exists() ? snap.val() : {};

        const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || data.status === 'admin';
        const name = data.name || user.email.split('@')[0];
        const photoURL = data.photoURL || '';

        document.getElementById('userName').innerText = name;
        document.getElementById('badgeLevel').innerText = isAdmin ? 'Lv999+' : `Lv${data.level || 1}`;
        if (isAdmin) {
          document.getElementById('badgeLevel').className = 'badge-pill badge-admin';
          document.getElementById('badgeAdmin').style.display = 'inline-block';
        }

        document.getElementById('statFollowers').innerText = data.followersCount || 0;
        document.getElementById('statFollowing').innerText = data.followingCount || 0;

        const avatarBox = document.getElementById('profileAvatar');
        if (photoURL) {
          avatarBox.innerHTML = `<img src="${photoURL}" alt="${name}" onerror="this.outerHTML='<span>${name.charAt(0).toUpperCase()}</span>'">`;
        } else {
          avatarBox.innerHTML = `<span>${name.charAt(0).toUpperCase()}</span>`;
        }

        loadUserFavorites(data.favorites);
        loadUserHistory(data.history);
      } catch (e) {
        document.getElementById('userName').innerText = user.email.split('@')[0];
      }
    }

    /* RENDER FAVORIT (HORIZONTAL SCROLL) */
    function loadUserFavorites(rtdbFavorites) {
      const container = document.getElementById('favoritesContainer');
      const countEl = document.getElementById('statFavorites');
      let favList = [];

      if (rtdbFavorites && typeof rtdbFavorites === 'object') {
        favList = Object.values(rtdbFavorites);
      } else {
        favList = JSON.parse(localStorage.getItem('df_favorites') || localStorage.getItem('rz_favorites') || '[]');
      }

      countEl.innerText = favList.length;

      if (favList.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:12px;padding:12px 0;">Belum ada koleksi favorit yang disimpan.</p>';
        return;
      }

      container.innerHTML = favList.map(item => `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="fav-card">
          <div class="fav-poster-wrap">
            <img src="${item.poster || 'https://via.placeholder.com/150x200?text=No+Cover'}" alt="${item.title}" referrerpolicy="no-referrer">
          </div>
          <div class="fav-title">${item.title}</div>
        </a>
      `).join('');
    }

    /* RENDER RIWAYAT NONTON (UI SEPERTI BERANDA) */
    function loadUserHistory(rtdbHistory) {
      const container = document.getElementById('historyContainer');
      let historyList = [];

      if (rtdbHistory && typeof rtdbHistory === 'object') {
        historyList = Object.values(rtdbHistory);
      } else {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      }

      historyList.sort((a, b) => (b.timestamp || b.updatedAt || 0) - (a.timestamp || a.updatedAt || 0));

      if (historyList.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:12px;padding:12px 0;">Belum ada riwayat tontonan.</p>';
        return;
      }

      container.innerHTML = historyList.map(item => {
        const epLabel = item.episode || 'Ep 1';
        const targetSlug = item.mainPath || item.slug || '';
        const epPath = item.epPath ? `?ep=${encodeURIComponent(item.epPath)}` : '';
        const poster = item.poster || item.cover || 'https://via.placeholder.com/300x170?text=No+Cover';
        const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : (item.updatedAt ? getTimeAgo(item.updatedAt) : 'Baru saja');

        return `
          <a href="/donghua/${encodeURIComponent(targetSlug)}${epPath}" class="history-card">
            <div class="history-cover-wrap">
              <img src="${poster}" alt="${item.title}" referrerpolicy="no-referrer">
              <span class="history-ep-badge">${epLabel}</span>
              <div class="history-play-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <div class="history-progress-bar">
                <div class="history-progress-fill"></div>
              </div>
            </div>
            <div class="history-content">
              <div class="history-title">${item.title || 'Donghua'}</div>
              <div class="history-time">Terakhir ditonton • ${timeAgo}</div>
            </div>
          </a>
        `;
      }).join('');
    }

    function getTimeAgo(timestamp) {
      const sec = Math.floor((Date.now() - timestamp) / 1000);
      if (sec < 60) return 'Baru saja';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m yang lalu`;
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return `${hrs}j yang lalu`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}h yang lalu`;
      return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

    window.previewImage = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) { base64Photo = e.target.result; };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.handleSaveName = async function(e) {
      e.preventDefault();
      const newName = document.getElementById('newNameInput').value.trim();
      if (!newName || !currentAuthUser) return;

      const emailKey = getDbKey(currentAuthUser.email);
      await set(ref(db, `users/${emailKey}/name`), newName);

      document.getElementById('userName').innerText = newName;
      window.closeModal('modalName');
      alert('Nama berhasil diubah!');
    };

    window.handleSavePhoto = async function(e) {
      e.preventDefault();
      const urlPhoto = document.getElementById('urlPhotoInput').value.trim();
      const finalPhoto = base64Photo || urlPhoto;
      if (!finalPhoto || !currentAuthUser) return;

      const emailKey = getDbKey(currentAuthUser.email);
      await set(ref(db, `users/${emailKey}/photoURL`), finalPhoto);

      const avatarBox = document.getElementById('profileAvatar');
      avatarBox.innerHTML = `<img src="${finalPhoto}" alt="Avatar">`;
      window.closeModal('modalPhoto');
      alert('Foto profil berhasil diperbarui!');
    };

    window.handleSavePassword = async function(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassInput').value;
      if (!newPass || newPass.length < 6) {
        alert('Password minimal 6 karakter!');
        return;
      }

      try {
        await updatePassword(currentAuthUser, newPass);
        window.closeModal('modalPassword');
        alert('Password berhasil diperbarui!');
      } catch (err) {
        alert('Gagal ubah password: ' + err.message);
      }
    };

    window.handleLogout = async function() {
      if (confirm('Yakin ingin keluar dari akun?')) {
        await signOut(auth);
        window.location.href = '/profil/login.html';
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/profil/login.html';
      } else {
        currentAuthUser = user;
        await loadUserData(user);
      }
    });
  </script>
</body>
</html>
