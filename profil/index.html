<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profil Saya - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="../image/IMG_6395.png">
  <link rel="apple-touch-icon" href="../image/IMG_6395.png">

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    :root {
      --bg-base: #000000;
      --bg-card: rgba(18, 22, 34, 0.65);
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-surface-hover: rgba(255, 255, 255, 0.08);
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
      --color-gold: #f59e0b;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(56, 189, 248, 0.25);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-top: 68px;
      padding-bottom: 70px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* BACKGROUND AMBIENT GLOWS */
    .ambient-glow-top {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 300px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.22) 0%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 70%, rgba(0, 0, 0, 0) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 16px 14px;
    }

    .header-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-circle-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      color: #fff;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.2s;
    }
    .icon-circle-btn:active { transform: scale(0.95); }
    .icon-circle-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #fff;
    }

    /* HERO CARD PROFILE */
    .profile-hero {
      background: var(--bg-card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 30px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero-top-bg {
      position: absolute;
      top: -60px;
      width: 220px;
      height: 120px;
      background: linear-gradient(180deg, var(--color-accent) 0%, transparent 100%);
      opacity: 0.25;
      filter: blur(40px);
      border-radius: 50%;
    }

    /* AVATAR RING */
    .avatar-container {
      position: relative;
      margin-bottom: 14px;
    }

    .avatar-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      border: 3px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.45);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease;
    }
    .avatar-wrapper:hover { transform: scale(1.03); }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .avatar-edit-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #0284c7;
      border: 2px solid #000;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .avatar-edit-badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .user-name {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .user-email {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-top: 3px;
      font-weight: 500;
    }

    .badges-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 9999px;
      letter-spacing: 0.3px;
    }

    .badge-level {
      background: rgba(56, 189, 248, 0.15);
      color: var(--color-accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .badge-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #000;
      font-weight: 900;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    /* STATS STRIP */
    .stats-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
      padding: 14px 10px;
      margin-top: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-box:last-child { border-right: none; }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }

    /* SECTION HEADER */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 4px 12px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* MENU LIST (iOS STYLE) */
    .menu-group {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .menu-item {
      width: 100%;
      background: transparent;
      border: none;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg-surface-hover); }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .menu-icon-wrap svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .icon-blue { background: rgba(56, 189, 248, 0.15); color: var(--color-accent); }
    .icon-amber { background: rgba(245, 158, 11, 0.15); color: var(--color-gold); }
    .icon-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .menu-chevron svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2.5;
    }

    .btn-item-logout {
      color: #f87171;
    }

    /* FAVORITES GRID */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .fav-card {
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .fav-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .fav-poster-wrap {
      width: 100%;
      aspect-ratio: 3/4;
      background: #090d16;
      overflow: hidden;
    }
    .fav-poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fav-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #f1f5f9;
      padding: 8px 10px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* MODAL OVERLAY & POPUP */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 16px;
    }

    .modal-close {
      position: absolute;
      top: 18px; right: 18px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 42px;
      background: #050811;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--color-accent); }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body>

  <div class="ambient-glow-top"></div>

  <header>
    <div class="header-content">
      <div class="header-left-group" onclick="window.location.href='/'">
        <button class="icon-circle-btn">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="brand-title">Profil Saya</span>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- HERO PROFILE -->
    <div class="profile-hero">
      <div class="hero-top-bg"></div>

      <div class="avatar-container">
        <div class="avatar-wrapper" id="profileAvatar" onclick="openModal('modalPhoto')">
          <span id="avatarInitial">U</span>
        </div>
        <div class="avatar-edit-badge" onclick="openModal('modalPhoto')">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
      </div>

      <div class="user-name" id="userName">Memuat...</div>
      <div class="user-email" id="userEmail">...</div>

      <div class="badges-row">
        <span class="badge-pill badge-level" id="badgeLevel">Lv1</span>
        <span class="badge-pill badge-admin" id="badgeAdmin" style="display: none;">★ ADMIN</span>
      </div>

      <!-- STATISTIK (FOLLOWER, FOLLOWING, FAVORIT) -->
      <div class="stats-card">
        <div class="stat-box">
          <span class="stat-num" id="statFollowers">0</span>
          <span class="stat-label">Pengikut</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statFollowing">0</span>
          <span class="stat-label">Mengikuti</span>
        </div>
        <div class="stat-box">
          <span class="stat-num" id="statFavorites">0</span>
          <span class="stat-label">Favorit</span>
        </div>
      </div>
    </div>

    <!-- PENGATURAN AKUN (LIST iOS STYLE) -->
    <div class="section-header">
      <span class="section-title">Pengaturan Akun</span>
    </div>

    <div class="menu-group">
      <button class="menu-item" onclick="openModal('modalName')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-blue">
            <svg viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </div>
          <span>Ubah Nama Tampilan</span>
        </div>
        <div class="menu-chevron">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </button>

      <button class="menu-item" onclick="openModal('modalPhoto')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-blue">
            <svg viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16m-2-2l1.586-1.586a2 2 0 0 1 2.828 0L20 14m-6-6h.01M6 20h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></svg>
          </div>
          <span>Perbarui Foto Profil</span>
        </div>
        <div class="menu-chevron">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </button>

      <button class="menu-item" onclick="openModal('modalPassword')">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-amber">
            <svg viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg>
          </div>
          <span>Ganti Password</span>
        </div>
        <div class="menu-chevron">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </button>

      <button class="menu-item btn-item-logout" onclick="handleLogout()">
        <div class="menu-item-left">
          <div class="menu-icon-wrap icon-red">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </div>
          <span>Keluar dari Akun</span>
        </div>
        <div class="menu-chevron">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </button>
    </div>

    <!-- DONGHUA FAVORIT TERSIMPAN -->
    <div class="section-header">
      <span class="section-title">
        <svg width="15" height="15" fill="currentColor" style="color: var(--color-gold);" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Koleksi Favorit
      </span>
    </div>

    <div class="favorites-grid" id="favoritesContainer">
      <p style="color:var(--text-muted);font-size:12px;grid-column: 1 / -1;">Memuat favorit...</p>
    </div>
  </div>

  <!-- MODAL: GANTI NAMA -->
  <div id="modalName" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalName')">&times;</button>
      <div class="modal-title">Ubah Nama Profil</div>
      <form onsubmit="handleSaveName(event)">
        <div class="form-group">
          <label class="form-label">Nama Pengguna Baru</label>
          <input type="text" id="newNameInput" class="form-input" required placeholder="Masukkan nama baru...">
        </div>
        <button type="submit" class="btn-submit">Simpan Nama</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GANTI FOTO PROFIL -->
  <div id="modalPhoto" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalPhoto')">&times;</button>
      <div class="modal-title">Ganti Foto Profil</div>
      <form onsubmit="handleSavePhoto(event)">
        <div class="form-group">
          <label class="form-label">Upload File Gambar</label>
          <input type="file" id="filePhotoInput" accept="image/*" class="form-input" onchange="previewImage(this)">
        </div>
        <div class="form-group">
          <label class="form-label">Atau Masukkan URL Gambar</label>
          <input type="url" id="urlPhotoInput" class="form-input" placeholder="https://example.com/foto.jpg">
        </div>
        <button type="submit" class="btn-submit">Perbarui Foto</button>
      </form>
    </div>
  </div>

  <!-- MODAL: GANTI PASSWORD -->
  <div id="modalPassword" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalPassword')">&times;</button>
      <div class="modal-title">Ganti Password</div>
      <form onsubmit="handleSavePassword(event)">
        <div class="form-group">
          <label class="form-label">Password Baru</label>
          <input type="password" id="newPassInput" class="form-input" required placeholder="Minimal 6 karakter...">
        </div>
        <button type="submit" class="btn-submit">Simpan Password Baru</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db, ref, get, set, onAuthStateChanged } from '/assets/firebase-config.js';
    import { updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAIL = 'zahrulms01@gmail.com';
    let base64Photo = '';
    let currentAuthUser = null;

    function getDbKey(email) {
      if (!email) return '';
      return email.toLowerCase().replace(/\./g, ',');
    }

    async function loadUserData(user) {
      document.getElementById('userEmail').innerText = user.email;
      const emailKey = getDbKey(user.email);
      const userRef = ref(db, `users/${emailKey}`);

      try {
        const snap = await get(userRef);
        let data = snap.exists() ? snap.val() : {};

        const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || data.status === 'admin';
        const name = data.name || user.email.split('@')[0];
        const photoURL = data.photoURL || '';

        document.getElementById('userName').innerText = name;
        document.getElementById('badgeLevel').innerText = isAdmin ? 'Lv999+' : `Lv${data.level || 1}`;
        if (isAdmin) {
          document.getElementById('badgeLevel').className = 'badge-pill badge-admin';
          document.getElementById('badgeAdmin').style.display = 'inline-block';
        }

        document.getElementById('statFollowers').innerText = data.followersCount || 0;
        document.getElementById('statFollowing').innerText = data.followingCount || 0;

        const avatarBox = document.getElementById('profileAvatar');
        if (photoURL) {
          avatarBox.innerHTML = `<img src="${photoURL}" alt="${name}" onerror="this.outerHTML='<span>${name.charAt(0).toUpperCase()}</span>'">`;
        } else {
          avatarBox.innerHTML = `<span>${name.charAt(0).toUpperCase()}</span>`;
        }

        loadUserFavorites(data.favorites);
      } catch (e) {
        document.getElementById('userName').innerText = user.email.split('@')[0];
      }
    }

    function loadUserFavorites(rtdbFavorites) {
      const container = document.getElementById('favoritesContainer');
      const countEl = document.getElementById('statFavorites');
      let favList = [];

      if (rtdbFavorites && typeof rtdbFavorites === 'object') {
        favList = Object.values(rtdbFavorites);
      } else {
        favList = JSON.parse(localStorage.getItem('df_favorites') || '[]');
      }

      countEl.innerText = favList.length;

      if (favList.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:12px;grid-column: 1 / -1; text-align:center; padding: 20px 0;">Belum ada donghua favorit yang disimpan.</p>';
        return;
      }

      container.innerHTML = favList.map(item => `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="fav-card">
          <div class="fav-poster-wrap">
            <img src="${item.poster || 'https://via.placeholder.com/150x200?text=No+Cover'}" alt="${item.title}" referrerpolicy="no-referrer">
          </div>
          <div class="fav-title">${item.title}</div>
        </a>
      `).join('');
    }

    window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

    window.previewImage = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64Photo = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.handleSaveName = async function(e) {
      e.preventDefault();
      const newName = document.getElementById('newNameInput').value.trim();
      if (!newName || !currentAuthUser) return;

      const emailKey = getDbKey(currentAuthUser.email);
      await set(ref(db, `users/${emailKey}/name`), newName);

      document.getElementById('userName').innerText = newName;
      window.closeModal('modalName');
      alert('Nama berhasil diubah!');
    };

    window.handleSavePhoto = async function(e) {
      e.preventDefault();
      const urlPhoto = document.getElementById('urlPhotoInput').value.trim();
      const finalPhoto = base64Photo || urlPhoto;
      if (!finalPhoto || !currentAuthUser) return;

      const emailKey = getDbKey(currentAuthUser.email);
      await set(ref(db, `users/${emailKey}/photoURL`), finalPhoto);

      const avatarBox = document.getElementById('profileAvatar');
      avatarBox.innerHTML = `<img src="${finalPhoto}" alt="Avatar">`;
      window.closeModal('modalPhoto');
      alert('Foto profil berhasil diperbarui!');
    };

    window.handleSavePassword = async function(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassInput').value;
      if (!newPass || newPass.length < 6) {
        alert('Password minimal 6 karakter!');
        return;
      }

      try {
        await updatePassword(currentAuthUser, newPass);
        window.closeModal('modalPassword');
        alert('Password berhasil diperbarui!');
      } catch (err) {
        alert('Gagal ubah password: ' + err.message);
      }
    };

    window.handleLogout = async function() {
      if (confirm('Yakin ingin keluar dari akun?')) {
        await signOut(auth);
        window.location.href = '/profil/login.html';
      }
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/profil/login.html';
      } else {
        currentAuthUser = user;
        await loadUserData(user);
      }
    });
  </script>
</body>
</html>
