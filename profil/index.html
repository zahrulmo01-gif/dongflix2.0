<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profil - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">

  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #12151e;
      --bg-pill: #ffffff;
      --text-pill: #000000;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-btn: 9999px;
      --radius-card: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 60px;
      padding-bottom: 60px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 16px;
    }

    .header-content {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 40px;
      gap: 12px;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CONTAINER UTAMA */
    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 20px;
    }

    /* AVATAR */
    .avatar-wrapper {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #1c2230;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-placeholder {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }

    /* INFORMASI PROFIL & BADGE */
    .profile-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .name-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #fff;
    }

    /* ANIMASI SHIMMER DARI KODE LIVE CHAT */
    @keyframes badgeShimmer {
      0% { transform: translateX(-150%) skewX(-20deg); }
      35%, 100% { transform: translateX(180%) skewX(-20deg); }
    }
    .badge-admin, .badge-level {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7.5px;
      border-radius: 6px;
      overflow: hidden;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    .badge-admin::after, .badge-level::after {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 45%; height: 200%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 100%);
      animation: badgeShimmer 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .badge-level {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22) 0%, rgba(2, 132, 199, 0.12) 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    .badge-level.admin-lvl {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #451a03;
      border: 1px solid rgba(254, 243, 199, 0.5);
      font-weight: 900;
    }
    .badge-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.45);
      font-weight: 900;
    }

    .profile-bio {
      font-size: 14.5px;
      line-height: 1.48;
      color: var(--text-sub);
      margin-top: 10px;
      max-width: 100%;
      word-break: break-word;
    }

    /* STATS (FOLLOWERS & FOLLOWING) */
    .stats-row {
      display: flex;
      align-items: center;
      gap: 36px;
      margin-top: 18px;
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 14.5px;
    }

    .stat-number {
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      color: var(--text-sub);
      font-weight: 500;
    }

    /* ACTION BAR */
    .action-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
      margin-bottom: 28px;
    }

    .btn-action-main {
      flex: 1;
      height: 46px;
      border-radius: var(--radius-btn);
      border: none;
      background: var(--bg-pill);
      color: var(--text-pill);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.08);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-action-main:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-action-main.btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-logout-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-logout-icon:hover {
      background: #ef4444;
      color: #ffffff;
    }
    .btn-logout-icon:active {
      transform: scale(0.95);
    }
    .btn-logout-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    /* TAB NAVIGASI MINIMALIS SEPERTI GAMBAR */
    .profile-tabs-nav {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }

    .tab-nav-btn {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      color: #64748b;
      transition: color 0.2s;
    }

    .tab-nav-btn svg {
      width: 22px;
      height: 22px;
      transition: transform 0.15s;
    }

    .tab-nav-btn.active {
      color: #ffffff;
    }

    /* Indikator Garis Putih di Bawah Tab Aktif */
    .tab-nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
    }

    /* KONTEN TAB */
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    /* GRID KOLEKSI (3 KOLOM) */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .work-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: block;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .work-card:active {
      transform: scale(0.97);
    }
    .work-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* LIST RIWAYAT NONTON (GRID CARD) */
    .history-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .history-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .history-thumb-wrap {
      width: 100px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      background: #090d16;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .history-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .history-ep-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(2, 132, 199, 0.9);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .history-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-time {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* KONDISI AKSES DITOLAK UNTUK TAB RIWAYAT */
    .access-denied-box {
      text-align: center;
      padding: 48px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .access-lock-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }
    .access-lock-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    .access-denied-text {
      font-size: 13.5px;
      color: var(--text-sub);
      max-width: 300px;
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      font-size: 13px;
      color: var(--text-sub);
      grid-column: 1 / -1;
    }

    /* MODAL EDIT PROFIL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      background: #11141c;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      position: relative;
    }

    .modal-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 18px; }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-sub);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
    }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; }
    .form-input {
      width: 100%; height: 42px; background: #080a0f; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 0 12px; color: #fff; font-size: 13.5px; outline: none;
    }
    .form-textarea {
      width: 100%; height: 70px; background: #080a0f; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13.5px; outline: none; resize: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: #38bdf8; }
    
    .input-hint { font-size: 11px; margin-top: 4px; display: none; font-weight: 600; }
    .input-hint.error { color: #ef4444; display: block; }
    .input-hint.success { color: #22c55e; display: block; }

    .btn-modal-save {
      width: 100%; height: 46px; background: #fff; color: #000; border: none;
      border-radius: var(--radius-btn); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-modal-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-content">
      <button class="back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="header-title" id="headerTitle">Memuat...</span>
    </div>
  </header>

  <div class="container" id="profileContent">
    <!-- AVATAR -->
    <div class="avatar-wrapper" id="profileAvatar">
      <span class="avatar-placeholder" id="avatarInitial">...</span>
    </div>

    <!-- INFO PROFIL -->
    <div class="profile-info">
      <div class="name-badge-row">
        <h1 class="profile-name" id="userName">Memuat...</h1>
        <div id="badgeContainer" style="display:inline-flex; align-items:center; gap:6px;"></div>
      </div>

      <p class="profile-bio" id="userBio">No bio yet</p>

      <!-- STATISTIK (FOLLOWERS & FOLLOWING) -->
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-number" id="statFollowers">0</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="statFollowing">0</span>
          <span class="stat-label">Following</span>
        </div>
      </div>
    </div>

    <!-- ACTION BAR: TOMBOL UTAMA + LOGOUT -->
    <div class="action-bar-row">
      <button class="btn-action-main" id="btnMainAction" onclick="handleMainAction()">
        + Follow
      </button>
      <button class="btn-logout-icon" id="btnLogoutProfile" style="display: none;" onclick="handleLogout()" title="Keluar dari Akun">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- DUA TAB NAVIGASI MINIMALIS -->
    <div class="profile-tabs-nav">
      <!-- Tab 1: Koleksi Favorit (Ikon Grid 9 Titik) -->
      <button class="tab-nav-btn active" id="tabBtnKoleksi" onclick="switchProfileTab('koleksi')" title="Koleksi Favorit">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="3" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="3" y="16.5" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="16.5" width="4.5" height="4.5" rx="1"/>
        </svg>
      </button>

      <!-- Tab 2: Riwayat Nonton (Ikon Putar / Reload) -->
      <button class="tab-nav-btn" id="tabBtnRiwayat" onclick="switchProfileTab('riwayat')" title="Riwayat Tontonan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19"/>
        </svg>
      </button>
    </div>

    <!-- ISI TAB 1: KOLEKSI -->
    <div class="tab-pane active" id="paneKoleksi">
      <div class="works-grid" id="koleksiContainer">
        <div class="empty-state">Memuat koleksi...</div>
      </div>
    </div>

    <!-- ISI TAB 2: RIWAYAT NONTON -->
    <div class="tab-pane" id="paneRiwayat">
      <div id="riwayatContentArea"></div>
    </div>
  </div>

  <!-- MODAL: EDIT PROFIL -->
  <div id="modalEditProfile" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalEditProfile')">&times;</button>
      <div class="modal-title">Edit Profil</div>
      <form onsubmit="handleSaveProfile(event)">
        
        <div class="form-group">
          <label class="form-label">Nama Tampilan</label>
          <input type="text" id="inputEditName" class="form-input" required placeholder="Nama Anda...">
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="inputEditUsername" class="form-input" required pattern="^[a-zA-Z0-9_]{3,20}$" placeholder="username baru...">
          <div id="editUsernameStatus" class="input-hint"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Bio Singkat</label>
          <textarea id="inputEditBio" class="form-textarea" placeholder="Tuliskan bio profil Anda..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Foto Profil</label>
          <input type="file" id="inputEditPhotoFile" accept="image/*" class="form-input" style="padding-top:7px; margin-bottom: 6px;">
          <input type="url" id="inputEditPhotoUrl" class="form-input" placeholder="Atau masukkan URL gambar...">
        </div>

        <div class="form-group">
          <label class="form-label">Ganti Password (Kosongkan jika tidak diubah)</label>
          <input type="password" id="inputEditPassword" class="form-input" minlength="6" placeholder="Minimal 6 karakter...">
        </div>

        <button type="submit" class="btn-modal-save" id="btnSaveModal">Simpan Perubahan</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/assets/firebase-config.js';
    import { ref, get, set, update, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { onAuthStateChanged, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAIL = 'zahrulms01@gmail.com';
    let currentAuthUser = null;
    let targetUserKey = null;
    let targetUserData = null;
    let isOwnProfile = false;
    let isFollowing = false;
    let uploadedPhotoBase64 = '';
    let isNewUsernameValid = true;
    let editCheckTimeout = null;

    // 1. Ekstrak nama user dari URL /profil/:username
    function getUsernameFromUrl() {
      const path = window.location.pathname.replace(/\/+$/, '');
      const segments = path.split('/');
      const profilIdx = segments.indexOf('profil');
      if (profilIdx !== -1 && segments[profilIdx + 1]) {
        const val = decodeURIComponent(segments[profilIdx + 1]);
        if (val !== 'index.html' && val !== 'login.html' && val !== 'register.html') return val;
      }
      return null;
    }

    // 2. Fetch data pengguna dari Firebase
    async function fetchUserData(identifier) {
      try {
        const usersRef = ref(db, 'users');
        try {
          const q = query(usersRef, orderByChild('username'), equalTo(identifier));
          const snap = await get(q);
          if (snap.exists()) {
            const val = snap.val();
            const key = Object.keys(val)[0];
            return { key, data: val[key] };
          }
        } catch (e) {
          console.warn('Index query dilewati:', e);
        }

        const allSnap = await get(usersRef);
        if (allSnap.exists()) {
          const allUsers = allSnap.val();
          for (const [key, val] of Object.entries(allUsers)) {
            const matchUsername = val.username && String(val.username).toLowerCase() === identifier.toLowerCase();
            const matchEmailPrefix = key.toLowerCase().startsWith(identifier.toLowerCase() + '@');
            const matchExactKey = key.toLowerCase() === identifier.toLowerCase();

            if (matchUsername || matchEmailPrefix || matchExactKey) {
              return { key, data: val };
            }
          }
        }
      } catch (err) {
        console.error('Fetch user error:', err);
      }
      return null;
    }

    // 3. Render Profil Utama
    async function renderProfile(targetData, key, currentUser) {
      targetUserKey = key;
      targetUserData = targetData;

      const currentUserEmailKey = currentUser?.email ? currentUser.email.toLowerCase().replace(/\./g, ',') : null;
      
      isOwnProfile = currentUser && (
        currentUser.uid === key || 
        currentUserEmailKey === key ||
        (targetData.email && currentUser.email.toLowerCase() === targetData.email.toLowerCase())
      );

      const name = targetData.name || targetData.username || 'Pengguna';
      const photoURL = targetData.photoURL || '';
      const bioText = targetData.bio && targetData.bio.trim() !== '' ? targetData.bio : 'No bio yet';
      const isAdmin = (targetData.email && targetData.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) || targetData.status === 'admin';

      document.getElementById('headerTitle').innerText = name;
      document.getElementById('userName').innerText = name;
      document.getElementById('userBio').innerText = bioText;

      // BADGE ADMIN & LEVEL
      const badgeBox = document.getElementById('badgeContainer');
      const levelBadgeHtml = isAdmin 
        ? `<span class="badge-level admin-lvl">Lv999+</span>` 
        : `<span class="badge-level">Lv${targetData.level || 1}</span>`;
      const adminBadgeHtml = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
      badgeBox.innerHTML = `${levelBadgeHtml} ${adminBadgeHtml}`;

      document.getElementById('statFollowers').innerText = targetData.followersCount || 0;
      document.getElementById('statFollowing').innerText = targetData.followingCount || 0;

      const avatarBox = document.getElementById('profileAvatar');
      if (photoURL) {
        avatarBox.innerHTML = `<img src="${photoURL}" alt="${name}" onerror="this.outerHTML='<span class=\\'avatar-placeholder\\'>${name.charAt(0).toUpperCase()}</span>'">`;
      } else {
        avatarBox.innerHTML = `<span class="avatar-placeholder">${name.charAt(0).toUpperCase()}</span>`;
      }

      // Tombol Aksi & Log Out
      const actionBtn = document.getElementById('btnMainAction');
      const logoutBtn = document.getElementById('btnLogoutProfile');

      if (isOwnProfile) {
        actionBtn.innerText = 'Edit Profil';
        actionBtn.className = 'btn-action-main btn-secondary';
        logoutBtn.style.display = 'flex';
      } else {
        logoutBtn.style.display = 'none';
        if (currentUser && targetData.followers && targetData.followers[currentUserEmailKey]) {
          isFollowing = true;
          actionBtn.innerText = 'Following';
          actionBtn.className = 'btn-action-main btn-secondary';
        } else {
          isFollowing = false;
          actionBtn.innerText = '+ Follow';
          actionBtn.className = 'btn-action-main';
        }
      }

      // Render Data Tab
      renderKoleksi(targetData.favorites);
      renderRiwayat(targetData.history);
    }

    // 4. Render Tab Koleksi
    function renderKoleksi(rtdbFavorites) {
      const container = document.getElementById('koleksiContainer');
      let favList = [];

      if (rtdbFavorites && typeof rtdbFavorites === 'object') {
        favList = Object.values(rtdbFavorites);
      } else if (isOwnProfile) {
        favList = JSON.parse(localStorage.getItem('df_favorites') || localStorage.getItem('rz_favorites') || '[]');
      }

      if (favList.length === 0) {
        container.innerHTML = '<div class="empty-state">Belum ada item dalam koleksi.</div>';
        return;
      }

      container.innerHTML = favList.map(item => `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="work-card" title="${item.title || 'Koleksi'}">
          <img src="${item.poster || 'https://via.placeholder.com/300x300?text=No+Cover'}" alt="${item.title || 'Item'}" referrerpolicy="no-referrer">
        </a>
      `).join('');
    }

    // 5. Render Tab Riwayat Nonton (Dengan proteksi kepemilikan)
    function renderRiwayat(rtdbHistory) {
      const area = document.getElementById('riwayatContentArea');

      // Proteksi hak akses jika BUKAN pemilik akun
      if (!isOwnProfile) {
        area.innerHTML = `
          <div class="access-denied-box">
            <div class="access-lock-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div class="access-denied-text">Hanya pemilik akun yang dapat mengakses riwayat tontonan ini.</div>
          </div>
        `;
        return;
      }

      let historyList = [];
      if (rtdbHistory && typeof rtdbHistory === 'object') {
        historyList = Object.values(rtdbHistory);
      } else {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      }

      historyList.sort((a, b) => (b.timestamp || b.updatedAt || 0) - (a.timestamp || a.updatedAt || 0));

      if (historyList.length === 0) {
        area.innerHTML = '<div class="empty-state">Belum ada riwayat tontonan.</div>';
        return;
      }

      area.innerHTML = `
        <div class="history-grid">
          ${historyList.map(item => {
            const epLabel = item.episode || 'Ep 1';
            const targetSlug = item.mainPath || item.slug || '';
            const epPath = item.epPath ? `?ep=${encodeURIComponent(item.epPath)}` : '';
            const poster = item.poster || item.cover || 'https://via.placeholder.com/300x170?text=No+Cover';
            const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : (item.updatedAt ? getTimeAgo(item.updatedAt) : 'Baru saja');

            return `
              <a href="/donghua/${encodeURIComponent(targetSlug)}${epPath}" class="history-card-item">
                <div class="history-thumb-wrap">
                  <img src="${poster}" alt="${item.title}" referrerpolicy="no-referrer">
                  <span class="history-ep-tag">${epLabel}</span>
                </div>
                <div class="history-details">
                  <div class="history-item-title">${item.title || 'Donghua'}</div>
                  <div class="history-item-time">Terakhir ditonton • ${timeAgo}</div>
                </div>
              </a>
            `;
          }).join('')}
        </div>
      `;
    }

    function getTimeAgo(timestamp) {
      const sec = Math.floor((Date.now() - timestamp) / 1000);
      if (sec < 60) return 'Baru saja';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m lalu`;
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return `${hrs}j lalu`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}h lalu`;
      return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    // 6. Pengalih Tab Navigasi
    window.switchProfileTab = function(tabName) {
      const btnKoleksi = document.getElementById('tabBtnKoleksi');
      const btnRiwayat = document.getElementById('tabBtnRiwayat');
      const paneKoleksi = document.getElementById('paneKoleksi');
      const paneRiwayat = document.getElementById('paneRiwayat');

      if (tabName === 'koleksi') {
        btnKoleksi.classList.add('active');
        btnRiwayat.classList.remove('active');
        paneKoleksi.classList.add('active');
        paneRiwayat.classList.remove('active');
      } else {
        btnRiwayat.classList.add('active');
        btnKoleksi.classList.remove('active');
        paneRiwayat.classList.add('active');
        paneKoleksi.classList.remove('active');
      }
    };

    // 7. Tombol Aksi Handler
    window.handleMainAction = async function() {
      if (isOwnProfile) {
        document.getElementById('inputEditName').value = targetUserData?.name || '';
        document.getElementById('inputEditUsername').value = targetUserData?.username || '';
        document.getElementById('inputEditBio').value = targetUserData?.bio || '';
        document.getElementById('inputEditPhotoUrl').value = targetUserData?.photoURL || '';
        document.getElementById('inputEditPhotoFile').value = '';
        document.getElementById('inputEditPassword').value = '';
        uploadedPhotoBase64 = '';
        isNewUsernameValid = true;
        document.getElementById('editUsernameStatus').style.display = 'none';

        openModal('modalEditProfile');
      } else {
        if (!currentAuthUser) {
          alert('Silakan login terlebih dahulu untuk mengikuti profil ini.');
          window.location.href = '/profil/login.html';
          return;
        }

        const myEmailKey = currentAuthUser.email.toLowerCase().replace(/\./g, ',');
        const btn = document.getElementById('btnMainAction');
        btn.disabled = true;

        try {
          let currentFollowers = targetUserData.followersCount || 0;
          if (isFollowing) {
            await set(ref(db, `users/${targetUserKey}/followers/${myEmailKey}`), null);
            currentFollowers = Math.max(0, currentFollowers - 1);
            await update(ref(db, `users/${targetUserKey}`), { followersCount: currentFollowers });

            isFollowing = false;
            btn.innerText = '+ Follow';
            btn.className = 'btn-action-main';
          } else {
            await set(ref(db, `users/${targetUserKey}/followers/${myEmailKey}`), true);
            currentFollowers += 1;
            await update(ref(db, `users/${targetUserKey}`), { followersCount: currentFollowers });

            isFollowing = true;
            btn.innerText = 'Following';
            btn.className = 'btn-action-main btn-secondary';
          }
          targetUserData.followersCount = currentFollowers;
          document.getElementById('statFollowers').innerText = currentFollowers;
        } catch (e) {
          alert('Gagal memproses follow/unfollow.');
        } finally {
          btn.disabled = false;
        }
      }
    };

    // 8. Cek Ketersediaan Username Saat Edit
    const editUsernameInput = document.getElementById('inputEditUsername');
    const editUsernameStatus = document.getElementById('editUsernameStatus');

    editUsernameInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\s+/g, '').toLowerCase();
      clearTimeout(editCheckTimeout);
      const val = e.target.value.trim();

      if (!val || val === (targetUserData?.username || '').toLowerCase()) {
        editUsernameStatus.style.display = 'none';
        isNewUsernameValid = true;
        return;
      }

      if (val.length < 3) {
        editUsernameStatus.className = 'input-hint error';
        editUsernameStatus.innerText = 'Username minimal 3 karakter.';
        isNewUsernameValid = false;
        return;
      }

      editCheckTimeout = setTimeout(async () => {
        try {
          const usersRef = ref(db, 'users');
          const allSnap = await get(usersRef);
          let isTaken = false;
          if (allSnap.exists()) {
            const data = allSnap.val();
            for (const key in data) {
              if (key !== targetUserKey && data[key]?.username && data[key].username.toLowerCase() === val) {
                isTaken = true;
                break;
              }
            }
          }

          if (isTaken) {
            editUsernameStatus.className = 'input-hint error';
            editUsernameStatus.innerText = `Username "${val}" sudah dipakai orang lain!`;
            isNewUsernameValid = false;
          } else {
            editUsernameStatus.className = 'input-hint success';
            editUsernameStatus.innerText = `Username "${val}" dapat digunakan!`;
            isNewUsernameValid = true;
          }
        } catch (_) {
          isNewUsernameValid = true;
        }
      }, 400);
    });

    // 9. Upload File Gambar
    document.getElementById('inputEditPhotoFile').addEventListener('change', function() {
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedPhotoBase64 = evt.target.result;
        };
        reader.readAsDataURL(this.files[0]);
      }
    });

    // 10. Simpan Edit Profil
    window.handleSaveProfile = async function(e) {
      e.preventDefault();
      if (!isOwnProfile || !targetUserKey) return;

      if (!isNewUsernameValid) {
        alert('Username yang dimasukkan tidak valid atau sudah dipakai orang lain.');
        return;
      }

      const newName = document.getElementById('inputEditName').value.trim();
      const newUsername = document.getElementById('inputEditUsername').value.trim().toLowerCase();
      const newBio = document.getElementById('inputEditBio').value.trim();
      const newPhotoUrl = document.getElementById('inputEditPhotoUrl').value.trim();
      const finalPhoto = uploadedPhotoBase64 || newPhotoUrl || targetUserData.photoURL || '';
      const newPassword = document.getElementById('inputEditPassword').value;

      const saveBtn = document.getElementById('btnSaveModal');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Menyimpan...';

      try {
        if (newPassword && newPassword.length >= 6) {
          await updatePassword(currentAuthUser, newPassword);
        }

        const updates = {
          name: newName,
          username: newUsername,
          bio: newBio,
          photoURL: finalPhoto
        };

        await update(ref(db, `users/${targetUserKey}`), updates);

        targetUserData.name = newName;
        targetUserData.username = newUsername;
        targetUserData.bio = newBio;
        targetUserData.photoURL = finalPhoto;

        await renderProfile(targetUserData, targetUserKey, currentAuthUser);
        closeModal('modalEditProfile');

        window.history.replaceState(null, '', `/profil/${newUsername}`);
        alert('Profil berhasil diperbarui!');
      } catch (err) {
        alert('Gagal menyimpan profil: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Simpan Perubahan';
      }
    };

    // 11. Logout
    window.handleLogout = async function() {
      if (confirm('Yakin ingin keluar dari akun?')) {
        await signOut(auth);
        window.location.href = '/profil/login.html';
      }
    };

    window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

    // 12. Controller Inisialisasi
    onAuthStateChanged(auth, async (authUser) => {
      currentAuthUser = authUser;
      const urlUsername = getUsernameFromUrl();

      if (urlUsername) {
        const found = await fetchUserData(urlUsername);
        if (found) {
          await renderProfile(found.data, found.key, authUser);
        } else {
          document.getElementById('profileContent').innerHTML = `
            <div style="text-align:center;padding:80px 20px;color:var(--text-sub);">
              <h2 style="color:#fff;margin-bottom:8px;font-size:20px;">Pengguna Tidak Ditemukan</h2>
              <p style="font-size:13.5px;">Profil "@${urlUsername}" belum terdaftar atau tidak ditemukan.</p>
              <a href="/" style="display:inline-block;margin-top:20px;padding:10px 24px;background:#fff;color:#000;text-decoration:none;font-weight:700;border-radius:9999px;font-size:13px;">Kembali ke Beranda</a>
            </div>
          `;
          document.getElementById('headerTitle').innerText = 'Tidak Ditemukan';
        }
      } else {
        if (!authUser) {
          window.location.href = '/profil/login.html';
          return;
        }

        const emailKey = authUser.email.toLowerCase().replace(/\./g, ',');
        let snap = await get(ref(db, `users/${emailKey}`));
        let data = snap.exists() ? snap.val() : null;

        if (!data) {
          snap = await get(ref(db, `users/${authUser.uid}`));
          data = snap.exists() ? snap.val() : {};
        }

        if (data.username) {
          window.location.href = `/profil/${data.username}`;
        } else {
          await renderProfile(data, emailKey, authUser);
        }
      }
    });
  </script>
</body>
</html>
