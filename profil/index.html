<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profil - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">

  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #12151e;
      --bg-pill: #ffffff;
      --text-pill: #000000;
      --text-main: #ffffff;
      --text-sub: #8e95a5;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-btn: 9999px;
      --radius-card: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: 60px;
      padding-bottom: 60px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes skeletonLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.11) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.6s infinite ease-in-out;
      border-radius: 6px;
      display: inline-block;
      color: transparent !important;
      user-select: none;
      pointer-events: none;
      border: none !important;
    }

    .skeleton-avatar {
      width: 86px;
      height: 86px;
      border-radius: 50% !important;
    }

    .skeleton-text {
      height: 1em;
      border-radius: 6px;
    }

    .skeleton-btn {
      border-radius: var(--radius-btn) !important;
    }

    .skeleton-card {
      border-radius: var(--radius-card) !important;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 16px;
    }

    .header-content {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      height: 40px;
      gap: 12px;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 12px 20px;
    }

    .avatar-wrapper {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #1c2230;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-placeholder {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 22px;
      width: 100%;
    }

    .name-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #fff;
      display: inline-flex;
      align-items: center;
    }

    @keyframes badgeShimmer {
      0% { transform: translateX(-150%) skewX(-20deg); }
      35%, 100% { transform: translateX(180%) skewX(-20deg); }
    }
    .badge-admin, .badge-level {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7.5px;
      border-radius: 6px;
      overflow: hidden;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    .badge-admin::after, .badge-level::after {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 45%; height: 200%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 100%);
      animation: badgeShimmer 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .badge-level {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22) 0%, rgba(2, 132, 199, 0.12) 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    .badge-level.admin-lvl {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #451a03;
      border: 1px solid rgba(254, 243, 199, 0.5);
      font-weight: 900;
    }
    .badge-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.45);
      font-weight: 900;
    }

    .profile-bio {
      font-size: 14.5px;
      line-height: 1.48;
      color: var(--text-sub);
      margin-top: 10px;
      width: 100%;
      word-break: break-word;
    }

    .stats-row {
      display: flex;
      align-items: center;
      gap: 36px;
      margin-top: 18px;
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 14.5px;
    }

    .stat-number {
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      color: var(--text-sub);
      font-weight: 500;
    }

    .action-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
      margin-bottom: 28px;
    }

    .btn-action-main {
      flex: 1;
      height: 46px;
      border-radius: var(--radius-btn);
      border: none;
      background: var(--bg-pill);
      color: var(--text-pill);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.08);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-action-main:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-action-main.btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-logout-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-logout-icon:hover {
      background: #ef4444;
      color: #ffffff;
    }
    .btn-logout-icon:active {
      transform: scale(0.95);
    }
    .btn-logout-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .profile-tabs-nav {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
    }

    .tab-nav-btn {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      color: #64748b;
      transition: color 0.2s;
    }

    .tab-nav-btn svg {
      width: 22px;
      height: 22px;
      transition: transform 0.15s;
    }

    .tab-nav-btn.active {
      color: #ffffff;
    }

    .tab-nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .work-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-surface);
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: block;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .work-card:active { transform: scale(0.97); }
    .work-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .history-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .history-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .history-thumb-wrap {
      width: 100px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      background: #090d16;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .history-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .history-ep-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(2, 132, 199, 0.9);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .history-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-time {
      font-size: 11px;
      color: var(--text-sub);
    }

    .access-denied-box {
      text-align: center;
      padding: 48px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .access-lock-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }
    .access-lock-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    .access-denied-text {
      font-size: 13.5px;
      color: var(--text-sub);
      max-width: 300px;
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      font-size: 13px;
      color: var(--text-sub);
      grid-column: 1 / -1;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      background: #11141c;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      position: relative;
    }

    .modal-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 18px; }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-sub);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
    }

    .form-group { margin-bottom: 14px; position: relative; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; }
    .form-input {
      width: 100%; height: 42px; background: #080a0f; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 0 12px; color: #fff; font-size: 13.5px; outline: none;
      transition: border-color 0.2s;
    }
    .form-textarea {
      width: 100%; height: 70px; background: #080a0f; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13.5px; outline: none; resize: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: #38bdf8; }
    
    .input-hint { 
      font-size: 12px; 
      margin-top: 6px; 
      font-weight: 700; 
      line-height: 1.3; 
      display: none; 
    }
    .input-hint.error { color: #ef4444 !important; display: block !important; }
    .input-hint.success { color: #22c55e !important; display: block !important; }
    .input-hint.checking { color: #38bdf8 !important; display: block !important; }

    .btn-modal-save {
      width: 100%; height: 46px; background: #fff; color: #000; border: none;
      border-radius: var(--radius-btn); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
      transition: opacity 0.2s, background 0.2s;
    }
    .btn-modal-save:disabled { 
      opacity: 0.35 !important; 
      cursor: not-allowed !important;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-content">
      <button class="back-btn" onclick="handleBackNavigation()">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="header-title" id="headerTitle">
        <span class="skeleton skeleton-text" style="width: 120px; height: 18px;"></span>
      </span>
    </div>
  </header>

  <div class="container" id="profileContent">
    <div class="avatar-wrapper skeleton skeleton-avatar" id="profileAvatar"></div>

    <div class="profile-info">
      <div class="name-badge-row">
        <h1 class="profile-name" id="userName">
          <span class="skeleton skeleton-text" style="width: 160px; height: 26px;"></span>
        </h1>
        <div id="badgeContainer" style="display:inline-flex; align-items:center; gap:6px;">
          <span class="skeleton" style="width: 44px; height: 20px; border-radius: 6px;"></span>
        </div>
      </div>

      <div class="profile-bio" id="userBio">
        <span class="skeleton skeleton-text" style="width: 80%; height: 14px; margin-top: 6px; display: block;"></span>
        <span class="skeleton skeleton-text" style="width: 50%; height: 14px; margin-top: 6px; display: block;"></span>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-number" id="statFollowers"><span class="skeleton skeleton-text" style="width: 24px; height: 16px;"></span></span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="statFollowing"><span class="skeleton skeleton-text" style="width: 24px; height: 16px;"></span></span>
          <span class="stat-label">Following</span>
        </div>
      </div>
    </div>

    <div class="action-bar-row">
      <button class="btn-action-main skeleton skeleton-btn" id="btnMainAction" onclick="handleMainAction()"></button>
      <button class="btn-logout-icon" id="btnLogoutProfile" style="display: none;" onclick="handleLogout()" title="Keluar dari Akun">
        <svg viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="profile-tabs-nav">
      <button class="tab-nav-btn active" id="tabBtnKoleksi" onclick="switchProfileTab('koleksi')" title="Koleksi Favorit">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="3" width="4.5" height="4.5" rx="1"/>
          <rect x="3" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="9.75" width="4.5" height="4.5" rx="1"/>
          <rect x="3" y="16.5" width="4.5" height="4.5" rx="1"/>
          <rect x="9.75" y="16.5" width="4.5" height="4.5" rx="1"/>
          <rect x="16.5" y="16.5" width="4.5" height="4.5" rx="1"/>
        </svg>
      </button>

      <button class="tab-nav-btn" id="tabBtnRiwayat" onclick="switchProfileTab('riwayat')" title="Riwayat Tontonan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19"/>
        </svg>
      </button>
    </div>

    <div class="tab-pane active" id="paneKoleksi">
      <div class="works-grid" id="koleksiContainer">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>

    <div class="tab-pane" id="paneRiwayat">
      <div id="riwayatContentArea">
        <div class="history-grid">
          <div class="skeleton" style="height: 72px; width: 100%; border-radius: 14px;"></div>
          <div class="skeleton" style="height: 72px; width: 100%; border-radius: 14px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT PROFIL -->
  <div id="modalEditProfile" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal('modalEditProfile')">&times;</button>
      <div class="modal-title">Edit Profil</div>
      <form onsubmit="handleSaveProfile(event)" id="formEditProfile">
        
        <div class="form-group">
          <label class="form-label">Nama Tampilan</label>
          <input type="text" id="inputEditName" class="form-input" required placeholder="Nama Anda...">
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="inputEditUsername" class="form-input" required pattern="^[a-zA-Z0-9_]{3,20}$" placeholder="username baru...">
          <div id="editUsernameStatus" class="input-hint"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Bio Singkat</label>
          <textarea id="inputEditBio" class="form-textarea" placeholder="Tuliskan bio profil Anda..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Foto Profil</label>
          <input type="file" id="inputEditPhotoFile" accept="image/*" class="form-input" style="padding-top:7px; margin-bottom: 6px;">
          <input type="url" id="inputEditPhotoUrl" class="form-input" placeholder="Atau masukkan URL gambar baru...">
        </div>

        <div class="form-group">
          <label class="form-label">Ganti Password (Kosongkan jika tidak diubah)</label>
          <input type="password" id="inputEditPassword" class="form-input" minlength="6" placeholder="Minimal 6 karakter...">
        </div>

        <button type="submit" class="btn-modal-save" id="btnSaveModal" disabled>Simpan Perubahan</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/assets/firebase-config.js';
    import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { onAuthStateChanged, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAIL = 'zahrulms01@gmail.com';
    let currentAuthUser = null;
    let targetUserKey = null;
    let targetUserData = null;
    let isOwnProfile = false;
    let isFollowing = false;
    let uploadedPhotoBase64 = '';
    
    // Status State Form & Validasi
    let initialFormValues = {};
    let isNewUsernameValid = true;
    let isCheckingUsername = false;
    let editCheckTimeout = null;

    let cachedUsersMap = null;

    function calculateLevel(expVal) {
      const exp = Number(expVal) || 0;
      if (exp <= 0) return 1;
      return Math.floor((exp - 1) / 1000) + 1;
    }

    function getDbKey(email) {
      return email.toLowerCase().trim().replace(/\./g, ',');
    }

    function getUsernameFromUrl() {
      const path = window.location.pathname.replace(/\/+$/, '');
      const segments = path.split('/');
      const profilIdx = segments.indexOf('profil');
      if (profilIdx !== -1 && segments[profilIdx + 1]) {
        const val = decodeURIComponent(segments[profilIdx + 1]);
        if (val !== 'index.html' && val !== 'login.html' && val !== 'register.html') return val;
      }
      return null;
    }

    window.handleBackNavigation = function() {
      const refUrl = document.referrer;
      if (refUrl.includes('/login') || refUrl.includes('/register') || !refUrl || window.history.length <= 1) {
        window.location.replace('/');
      } else {
        window.history.back();
      }
    };

    // CEK USERNAME MENGGUNAKAN POLA REGISTER.HTML
    async function checkUsernameAvailability(username, excludeKey) {
      const cleanUsername = username.trim().toLowerCase();
      try {
        const allSnap = await get(ref(db, 'users'));
        if (!allSnap.exists()) return true;

        cachedUsersMap = allSnap.val();
        for (const key in cachedUsersMap) {
          if (key !== excludeKey && cachedUsersMap[key]?.username) {
            if (String(cachedUsersMap[key].username).toLowerCase() === cleanUsername) {
              return false; // Sudah dipakai
            }
          }
        }
        return true; // Tersedia
      } catch (err) {
        console.warn("Gagal cek username:", err);
        return false;
      }
    }

    async function fetchUserData(identifier) {
      const idClean = identifier.trim();
      const usersRef = ref(db, 'users');

      try {
        const directSnap = await get(ref(db, `users/${idClean}`));
        if (directSnap.exists()) {
          return { key: idClean, data: directSnap.val() };
        }
      } catch (_) {}

      try {
        const allSnap = await get(usersRef);
        if (allSnap.exists()) {
          cachedUsersMap = allSnap.val();
          for (const [key, val] of Object.entries(cachedUsersMap)) {
            const matchUsername = val.username && String(val.username).toLowerCase() === idClean.toLowerCase();
            const matchEmailPrefix = key.toLowerCase().startsWith(idClean.toLowerCase() + '@');
            const matchExactKey = key.toLowerCase() === idClean.toLowerCase();

            if (matchUsername || matchEmailPrefix || matchExactKey) {
              return { key, data: val };
            }
          }
        }
      } catch (err) {
        console.error('Fetch user error:', err);
      }
      return null;
    }

    async function renderProfile(targetData, key, currentUser) {
      targetUserKey = key;
      targetUserData = targetData;

      const currentUserEmailKey = currentUser?.email ? getDbKey(currentUser.email) : null;
      
      isOwnProfile = currentUser && (
        currentUser.uid === key || 
        currentUserEmailKey === key ||
        (targetData.email && currentUser.email.toLowerCase() === targetData.email.toLowerCase())
      );

      const name = targetData.name || targetData.username || 'Pengguna';
      const photoURL = targetData.photoURL || '';
      const bioText = targetData.bio && targetData.bio.trim() !== '' ? targetData.bio : 'No bio yet';
      const isAdmin = (targetData.email && targetData.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) || targetData.status === 'admin';

      document.getElementById('headerTitle').innerHTML = name;
      document.getElementById('userName').innerHTML = name;
      document.getElementById('userBio').innerText = bioText;

      const userLevel = calculateLevel(targetData.exp || 0);
      const badgeBox = document.getElementById('badgeContainer');
      const levelBadgeHtml = isAdmin 
        ? `<span class="badge-level admin-lvl">Lv999+</span>` 
        : `<span class="badge-level">Lv${userLevel}</span>`;
      const adminBadgeHtml = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';
      badgeBox.innerHTML = `${levelBadgeHtml} ${adminBadgeHtml}`;

      document.getElementById('statFollowers').innerText = targetData.followersCount || 0;
      document.getElementById('statFollowing').innerText = targetData.followingCount || 0;

      const avatarBox = document.getElementById('profileAvatar');
      avatarBox.classList.remove('skeleton', 'skeleton-avatar');
      if (photoURL) {
        avatarBox.innerHTML = `<img src="${photoURL}" alt="${name}" onerror="this.outerHTML='<span class=\\'avatar-placeholder\\'>${name.charAt(0).toUpperCase()}</span>'">`;
      } else {
        avatarBox.innerHTML = `<span class="avatar-placeholder">${name.charAt(0).toUpperCase()}</span>`;
      }

      const actionBtn = document.getElementById('btnMainAction');
      actionBtn.classList.remove('skeleton', 'skeleton-btn');
      const logoutBtn = document.getElementById('btnLogoutProfile');

      if (isOwnProfile) {
        actionBtn.innerText = 'Edit Profil';
        actionBtn.className = 'btn-action-main btn-secondary';
        logoutBtn.style.display = 'flex';
      } else {
        logoutBtn.style.display = 'none';

        if (currentUserEmailKey && targetData.followers && targetData.followers[currentUserEmailKey]) {
          isFollowing = true;
          actionBtn.innerText = 'Following';
          actionBtn.className = 'btn-action-main btn-secondary';
        } else {
          isFollowing = false;
          actionBtn.innerText = '+ Follow';
          actionBtn.className = 'btn-action-main';
        }
      }

      renderKoleksi(targetData.favorites);
      renderRiwayat(targetData.history);
    }

    function renderKoleksi(rtdbFavorites) {
      const container = document.getElementById('koleksiContainer');
      let favList = [];

      if (rtdbFavorites && typeof rtdbFavorites === 'object') {
        favList = Object.values(rtdbFavorites);
      } else if (isOwnProfile) {
        favList = JSON.parse(localStorage.getItem('df_favorites') || localStorage.getItem('rz_favorites') || '[]');
      }

      if (favList.length === 0) {
        container.innerHTML = '<div class="empty-state">Belum ada item dalam koleksi.</div>';
        return;
      }

      container.innerHTML = favList.map(item => `
        <a href="/donghua/${encodeURIComponent(item.slug)}" class="work-card" title="${item.title || 'Koleksi'}">
          <img src="${item.poster || 'https://via.placeholder.com/300x300?text=No+Cover'}" alt="${item.title || 'Item'}" referrerpolicy="no-referrer">
        </a>
      `).join('');
    }

    function renderRiwayat(rtdbHistory) {
      const area = document.getElementById('riwayatContentArea');

      if (!isOwnProfile) {
        area.innerHTML = `
          <div class="access-denied-box">
            <div class="access-lock-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div class="access-denied-text">Hanya pengguna pemilik yang dapat mengakses riwayat tontonan ini.</div>
          </div>
        `;
        return;
      }

      let historyList = [];
      if (rtdbHistory && typeof rtdbHistory === 'object') {
        historyList = Object.values(rtdbHistory);
      } else {
        historyList = JSON.parse(localStorage.getItem('rz_continue_history') || '[]');
      }

      historyList.sort((a, b) => (b.timestamp || b.updatedAt || 0) - (a.timestamp || a.updatedAt || 0));

      if (historyList.length === 0) {
        area.innerHTML = '<div class="empty-state">Belum ada riwayat tontonan.</div>';
        return;
      }

      area.innerHTML = `
        <div class="history-grid">
          ${historyList.map(item => {
            const epLabel = item.episode || 'Ep 1';
            const targetSlug = item.mainPath || item.slug || '';
            const epPath = item.epPath ? `?ep=${encodeURIComponent(item.epPath)}` : '';
            const poster = item.poster || item.cover || 'https://via.placeholder.com/300x170?text=No+Cover';
            const timeAgo = item.timestamp ? getTimeAgo(item.timestamp) : (item.updatedAt ? getTimeAgo(item.updatedAt) : 'Baru saja');

            return `
              <a href="/donghua/${encodeURIComponent(targetSlug)}${epPath}" class="history-card-item">
                <div class="history-thumb-wrap">
                  <img src="${poster}" alt="${item.title}" referrerpolicy="no-referrer">
                  <span class="history-ep-tag">${epLabel}</span>
                </div>
                <div class="history-details">
                  <div class="history-item-title">${item.title || 'Donghua'}</div>
                  <div class="history-item-time">Terakhir ditonton • ${timeAgo}</div>
                </div>
              </a>
            `;
          }).join('')}
        </div>
      `;
    }

    function getTimeAgo(timestamp) {
      const sec = Math.floor((Date.now() - timestamp) / 1000);
      if (sec < 60) return 'Baru saja';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m lalu`;
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return `${hrs}j lalu`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}h lalu`;
      return new Date(timestamp).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    window.switchProfileTab = function(tabName) {
      const btnKoleksi = document.getElementById('tabBtnKoleksi');
      const btnRiwayat = document.getElementById('tabBtnRiwayat');
      const paneKoleksi = document.getElementById('paneKoleksi');
      const paneRiwayat = document.getElementById('paneRiwayat');

      if (tabName === 'koleksi') {
        btnKoleksi.classList.add('active');
        btnRiwayat.classList.remove('active');
        paneKoleksi.classList.add('active');
        paneRiwayat.classList.remove('active');
      } else {
        btnRiwayat.classList.add('active');
        btnKoleksi.classList.remove('active');
        paneRiwayat.classList.add('active');
        paneKoleksi.classList.remove('active');
      }
    };

    // CEK APAKAH ADA PERUBAHAN PADA FORM EDIT PROFIL
    function checkFormChanges() {
      const currentName = document.getElementById('inputEditName').value.trim();
      const currentUsername = document.getElementById('inputEditUsername').value.trim().toLowerCase();
      const currentBio = document.getElementById('inputEditBio').value.trim();
      const currentPhotoUrl = document.getElementById('inputEditPhotoUrl').value.trim();
      const currentPassword = document.getElementById('inputEditPassword').value;

      const isChanged = (
        currentName !== initialFormValues.name ||
        currentUsername !== initialFormValues.username ||
        currentBio !== initialFormValues.bio ||
        currentPhotoUrl !== '' ||
        uploadedPhotoBase64 !== '' ||
        (currentPassword && currentPassword.length >= 6)
      );

      const saveBtn = document.getElementById('btnSaveModal');
      if (isChanged && isNewUsernameValid && !isCheckingUsername) {
        saveBtn.disabled = false;
      } else {
        saveBtn.disabled = true;
      }
    }

    window.handleMainAction = async function() {
      const btn = document.getElementById('btnMainAction');

      if (isOwnProfile) {
        const currentName = targetUserData?.name || '';
        const currentUsername = (targetUserData?.username || '').toLowerCase();
        const currentBio = targetUserData?.bio || '';

        document.getElementById('inputEditName').value = currentName;
        document.getElementById('inputEditUsername').value = currentUsername;
        document.getElementById('inputEditBio').value = currentBio;
        document.getElementById('inputEditPhotoUrl').value = '';
        document.getElementById('inputEditPhotoFile').value = '';
        document.getElementById('inputEditPassword').value = '';
        uploadedPhotoBase64 = '';

        initialFormValues = {
          name: currentName,
          username: currentUsername,
          bio: currentBio
        };

        isNewUsernameValid = true;
        isCheckingUsername = false;
        
        const hintEl = document.getElementById('editUsernameStatus');
        hintEl.style.display = 'none';
        hintEl.className = 'input-hint';
        hintEl.innerText = '';

        document.getElementById('btnSaveModal').disabled = true;

        openModal('modalEditProfile');
        return;
      }

      if (!currentAuthUser) {
        alert('Silakan login terlebih dahulu untuk mengikuti akun ini.');
        window.location.replace('/profil/login.html');
        return;
      }

      if (!targetUserKey) {
        console.error('Target key akun tidak ditemukan.');
        return;
      }

      const myEmailKey = getDbKey(currentAuthUser.email);
      btn.disabled = true;
      btn.style.opacity = '0.6';

      try {
        let currentFollowers = Number(targetUserData?.followersCount) || 0;

        if (isFollowing) {
          await set(ref(db, `users/${targetUserKey}/followers/${myEmailKey}`), null);
          currentFollowers = Math.max(0, currentFollowers - 1);
          await update(ref(db, `users/${targetUserKey}`), { followersCount: currentFollowers });

          const mySnap = await get(ref(db, `users/${myEmailKey}`));
          if (mySnap.exists()) {
            const myData = mySnap.val();
            const myFollowingCount = Math.max(0, (Number(myData.followingCount) || 0) - 1);
            await update(ref(db, `users/${myEmailKey}`), { followingCount: myFollowingCount });
          }

          if (!targetUserData.followers) targetUserData.followers = {};
          delete targetUserData.followers[myEmailKey];

          isFollowing = false;
          btn.innerText = '+ Follow';
          btn.className = 'btn-action-main';
        } else {
          await set(ref(db, `users/${targetUserKey}/followers/${myEmailKey}`), {
            uid: currentAuthUser.uid,
            email: currentAuthUser.email,
            timestamp: Date.now()
          });
          currentFollowers += 1;
          await update(ref(db, `users/${targetUserKey}`), { followersCount: currentFollowers });

          const mySnap = await get(ref(db, `users/${myEmailKey}`));
          if (mySnap.exists()) {
            const myData = mySnap.val();
            const myFollowingCount = (Number(myData.followingCount) || 0) + 1;
            await update(ref(db, `users/${myEmailKey}`), { followingCount: myFollowingCount });
          }

          if (!targetUserData.followers) targetUserData.followers = {};
          targetUserData.followers[myEmailKey] = true;

          isFollowing = true;
          btn.innerText = 'Following';
          btn.className = 'btn-action-main btn-secondary';
        }

        if (targetUserData) targetUserData.followersCount = currentFollowers;
        document.getElementById('statFollowers').innerText = currentFollowers;

      } catch (err) {
        console.error('Error Follow/Unfollow:', err);
        alert('Gagal memproses follow: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    };

    // CEK KETERSEDIAAN USERNAME DENGAN FEEDBACK VISUAL PASTI
    const editUsernameInput = document.getElementById('inputEditUsername');
    const editUsernameStatus = document.getElementById('editUsernameStatus');

    editUsernameInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
      clearTimeout(editCheckTimeout);
      const val = e.target.value.trim();

      // Jika sama persis dengan username akun saat ini
      if (!val || val === (initialFormValues.username || '').toLowerCase()) {
        editUsernameStatus.style.display = 'none';
        editUsernameStatus.className = 'input-hint';
        editUsernameStatus.innerText = '';
        isNewUsernameValid = true;
        isCheckingUsername = false;
        checkFormChanges();
        return;
      }

      if (val.length < 3) {
        editUsernameStatus.style.display = 'block';
        editUsernameStatus.className = 'input-hint error';
        editUsernameStatus.innerText = 'Minimal 3 karakter (huruf, angka, _).';
        isNewUsernameValid = false;
        isCheckingUsername = false;
        checkFormChanges();
        return;
      }

      // Tampilkan status memeriksa
      editUsernameStatus.style.display = 'block';
      editUsernameStatus.className = 'input-hint checking';
      editUsernameStatus.innerText = 'Memeriksa ketersediaan...';
      isCheckingUsername = true;
      checkFormChanges();

      editCheckTimeout = setTimeout(async () => {
        const isAvailable = await checkUsernameAvailability(val, targetUserKey);

        editUsernameStatus.style.display = 'block';
        if (!isAvailable) {
          editUsernameStatus.className = 'input-hint error';
          editUsernameStatus.innerText = 'Username sudah digunakan.';
          isNewUsernameValid = false;
        } else {
          editUsernameStatus.className = 'input-hint success';
          editUsernameStatus.innerText = 'Username tersedia.';
          isNewUsernameValid = true;
        }

        isCheckingUsername = false;
        checkFormChanges();
      }, 250);
    });

    ['inputEditName', 'inputEditBio', 'inputEditPhotoUrl', 'inputEditPassword'].forEach(id => {
      document.getElementById(id).addEventListener('input', checkFormChanges);
    });

    document.getElementById('inputEditPhotoFile').addEventListener('change', function() {
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedPhotoBase64 = evt.target.result;
          checkFormChanges();
        };
        reader.readAsDataURL(this.files[0]);
      } else {
        uploadedPhotoBase64 = '';
        checkFormChanges();
      }
    });

    window.handleSaveProfile = async function(e) {
      e.preventDefault();
      if (!isOwnProfile || !targetUserKey) return;

      if (isCheckingUsername) {
        alert('Mohon tunggu sebentar, sedang memeriksa ketersediaan username...');
        return;
      }

      if (!isNewUsernameValid) {
        alert('Username sudah digunakan atau belum memenuhi syarat.');
        return;
      }

      const newName = document.getElementById('inputEditName').value.trim();
      const newUsername = document.getElementById('inputEditUsername').value.trim().toLowerCase();
      const newBio = document.getElementById('inputEditBio').value.trim();
      const newPhotoUrl = document.getElementById('inputEditPhotoUrl').value.trim();
      const finalPhoto = uploadedPhotoBase64 || newPhotoUrl || targetUserData.photoURL || '';
      const newPassword = document.getElementById('inputEditPassword').value;

      const saveBtn = document.getElementById('btnSaveModal');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Menyimpan...';

      try {
        if (newUsername !== (initialFormValues.username || '').toLowerCase()) {
          const finalCheck = await checkUsernameAvailability(newUsername, targetUserKey);
          if (!finalCheck) {
            editUsernameStatus.style.display = 'block';
            editUsernameStatus.className = 'input-hint error';
            editUsernameStatus.innerText = 'Username sudah digunakan.';
            alert('Username sudah digunakan oleh pengguna lain.');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Simpan Perubahan';
            return;
          }
        }

        if (newPassword && newPassword.length >= 6) {
          await updatePassword(currentAuthUser, newPassword);
        }

        const updates = {
          name: newName,
          username: newUsername,
          bio: newBio,
          photoURL: finalPhoto
        };

        await update(ref(db, `users/${targetUserKey}`), updates);

        targetUserData.name = newName;
        targetUserData.username = newUsername;
        targetUserData.bio = newBio;
        targetUserData.photoURL = finalPhoto;

        await renderProfile(targetUserData, targetUserKey, currentAuthUser);
        closeModal('modalEditProfile');

        window.history.replaceState(null, '', `/profil/${newUsername}`);
        alert('Profil berhasil diperbarui!');
      } catch (err) {
        alert('Gagal menyimpan profil: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Simpan Perubahan';
      }
    };

    window.handleLogout = async function() {
      if (confirm('Yakin ingin keluar dari akun?')) {
        await signOut(auth);
        window.location.replace('/profil/login.html');
      }
    };

    window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

    onAuthStateChanged(auth, async (authUser) => {
      currentAuthUser = authUser;
      const urlUsername = getUsernameFromUrl();

      if (urlUsername) {
        const found = await fetchUserData(urlUsername);
        if (found) {
          await renderProfile(found.data, found.key, authUser);
        } else {
          document.getElementById('profileContent').innerHTML = `
            <div style="text-align:center;padding:80px 20px;color:var(--text-sub);">
              <h2 style="color:#fff;margin-bottom:8px;font-size:20px;">Pengguna Tidak Ditemukan</h2>
              <p style="font-size:13.5px;">Profil "@${urlUsername}" belum terdaftar atau tidak ditemukan.</p>
              <a href="/" style="display:inline-block;margin-top:20px;padding:10px 24px;background:#fff;color:#000;text-decoration:none;font-weight:700;border-radius:9999px;font-size:13px;">Kembali ke Beranda</a>
            </div>
          `;
          document.getElementById('headerTitle').innerText = 'Tidak Ditemukan';
        }
      } else {
        if (!authUser) {
          window.location.replace('/profil/login.html');
          return;
        }

        const emailKey = getDbKey(authUser.email);
        let snap = await get(ref(db, `users/${emailKey}`));
        let data = snap.exists() ? snap.val() : null;

        if (!data) {
          snap = await get(ref(db, `users/${authUser.uid}`));
          data = snap.exists() ? snap.val() : {};
        }

        if (data.username) {
          window.location.replace(`/profil/${data.username}`);
        } else {
          await renderProfile(data, emailKey, authUser);
        }
      }
    });
  </script>
