<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Masuk - Dongflix</title>
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">

  <style>
    :root {
      --bg-base: #000000;
      --bg-card: rgba(18, 22, 34, 0.75);
      --color-primary: #0284c7;
      --color-accent: #38bdf8;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-xl: 24px;
      --radius-md: 12px;
      --radius-btn: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.25) 0%, transparent 75%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      padding: 34px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      background: rgba(5, 8, 17, 0.85);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 14px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--color-accent);
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      margin-bottom: 18px;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }

    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-links {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-sub);
    }

    .footer-links a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-sub);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-title">Masuk ke Dongflix</div>
      <div class="brand-sub">Akses koleksi donghua & kelola profil Anda</div>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email atau Username *</label>
        <input type="text" id="loginIdentifier" class="form-input" placeholder="contoh: rulsz atau nama@email.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="Masukkan password Anda" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnSubmitLogin" class="btn-submit">Masuk Sekarang</button>
    </form>

    <div class="footer-links">
      Belum punya akun? <a href="/profil/register.html">Daftar di sini</a>
    </div>

    <a href="/" class="back-home">&larr; Kembali ke Beranda</a>
  </div>

  <script type="module">
    import { auth, db } from '/assets/firebase-config.js';
    import { ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('btnSubmitLogin');

    function showError(msg) {
      errorBanner.innerText = msg;
      errorBanner.style.display = 'block';
    }

    // Menggunakan window.location.replace agar halaman login tidak tersimpan di riwayat tombol kembali
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const emailKey = user.email.toLowerCase().replace(/\./g, ',');
        const userSnap = await get(ref(db, `users/${emailKey}`));
        const targetUrl = (userSnap.exists() && userSnap.val().username)
          ? `/profil/${userSnap.val().username}`
          : '/profil/';
        window.location.replace(targetUrl);
      }
    });

    async function resolveEmailFromIdentifier(identifier) {
      const cleanInput = identifier.trim().toLowerCase();
      if (cleanInput.includes('@')) return cleanInput;

      try {
        const usersRef = ref(db, 'users');
        try {
          const q = query(usersRef, orderByChild('username'), equalTo(cleanInput));
          const snap = await get(q);
          if (snap.exists()) {
            const data = snap.val();
            return data[Object.keys(data)[0]].email || null;
          }
        } catch (_) {}

        const allSnap = await get(usersRef);
        if (allSnap.exists()) {
          const allData = allSnap.val();
          for (const key in allData) {
            if (allData[key]?.username && allData[key].username.toLowerCase() === cleanInput) {
              return allData[key].email || null;
            }
          }
        }
      } catch (err) {
        console.error(err);
      }
      return null;
    }

    window.handleLogin = async function(e) {
      e.preventDefault();
      errorBanner.style.display = 'none';

      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!identifier || !password) return showError('Semua form wajib diisi!');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Memeriksa akun...';

      try {
        const emailToLogin = await resolveEmailFromIdentifier(identifier);
        if (!emailToLogin) {
          showError('Username tidak ditemukan.');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Masuk Sekarang';
          return;
        }

        const cred = await signInWithEmailAndPassword(auth, emailToLogin, password);
        const emailKey = cred.user.email.toLowerCase().replace(/\./g, ',');
        const userSnap = await get(ref(db, `users/${emailKey}`));

        const targetUrl = (userSnap.exists() && userSnap.val().username)
          ? `/profil/${userSnap.val().username}`
          : '/profil/';
        
        window.location.replace(targetUrl);
      } catch (err) {
        let msg = 'Gagal masuk. Periksa kembali email/username dan password.';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') msg = 'Password salah.';
        else if (err.code === 'auth/user-not-found') msg = 'Akun belum terdaftar.';
        showError(msg);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Masuk Sekarang';
      }
    };
  </script>
</body>
</html>
