<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Scraper Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-10 font-sans">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
          Admin Scraper Panel
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Target data: <code class="text-sky-400 bg-slate-900 px-2 py-0.5 rounded">/donghua/donghua.json</code>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <a href="/" class="px-4 py-2 text-sm rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 transition">
          Lihat Web Utama
        </a>
        <button id="btnTrigger" onclick="triggerScrapeAction()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-sm font-semibold transition active:scale-95 shadow-lg shadow-blue-600/30">
          Jalankan Scraper
        </button>
      </div>
    </div>

    <!-- Modal / Setting Token (Tersimpan di LocalStorage browser admin) -->
    <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="text-sm">
        <p class="font-semibold text-slate-200">Konfigurasi GitHub Workflow</p>
        <p class="text-slate-400 text-xs">Diperlukan untuk memicu tombol action langsung dari web tanpa buka GitHub.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <input id="ghOwner" type="text" placeholder="Owner/Username" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
        <input id="ghRepo" type="text" placeholder="Nama Repo" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
        <input id="ghPat" type="password" placeholder="GitHub PAT (token)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
        <button onclick="saveConfig()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium">Simpan</button>
      </div>
    </div>

    <!-- Alert Status -->
    <div id="statusAlert" class="hidden p-4 rounded-xl text-sm border"></div>

    <!-- Metric Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Item Tersimpan</div>
        <div id="totalDonghua" class="text-3xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Status Data Lokal</div>
        <div id="fileStatus" class="text-sm font-medium text-emerald-400 mt-3 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Terkoneksi
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Pencarian Cepat</div>
        <input id="searchInput" oninput="filterData()" type="text" placeholder="Ketik judul..." class="w-full mt-2 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none">
      </div>
    </div>

    <!-- List Donghua Container -->
    <div>
      <h2 class="text-xl font-bold text-slate-200 mb-4">Daftar Donghua Saat Ini</h2>
      <div id="donghuaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- Render card dinamis dari donghua.json -->
      </div>
    </div>

  </div>

  <script>
    let donghuaData = [];

    // Ambil data dari /donghua/donghua.json
    async function loadData() {
      try {
        const res = await fetch('/donghua/donghua.json?t=' + Date.now());
        if (!res.ok) throw new Error('File belum ditemukan');
        donghuaData = await res.json();
        document.getElementById('totalDonghua').innerText = donghuaData.length;
        renderGrid(donghuaData);
      } catch (err) {
        document.getElementById('totalDonghua').innerText = '0';
        document.getElementById('fileStatus').innerHTML = '<span class="text-rose-400">Belum ada data</span>';
        document.getElementById('donghuaGrid').innerHTML = '<div class="col-span-full py-16 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">donghua.json masih kosong. Silakan jalankan scraper.</div>';
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('donghuaGrid');
      grid.innerHTML = items.map(item => `
        <div class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
          <div class="aspect-[3/4] w-full bg-slate-800 relative overflow-hidden">
            <img src="${item.cover}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
            <span class="absolute top-2 left-2 bg-slate-950/80 text-[10px] text-sky-400 font-semibold px-2 py-0.5 rounded">${item.type}</span>
            <span class="absolute bottom-2 right-2 bg-blue-600/90 text-[10px] text-white font-medium px-1.5 py-0.5 rounded">${item.episode}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <h3 class="text-xs font-semibold text-slate-200 line-clamp-2" title="${item.title}">${item.title}</h3>
            <div class="mt-2 flex items-center justify-between text-[11px]">
              <span class="text-emerald-400 font-medium">${item.status}</span>
              <a href="${item.link}" target="_blank" class="text-slate-400 hover:text-white">Buka ↗</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderGrid(donghuaData.filter(d => d.title.toLowerCase().includes(q)));
    }

    function saveConfig() {
      localStorage.setItem('gh_owner', document.getElementById('ghOwner').value);
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value);
      localStorage.setItem('gh_pat', document.getElementById('ghPat').value);
      showAlert('Konfigurasi GitHub berhasil disimpan di browser.', 'emerald');
    }

    async function triggerScrapeAction() {
      const owner = localStorage.getItem('gh_owner');
      const repo = localStorage.getItem('gh_repo');
      const pat = localStorage.getItem('gh_pat');

      if (!owner || !repo || !pat) {
        return showAlert('Isi dan simpan Konfigurasi GitHub (Owner, Repo, Token) terlebih dahulu.', 'rose');
      }

      const btn = document.getElementById('btnTrigger');
      btn.disabled = true;
      btn.innerText = 'Mengirim Permintaan...';

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/scrape.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${pat}`,
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (res.ok) {
          showAlert('Scraper berhasil dipicu di GitHub Action! File donghua.json akan terupdate otomatis dalam beberapa menit.', 'emerald');
        } else {
          const err = await res.json();
          showAlert('Gagal: ' + (err.message || 'Cek token/nama repo'), 'rose');
        }
      } catch (err) {
        showAlert('Gagal menghubungi GitHub API: ' + err.message, 'rose');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Jalankan Scraper';
      }
    }

    function showAlert(msg, color) {
      const el = document.getElementById('statusAlert');
      el.className = `p-4 rounded-xl text-sm border bg-${color}-950/40 border-${color}-800 text-${color}-300 block`;
      el.innerText = msg;
    }

    // Load konfigurasi tersimpan
    document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || '';
    document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
    document.getElementById('ghPat').value = localStorage.getItem('gh_pat') || '';

    loadData();
  </script>
</body>
</html>
