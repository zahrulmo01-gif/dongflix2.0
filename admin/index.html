<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dongflix Admin - Data Management</title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="text-xl font-black tracking-tight bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-500 bg-clip-text text-transparent">
          Dongflix Admin
        </a>
        <span class="text-[10px] font-bold uppercase tracking-wider bg-cyan-950/80 text-cyan-300 border border-cyan-800/60 px-2 py-0.5 rounded-full font-mono">
          Dashboard
        </span>
      </div>

      <nav class="flex items-center gap-2">
        <a href="/" class="text-xs font-semibold text-slate-300 hover:text-white px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition">
          Lihat Web
        </a>
        <button onclick="loadAdminData()" class="text-xs font-semibold text-cyan-400 px-3.5 py-2 rounded-xl bg-cyan-950/40 border border-cyan-800/60 hover:bg-cyan-900/40 transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Refresh Data
        </button>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8 space-y-6">
    
    <!-- STATS CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400">Total Judul Terdata</span>
        <h2 id="statTotal" class="text-2xl font-black text-white mt-1">...</h2>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400">Status Ongoing</span>
        <h2 id="statOngoing" class="text-2xl font-black text-emerald-400 mt-1">...</h2>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400">Status Completed</span>
        <h2 id="statCompleted" class="text-2xl font-black text-blue-400 mt-1">...</h2>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="relative w-full sm:w-80">
        <input 
          id="adminSearchInput" 
          type="text" 
          placeholder="Cari slug atau judul..." 
          oninput="applyFilter()"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
        >
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select 
          id="statusFilter" 
          onchange="applyFilter()" 
          class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-cyan-500"
        >
          <option value="ALL">Semua Status</option>
          <option value="Ongoing">Ongoing</option>
          <option value="Completed">Completed</option>
        </select>
        <span id="filteredCountInfo" class="text-xs text-slate-400 font-mono">Memuat...</span>
      </div>
    </div>

    <!-- TABLE LIST -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-950/80 border-b border-slate-800 text-slate-400 font-semibold uppercase tracking-wider font-mono">
            <tr>
              <th class="p-4 w-12 text-center">#</th>
              <th class="p-4">Donghua</th>
              <th class="p-4">Slug</th>
              <th class="p-4 text-center">Status</th>
              <th class="p-4 text-center">Episode</th>
              <th class="p-4">Updated At</th>
              <th class="p-4 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="adminTableBody" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-500">Memuat katalog dari API Proxy...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="border-t border-slate-800 bg-slate-950 px-4 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026 Dongflix Admin Panel</p>
  </footer>

  <script>
    let rawDonghuaList = [];
    let filteredList = [];

    async function loadAdminData() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500">Memuat data dari API Proxy...</td></tr>';

      try {
        const res = await fetch('/api/donghua?path=donghua.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('API Proxy gagal merespons');
        rawDonghuaList = await res.json();

        // Hitung statistik
        document.getElementById('statTotal').innerText = rawDonghuaList.length;
        document.getElementById('statOngoing').innerText = rawDonghuaList.filter(d => (d.status || '').toLowerCase() === 'ongoing').length;
        document.getElementById('statCompleted').innerText = rawDonghuaList.filter(d => (d.status || '').toLowerCase() === 'completed').length;

        filteredList = [...rawDonghuaList];
        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-rose-400">Gagal mengambil data: ${err.message}</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('adminTableBody');
      document.getElementById('filteredCountInfo').innerText = `${filteredList.length} dari ${rawDonghuaList.length}`;

      if (filteredList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-500">Tidak ada judul yang sesuai.</td></tr>';
        return;
      }

      tbody.innerHTML = filteredList.slice(0, 100).map((item, idx) => {
        const isCompleted = (item.status || '').toLowerCase() === 'completed';
        const coverImg = item.cover || 'https://via.placeholder.com/60x80?text=No+Cover';
        const epVal = item['latest-episode'] || item.episode || '-';

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-4 text-center font-mono text-slate-500">${idx + 1}</td>
            <td class="p-4">
              <div class="flex items-center gap-3">
                <img src="${coverImg}" referrerpolicy="no-referrer" class="w-9 h-12 object-cover rounded-md border border-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/60x80?text=No+Cover'">
                <span class="font-semibold text-slate-200 line-clamp-1 max-w-xs" title="${item.title}">${item.title}</span>
              </div>
            </td>
            <td class="p-4 font-mono text-slate-400 text-[11px]">${item.slug}</td>
            <td class="p-4 text-center">
              <span class="px-2 py-0.5 rounded-md font-semibold text-[10px] ${isCompleted ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                ${item.status || 'Ongoing'}
              </span>
            </td>
            <td class="p-4 text-center font-mono font-bold text-cyan-400">
              ${epVal}
            </td>
            <td class="p-4 font-mono text-slate-500 text-[11px]">
              ${item.updated_at ? new Date(item.updated_at).toLocaleDateString('id-ID') : '-'}
            </td>
            <td class="p-4 text-right">
              <a href="/donghua/${encodeURIComponent(item.slug)}" target="_blank" class="text-cyan-400 hover:text-cyan-300 font-semibold text-[11px] bg-cyan-950/60 border border-cyan-800/60 px-2.5 py-1 rounded-lg transition">
                Buka
              </a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilter() {
      const q = document.getElementById('adminSearchInput').value.toLowerCase().trim();
      const st = document.getElementById('statusFilter').value;

      filteredList = rawDonghuaList.filter(item => {
        const matchTitle = (item.title && item.title.toLowerCase().includes(q)) || (item.slug && item.slug.toLowerCase().includes(q));
        const matchStatus = st === 'ALL' || (item.status && item.status.toLowerCase() === st.toLowerCase());
        return matchTitle && matchStatus;
      });

      renderTable();
    }

    loadAdminData();
  </script>
</body>
</html>
