<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>404 - Halaman Tidak Ditemukan | Dongflix</title>

  <!-- Favicon / Ikon Web -->
  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">
  <meta name="theme-color" content="#000000">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0a;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(20, 20, 24, 0.58);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      --glass-blur: blur(20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* BACKGROUND GLOW ORNAMENTS */
    .bg-glow-1 {
      position: fixed;
      top: 15%;
      left: 10%;
      width: 320px;
      height: 320px;
      background: rgba(2, 132, 199, 0.18);
      filter: blur(100px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: 15%;
      right: 10%;
      width: 320px;
      height: 320px;
      background: rgba(56, 189, 248, 0.12);
      filter: blur(100px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* FLOATING PILL HEADER */
    .header-bar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      pointer-events: none;
    }

    .header-bar > * { pointer-events: auto; }

    .pill-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-light-pip {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 3.5px;
      background: var(--color-accent);
      border-radius: 9999px;
      box-shadow: 0 0 10px var(--color-accent), 0 0 18px var(--color-accent);
      opacity: 0.9;
      pointer-events: none;
    }

    .nav-capsule {
      display: flex;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 9999px;
      padding: 6px 20px;
      height: 46px;
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      text-decoration: none;
    }

    .brand-title-capsule {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.4px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      background: transparent !important;
    }

    .brand-title-capsule .brand-accent {
      color: var(--color-accent);
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      letter-spacing: 0.2px;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    /* 404 CONTENT CONTAINER */
    .main-container {
      position: relative;
      z-index: 10;
      max-width: 520px;
      margin: auto;
      padding: 100px 20px 40px;
      text-align: center;
      width: 100%;
    }

    .glass-box {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      border-radius: 28px;
      padding: 44px 26px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 88px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ffffff 30%, var(--color-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
    }

    .badge-error {
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--color-accent);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .error-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 30px;
      max-width: 380px;
    }

    /* ACTION BUTTONS */
    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    @media (min-width: 480px) {
      .actions-row {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn-action-primary {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
      transition: transform 0.15s ease;
      border: none;
      cursor: pointer;
    }

    .btn-action-primary:active { transform: scale(0.97); }

    .btn-action-secondary {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
    }

    .btn-action-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .btn-action-secondary:active { transform: scale(0.97); }

    .btn-svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 10;
      padding: 24px 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND GLOWS -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- FLOATING PILL HEADER -->
  <header class="header-bar">
    <div class="pill-wrapper">
      <div class="top-light-pip"></div>
      <a href="/" class="nav-capsule">
        <span class="brand-title-capsule">
          <img src="/image/IMG_6395.png" alt="Logo" class="brand-logo-icon">
          <span>Dong<span class="brand-accent">flix</span></span>
        </span>
      </a>
    </div>
  </header>

  <!-- 404 KONTEN KACA -->
  <main class="main-container">
    <div class="glass-box">
      <span class="badge-error">Halaman Hilang</span>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Donghua atau Halaman Tidak Ditemukan</h2>
      <p class="error-desc">
        Tautan yang kamu tuju mungkin telah dipindahkan, judulnya berganti, atau belum tersedia di server Dongflix.
      </p>

      <div class="actions-row">
        <button onclick="goBack()" class="btn-action-secondary">
          <svg class="btn-svg" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          Kembali
        </button>
        <a href="/" class="btn-action-primary">
          <svg class="btn-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Ke Beranda
        </a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Dongflix.my.id. Seluruh hak cipta dilindungi.</p>
  </footer>

  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
