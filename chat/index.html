<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live Chat Komunitas - Dongflix</title>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Ruang obrolan langsung sesama penikmat donghua subtitle Indonesia di Dongflix.">

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" href="/image/IMG_6395.png">
  <link rel="apple-touch-icon" href="/image/IMG_6395.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script type="module" src="/assets/firebase-config.js"></script>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0a0a0c;
      --bg-chat-bubble: #17181c;
      --color-primary: #0284c7;
      --color-primary-hover: #0369a1;
      --color-accent: #38bdf8;
      --color-quote-border: #a855f7;
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(18, 18, 24, 0.72);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-blur: blur(20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* SKELETON SHIMMER ANIMATION */
    @keyframes skeletonShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.03) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.6s infinite ease-in-out;
      border-radius: 8px;
      border: none !important;
      color: transparent !important;
      user-select: none;
      pointer-events: none;
    }

    .skeleton-text {
      height: 12px;
      border-radius: 6px;
      display: block;
    }

    /* Container Dinamis */
    .app-viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    /* Top Navigation Header */
    header {
      height: 60px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-content {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }

    .header-titles {
      display: flex;
      flex-direction: column;
    }
    .header-titles h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .live-status {
      font-size: 11px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseGreen 1.6s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Chat Messages Container */
    .chat-messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 8px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .chat-loading-placeholder {
      margin: auto;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    /* Badge Pemisah Tanggal */
    .date-separator-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px 0;
      user-select: none;
    }
    .date-separator-badge {
      background: rgba(22, 27, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Message Item Card */
    .chat-msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: 88%;
      position: relative;
    }
    .chat-msg-row.mine {
      margin-left: auto;
      flex-direction: row-reverse;
    }
    .chat-msg-row.highlighted .msg-bubble {
      box-shadow: 0 0 0 2px var(--color-accent);
      transition: box-shadow 0.3s ease;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      cursor: pointer;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-body-wrapper {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 100%;
    }
    .chat-msg-row.mine .msg-body-wrapper {
      align-items: flex-end;
    }

    /* Shimmer Badge */
    @keyframes badgeShimmer {
      0% { transform: translateX(-150%) skewX(-20deg); }
      35%, 100% { transform: translateX(180%) skewX(-20deg); }
    }
    .badge-admin, .badge-level {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 800;
      padding: 1.5px 6.5px;
      border-radius: 6px;
      overflow: hidden;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    .badge-admin::after, .badge-level::after {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 45%; height: 200%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0) 100%);
      animation: badgeShimmer 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .badge-level {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22) 0%, rgba(2, 132, 199, 0.12) 100%);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }
    .badge-level.admin-lvl {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #451a03;
      border: 1px solid rgba(254, 243, 199, 0.5);
      font-weight: 900;
    }
    .badge-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      color: #ffffff;
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.45);
      font-weight: 900;
    }

    /* Message Bubble */
    .msg-bubble {
      background: var(--bg-chat-bubble);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 10px 14px 22px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      min-width: 90px;
    }
    .chat-msg-row.mine .msg-bubble {
      background: #1e2638;
      border-color: rgba(56, 189, 248, 0.2);
    }

    /* Quote Box */
    .msg-quote-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 6px 10px 6px 12px;
      margin-bottom: 4px;
      position: relative;
      border-left: 3.5px solid #a855f7;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chat-msg-row.mine .msg-quote-box {
      border-left-color: #38bdf8;
    }
    .quote-author {
      font-size: 11.5px;
      font-weight: 800;
      color: #38bdf8;
    }
    .quote-snippet {
      font-size: 11.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    .msg-user-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      flex-wrap: wrap;
    }
    .sender-name {
      font-weight: 800;
      color: #93c5fd;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .sender-name:hover {
      text-decoration: underline;
    }
    .sender-name.admin {
      color: #f59e0b !important;
    }

    .msg-text-content {
      font-size: 13.5px;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-word;
      padding-right: 32px;
    }

    .msg-sticker {
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      margin-top: 4px;
      margin-bottom: 2px;
      background: rgba(255, 255, 255, 0.02);
    }

    .mention-tag {
      color: #38bdf8 !important;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .mention-tag:hover {
      text-decoration: underline;
    }
    .chat-msg-row.mine .mention-tag {
      color: #bae6fd !important;
    }

    .msg-time-bottom-right {
      position: absolute;
      bottom: 5px;
      right: 12px;
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
      user-select: none;
    }
    .chat-msg-row.mine .msg-time-bottom-right {
      color: #94a3b8;
    }

    .msg-delete-btn {
      display: none;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
      align-self: center;
    }
    .msg-delete-btn:hover {
      background: #ef4444;
      color: #ffffff;
      transform: scale(1.1);
    }
    .msg-delete-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .chat-msg-row:hover .msg-delete-btn {
      display: inline-flex;
    }

    .chat-bottom-bar {
      background: rgba(10, 10, 14, 0.98);
      border-top: 1px solid var(--border-color);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      width: 100%;
      z-index: 110;
      flex-shrink: 0;
    }

    .chat-input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .reply-target-banner {
      display: none;
      background: #111827;
      border-left: 3.5px solid #a855f7;
      border-radius: 10px 10px 0 0;
      padding: 6px 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .reply-target-banner.active { display: flex; }
    .reply-target-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .reply-target-name {
      font-size: 11.5px;
      font-weight: 800;
      color: #a855f7;
    }
    .reply-target-text {
      font-size: 11.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .reply-target-cancel {
      color: #94a3b8;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }

    .sticker-preview-box {
      display: none;
      position: relative;
      width: 58px;
      height: 58px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 12px;
      padding: 4px;
      align-items: center;
      justify-content: center;
    }
    .sticker-preview-box.active { display: inline-flex; }
    .sticker-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .sticker-preview-remove {
      position: absolute;
      top: -5px; right: -5px;
      width: 18px; height: 18px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #000;
    }

    .mention-dropdown {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: #0b1329;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 6px;
      min-width: 220px;
      max-height: 180px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 150;
      overflow-y: auto;
    }
    .mention-dropdown.active { display: block; }
    .mention-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    .mention-item:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .mention-item img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .mention-initial {
      width: 24px; height: 24px; border-radius: 50%; background: #0284c7; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 26px;
      padding: 5px 8px 5px 16px;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: #38bdf8; }

    .chat-input {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    .btn-sticker {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-sticker:hover { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border-color: #38bdf8; }
    .btn-sticker svg { width: 20px; height: 20px; }

    .btn-send {
      background: #0284c7;
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }
    .btn-send:hover { background: #0369a1; }
    .btn-send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    .chat-login-prompt {
      display: none;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      padding: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      max-width: 900px;
      margin: 0 auto;
    }
    .chat-login-prompt a {
      color: #38bdf8;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
    }
    .sheet-overlay.active { display: block; }

    .sticker-panel {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #090e17;
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 205;
      padding: 16px;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.8);
      max-height: 45vh;
      flex-direction: column;
    }
    .sticker-panel.active { display: flex; }

    .sticker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sticker-header span {
      font-size: 13.5px;
      font-weight: 800;
      color: #f1f5f9;
    }
    .sticker-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding: 6px 2px;
      max-height: 32vh;
    }
    .sticker-grid-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, border-color 0.15s;
      aspect-ratio: 1/1;
    }
    .sticker-grid-item:hover, .sticker-grid-item:active {
      transform: scale(1.08);
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }
    .sticker-grid-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="app-viewport-wrapper" id="appViewport">
    <!-- Top Header Navigation -->
    <header>
      <div class="header-content">
        <div class="header-left" onclick="history.back() || (window.location.href='/')">
          <button class="icon-btn" aria-label="Kembali">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="header-titles">
            <h1>Live Chat Dongflix</h1>
            <div class="live-status">
              <span class="pulse-dot"></span>
              <span id="onlineCountText">Komunitas Online</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Chat Log Message View DENGAN SKELETON PLACEHOLDER -->
    <main class="chat-messages-container" id="chatContainer">
      <div id="chatLoading" style="display:flex; flex-direction:column; gap:14px; width:100%;">
        <div class="chat-msg-row">
          <div class="user-avatar skeleton" style="border-radius:50%;"></div>
          <div class="msg-body-wrapper" style="width:65%;">
            <div class="msg-bubble" style="background:#141720; border-color:transparent; gap:8px;">
              <div style="display:flex; gap:6px;">
                <div class="skeleton skeleton-text" style="width:75px; height:12px;"></div>
                <div class="skeleton" style="width:36px; height:12px; border-radius:4px;"></div>
              </div>
              <div class="skeleton skeleton-text" style="width:90%; height:13px;"></div>
              <div class="skeleton skeleton-text" style="width:55%; height:13px;"></div>
            </div>
          </div>
        </div>
        <div class="chat-msg-row mine">
          <div class="user-avatar skeleton" style="border-radius:50%;"></div>
          <div class="msg-body-wrapper" style="width:55%;">
            <div class="msg-bubble" style="background:#1b2336; border-color:transparent; gap:8px;">
              <div style="display:flex; gap:6px;">
                <div class="skeleton skeleton-text" style="width:60px; height:12px;"></div>
              </div>
              <div class="skeleton skeleton-text" style="width:85%; height:13px;"></div>
            </div>
          </div>
        </div>
        <div class="chat-msg-row">
          <div class="user-avatar skeleton" style="border-radius:50%;"></div>
          <div class="msg-body-wrapper" style="width:70%;">
            <div class="msg-bubble" style="background:#141720; border-color:transparent; gap:8px;">
              <div style="display:flex; gap:6px;">
                <div class="skeleton skeleton-text" style="width:90px; height:12px;"></div>
                <div class="skeleton" style="width:40px; height:12px; border-radius:4px;"></div>
              </div>
              <div class="skeleton skeleton-text" style="width:95%; height:13px;"></div>
              <div class="skeleton skeleton-text" style="width:70%; height:13px;"></div>
            </div>
          </div>
        </div>
      </div>

  <!-- Firebase Script Init -->
  <script type="module">
    import * as FB from '/assets/firebase-config.js';

    window.auth = FB.auth;

    window.fbRef = FB.ref || FB.fbRef;
    window.fbGet = FB.get || FB.fbGet;
    window.fbSet = FB.set || FB.fbSet;

    if (FB.onAuthStateChanged && FB.auth) {
      FB.onAuthStateChanged(FB.auth, (user) => {
        window.currentUser = user;
        const inputArea = document.getElementById('chatInputArea');
        const loginPrompt = document.getElementById('chatLoginPrompt');

        if (user) {
          if (inputArea) inputArea.style.display = 'flex';

    let checkTries = 0;
    const checkReady = setInterval(() => {
      checkTries++;
      if (window.db && window.fbRef && window.fbGet) {
        clearInterval(checkReady);
        initLiveChat();

        clearInterval(checkReady);
        const loadingEl = document.getElementById('chatLoading');
        if (loadingEl) {
          loadingEl.innerHTML = '<span style="color:#ef4444; text-align:center; display:block; padding:20px;">Gagal memuat modul database.</span>';

    }, 50);

  <script>
    const ADMIN_EMAIL = 'zahrulms01@gmail.com';
    let selectedStickerUrl = '';
    let cachedStickers = [];
    let allFirebaseUsersList = []; // Daftar semua user dari node users
    let lastRenderedChatJson = '';
    let replyingMessage = null;
    const userProfileCache = {};

    const DEFAULT_STICKERS = [
      'https://cdn-icons-png.flaticon.com/128/9408/9408175.png',
      'https://media.tenor.com/On7KVXhzuf8AAAAj/chibi-cat.gif',
      'https://cdn-icons-png.flaticon.com/128/9408/9408201.png',
      'https://media.tenor.com/2s_jOsl0e8MAAAAj/dance-happy.gif',
      'https://cdn-icons-png.flaticon.com/128/9408/9408166.png',
      'https://media.tenor.com/kHIdycPoP6AAAAAj/anime-cry.gif',
      'https://cdn-icons-png.flaticon.com/128/9408/9408224.png',
      'https://media.tenor.com/gK2J_J7KkE8AAAAj/cute-love.gif'
    ];

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return `${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function getDateDividerLabel(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      const now = new Date();

      const dYear = d.getFullYear();
      const dMonth = d.getMonth();
      const dDate = d.getDate();

      const nowYear = now.getFullYear();
      const nowMonth = now.getMonth();
      const nowDate = now.getDate();

      if (dYear === nowYear && dMonth === nowMonth && dDate === nowDate) return 'HARI INI';

      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      if (dYear === yesterday.getFullYear() && dMonth === yesterday.getMonth() && dDate === yesterday.getDate()) return 'KEMARIN';

      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return dYear === nowYear ? `${dDate} ${months[dMonth]}` : `${dDate} ${months[dMonth]} ${dYear}`;
    }

    function getDateKey(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function scrollToBottomInstant() {
      const container = document.getElementById('chatContainer');
      if (container) {
        container.scrollTop = container.scrollHeight + 1000;
      }
    }

    function scrollToBottom(smooth = false) {
      const anchor = document.getElementById('chatBottomAnchor');
      if (anchor) {
        anchor.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'end' });
      } else {
        scrollToBottomInstant();
      }
    }

    function scrollToMessage(msgId) {
      const el = document.getElementById(`msg-${msgId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('highlighted');
        setTimeout(() => el.classList.remove('highlighted'), 1500);
      }
    }

    const appViewport = document.getElementById('appViewport');
    const bottomBar = document.getElementById('chatBottomBar');
    const chatInput = document.getElementById('chatInput');

    function syncAppHeight() {
      if (!appViewport) return;
      if (window.visualViewport) {
        const vv = window.visualViewport;
        appViewport.style.height = `${vv.height}px`;
        appViewport.style.top = `${vv.offsetTop}px`;

        const isKeyboardUp = (window.innerHeight - vv.height) > 120;
        if (bottomBar) {
          bottomBar.style.paddingBottom = isKeyboardUp ? '8px' : 'calc(8px + env(safe-area-inset-bottom))';
        }
      } else {
        appViewport.style.height = '100dvh';
      }
      scrollToBottomInstant();
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncAppHeight);
      window.visualViewport.addEventListener('scroll', syncAppHeight);
    }
    window.addEventListener('resize', syncAppHeight);

    if (chatInput) {
      chatInput.addEventListener('focus', () => {
        window.scrollTo(0, 0);
        setTimeout(syncAppHeight, 100);
        setTimeout(syncAppHeight, 300);
      });
      chatInput.addEventListener('blur', () => {
        window.scrollTo(0, 0);
        setTimeout(syncAppHeight, 100);
      });
    }

    async function deleteChatMessage(msgId) {
      if (!confirm('Hapus pesan ini?')) return;
      try {
        if (!window.db || !window.fbRef) return;
        const targetRef = window.fbRef(window.db, `live_chat/${msgId}`);
        if (window.fbRemove) {
          await window.fbRemove(targetRef);
        } else if (window.fbSet) {
          await window.fbSet(targetRef, null);
        }
        const row = document.getElementById(`msg-${msgId}`);
        if (row) row.remove();
      } catch (err) {
        alert('Gagal menghapus pesan: ' + err.message);
      }
    }

    function setReplyMessage(msgId, author, text, stickerUrl) {
      if (!window.currentUser) return;
      const snippet = text || (stickerUrl ? '[Stiker/GIF]' : 'Pesan');
      replyingMessage = { id: msgId, author, snippet };

      document.getElementById('replyTargetAuthor').innerText = author;
      document.getElementById('replyTargetSnippet').innerText = snippet;
      document.getElementById('replyBanner').classList.add('active');
      document.getElementById('chatInput').focus();
    }

    function cancelReply() {
      replyingMessage = null;
      document.getElementById('replyBanner').classList.remove('active');
    }

    async function fetchStickers() {
      if (cachedStickers.length > 0) return cachedStickers;
      try {
        if (window.db && window.fbRef && window.fbGet) {
          let snap = await window.fbGet(window.fbRef(window.db, 'stickers'));
          if (!snap.exists()) snap = await window.fbGet(window.fbRef(window.db, 'sticker'));

          if (snap.exists()) {
            const val = snap.val();
            let list = [];
            if (Array.isArray(val)) {
              list = val.filter(Boolean);
            } else if (typeof val === 'object' && val !== null) {
              Object.values(val).forEach(item => {
                if (typeof item === 'string') list.push(item);
                else if (item && typeof item === 'object') {
                  const url = item.url || item.link || item.image || item.src;
                  if (url) list.push(url);
                }
              });
            }
            if (list.length > 0) {
              cachedStickers = list;
              return cachedStickers;
            }
          }
        }
      } catch (_) {}
      cachedStickers = DEFAULT_STICKERS;
      return cachedStickers;
    }

    async function openStickerPicker() {
      if (!window.currentUser) return;
      document.getElementById('stickerPanel').classList.add('active');
      document.getElementById('stickerOverlay').classList.add('active');

      const grid = document.getElementById('stickerGrid');
      grid.innerHTML = `
        <div class="skeleton" style="aspect-ratio:1/1; border-radius:12px;"></div>
        <div class="skeleton" style="aspect-ratio:1/1; border-radius:12px;"></div>
        <div class="skeleton" style="aspect-ratio:1/1; border-radius:12px;"></div>
        <div class="skeleton" style="aspect-ratio:1/1; border-radius:12px;"></div>
      `;

      const list = await fetchStickers();
      grid.innerHTML = list.map(url => `
        <div class="sticker-grid-item" onclick="chooseSticker('${url}')">
          <img src="${url}" loading="lazy" />
        </div>
      `).join('');
    }

    function closeStickerPicker() {
      document.getElementById('stickerPanel').classList.remove('active');
      document.getElementById('stickerOverlay').classList.remove('active');
    }

    function chooseSticker(url) {
      selectedStickerUrl = url;
      closeStickerPicker();

      const box = document.getElementById('stickerPreview');
      const img = document.getElementById('stickerPreviewImg');
      if (box && img) {
        img.src = url;
        box.classList.add('active');
      }
      document.getElementById('chatInput').focus();
    }

    function removeStickerPreview() {
      selectedStickerUrl = '';
      const box = document.getElementById('stickerPreview');
      if (box) box.classList.remove('active');
    }

    // Ambil semua pengguna Firebase untuk support tag mention global
    async function loadAllFirebaseUsers() {
      if (allFirebaseUsersList.length > 0) return allFirebaseUsersList;
      try {
        if (window.db && window.fbRef && window.fbGet) {
          const snap = await window.fbGet(window.fbRef(window.db, 'users'));
          if (snap.exists()) {
            const raw = snap.val() || {};
            const list = [];
            Object.keys(raw).forEach(k => {
              const u = raw[k];
              if (u && typeof u === 'object') {
                list.push({
                  key: k,
                  username: u.username || '',
                  name: u.name || u.username || 'User',
                  photo: u.photoURL || '',
                  email: u.email || ''
                });
              }
            });
            allFirebaseUsersList = list;
            return allFirebaseUsersList;
          }
        }
      } catch (e) {
        console.warn("Gagal memuat daftar users:", e);
      }
      return [];
    }

    async function handleMentionSearch(inputEl) {
      const menu = document.getElementById('mentionMenu');
      if (!menu) return;

      const val = inputEl.value;
      const cursorPos = inputEl.selectionStart;
      const textBeforeCursor = val.slice(0, cursorPos);
      const atIdx = textBeforeCursor.lastIndexOf('@');

      if (atIdx !== -1 && (atIdx === 0 || /\s/.test(textBeforeCursor[atIdx - 1]))) {
        const query = textBeforeCursor.slice(atIdx + 1).toLowerCase();

        if (allFirebaseUsersList.length === 0) {
          await loadAllFirebaseUsers();
        }

        const matches = allFirebaseUsersList.filter(u => {
          const uName = (u.username || '').toLowerCase();
          const dName = (u.name || '').toLowerCase();
          return uName.includes(query) || dName.includes(query);
        });

        if (matches.length > 0) {
          menu.innerHTML = matches.slice(0, 8).map(u => {
            const insertTag = u.username || u.name;
            const initial = (u.name || u.username || 'U').charAt(0).toUpperCase();
            const avatarHtml = u.photo 
              ? `<img src="${u.photo}" onerror="this.outerHTML='<span class=\\'mention-initial\\'>${initial}</span>'" />` 
              : `<span class="mention-initial">${initial}</span>`;

            return `
              <div class="mention-item" onclick="applyMention('${escapeHtml(insertTag)}', ${atIdx})">
                ${avatarHtml}
                <div style="display:flex; flex-direction:column; line-height:1.2;">
                  <span style="color:#f1f5f9; font-weight:700;">${escapeHtml(u.name)}</span>
                  ${u.username ? `<span style="font-size:10px; color:#64748b;">@${escapeHtml(u.username)}</span>` : ''}
                </div>
              </div>
            `;
          }).join('');
          menu.classList.add('active');
          return;
        }
      }
      menu.classList.remove('active');
    }

    function applyMention(name, atIdx) {
      const input = document.getElementById('chatInput');
      const menu = document.getElementById('mentionMenu');
      if (!input) return;

      const val = input.value;
      const before = val.slice(0, atIdx);
      const after = val.slice(input.selectionStart);

      input.value = `${before}@${name} ${after}`;
      if (menu) menu.classList.remove('active');
      input.focus();
    }

    function appendMentionToInput(name) {
      const input = document.getElementById('chatInput');
      if (!input) return;
      input.value += `@${name} `;
      input.focus();
    }

    // Mengubah tag @username menjadi link yang bisa diklik menuju profil
    function parseMentions(text) {
      const safe = escapeHtml(text);
      return safe.replace(/@([a-zA-Z0-9_\u00C0-\u024F\u1E00-\u1EFF]+)/g, (m, u) => {
        const cleanUser = u.trim();
        return `<a href="/profil/${encodeURIComponent(cleanUser)}" class="mention-tag" onclick="event.stopPropagation()">@${cleanUser}</a>`;
      });
    }

    async function getUserCachedProfile(email, uid) {
      const key = email ? email.toLowerCase().replace(/\./g, ',') : uid;
      if (!key) return null;
      if (userProfileCache[key]) return userProfileCache[key];

      try {
        if (window.db && window.fbRef && window.fbGet) {
          const snap = await window.fbGet(window.fbRef(window.db, `users/${key}`));
          if (snap.exists()) {
            userProfileCache[key] = snap.val();
            return userProfileCache[key];
          }
        }
      } catch (_) {}
      return null;
    }

    async function renderLiveChatMessages(chatData) {
      const container = document.getElementById('chatContainer');
      const loadingEl = document.getElementById('chatLoading');
      if (loadingEl) loadingEl.remove();

      if (!chatData || Object.keys(chatData).length === 0) {
        container.innerHTML = '<div class="chat-loading-placeholder">Belum ada obrolan. Mulai sapa teman-teman sekarang!</div>';
        return;
      }

      const messageList = [];
      Object.keys(chatData).forEach((key) => {
        const item = chatData[key];
        if (item && typeof item === 'object') {
          messageList.push({ ...item, id: key });
        }
      });
      messageList.sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));

      const fragment = document.createDocumentFragment();
      let lastMessageDateKey = null;

      const isCurrentUserAdmin = window.currentUser && window.currentUser.email && window.currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      const uniqueUsers = [...new Set(messageList.map(m => m.email ? m.email.toLowerCase().replace(/\./g, ',') : m.uid).filter(Boolean))];
      await Promise.all(uniqueUsers.map(uKey => getUserCachedProfile(uKey, uKey)));

      // Muat daftar users jika belum ada
      loadAllFirebaseUsers();

      messageList.forEach((item) => {
        const msgTimestamp = Number(item.timestamp) || Date.now();
        const dateKey = getDateKey(msgTimestamp);

        if (dateKey !== lastMessageDateKey) {
          const dateLabel = getDateDividerLabel(msgTimestamp);
          const dividerEl = document.createElement('div');
          dividerEl.className = 'date-separator-wrapper';
          dividerEl.innerHTML = `<span class="date-separator-badge">${dateLabel}</span>`;
          fragment.appendChild(dividerEl);
          lastMessageDateKey = dateKey;
        }

        const isMine = window.currentUser && (
          (window.currentUser.email && item.email && window.currentUser.email.toLowerCase() === String(item.email).toLowerCase()) ||
          (window.currentUser.uid && item.uid && window.currentUser.uid === item.uid)
        );

        const uKey = item.email ? item.email.toLowerCase().replace(/\./g, ',') : item.uid;
        const updatedProfile = userProfileCache[uKey] || null;

        const authorName = (updatedProfile && updatedProfile.name) ? updatedProfile.name : (item.author || (item.email ? String(item.email).split('@')[0] : 'User'));
        const photoURL = (updatedProfile && updatedProfile.photoURL) ? updatedProfile.photoURL : (item.photoURL || '');
        const username = (updatedProfile && updatedProfile.username) ? updatedProfile.username : (item.username || (item.email ? String(item.email).split('@')[0] : ''));
        const initial = (authorName.trim().charAt(0) || 'U').toUpperCase();
        const isAdmin = (item.email && item.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) || item.isAdmin === true;

        // URL Menuju Profil
        const profileUrl = username ? `/profil/${encodeURIComponent(username)}` : (item.email ? `/profil/${encodeURIComponent(item.email.split('@')[0])}` : '/profil/');

        const avatarContent = photoURL 
          ? `<img src="${photoURL}" alt="${escapeHtml(authorName)}" referrerpolicy="no-referrer" onerror="this.outerHTML='${initial}'" />`
          : initial;

        const levelBadge = isAdmin ? `<span class="badge-level admin-lvl">Lv999+</span>` : `<span class="badge-level">Lv1</span>`;
        const adminBadge = isAdmin ? `<span class="badge-admin">★ ADMIN</span>` : '';

        const row = document.createElement('div');
        row.className = `chat-msg-row ${isMine ? 'mine' : ''}`;
        row.id = `msg-${item.id}`;

        let quoteHtml = '';
        if (item.replyTo) {
          quoteHtml = `
            <div class="msg-quote-box" onclick="event.stopPropagation(); scrollToMessage('${item.replyTo.id}')">
              <span class="quote-author">${escapeHtml(item.replyTo.author)}</span>
              <span class="quote-snippet">${escapeHtml(item.replyTo.snippet)}</span>
            </div>
          `;
        }

        let contentHtml = '';
        if (item.text) contentHtml += `<div class="msg-text-content">${parseMentions(item.text)}</div>`;
        if (item.stickerUrl) {
          contentHtml += `<img src="${item.stickerUrl}" class="msg-sticker" loading="lazy" onload="scrollToBottomInstant()" />`;
        }

        let deleteBtnHtml = '';
        if (isMine || isCurrentUserAdmin) {
          deleteBtnHtml = `
            <button class="msg-delete-btn" onclick="event.stopPropagation(); deleteChatMessage('${item.id}')" title="Hapus Chat">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
            </button>
          `;
        }

        row.innerHTML = `
          <a href="${profileUrl}" class="user-avatar" title="Lihat Profil" onclick="event.stopPropagation()">${avatarContent}</a>
          <div class="msg-body-wrapper">
            <div class="msg-bubble" onclick="setReplyMessage('${item.id}', '${escapeHtml(authorName)}', '${escapeHtml(item.text || '')}', '${item.stickerUrl || ''}')">
              ${quoteHtml}
              <div class="msg-user-meta">
                <a href="${profileUrl}" class="sender-name ${isAdmin ? 'admin' : ''}" title="Lihat Profil" onclick="event.stopPropagation()">${escapeHtml(authorName)}</a>
                ${levelBadge} ${adminBadge}
              </div>
              ${contentHtml}
              <span class="msg-time-bottom-right">${formatTime(msgTimestamp)}</span>
            </div>
          </div>
          ${deleteBtnHtml}
        `;

        fragment.appendChild(row);
      });

      const bottomAnchor = document.createElement('div');
      bottomAnchor.id = 'chatBottomAnchor';
      bottomAnchor.style.cssText = 'height:22px;width:100%;flex-shrink:0;';
      fragment.appendChild(bottomAnchor);

      container.innerHTML = '';
      container.appendChild(fragment);

      syncAppHeight();
      setTimeout(syncAppHeight, 60);
    }

    async function loadChatMessagesOnce() {
      try {
        if (!window.db || !window.fbRef || !window.fbGet) return;
        
        let targetRef = window.fbRef(window.db, 'live_chat');
        if (window.fbQuery && window.fbLimitToLast) {
          targetRef = window.fbQuery(targetRef, window.fbLimitToLast(60));
        }

        const snap = await window.fbGet(targetRef);
        if (snap.exists()) {
          const val = snap.val() || {};
          const jsonStr = JSON.stringify(val);
          if (jsonStr !== lastRenderedChatJson) {
            lastRenderedChatJson = jsonStr;
            await renderLiveChatMessages(val);
          }
        } else {
          const loadingEl = document.getElementById('chatLoading');
          if (loadingEl) {
            document.getElementById('chatContainer').innerHTML = '<div class="chat-loading-placeholder">Belum ada obrolan. Mulai sapa teman-teman sekarang!</div>';
          }
        }
      } catch (err) {
        console.error("Load Chat Error:", err);
      }
    }

    function initLiveChat() {
      syncAppHeight();
      loadChatMessagesOnce();

      if (typeof window.fbOnValue === 'function') {
        let chatRef = window.fbRef(window.db, 'live_chat');
        if (window.fbQuery && window.fbLimitToLast) {
          chatRef = window.fbQuery(chatRef, window.fbLimitToLast(60));
        }
        window.fbOnValue(chatRef, (snapshot) => {
          if (snapshot.exists()) {
            const val = snapshot.val() || {};
            lastRenderedChatJson = JSON.stringify(val);
            renderLiveChatMessages(val);
          } else {
            document.getElementById('chatContainer').innerHTML = '<div class="chat-loading-placeholder">Belum ada obrolan. Mulai sapa teman-teman sekarang!</div>';
          }
        });
      } else {
        setInterval(loadChatMessagesOnce, 2000);
      }
    }
    window.initLiveChat = initLiveChat;

    async function sendMessage() {
      if (!window.currentUser) return;
      const input = document.getElementById('chatInput');
      const text = input ? input.value.trim() : '';
      const stickerUrl = selectedStickerUrl;

      if (!text && !stickerUrl) return;

      const user = window.currentUser;
      const isAdmin = user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      // Dapatkan data profil user aktif
      const uKey = user.email ? user.email.toLowerCase().replace(/\./g, ',') : user.uid;
      const myProfile = await getUserCachedProfile(user.email, user.uid);

      const newMsg = {
        uid: user.uid,
        email: user.email || '',
        author: (myProfile && myProfile.name) ? myProfile.name : (user.displayName || (user.email ? user.email.split('@')[0] : 'User')),
        username: (myProfile && myProfile.username) ? myProfile.username : (user.email ? user.email.split('@')[0] : ''),
        photoURL: (myProfile && myProfile.photoURL) ? myProfile.photoURL : (user.photoURL || ''),
        text: text,
        stickerUrl: stickerUrl || '',
        timestamp: Date.now(),
        isAdmin: isAdmin
      };

      if (replyingMessage) {
        newMsg.replyTo = {
          id: replyingMessage.id,
          author: replyingMessage.author,
          snippet: replyingMessage.snippet
        };
      }

      try {
        const msgKey = Date.now();
        const newMsgRef = window.fbRef(window.db, `live_chat/${msgKey}`);
        await window.fbSet(newMsgRef, newMsg);

        input.value = '';
        removeStickerPreview();
        cancelReply();
        loadChatMessagesOnce();
        setTimeout(syncAppHeight, 80);
      } catch (err) {
        alert('Gagal mengirim pesan: ' + err.message);
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#mentionMenu') && !e.target.closest('#chatInput')) {
        const menu = document.getElementById('mentionMenu');
        if (menu) menu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
