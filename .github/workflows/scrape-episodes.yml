name: Scrape Donghua Episodes

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug Donghua yang akan discrape (contoh: my-senior-brother-is-too-steady)'
        required: true
        default: 'my-senior-brother-is-too-steady'

jobs:
  scrape-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Jalankan Scraper Episode
        env:
          TARGET_SLUG: ${{ github.event.inputs.slug }}
        run: node admin/scraper-episodes.js

      - name: Commit Hasil Episode JSON & Update Master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add donghua/episodes/ donghua/donghua.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update episodes & latest-episode for ${{ github.event.inputs.slug }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
