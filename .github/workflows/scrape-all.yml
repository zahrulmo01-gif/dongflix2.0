name: Smart Scrape All Episodes

on:
  repository_dispatch:
    types: [scrape-all-episodes]
  workflow_dispatch:

jobs:
  smart-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Smart Scraper
        run: node admin/scrape-all-smart.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add donghua/episodes/*.json donghua/donghua.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update episode & bump updated donghua [skip ci]" && git push)
