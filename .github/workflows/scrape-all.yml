name: Scrape All Episodes Automation

on:
  repository_dispatch:
    types: [scrape-all-episodes]
  workflow_dispatch:

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Loop & Scrape Tiap Donghua
        run: |
          node -e '
            import fs from "fs";
            import { execSync } from "child_process";

            const data = JSON.parse(fs.readFileSync("donghua/donghua.json", "utf-8"));
            console.log(`Menemukan ${data.length} judul untuk di-scrape.`);

            for (const [index, item] of data.entries()) {
              console.log(`\n[${index + 1}/${data.length}] Memproses: ${item.slug}`);
              try {
                execSync(`node admin/scraper-episodes.js ${item.slug}`, { stdio: "inherit" });
              } catch (err) {
                console.warn(`Lewati ${item.slug} karena error:`, err.message);
              }
            }
          '

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add donghua/episodes/*.json donghua/donghua.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update episode all donghua [skip ci]" && git push)
