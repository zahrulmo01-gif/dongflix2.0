name: Clean JSON Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Cleaner Script
        run: node admin/clean-json.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add donghua/donghua.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Fix: Clean duplicate titles and null episodes [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Data berhasil dibersihkan dan dipush ke main."
          else
            echo "ℹ️ Semua data sudah bersih. Tidak ada perubahan yang perlu dipush."
          fi
