name: Scrape Donghua Action

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Eksekusi Scraper di folder Admin
        run: npm run scrape

      - name: Commit dan Push donghua.json & sitemap.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add donghua/donghua.json sitemap.xml
          git diff --staged --quiet || (git commit -m "chore: sync donghua list and sitemap [skip ci]" && git push)
