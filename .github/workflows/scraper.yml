name: Dongflix Automation Scraper

on:
  repository_dispatch:
    types: [scrape-list, scrape-episode, scrape-all-episodes]
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Pilih aksi: list, episode, atau all'
        required: true
        default: 'all'
      target_slug:
        description: 'Slug Donghua (khusus jika memilih aksi episode)'
        required: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      # 1. Jalankan Scrape List Master Donghua
      - name: Run Scraper List Donghua
        if: github.event.action == 'scrape-list' || github.event.inputs.action_type == 'list'
        run: node admin/scraper-donghua.js

      # 2. Jalankan Scrape Single Episode
      - name: Run Scraper Single Episode
        if: github.event.action == 'scrape-episode' || github.event.inputs.action_type == 'episode'
        run: node admin/scraper-episodes.js ${{ github.event.client_payload.target_slug || github.event.inputs.target_slug }}

      # 3. Jalankan Smart Scrape All (Cek Web vs JSON + Auto Bump)
      - name: Run Smart Scrape All Episodes
        if: github.event.action == 'scrape-all-episodes' || github.event.inputs.action_type == 'all'
        run: node admin/scrape-all-smart.js

      # Commit dan Push Hasil
      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add donghua/donghua.json donghua/episodes/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update database katalog/episode [skip ci]" && git push)
